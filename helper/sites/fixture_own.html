<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Testform</title></head><body>
<div id="cookie"><button onclick="document.getElementById('cookie').remove()">Alle akzeptieren</button></div>
<a href="#" onclick="document.getElementById('f').style.display='block';this.remove();return false">Jetzt bewerben</a>
<form id="f" style="display:none" onsubmit="document.body.innerHTML='<h1>Vielen Dank für Ihre Bewerbung</h1>';return false">
<label>Anrede <select name="a"><option></option><option>Herr</option><option>Frau</option></select></label>
<label>Vorname* <input name="fn" required></label><label>Nachname* <input name="ln" required></label>
<label>E-Mail* <input name="em" type="email" required></label><label>Telefon <input name="ph"></label>
<label>Staatsangehörigkeit* <input name="nat" required></label>
<label>Frühestmöglicher Eintrittstermin* <input name="start" required></label>
<fieldset><legend>Liegt eine Schwerbehinderung vor?*</legend>
<label><input type="radio" name="dis" value="ja" required> Ja</label><label><input type="radio" name="dis" value="nein"> Nein</label></fieldset>
<label>Umzugsbereitschaft <select name="rel" required><option value="">Bitte wählen</option><option>Ja</option><option>Nein</option></select></label>
<label>Lebenslauf* <input type="file" name="cv" required></label><label>Anschreiben <input type="file" name="cl"></label>
<label>Ihre Nachricht <textarea name="m"></textarea></label>
<label><input type="checkbox" name="p" required> Ich akzeptiere die Datenschutzerklärung</label>
<label><input type="checkbox" name="tp"> In den Talentpool aufnehmen</label>
<label><input type="checkbox" name="nl"> Newsletter abonnieren</label>
<button type="submit">Bewerbung absenden</button></form></body></html>
