# Extra sources (each off = false). StepStone needs Playwright + Chromium.
sources:
  stepstone: true
  xing: true
  jobspy_sites: [linkedin, indeed, glassdoor, google]
  companies_bw: true
  board_queries: ["SAP Commerce", "Hybris", "SAP Commerce Cloud", "Spartacus", "commercetools", "Spryker"]

# Google search inside career sites hosted on hiring systems (Personio, Workday, SuccessFactors, ...).
# Covers thousands of company websites at once. Needs SERPER_API_KEY; runs once a day (first run) to save credits.
career_site_queries:
  - '(site:jobs.personio.de OR site:jobs.personio.com) ("SAP Commerce" OR Hybris)'
  - '(site:myworkdayjobs.com OR site:successfactors.eu OR site:successfactors.com OR site:sapsf.eu) ("SAP Commerce" OR Hybris) (Germany OR Deutschland)'
  - '(site:jobs.smartrecruiters.com OR site:join.com OR site:softgarden.io OR site:recruitee.com OR site:teamtailor.com) ("SAP Commerce" OR Hybris)'
  - '(site:boards.greenhouse.io OR site:job-boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com OR site:apply.workable.com) ("SAP Commerce" OR Hybris)'
  - 'site:jobs.sap.com ("Commerce Cloud" OR "SAP CX") Germany'
  - '(karriere OR careers OR stellenangebote OR jobs) ("SAP Commerce Developer" OR "Hybris Developer" OR "SAP Commerce Entwickler") (m/w/d) -linkedin -indeed -stepstone -xing'

# A job is kept only if its title or description contains one of these
# (case-insensitive). Keeps noise out without dropping real openings.
relevance_terms:
  - hybris
  - sap commerce
  - commerce cloud
  - sap cx
  - ccv2
  - spartacus
  - composable storefront
  - sfcc
  - demandware
  - commercetools
  - spryker
  - intershop
  - adobe commerce
  - magento
  - shopware
  - e-commerce
  - ecommerce
  - e-business
  - onlineshop
  - online-shop
  - webshop
  - digital commerce
  - b2b commerce
  - b2c commerce
  - sap cpq
  - pim

# Titles containing these are dropped (sales/intern roles etc.)
exclude_title_terms:
  - praktik
  - intern
  - werkstudent
  - working student
  - ausbildung
  - azubi
  - account executive
  - sales manager
  - vertrieb
  - lager
  - schichtleit
  - kommissionier
  - fahrer
  - steuer
  - tax manager

locations:
  - "Germany"
remote_location: "European Union"   # extra remote-only pass
hours_old: 168         # how far back each run looks (7 days); jobs are still never sent twice
results_per_query: 30
min_score_in_digest: 0  # 0 = show everything, ranked

# Email applications from Kranti's Gmail (needs CANDIDATE_EMAIL + KRANTI_GMAIL_APP_PASSWORD secrets).
# mode "draft": saved in her Gmail Drafts, she presses Send. Switch to "send" once the drafts are trusted.
# We apply; rejecting is the hiring team's job. Scores 60+ are realistic fits (letters stay honest about gaps).
applications:
  mode: send
  max_per_day: 15
  min_score: 60
  per_company: 2       # different roles at one company, never two on the same day
  catch_up_days: 45    # strong jobs from earlier digests still get an application
