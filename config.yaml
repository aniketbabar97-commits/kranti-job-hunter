# What to search for. Every query runs on every source; results are
# de-duplicated, filtered for relevance, then scored against cv.md.
queries:
  # Tier A - core SAP Commerce
  - "SAP Commerce Cloud"
  - "SAP Commerce"
  - "Hybris"
  - "SAP CX"
  - "Spartacus"
  - "Composable Storefront"
  - "SAP Commerce Developer"
  - "SAP Commerce Cloud Developer"
  - "Java Developer SAP Commerce"
  - "Java Developer Hybris"
  - "Hybris Developer"
  - "SAP Hybris Entwickler"
  - "Java Entwickler SAP Commerce"
  - "SAP Commerce Consultant"
  - "SAP Commerce Architect"
  - "Backend Developer SAP Commerce"
  # Tier B - other commerce platforms (ready to learn)
  - "Salesforce Commerce Cloud"
  - "SFCC"
  - "commercetools"
  - "Spryker"
  - "Intershop"
  - "Adobe Commerce"
  - "Shopware"
  # Tier C - e-commerce roles
  - "E-Commerce Business Analyst"
  - "E-Commerce Consultant"
  - "E-Commerce Entwickler"
  - "E-Commerce Product Owner"
  - "E-Commerce Projektmanager"
  - "Commerce Consultant"
  - "Commerce Architect"
  - "Digital Commerce"
  # Tier D - adjacent
  - "Java Entwickler E-Commerce"
  - "SAP CPQ"
  - "PIM Consultant"

# Google searches for recruiter "we are hiring" posts on LinkedIn (needs SERPER_API_KEY).
post_queries:
  - 'site:linkedin.com/posts ("SAP Commerce" OR Hybris) (hiring OR "we are hiring" OR "looking for" OR "wir suchen")'
  - 'site:linkedin.com/posts ("SAP CX" OR Spartacus OR "Composable Storefront" OR CCV2) (hiring OR "looking for" OR "wir suchen")'
  - 'site:linkedin.com/posts ("Salesforce Commerce Cloud" OR SFCC OR commercetools OR Spryker) (hiring OR "looking for")'
  - 'site:linkedin.com/posts ("SAP Commerce" OR Hybris) (Germany OR Deutschland OR remote) (job OR role OR position OR stelle)'

