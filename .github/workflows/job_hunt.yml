name: Job hunt

on:
  schedule:
    # India time (IST = UTC+5:30, no daylight saving). Set ~15 min early because
    # GitHub often starts scheduled runs late, and a run takes ~12 min.
    - cron: "17 5 * * *"   # 10:47 IST -> email ~11:00 IST
    - cron: "17 11 * * *"  # 16:47 IST -> email ~17:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email, nothing saved)"
        type: boolean
        default: false
      posts_check:
        description: "Quick check of LinkedIn-post search only (no email)"
        type: boolean
        default: false
      weekly_now:
        description: "Also send the weekly summary now"
        type: boolean
        default: false
      test_email:
        description: "Only send a test email (no search)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search, score and email
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY:     ${{ secrets.SERPER_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:         ${{ secrets.FROM_EMAIL }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          TO_EMAIL_2:         ${{ secrets.TO_EMAIL_2 }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN:            ${{ (inputs.dry_run || inputs.posts_check) && '1' || '' }}
          QUERY_LIMIT:        ${{ inputs.posts_check && '0' || '' }}
          TEST_EMAIL:         ${{ inputs.test_email && '1' || '' }}
          FORCE_WEEKLY:       ${{ inputs.weekly_now && '1' || '' }}
        run: python -m hunter.main

      - name: Upload digest preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest
          path: data/last_digest.html
          if-no-files-found: ignore

      - name: Save seen jobs and log
        if: success() && !inputs.dry_run && !inputs.test_email && !inputs.posts_check
        run: |
          git config user.name "Job Hunter Bot"
          git config user.email "bot@job-hunter"
          git add data/seen.json data/jobs_log.csv JOBS.md data/weekly_sent.txt
          git diff --cached --quiet || git commit -m "jobs: $(date -u +%F\ %H:%M)"
          git pull --rebase && git push
