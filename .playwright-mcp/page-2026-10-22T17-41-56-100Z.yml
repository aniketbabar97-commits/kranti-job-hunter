          - text: Odoo-Entwickler (m/w/d)
        - generic [ref=e118]:
          - heading "Anspruchsvolle Projekte. Gute Bezahlung. Zeit für dein Leben." [level=3] [ref=e119]
          - paragraph [ref=e120]:
            - strong [ref=e121]: "Standort: Frankfurt am Main · Hybrides Arbeiten · Vollzeit oder Teilzeit nach Vereinbarung"
          - paragraph [ref=e122]: Du möchtest mit Python mehr bewegen als die nächste kleine Anpassung? Bei eBakery entwickelst du Odoo-Lösungen, die Unternehmen im Alltag unterstützen – von individuellen Modulen über automatisierte Abläufe bis zu Schnittstellen für den E-Commerce.
          - paragraph [ref=e123]: Wir suchen einen Odoo-Entwickler, der technische Herausforderungen gerne durchdenkt, sauber programmiert und eigene Ideen einbringt. Dich erwarten ein internationales Team, unser Standort im Frankfurter Grand Tower und eine attraktive Vergütung, die deine Erfahrung und Verantwortung berücksichtigt.
          - heading "Deine Aufgaben" [level=3] [ref=e124]
          - list [ref=e125]:
            - listitem [ref=e126]: Du entwickelst individuelle Odoo-Module und erweiterst bestehende Funktionen.
            - listitem [ref=e127]: Du setzt Geschäftsprozesse technisch um, beispielsweise für Vertrieb, Einkauf, Lager und Abrechnung.
            - listitem [ref=e128]: Du entwickelst Schnittstellen zu Shopsystemen, Marktplätzen und weiteren Anwendungen.
            - listitem [ref=e129]: Du begleitest Updates und Migrationen und unterstützt bei der Übernahme bestehender Daten.
            - listitem [ref=e130]: Du analysierst Fehler und verbesserst die Stabilität und Performance unserer Lösungen.
            - listitem [ref=e131]: Du arbeitest mit Beratung und Projektmanagement zusammen, um aus Kundenanforderungen durchdachte technische Lösungen zu entwickeln.
            - listitem [ref=e132]: Du dokumentierst deine Arbeit und bringst dich in den fachlichen Austausch sowie Code-Reviews ein.
          - heading "Das bringst du mit" [level=3] [ref=e133]
          - paragraph [ref=e134]: Du hast praktische Erfahrung in der Odoo-Entwicklung und gute Python-Kenntnisse. Du verstehst, wie Odoo-Module aufgebaut sind, und kannst Anforderungen eigenständig in wartbaren Code übersetzen.
          - paragraph [ref=e135]: "Außerdem wünschen wir uns:"
          - list [ref=e136]:
            - listitem [ref=e137]: Einen sicheren Umgang mit dem Odoo ORM, PostgreSQL und Git.
            - listitem [ref=e138]: Erfahrung mit XML und der Anpassung von Odoo-Ansichten.
            - listitem [ref=e139]: Kenntnisse in der Entwicklung und Anbindung von APIs.
            - listitem [ref=e140]: Eine strukturierte Arbeitsweise und einen klaren Blick für technische Qualität.
            - listitem [ref=e141]: Gute Deutschkenntnisse für die Zusammenarbeit mit Team und Kunden sowie Englischkenntnisse zum Lesen technischer Dokumentation.
          - paragraph [ref=e142]: Erfahrung mit JavaScript, OWL, automatisierten Tests oder Odoo.sh ist ein Plus. Ein bestimmter Studienabschluss ist keine Voraussetzung – für uns zählen dein Können und deine bisherigen Projekte.
          - heading "Das bieten wir dir" [level=3] [ref=e143]
          - paragraph [ref=e144]:
            - strong [ref=e145]: Ein gutes Gehalt, das deine Erfahrung wertschätzt
            - text: Wir bieten dir eine attraktive Vergütung, die zu deinen Odoo-Kenntnissen, deiner Erfahrung und der Verantwortung deiner Position passt. Deine Gehaltsvorstellung besprechen wir offen im Kennenlernen. Hinzu kommen regelmäßiges Weihnachtsgeld und individuelle Boni für besondere Leistungen.
          - paragraph [ref=e146]:
            - strong [ref=e147]: Flexibles Arbeiten mit persönlichem Austausch
            - text: Gleitzeit und Homeoffice ermöglichen dir, deinen Arbeitsalltag flexibel zu gestalten. Gleichzeitig treffen wir uns regelmäßig in unserem Büro im Frankfurter Grand Tower, um gemeinsam an Ideen zu arbeiten und den Teamgeist zu stärken. Die Aufteilung stimmen wir passend zu deiner Rolle ab.
          - paragraph [ref=e148]:
            - strong [ref=e149]: Eine gesunde Work-Life-Balance
            - text: Wir planen Projekte so, dass sie innerhalb der vereinbarten Arbeitszeit umgesetzt werden können. Überstunden sind normalerweise nicht vorgesehen. Sollten sie in besonderen Ausnahmefällen erforderlich sein, vergüten wir sie mit einem Zuschlag von 25 % auf den regulären Stundenlohn.
          - paragraph [ref=e150]:
            - strong [ref=e151]: Ausstattung und zusätzliche Benefits
            - text: Für deine Arbeit stellen wir dir einen Firmenlaptop zur Verfügung. Für erfahrene Mitarbeitende kommt nach individueller Vereinbarung auch ein Firmenwagen infrage.
          - paragraph [ref=e152]:
            - strong [ref=e153]: Rücksicht auf deine persönliche Situation
            - text: Alleinerziehende und Menschen mit Behinderung sind bei uns ausdrücklich willkommen. Gemeinsam besprechen wir, welche Arbeitszeiten und organisatorischen oder technischen Anpassungen dir helfen, deine Stärken einzubringen.
          - paragraph [ref=e154]:
            - strong [ref=e155]: Ein ausgezeichnetes Teamumfeld
            - text: eBakery wurde mehrfach als kununu Top Company ausgezeichnet. Bei uns kannst du Verantwortung übernehmen, Wissen teilen und dich durch abwechslungsreiche Projekte fachlich weiterentwickeln.
