    - generic [ref=e24]:
      - heading "Karriere bei eBakery" [level=1] [ref=e26]
      - heading "Dein nächster Schritt. Unser nächstes Kapitel." [level=2] [ref=e28]
      - generic [ref=e29]:
        - paragraph [ref=e30]: Du möchtest digitale Projekte voranbringen, Verantwortung übernehmen und sehen, was deine Arbeit bewirkt? Bei eBakery verbinden wir E-Commerce, Entwicklung, Design und Online-Marketing – und suchen Menschen, die mit uns weiterdenken.
        - paragraph [ref=e31]: "Unser Standort im Frankfurter Grand Tower und die Möglichkeit zum Homeoffice verbinden ein besonderes Umfeld mit flexibler Zusammenarbeit. Ob du technische Herausforderungen liebst, überzeugende Nutzererlebnisse gestaltest oder Projekte koordinierst: Entdecke, wo du bei uns etwas bewegen kannst."
    - generic [ref=e33]:
      - generic [ref=e35]:
        - heading "Unsere Auszeichnungen" [level=2] [ref=e37]
        - generic [ref=e39]:
          - paragraph [ref=e40]: Ein toller Arbeitsplatz entsteht durch die Menschen, die ihn gestalten. Bei eBakery arbeiten wir gemeinsam an anspruchsvollen E-Commerce-Projekten – mit Raum für eigene Ideen, fachliche Entwicklung und gegenseitige Unterstützung. Wir möchten, dass du deine Stärken einbringen, Verantwortung übernehmen und dich als Teil unseres internationalen Teams wohlfühlen kannst.
          - paragraph [ref=e41]: "Dass unsere Mitarbeitenden dieses Umfeld schätzen, zeigen ihre Bewertungen auf kununu: eBakery wurde von 2022 bis 2026 jedes Jahr als Top Company ausgezeichnet. Hinzu kommen die Auszeichnungen „Top Rated 2026“ für Gehaltszufriedenheit und Familienfreundlichkeit. Sie stehen für Aspekte des Arbeitslebens, die auch für uns zählen: Wertschätzung, faire Rahmenbedingungen und die Vereinbarkeit von Beruf und Privatleben."
          - paragraph [ref=e42]:
            - text: Besonders freuen wir uns über
            - link "Platz 1 im kununu-Arbeitgeberranking Hessen 2026" [ref=e43] [cursor=pointer]:
              - /url: https://news.kununu.com/beste-arbeitgeber-hessen/
            - text: in der Kategorie der kleineren und mittleren Unternehmen sowie
            - link "Platz 1 in Frankfurt" [ref=e44] [cursor=pointer]:
              - /url: https://news.kununu.com/beste-arbeitgeber-frankfurt/
            - text: . Für uns ist diese Anerkennung zugleich ein Ansporn, uns als Arbeitgeber weiterzuentwickeln.
          - paragraph [ref=e45]: Du möchtest deine nächsten beruflichen Schritte in einem ausgezeichneten Umfeld gehen? Dann lerne eBakery kennen – und gestalte mit uns das nächste Kapitel.
