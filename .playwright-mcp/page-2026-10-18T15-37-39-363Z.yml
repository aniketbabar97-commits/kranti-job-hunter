            - generic [ref=f18e118]: "Dank dir fühlt sich komplexe Software einfach an. Du weißt: Das Kundenerlebnis macht den Unterschied."
            - generic [ref=f18e124]:
              - paragraph [ref=f18e125]
              - paragraph [ref=f18e126]:
                - generic [ref=f18e127]: Deine Mission
              - paragraph [ref=f18e129]: "Du weißt: Das Kundenerlebnis macht den Unterschied. Mache jetzt den nächsten wichtigen Karriereschritt und schließe dich einem der weltweit führenden Beratungs- und Technologieunternehmen an. Hilf uns, mit zukunftsfähigen Technologien die digitale Transformation namhafter Unternehmen zu beschleunigen."
              - paragraph [ref=f18e130]
              - paragraph [ref=f18e131]: Wir verstehen das Thema SAP CX/CRM in einem End-to-End-Kontext, der alle endkundenbezogenen Themenbereiche inkludiert, von Marketing-Engagement, über Commerce und Sales und Service, Stammdaten-Management und Billing Revenue Innovation Management sowie die SAP Business Transformation Platform.
              - paragraph [ref=f18e132]
              - paragraph [ref=f18e133]: Lebe deine Leidenschaft im SAP Customer Experience (SAP CX)-Team mit einem ganzheitlichen Ansatz für Strategieberatung, Prozessoptimierung, Implementierung und Betriebsführung von SAP CX-basierten Dienstleistungen (u.a. SAP Sales- & Service-Cloud (v1/v2), SAP CPQ, SAP Emarsys Customer Engagement & CDC/CDP/MDG, SAP Commerce Cloud, SAP CRM onPrem und S/4HANA Service, SAP Field Service Management, Subscription Billing und BRIM).
              - paragraph [ref=f18e134]
              - paragraph [ref=f18e135]: Das erwartet dich
              - list [ref=f18e136]:
                - listitem [ref=f18e137]:
                  - paragraph [ref=f18e138]: Implementiere mit uns Marketing, Sales & Services Lösungen
                  - paragraph [ref=f18e139]:
                    - generic [ref=f18e140]: Gemeinsam mit unseren Kunden analysierst du neue Anforderungen in den Bereichen Marketing und Vertrieb, Kundenservice und Kundendienst, Customer Engagement, eCommerce sowie Abrechnung von Service-orientierten Abomodellen. Du übernimmst bei der Implementierung die Konfiguration der entsprechenden SAP Module und gegebenenfalls Entwicklungsaufgaben.
                - listitem [ref=f18e141]:
                  - paragraph [ref=f18e142]: Setze neue Technologien bei Kunden um
                  - paragraph [ref=f18e143]:
                    - generic [ref=f18e144]: Du bringst die Umsetzung neuer Technologien und Themen wie digitale Transformationsprozesse, GenAI und Machine Learning, Sustainability sowie IoT voran, wobei du dich auf die erweiterten SAP CX-basierten Lösungen im jeweils branchenspezifischen Kontext konzentrierst
                - listitem [ref=f18e145]:
                  - paragraph [ref=f18e146]:
                    - generic [ref=f18e147]: Sorge für passgenaue Lösungen
                  - paragraph [ref=f18e148]: Je nach Projektphase bearbeitest du eigenverantwortlich Themenbereiche und Fragestellungen, erarbeitest User Stories, fachliche und technische Konzepte, führst Workshops und Anwenderschulungen durch und passt die Anwendung an die Kundenbedürfnisse an
            - paragraph [ref=f18e149]
            - paragraph [ref=f18e150]
            - paragraph [ref=f18e151]
            - paragraph [ref=f18e152]: Darauf freuen wir uns
            - list [ref=f18e153]:
              - listitem [ref=f18e154]:
                - paragraph [ref=f18e155]:
                  - generic [ref=f18e156]: Studium der (Wirtschafts-)Informatik, Betriebswirtschaft oder eine vergleichbare Ausbildung, gerne auch Quereinsteiger
              - listitem [ref=f18e157]:
                - paragraph [ref=f18e158]: Mehrjährige Projekt- und Beratungserfahrung im Bereich CRM/CX oder Abrechnung (idealerweise mit SAP CX bzw. SAP CRM / S/4HANA)
              - listitem [ref=f18e159]:
                - paragraph [ref=f18e160]:
                  - generic [ref=f18e161]: Einblicke in die Prozessanalyse und Fachkonzepterstellung, ins Technologiedesign sowie in die Konfiguration und das Go-live von CX-Lösungen
              - listitem [ref=f18e162]:
                - paragraph [ref=f18e163]:
                  - generic [ref=f18e164]: Ausgeprägte Affinität für neue Technologien und moderne Methoden der Projektdurchführung sowie ggf. Programmierkenntnisse (z.B. ABAP, CAP/RAP, ABSL, Java, JavaScript, HTML5/UI5, SQL, CPI, Kafka/ESB Erfahrung
                  - generic [ref=f18e165]: oä.)
              - listitem [ref=f18e166]:
                - paragraph [ref=f18e167]: Kommunikationsstärke in Deutsch (B2, C1) und Englisch sind notwendig sowie Spaß an der Beratungstätigkeit und der damit verbundenen Reisebereitschaft
            - paragraph [ref=f18e168]: Was wir dir bieten
            - list [ref=f18e169]:
              - listitem [ref=f18e170]:
                - paragraph [ref=f18e171]: Flexible Arbeitszeitmodelle
              - listitem [ref=f18e172]:
                - paragraph [ref=f18e173]:
                  - text: Umfassende Trainingsangebote, Fort- und
                  - generic [ref=f18e174]: Weiterbildungsmöglichkeiten
              - listitem [ref=f18e175]:
                - paragraph [ref=f18e176]: Attraktive Corporate Benefits
              - listitem [ref=f18e177]:
