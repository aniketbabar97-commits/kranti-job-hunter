            - paragraph [ref=f18e179]
            - paragraph [ref=f18e180]:
              - generic [ref=f18e181]: "Die Accenture-Kultur: Hier machst DU den Unterschied"
            - paragraph [ref=f18e183]:
              - generic [ref=f18e184]: "Deine Fähigkeiten, dein Naturell und deine Ambitionen machen dich einzigartig. Und wenn die unterschiedlichsten Talente, Stärken und Sichtweisen aufeinandertreffen, entsteht etwas Großartiges: Ideen, die in der Welt etwas bewegen. Deshalb setzen wir bei Accenture auf Diversität und freie Entfaltung. Schaffe dir ein Arbeitsumfeld, in dem du aufgehst. Mit Aufgaben, die dir am Herzen liegen. Mit einem Workload, der zu dir passt. Und mit einer Arbeitsweise, die sich an deinen Zielen orientiert. Wie du dich vernetzen, weiterbilden und persönlich wachsen willst, liegt bei dir. Es ist deine Karriere. Wir helfen dir, sie so zu gestalten, wie du es dir vorstellst."
            - paragraph [ref=f18e186]
            - paragraph [ref=f18e187]: Dein Kontakt
            - paragraph [ref=f18e188]:
              - text: Du hast Fragen? Dann wende dich gerne an unser Recruiting Team per E-Mail an
              - link [ref=f18e435] [cursor=pointer]:
