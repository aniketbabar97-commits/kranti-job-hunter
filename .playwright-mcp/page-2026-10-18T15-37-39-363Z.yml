                - text: recruiting_germany@accenture.com
              - text: .
            - paragraph [ref=f18e190]
            - paragraph [ref=f18e191]: Wir freuen uns auf deine Bewerbung über unser Online-Formular.
            - paragraph [ref=f18e192]
            - paragraph [ref=f18e193]
            - paragraph [ref=f18e194]
            - paragraph [ref=f18e195]:
              - generic [ref=f18e196]: About Accenture
            - text: Accenture is a leading global professional services company that helps the world’s leading businesses, governments and other organizations build their digital core, optimize their operations, accelerate revenue growth and enhance citizen services—creating tangible value at speed and scale. We are a talent- and innovation-led company with approximately 791,000 people serving clients in more than 120 countries. Technology is at the core of change today, and we are one of the world’s leaders in helping drive that change, with strong ecosystem relationships. We combine our strength in technology and leadership in cloud, data and AI with unmatched industry experience, functional expertise and global delivery capability. Our broad range of services, solutions and assets across Strategy & Consulting, Technology, Operations, Industry X and Song, together with our culture of shared success and commitment to creating 360° value, enable us to help our clients reinvent and build trusted, lasting relationships. We measure our success by the 360° value we create for our clients, each other, our shareholders, partners and communities.
            - paragraph [ref=f18e197]:
              - text: Visit us at
              - link [ref=f18e436] [cursor=pointer]:
                - /url: http://www.accenture.com/
                - text: www.accenture.com
            - paragraph [ref=f18e199]
            - paragraph [ref=f18e200]
            - paragraph [ref=f18e201]: Erklärung zur Chancengleichheit am Arbeitsplatz
            - paragraph [ref=f18e202]
            - paragraph [ref=f18e203]: Wir sind der Meinung, dass niemand aufgrund seiner Andersartigkeit diskriminiert werden sollte. Alle Einstellungsentscheidungen werden unabhängig von Alter, Rasse, Glaubensbekenntnis, Hautfarbe, Religion, Geschlecht, nationaler Herkunft, Abstammung, Behinderung, Veteranenstatus, sexueller Orientierung, Geschlechtsidentität oder -ausdruck, genetischen Informationen, Familienstand, Staatsbürgerschaft oder anderen gesetzlich geschützten Kriterien getroffen. Unsere große Vielfalt macht uns innovativer, wettbewerbsfähiger und kreativer und hilft uns, unsere Kunden und unsere Gemeinschaften besser zu betreuen.
