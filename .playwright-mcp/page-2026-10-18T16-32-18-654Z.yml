          - generic [ref=e99]:
            - paragraph [ref=e100]: "JobID: 7005"
            - paragraph [ref=e101]: "Standort: NBG VO"
            - paragraph [ref=e102]: "Art der Anstellung: Unbefristet / Vollzeit"
            - paragraph [ref=e103]
            - paragraph [ref=e104]:
              - strong [ref=e105]: Zur Verstärkung unseres Teams bei Innomotics suchen wir einen Global E-Business Operations Manager (m/w/d).
            - paragraph [ref=e106]:
              - strong [ref=e107]
            - paragraph [ref=e108]:
              - strong [ref=e109]: Der Branchenführer für Motoren und Antriebe
            - paragraph [ref=e110]: "Innomotics ist ein branchenführender Anbieter von Motoren und großen Antriebssystemen. Unsere Produkte, die auf mehr als 150 Jahre Erfahrung im Maschinenbau zurückblicken können, treiben alle wichtigen Industrien der Welt an. Heute erwecken wir die #EnergyTransition mit einem Portfolio zum Leben, das es unseren Kunden ermöglicht, die Energieeffizienz zu steigern, Treibhausgase zu reduzieren und den CO2-Fußabdruck von Anlagen zu minimieren."
            - paragraph [ref=e111]
            - paragraph [ref=e112]:
              - strong [ref=e113]: "Unser stärkster Motor: Unsere Mitarbeitenden"
            - paragraph [ref=e114]: Wir sind ein Team von mehr als 15.000 engagierten Experten, Machern und Innovatoren. Die Zukunft zu gestalten, bedeutet für uns, Unternehmen in Bewegung zu halten. Als Global Player, der mit dem Geist und der Geschwindigkeit eines mittelständischen Champions agiert, bietet uns die Zukunft unbegrenzte Möglichkeiten. Wenn Sie den gleichen Mut haben, wie wir und zu den Besten gehören wollen, sind Sie bei uns genau richtig.
            - paragraph [ref=e115]
            - paragraph [ref=e116]:
              - generic [ref=e117]:
                - text: Als
                - strong [ref=e118]: Global E-Business Operations Manager (m/w/d)
                - text: werden Sie Teil unseres Digital Sales Platform Teams und gestalten die Zukunft unserer digitalen Vertriebsprozesse aktiv mit. Sie betreuen und entwickeln unsere digitalen Vertriebslösungen in den Bereichen
                - strong [ref=e119]: E-Commerce, EDI und Mail2EDI
                - text: kontinuierlich weiter.
            - paragraph [ref=e120]
            - paragraph [ref=e121]: Dabei sind Sie die zentrale Schnittstelle zwischen IT, internationalen E-Business-Ansprechpartner:innen und weiteren Fachbereichen. Sie verbinden fachliche Anforderungen mit der technischen Umsetzung und stellen sicher, dass unsere Plattformen und Prozesse bestmöglich auf die Bedürfnisse unserer Kunden und Märkte ausgerichtet sind.
            - paragraph [ref=e122]
            - paragraph [ref=e123]:
              - strong [ref=e124]: Ihre Aufgaben
            - paragraph [ref=e125]:
              - generic [ref=e126]: • Betreuung, Steuerung und kontinuierliche Weiterentwicklung unserer digitalen E-Business- und E-Commerce-Plattform• Aufnahme, Analyse, Strukturierung und Priorisierung fachlicher Anforderungen im Rahmen des Demand Managements• Durchführung von Requirements Engineering, von der Anforderungsanalyse über die Spezifikation bis zur Abstimmung mit allen relevanten Stakeholdern• Übersetzung von Business-Anforderungen in umsetzbare Anforderungen für die IT und externe Dienstleister• Steuerung und Begleitung von Projekten zur Weiterentwicklung der Digital Sales Platform, von der Planung bis zum erfolgreichen Go-live• Arbeit in agilen Teams sowie aktive Mitgestaltung agiler Prozesse, beispielsweise durch Backlog-Pflege, Sprint-Planung und Reviews• Enge Zusammenarbeit mit globalen E-Business-Ansprechpartner:innen, die Kunden auf unsere Plattform onboarden• Aufnahme, Bewertung und Überführung von Feedback aus den internationalen Märkten in konkrete Optimierungsmaßnahmen• Abstimmung mit IT, Vertrieb, Customer Service und weiteren internationalen Stakeholdern• Mitwirkung bei Tests, Qualitätssicherung, Roll-outs und der Erstellung relevanter Dokumentationen
            - paragraph [ref=e127]
            - paragraph [ref=e128]:
              - strong [ref=e129]: Ihr Profil
            - paragraph [ref=e130]:
              - generic [ref=e131]: • Abgeschlossenes Studium in Wirtschaftsinformatik, Betriebswirtschaftslehre oder eine vergleichbare Qualifikation• Mindestens fünf Jahre Berufserfahrung im Umfeld Digital Sales, E-Business, E-Commerce oder Business Applications• Fundierte Erfahrung im Projektmanagement sowie in der Steuerung komplexer, internationaler Stakeholder-Strukturen• Praktische Kenntnisse im Demand Management und Requirements Engineering• Erfahrung mit agilen Arbeitsweisen und Methoden, beispielsweise Scrum, Kanban oder hybriden Projektansätzen• Gutes Verständnis digitaler Vertriebs- und Order-to-Cash-Prozesse• Berührungspunkte mit EDI und/oder Erfahrung mit digitalen B2B-Integrationsprozessen und SAP SD sind von Vorteil• Sehr gute Kommunikations- und Moderationsfähigkeiten in einem internationalen Umfeld• Verhandlungssichere Englischkenntnisse in Wort und Schrift; Deutschkenntnisse sind von Vorteil
            - paragraph [ref=e132]
            - paragraph [ref=e133]
            - paragraph [ref=e134]:
              - strong [ref=e135]: Was ist für Sie drIN (Unsere Benefits)
            - paragraph [ref=e136]
            - list [ref=e137]:
              - listitem [ref=e138]: Vergütung nach den jeweils gültigen Tarifverträgen der Metall- und Elektroindustrie
              - listitem [ref=e139]: 30 Tage Urlaub
              - listitem [ref=e140]: Flexible Arbeitszeitmodelle
              - listitem [ref=e141]: Attraktive Altersvorsorge
              - listitem [ref=e142]: Zahlreiche Weiterbildungsmöglichkeiten
              - listitem [ref=e143]: Vielfältige Gesundheitsangebote
              - listitem [ref=e144]: Kinderbetreuungszuschuss
              - listitem [ref=e145]: Arbeitgeberzuschuss zum Deutschlandticket
              - listitem [ref=e146]: Kantinen mit vergünstigten Preisen für Mitarbeitende
              - listitem [ref=e147]: Zugang zu einem Vorteilsportal mit attraktiven Mitarbeiterangeboten
            - paragraph [ref=e148]
            - paragraph [ref=e149]:
              - strong [ref=e150]: Sind Sie bereit, die Zukunft mit uns zu gestalten? Kommen Sie zu Innomotics und fangen Sie jetzt an, einen Unterschied zu machen.
            - paragraph [ref=e151]:
              - strong [ref=e152]: "#TeamInnomotics #JoinReliableMotion"
            - paragraph [ref=e153]: Innomotics ist ein Arbeitgeber der Chancengleichheit und legt Wert auf Vielfalt. Wir diskriminieren nicht aufgrund von Ethnie, Religion, Hautfarbe, nationaler Herkunft, Geschlecht, sexueller Orientierung, Alter, Familienstand oder Behinderungsstatus.
