                    - paragraph [ref=f1e668] [cursor=pointer]:
                      - text: Ich willige ein, dass mein Bewerberprofil (allgemeine Profilangaben und – soweit von mir freiwillig hinterlegt – optionale Angaben/Dokumente) in den Kandidaten-/Talentpool aufnimmt, damit zugriffsberechtigte Recruiter*innen der Bertelsmann-Unternehmen, Bertelsmann Stiftungen und ausgewählten Partnerunternehmen mein Profil manuell mit offenen Positionen abgleichen und mich proaktiv kontaktieren dürfen (Art. 6 Abs. 1 lit. a DSGVO). Stellenspezifische Angaben aus laufenden Bewerbungen sind nicht Bestandteil des Pools. Es kann zu Datenübermittlungen in Drittländer kommen; hierfür nutzen wir Art. 45/46 DSGVO (Angemessenheitsbe-schluss/Standardvertragsklauseln), ausnahmsweise stützt sich die Übermittlung auf meine ausdrückliche Einwilligung (Art. 49 Abs. 1 lit. a DSGVO). Widerruf jederzeit möglich; laufende Einzelbewerbungen bleiben unberührt. Weitere Informationen finde ich in den
