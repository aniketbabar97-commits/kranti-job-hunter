                      - paragraph [ref=f1e652]:
                        - text: Ich willige ein, dass die von mir freiwillig gemachten optionalen Angaben und Dokumente ausschließlich für diese konkrete Bewerbung verarbeitet werden, um meine Eignung zu prüfen und mit mir zu kommunizieren. Zugriff erhalten nur die am Prozess beteiligten Stellen. Eine Nutzung für einen Talentpool erfolgt nur, wenn ich dem gesondert zustimme. Ich kann diese Einwilligung jederzeit mit Wirkung für die Zukunft widerrufen. Soweit ich stellenspezifische Angaben zur Chancengleichheit mache, willige ich außerdem ausdrücklich ein, dass diese Daten getrennt von den übrigen Bewerbungsdaten ausschließlich zu Gleichstellungszwecken und nur für die konkrete Stelle verarbeitet werden. Rechtsgrundlagen sind Art. 6 Abs. 1 Buchst. a DSGVO und – für Chancengleichheitsangaben – Art. 9 Abs. 2 Buchst. a DSGVO. Mir ist bewusst, dass meine Daten bei Bewerbungen auf Jobs von Unternehmen in Drittländern auch in diesen verarbeitet werden (Art. 49 DSGVO). Weitere Informationen finde ich in den
                        - link "Datenschutzhinweisen" [ref=f1e653]:
