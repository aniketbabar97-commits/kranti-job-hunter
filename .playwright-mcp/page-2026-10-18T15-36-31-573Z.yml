            - heading "Senior Product Owner (w/m/d) E-Commerce" [level=1] [ref=f11e13]
            - generic [ref=f11e14]: Hinterm Hauptbahnhof 3-5, 76137 Karlsruhe
          - button "Bewerben" [ref=f11e18] [cursor=pointer]: Jetzt bewerben
        - generic [ref=f11e19]:
          - generic [ref=f11e20]:
            - heading "Über IONOS" [level=4] [ref=f11e21]
            - paragraph [ref=f11e22]: "Bei IONOS verwalten wir nicht nur Server, wir prägen mit unseren Lösungen die digitale Zukunft für über 6,2 Millionen Kundinnen und Kunden weltweit. Als Europas führender Hosting-Anbieter und Pionier für unabhängige Cloud-Lösungen bauen wir eine Infrastruktur der nächsten Generation: von souveränen Cloud-Architekturen und hochperformanten GPU-Clustern bis hin zu integrierten KI-Automatisierungstools."
            - paragraph [ref=f11e23]: "Was uns antreibt: Digitale Entscheidungsfreiheit für Europa und echter Impact für kleine und mittlere Unternehmen (KMU) sowie Großunternehmen. Wir arbeiten in agilen Teams, setzen auf transparente Strukturen und glauben daran, dass Exzellenz und Innovation nur mit echtem Teamgeist entstehen."
            - paragraph [ref=f11e24]: Bereit für Deinen nächsten Schritt? Werde ein Teil von IONOS und wachse mit uns.
          - generic [ref=f11e25]:
            - paragraph [ref=f11e26]: Wir sind eine moderne E-Commerce-Division und verantworten im Rahmen der IONOS Group den internationalen Webauftritt von aktuell sieben Marken und somit einem der wichtigsten Vertriebskanäle unseres Unternehmens. Wir arbeiten sowohl in agilen, crossfunktionalen und interdisziplinären Teams als auch in Kombination mit agilem Projektmanagement für größere, komplexe Initiativen und Projekte.
            - paragraph [ref=f11e27]: Du übernimmst gerne Verantwortung und möchtest gemeinsam mit uns den Webauftritt von morgen mitgestalten? Dann bist du bei uns genau richtig!
            - heading "Aufgabenbereich" [level=4] [ref=f11e28]
            - list [ref=f11e29]:
              - listitem [ref=f11e30]: Als Product Owner übernimmst du die End-to-End-Verantwortung für einen Produktbereich unserer Websites und Online-Shops und/oder für eine Marke der IONOS Gruppe, zusammen mit funktionsübergreifenden Experten.
              - listitem [ref=f11e31]: Als Verantwortlicher für die Conversion-Rate übernimmst du die kontinuierliche Analyse und Interpretation der User Flows auf dem Portal und im Check-out-Funnel.
              - listitem [ref=f11e32]: Du führst eine kontinuierliche Erfolgskontrolle der wichtigsten Websites und Online-Shop-KPIs durch. Außerdem stellst du Reports für das Management bereit.
              - listitem [ref=f11e33]: Du erstellst und priorisierst Ihr Backlog mit Verbesserungen, basierend auf Nutzerfeedback, Geschäftszielen und Markteinblicken, und stimmst dies mit den Stakeholdern ab.
              - listitem [ref=f11e34]: Durchführung von methodischen Analysen, wie z.B. Markt- und Wettbewerbsbetrachtungen, um Nutzerbedürfnisse, Trends und Möglichkeiten für die Weiterentwicklung zu identifizieren.
              - listitem [ref=f11e35]: Du verstehst es, komplexe Nutzer- und Business-Anforderungen von verschiedenen Stakeholdern im Unternehmen in nahtlose Workflows und Konzeptideen zu übersetzen.
              - listitem [ref=f11e36]: Enge Zusammenarbeit in Crossfunktional Teams und Abstimmung mit allen relevanten Schnittstellen (Entwicklung, Technik, Agenturen, Produktmanagement, Product Marketing, Vertrieb, Customer Service u.a.).
              - listitem [ref=f11e37]: Du kennst aktuelle UX-Design-Trends und interessierst dich für innovative Konzepte. Du verstehst es, neue Ideen und Konzepte im Team und bei unseren Stakeholdern zu kommunizieren und zu vertreten.
            - heading "Qualifikationen" [level=4] [ref=f11e38]
            - list [ref=f11e39]:
              - listitem [ref=f11e40]: Du bist PO aus Leidenschaft und weißt, was du willst. Die Bedürfnisse unserer Nutzer treiben dich an. Den Grundstein deines Erfolgs bildet ein erfolgreiches Studium oder eine vergleichbare Ausbildung.
              - listitem [ref=f11e41]: Die Vor- und Nachteile von klassischen und agilen Vorgehensweisen sind dir aus mehrjähriger praktischer Erfahrung, optimalerweise im Bereich der Softwareentwicklung, bekannt.
              - listitem [ref=f11e42]: Du bringst die richtige Mischung aus Kreativität und unternehmerischem Kalkül mit.
              - listitem [ref=f11e43]: Du zeichnest dich durch analytisches Denkvermögen, viel Eigeninitiative, Engagement, Mut und ein strukturiertes, aber auch pragmatisches Vorgehen aus.
              - listitem [ref=f11e44]:
                - text: Du bist versiert im Umgang mit Stakeholdern sowie im Erstellen von Epics und
                - strong [ref=f11e45]: User Stories
                - text: und im Verantworten und Priorisieren des Product Backlogs.
              - listitem [ref=f11e46]: Du entwickelst gemeinsam mit den Stakeholdern die Produktvision weiter und füllst sie mit Leben.
              - listitem [ref=f11e47]: Du hast eine Leidenschaft für digitale Innovation und ein ausgeprägtes Interesse an neuen Technologien und Trends.
              - listitem [ref=f11e48]: Die Fähigkeit, in einem schnelllebigen, dynamischen Umfeld erfolgreich zu sein und sich schnell an sich ändernde Prioritäten und Anforderungen anzupassen.Persönlich zeichnen dich Qualitätsbewusstsein, Leistungsbereitschaft und Eigeninitiative aus.
              - listitem [ref=f11e49]: Du hast Spaß an technischen Themen und digitalen Produkten.
              - listitem [ref=f11e50]: Der Umgang mit Tools wie G-Suite, Microsoft Office, Atlassian JIRA oder Confluence ist kein Problem für dich.
              - listitem [ref=f11e51]: Sehr gute Deutsch- und Englischkenntnisse in Wort und Schrift.
            - heading "Benefits" [level=4] [ref=f11e52]
            - list [ref=f11e53]:
              - listitem [ref=f11e54]: Hybrides Arbeitsmodell mit Homeoffice-Möglichkeit.
              - listitem [ref=f11e55]: Flexible Arbeitszeiten durch Vertrauensarbeitszeit.
              - listitem [ref=f11e56]: An einigen Standorten eine bezuschusste Kantine und verschiedene kostenfreie Getränke.
              - listitem [ref=f11e57]: Moderne Büroflächen mit sehr guter Verkehrsanbindung.
              - listitem [ref=f11e58]: Diverse Mitarbeiterrabatte für Aktivitäten und Produkte.
              - listitem [ref=f11e59]: Mitarbeiterevents wie Sommer- und Winterfeiern, sowie Workshops.
              - listitem [ref=f11e60]: Zahlreiche Weiterbildungs- und Entwicklungsmöglichkeiten.
              - listitem [ref=f11e61]: Verschiedene Gesundheitsangebote, wie Sport- und Gesundheitskurse.
          - generic [ref=f11e62]:
            - heading "Hinweis zur Bewerbung" [level=4] [ref=f11e63]
            - paragraph [ref=f11e64]: Wir wertschätzen Vielfalt und begrüßen alle Bewerbungen – unabhängig von z. B. Geschlecht, Nationalität, ethnischer und sozialer Herkunft, Religion, Behinderung, Alter sowie sexueller Orientierung und Identität, körperlichen Merkmalen, Familienstand oder einem anderen sachfremden Kriterium nach geltendem Recht.
            - paragraph [ref=f11e65]
