  - generic [ref=f7e29]:
    - paragraph [ref=f7e30]: Die CEMO-Gruppe mit rund 300 Mitarbeitenden ist ein einer der führenden Hersteller professioneller Systeme zur sicheren Lagerung und zum Transport von Gefahrstoffen und Kraftstoffen. Seit 1960 entwickeln und produzieren wir in Deutschland praxisgerechte Lösungen – von Tankanlagen und Behältern bis zu modernen Sicherheitsschränken und Sicherheitscontainern. CEMO steht für Sicherheit, Qualität und Innovation.
    - paragraph [ref=f7e31]:
      - strong [ref=f7e32]: Gemeinsam weiterkommen – Schwäbischer Erfindergeist gepaart mit menschlicher Wertschätzung
    - paragraph [ref=f7e33]: Wir gehen fair miteinander um und inspirieren uns gegenseitig. Das macht uns in Krisenzeiten stark und bietet langfristig sichere Arbeitsplätze in einem international wachsenden Unternehmen. Respekt, Vertrauen und Aufrichtigkeit prägen unsere Geschichte und werden es auch in Zukunft tun.
    - paragraph [ref=f7e34]
    - paragraph [ref=f7e35]:
      - strong [ref=f7e36]: Ihre Aufgaben
    - list [ref=f7e37]:
      - listitem [ref=f7e38]: Analyse, Konzeption und Umsetzung von Anforderungen aus Vertrieb, Marketing, Kundenservice und E-Business
      - listitem [ref=f7e39]: Betreuung und Weiterentwicklung unserer digitalen Systemlandschaft (Online-Shop, CRM, PIM)
      - listitem [ref=f7e40]: Planung, Implementierung und Optimierung von Schnittstellen sowie EDI-Prozessen
      - listitem [ref=f7e41]: Analyse und Optimierung von Geschäftsprozessen, Datenflüssen und Middleware-Lösungen
      - listitem [ref=f7e42]: Erstellung von Fachkonzepten, Spezifikationen und User Stories
      - listitem [ref=f7e43]: Mitwirkung bei der Einführung neuer digitaler Lösungen und Automatisierungen
      - listitem [ref=f7e44]: Sicherstellung der Datenqualität durch Datenimporte, Abgleiche und Plausibilitätsprüfungen
      - listitem [ref=f7e45]: Fehleranalyse und Störungsbehebung in Anwendungen, Schnittstellen und Prozessen
      - listitem [ref=f7e46]: Begleitung von Anforderungen und Projekten von der Konzeption bis zum Go-Live
      - listitem [ref=f7e47]: Durchführung von Funktions-, Integrations- und User-Acceptance-Tests
      - listitem [ref=f7e48]: Zusammenarbeit mit internen Fachbereichen sowie externen Dienstleistern und Partnern
    - paragraph [ref=f7e49]:
      - strong [ref=f7e50]: Ihr Profil
    - list [ref=f7e51]:
      - listitem [ref=f7e52]: Abgeschlossenes Studium im Bereich Wirtschaftsinformatik, Informatik, BWL oder eine vergleichbare Qualifikation
      - listitem [ref=f7e53]: Berufserfahrung als Business Analyst, Application Specialist oder in einer vergleichbaren Rolle, idealerweise im E-Commerce-Umfeld
      - listitem [ref=f7e54]: Gutes Verständnis für E-Commerce-Prozesse (ERP-Systeme, Schnittstellen, Zahlungsanbieter, etc.)
      - listitem [ref=f7e55]: Analytisches Denkvermögen und die Fähigkeit, komplexe Sachverhalte verständlich aufzubereiten
      - listitem [ref=f7e56]: Kommunikationsstärke und Freude an der Zusammenarbeit mit unterschiedlichen Stakeholdern
      - listitem [ref=f7e57]: Sehr gute Deutsch- und gute Englischkenntnisse
    - paragraph [ref=f7e58]:
      - strong [ref=f7e59]: Ihre Vorteile
    - list [ref=f7e60]:
      - listitem [ref=f7e61]: Gutes und soziales Betriebsklima
      - listitem [ref=f7e62]: Attraktive Vergütung mit Urlaubs- und Weihnachtsgeld
      - listitem [ref=f7e63]: 30 Tage Urlaub
      - listitem [ref=f7e64]: Verpflegungszuschuss und Obsttage
      - listitem [ref=f7e65]: Mitarbeiterangebote
      - listitem [ref=f7e66]: Business-Bike
    - paragraph [ref=f7e67]
    - paragraph [ref=f7e68]: Es erwartet Sie eine abwechslungsreiche und verantwortungsvolle Tätigkeit in einem erfolgreichen mittelständischen Unternehmen mit viel Freiraum für eigene Kreativität und Verantwortung. Wenn Sie sich vorstellen können, Teil unseres motivierten Teams zu werden, bewerben Sie sich bitte direkt über den "Online Bewerben-Button" unter Angabe Ihres frühestmöglichen Eintrittstermins und Ihres Gehaltswunsches.
    - paragraph [ref=f7e69]: Vorabinformationen zur Stelle gibt Ihnen gerne Herr Reichenauer (Leitung Organisation) unter 07151/9636-1401.
