            - strong [ref=e24]: Tradition trifft Moderne – Wir als inhabergeführtes Familienunternehmen wachsen und wir suchen neue Mitarbeiter, die uns dabei unterstützen.
          - paragraph
          - paragraph [ref=e25]: Sind Sie auf der Suche nach einem sicheren Arbeitsplatz in einem stabilen, familiengeführten Unternehmen, das Werte wie Zusammenhalt und Vertrauen hochhält? Möchten Sie in einem Umfeld arbeiten, das sowohl neue Herausforderungen als auch vielfältige Entwicklungsmöglichkeiten bietet? Wenn Sie motiviert, teamfähig und kreativ sind, dann sind Sie bei uns genau richtig! Bei BADER erwarten Sie nicht nur spannende Aufgaben, sondern auch flache Hierarchien, die eine enge Zusammenarbeit und einen familiären Umgang fördern. Werden Sie Teil unserer Geschichte und gestalten Sie die Zukunft mit uns!Wir freuen uns auf die Zusammenarbeit mit Ihnen!
