        - heading "SAP CX Spezialist | BW/4HANA, SAP BTP, SAP CRM, Projektleitung | Inhouse, bis 95.000 € (mwd)" [level=1] [ref=f1e55]
        - paragraph [ref=f1e56]: Unser Klient ist ein bekannter überregionaler Infrastruktur-Dienstleister. Er bedient seine Kunden seit Jahrzehnten mit viel Kompetenz und Erfahrung. Deshalb investiert er in erneuerbare Energiegewinnung und unterstützt Kommunen bei der Wärmewende sowie dem Ausbau von Elektromobilität. Als führender Dienstleister hat er hohe Ansprüche an sich und treibt innovative Projekte aktiv voran. Als Arbeitgeber bietet er beste Bedingungen und Entwicklungsperspektiven.
