                - heading "Infra / DevOps Lead - eCommerce (m/w/d)" [level=1] [ref=f15e67]
                - generic [ref=f15e68]: "Kategorie: Infrastruktur/Cloud"
                - generic [ref=f15e69]: "Hauptstandort: Deutschland, Nordrhein-Westfalen, Düsseldorf, Köln oder Bochum"
                - generic [ref=f15e70]: "Stellen-ID: J1026-0889"
                - generic [ref=f15e71]: "Anstellungsart: Vollzeit"
              - generic [ref=f15e72]:
                - generic [ref=f15e73]:
                  - heading "Stellenbeschreibung:" [level=2] [ref=f15e74]
                  - paragraph
                  - list [ref=f15e75]:
                    - paragraph [ref=f15e76]:
                      - text: "Der eCommerce-Bereich befindet sich in einem tiefgreifenden Wandel: Steigende Anforderungen an Verfügbarkeit, Skalierbarkeit und Kundenerlebnis treffen auf den Weg in Richtung Cloud. Gleichzeitig wachsen die Anforderungen an moderne, PHP-basierte Plattformarchitekturen, die stabil betrieben und gleichzeitig weiterentwickelt werden müssen. Als Infra / DevOps Lead (m/w/d) übernimmst du eine zentrale Rolle beim Betrieb und der technologischen Weiterentwicklung einer geschäftskritischen B2B-eCommerce-Plattform auf Basis von Magento 2. Die Plattform wird aktuell in einer On-Premises-Infrastruktur betrieben und soll zeitnah in die Adobe Commerce Cloud migriert werden. Du verantwortest die technische Führung des Infrastruktur- und DevOps-Bereichs und arbeitest eng mit Development, Operations, Security und weiteren Stakeholdern zusammen. Wenn du technische Verantwortung für eine geschäftskritische Systemlandschaft übernehmen, die Transformation in Richtung Cloud aktiv mitgestalten und ein Team fachlich führen möchtest, bist du bei uns genau richtig. CGI gehört zu den weltweit führenden Unternehmen für Business- und IT-Beratung. Mit über 94.000 Partnern arbeiten wir in lokal verankerten Teams und verbinden globale Expertise mit regionaler Nähe. Unser Portfolio umfasst Business Consulting, Systemintegration und Managed Services – wir begleiten unsere Kunden End-to-End durch ihre digitale Transformation."
