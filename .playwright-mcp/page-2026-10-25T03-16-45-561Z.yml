                - generic [ref=f15e78]:
                  - heading "Aufgaben:" [level=2] [ref=f15e79]
                  - paragraph
                  - list [ref=f15e80]:
                    - paragraph [ref=f15e81]: "In deiner Rolle als Infra / DevOps Lead (m/w/d) verantwortest du den stabilen Betrieb sowie die Weiterentwicklung der Infrastruktur- und DevOps-Architektur einer komplexen eCommerce-Plattform. Deine Aufgaben umfassen insbesondere:"
                    - listitem [ref=f15e82]: Technische Verantwortung für Infrastruktur und stabilen Betrieb der Magento-2-Plattform in der aktuellen On-Premises-Umgebung sowie in der zukünftigen Adobe Commerce Cloud
                    - listitem [ref=f15e83]: Weiterentwicklung und Optimierung der Infrastruktur- und DevOps-Architektur mit Fokus auf Verfügbarkeit, Performance, Skalierbarkeit, Security und Wartbarkeit
                    - listitem [ref=f15e84]: Technische und fachliche Führung des Operations-/DevOps-Teams sowie Unterstützung anderer Engineers bei komplexen technischen Fragestellungen
                    - listitem [ref=f15e85]: Analyse und Lösung komplexer Infrastruktur-, Performance- und Produktionsprobleme, insbesondere entlang der Magento-/PHP-Laufzeitumgebung
                    - listitem [ref=f15e86]: Technische Leitung strukturierter Root Cause Analysen und Ableitung nachhaltiger Maßnahmen zur Stabilisierung und Verbesserung der Plattform
                    - listitem [ref=f15e87]: Technische Begleitung und Mitgestaltung der geplanten Migration von On-Premises zu
                    - listitem [ref=f15e88]: Verantwortung fuer CI/CD-, Configuration-Management-, Deployment- und Release-Prozesse, insbesondere mit Jenkins sowie Puppet / Ansible
                    - listitem [ref=f15e89]: Planung und Koordination von Releases, Patches, Infrastrukturveränderungen und Wartungsarbeiten inklusive Risiko- und Abhaengigkeitsbewertung
                    - listitem [ref=f15e90]: Aufbau und Weiterentwicklung von Monitoring, Alerting und Observability sowie Nutzung geeigneter Telemetrie fuer Fehleranalyse und Performance-Optimierung
                    - listitem [ref=f15e91]: Proaktive Identifikation von Capacity-, Lifecycle-, Security- und Obsolescence-Risiken und Einleitung geeigneter Gegenmassnahmen
                    - listitem [ref=f15e92]: Zusammenarbeit mit Development, QA, Architecture, Security, Service Management sowie externen Infrastruktur- und Hosting-Providern
                    - listitem [ref=f15e93]:
                      - text: Unterstuetzung bei Business Continuity, Backup/Restore und Disaster-Recovery-Konzepten sowie bei entsprechenden Tests
                      - paragraph
                - generic [ref=f15e94]:
                  - heading "Qualifikation:" [level=2] [ref=f15e95]
                  - paragraph
                  - list [ref=f15e96]:
                    - paragraph [ref=f15e97]: Du bringst fundierte Erfahrung im Bereich DevOps und Infrastructure Engineering sowie die Fähigkeit mit, eine komplexe, geschäftskritische Plattform technisch zu führen und strukturiert weiterzuentwickeln.
                    - listitem [ref=f15e98]: Mehrjährige Erfahrung im Bereich DevOps, Infrastructure Engineering oder Platform Operations, idealerweise in einer Lead- oder Senior-Rolle
                    - listitem [ref=f15e99]: Sehr gute Kenntnisse von Magento 2 und der zugrunde liegenden technischen Architektur
                    - listitem [ref=f15e100]: Sehr gute PHP-Kenntnisse sowie fundiertes Verständnis von PHP-FPM, PHP-Konfiguration, Worker-Modellen, Memory Management, Timeouts und Performance-Tuning
                    - listitem [ref=f15e101]: Sehr gute Linux-Kenntnisse, idealerweise RHEL / Rocky Linux, sowie sehr gute Kenntnisse von Nginx und dem Betrieb PHP-basierter Web-Applikationen
                    - listitem [ref=f15e102]: Erfahrung mit CI/CD, insbesondere Jenkins, sowie mit Build-, Deployment- und Release-Prozessen in komplexen Systemlandschaften
                    - listitem [ref=f15e103]: Erfahrung mit Configuration Management und Infrastructure-as-Code, idealerweise Puppet und ergänzend Ansible
                    - listitem [ref=f15e104]: Gute Kenntnisse mehrerer für Magento typischer Backend-Komponenten wie Redis / Sentinel, RabbitMQ, Elasticsearch / OpenSearch sowie MySQL / MariaDB
                    - listitem [ref=f15e105]: Erfahrung mit Monitoring und Observability, beispielsweise New Relic, Kibana und Filebeat
                    - listitem [ref=f15e106]: Sehr gutes Verständnis von Networking, DNS, TLS/SSL, Firewalls, Load Balancing und Reverse Proxies
                    - listitem [ref=f15e107]: Erfahrung im Troubleshooting komplexer verteilter Systemlandschaften und in der strukturierten Root Cause Analysis
                    - listitem [ref=f15e108]: Erfahrung mit Adobe Commerce Cloud bzw. Adobe Commerce on Cloud Infrastructure oder vergleichbare praktische Erfahrung mit dem Betrieb und der Migration komplexer eCommerce-Plattformen in Cloud-Umgebungen
                    - listitem [ref=f15e109]: Verstaendnis von Cloud-Architekturen und Cloud-Betriebsmodellen sowie der Unterschiede zu klassischen On-Premises-Infrastrukturen
                    - listitem [ref=f15e110]: Sehr gute Englischkenntnisse, Deutsch von Vorteil Von Vorteil
                    - listitem [ref=f15e111]: Erfahrung mit VMware / ESXi sowie SAN-/NAS-Infrastrukturen
                    - listitem [ref=f15e112]: Kenntnisse in Cloudflare sowie CDN-, WAF- und Web-Security-Konzepten
                    - listitem [ref=f15e113]: Erfahrung mit F5 BIG-IP sowie Cisco- oder Palo-Alto-Firewalls
                    - listitem [ref=f15e114]: Kenntnisse in LDAP / 389 Directory Server / SSSD bzw. zentralem Identity Management
                    - listitem [ref=f15e115]: Erfahrung mit High-Availability-, Backup-/Restore- und Disaster-Recovery-Konzepten
                    - listitem [ref=f15e116]:
                      - text: Erfahrung im Betrieb grosser oder geschaeftskritischer B2B-eCommerce-Plattformen Technisches Umfeld Magento 2 · PHP / PHP-FPM · Linux / RHEL / Rocky Linux · Nginx · Jenkins · Puppet · Ansible · Git / Gitea · Redis / Sentinel · RabbitMQ · OpenSearch / Elasticsearch · MySQL / MariaDB · New Relic · Kibana · Filebeat · VMware / ESXi · Cloudflare · F5 · LDAP Neben deinem fachlichen Know-how überzeugst du durch unternehmerisches Denken, strategische Weitsicht und die Fähigkeit, komplexe Sachverhalte verständlich zu kommunizieren. Du arbeitest eigenverantwortlich, bringst dich aktiv ins Team ein und gestaltest Themen mit.
                      - heading "Was wir bieten" [level=2] [ref=f15e117]
                    - listitem [ref=f15e118]: Bei uns findest du Kolleg:innen, mit denen die Zusammenarbeit Spaß macht. Wir begegnen uns offen, duzen uns über alle Positionen hinweg und denken nicht in Hierarchien oder Silos.
                    - listitem [ref=f15e119]: Du arbeitest meist direkt an deinem Heimatort – weil wir Kundennähe wörtlich nehmen und uns Work-Life-Balance am Herzen liegt.
                    - listitem [ref=f15e120]: Du profitierst von flexiblen Arbeitszeiten und hast je nach Kundensituation die Möglichkeit, von zuhause zu arbeiten.
                    - listitem [ref=f15e121]: Die richtigen Trainings und Zertifikate bringen deine Weiterbildung voran. Unsere E-Learning-Plattform Academia ermöglicht dir das Lernen, wo und wann du willst.
                    - listitem [ref=f15e122]: Einen Teil deines Bruttogehalts kannst du in CGI Aktien investieren – bis maximal 3 % des Monatsgehalts geben wir für jeden Euro einen weiteren hinzu.
                    - listitem [ref=f15e123]: "Außerdem beteiligen wir dich am Unternehmenserfolg: Du erhältst eine Gewinnbeteiligung, die sich nach deiner individuellen Leistung richtet, sowie danach, wie wir als Unternehmen unsere finanziellen Ziele erreichen konnten."
                    - listitem [ref=f15e124]: Mit Jobticket und Jobbike fördern wir umweltfreundliche Mobilität. Abhängig von deiner Rolle und Projektsituation sind auch Bahncard oder Elektro-Firmenwagen möglich.
                    - listitem [ref=f15e125]: Sabbatical oder Elternzeit werden unterstützt. Sie sind bei uns kein Karriere-Stopper!
                    - listitem [ref=f15e126]: "Wir sind an deiner Seite, auch wenn es einmal nicht so gut läuft: Du kannst Sonderurlaub nehmen, und unsere Beratungshotline steht dir immer zur Verfügung."
                    - listitem [ref=f15e127]:
                      - text: Eine Vielzahl an gemeinsamen Events und Freizeitaktivitäten stärkt deine Verbundenheit mit deinen Kolleg:innen.#LI-MH21
                      - paragraph
                - generic [ref=f15e128]:
                  - heading "Was kann man von CGI erwarten?:" [level=2] [ref=f15e129]
                  - paragraph [ref=f15e130]:
                    - strong [ref=f15e131]: Together, as owners, let’s turn meaningful insights into action.
                    - text: 1976 gegründet und nach wie vor familiengeführt, ist CGI heute einer der weltweit größten unabhängigen Anbieter von IT und Business Consulting. Ein hohes Maß an Eigenverantwortung, Teamwork, Respekt und Zusammenhalt machen das Arbeiten bei uns besonders. Bei uns kannst du dein volles Potenzial entfalten!Du darfst dich vom ersten Tag an als Miteigentümer:in von CGI verstehen. Wir lassen unsere Vision gemeinsam Wirklichkeit werden. Wir profitieren von unserem gemeinsamen Erfolg und haben die Möglichkeit und die Verantwortung, die Strategie und Ausrichtung unseres Unternehmens aktiv mitzugestalten.Deine Arbeit schafft Mehrwert. Du findest innovative Lösungen und stärkst dein Netzwerk aus Kolleg:innen und Kunden. Gleichzeitig hast du Zugang zu globalen Ressourcen, um große Ideen zu verwirklichen, neue Chancen zu nutzen und von der immensen Branchen- und Technologie-Kompetenz zu profitieren.Du bringst deine Karriere voran, da du in einem Unternehmen arbeitest, das auf Wachstum und Langlebigkeit ausgelegt ist. Du wirst von Führungskräften unterstützt, die deine Gesundheit und Zufriedenheit fördern – und dir Möglichkeiten bieten, deine Fähigkeiten zu vertiefen und deinen Horizont zu erweitern.
              - button "Bewirb dich jetzt!" [ref=f15e134] [cursor=pointer]
