  - heading [level=3] [ref=e173]: "1"
  - generic [ref=e174]: TEAMWORK STATT ELLENBOGEN
  - paragraph [ref=e175]: Bei uns werden alle Herausforderungen gemeinsam gelöst. Jeden Tag sind wir stolz auf unsere wertschätzende Arbeitsatmosphäre.
  - heading [level=3] [ref=e176]: "2"
  - generic [ref=e177]: OPTIMALE ARBEITSBEDINGUNGEN
  - paragraph [ref=e178]: "Wer hoch hinaus will, braucht eine Atmosphäre, in der man gut arbeiten kann: An unserem Standort in Essen mit einer eigenen Kantine, spannenden Aufgaben und einem ganz besonderem Teamgefühl."
  - heading [level=3] [ref=e179]: "3"
  - generic [ref=e180]: GROSSES INNOVATIONSPOTENZIAL
  - paragraph [ref=e181]: Wir wollen noch viel weiter gehen. Und wir haben das Know-how und die Kraft, Deichmann für die Zukunft aufzustellen. Dafür brauchen wir neben IT-Skills vor allem Forward Thinker, die zusammen Neues schaffen wollen.
  - heading [level=3] [ref=e182]: "4"
  - generic [ref=e183]: EINE GEMEINSAME VISION
  - paragraph [ref=e184]: Wir glauben an unser Produkt. Es bietet echten Mehrwert für viele – und zwar unabhängig vom Einkommen.
  - heading [level=3] [ref=e185]: "5"
  - generic [ref=e186]: SICHERHEIT AUCH IN KRISENZEITEN
  - paragraph [ref=e187]: Ein zukunftsfähiges Produkt und eine menschenzentrierte Unternehmensführung sichern auch langfristig unsere Jobs.
  - heading [level=3] [ref=e188]: "6"
  - generic [ref=e189]: MENSCHLICHKEIT IM FOKUS
  - paragraph [ref=e190]: Trotz allen technologischen Fortschritts sind es doch vor allem traditionelle Bodenständigkeit und ehrliche Wertschätzung, die unsere Mitarbeiter oft über Jahrzehnte zufrieden bei uns halten.
