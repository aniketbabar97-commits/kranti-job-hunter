          - heading "Über uns" [level=3] [ref=f3e48]
          - paragraph [ref=f3e49]: Die MACS HOLDING GmbH ist eine erfolgreiche Firmengruppe mit innovativen Produkt- und Vertriebskonzepten. Basis für unser starkes Wachstum ist die ausgeprägte Innovationskultur in Kombination mit den Werten und der Schlagkraft eines Familienunternehmens. Unsere rund 600 Mitarbeiterinnen und Mitarbeiter arbeiten jeden Tag an 10 Standorten mit Leidenschaft daran, für unsere Kunden die bestmöglichen Produkte & Lösungen zu entwickeln.
