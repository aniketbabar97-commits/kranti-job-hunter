          - listitem [ref=f3e56]: Du berätst unsere Tochterfirmen und interne Teams in technischen Fragen
          - listitem [ref=f3e57]: Du koordinierst die Qualitätssicherung und dokumentierst die Ergebnisse
          - listitem [ref=f3e58]: Du führst und coachst ein Team von Junior-Entwicklern inkl. Code-Reviews und arbeitest mit Projektleitern, UX-Designern und anderen Entwicklern zusammen
