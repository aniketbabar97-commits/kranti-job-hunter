              - paragraph [ref=e168]
              - paragraph [ref=e169]:
                - strong [ref=e170]: "#nicetohave"
              - list [ref=e172]:
                - listitem [ref=e173]: "Wenn du zusätzlich in den folgenden Bereichen Erfahrung vorzuweisen hast, gibt es Bonuspunkte für dich: OOP / Symfony / jQuery / Performance-Optimierung / Docker / DevOps"
              - paragraph [ref=e174]: "Deine Leistungen sagen mehr als tausend Worte: Bitte schicke uns anstatt eines langen Lebenslaufes lieber Codebeispiele mit deiner Bewerbung mit, damit wir sehen, was du auf dem Kasten hast."
            - generic [ref=e175]:
              - heading "#feelgoodagency" [level=2] [ref=e176]
              - paragraph [ref=e177]
              - list [ref=e178]:
                - listitem [ref=e179]: Wir bieten dir Events, die du und deine Kolleg:innen mitgestalten könnt
                - listitem [ref=e180]: Du kannst dich weiterentwickeln und wirklich etwas bewegen – und das in einer der spannendsten Branchen mit viel Kundenkontakt auf B2B-Ebene.
                - listitem [ref=e181]: Wir arbeiten ortsunabhängig – mal im Büro, mal daheim. Die Mischung macht’s!
                - listitem [ref=e182]: Genieße das Arbeiten innerhalb agiler Teams mit flachen Hierarchien, einem festen Weiterbildungsbudget und einer guten Netzwerkorganisation – und in der Mittagspause einen Snack auf der Dachterrasse mit Blick auf die Dresdner Altstadt.
                - listitem [ref=e183]: Wie klingen ein unbefristeter Arbeitsvertrag, zahlreiche Events, Obst, Müsli, Gemüse, Softdrinks sowie eine bezuschusste betriebliche Altersvorsorge für dich? Bei uns findest du eine sichere, erfüllende und humorvolle Arbeitsumgebung!
                - listitem [ref=e184]: Zusätzlich profitierst du von familienfreundlichen Kernarbeitszeiten werktags von 09:00 – 15:00 Uhr, 29 Tagen Urlaub, Kindkrank-Tagen auf Kulanz und der Möglichkeit, Überstunden unkompliziert abzubummeln
              - paragraph [ref=e185]:
                - text: Mehr zu all unseren Benefits findest du auf unserer
                - link "Karriereseite" [ref=e186] [cursor=pointer]:
                  - /url: https://clicks.digital/karriere
                - text: "!"
            - generic [ref=e187]:
              - heading "#letsgo" [level=2] [ref=e188]
              - paragraph [ref=e189]: "Das klingt toll für dich? Dann melde dich gern bei uns. Zuallererst wollen wir dich als Mensch kennenlernen und können in einem ruhigen Gespräch gemeinsam herausfinden, ob und wie wir harmonieren. Anschließend lernst du unser Team kennen, schnupperst bei uns rein und wenn alles passt, erhältst du direkt ein Jobangebot. Selbstverständlich sind wir während des gesamten Onboardings permanent für dich da. Unser Ziel: Eine Win-Win-Situation und ein ernstgemeintes Willkommen!"
