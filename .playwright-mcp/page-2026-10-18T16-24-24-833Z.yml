            - generic [ref=e127]:
              - paragraph [ref=e128]: "Du kannst PHP – aber kannst du KI sauber in Magento & Shopware integrieren? Zeig’s uns! Gemeinsam mit einem starken Team bringst du Relaunchs und komplexe Webanwendungen live: saubere Schnittstellen, stabile Datenbanken und getesteter Code im Scrum-Setup."
              - paragraph [ref=e129]: Für unseren Standort in Dresden suchen wir zum schnellstmöglichen Zeitpunkt einen Software-Entwickler PHP (m/w/d).
              - paragraph [ref=e130]: Bewirb dich jetzt und gestalte mit uns die nächste Generation Web-Development.
              - paragraph
            - link "Jetzt bewerben" [ref=e132] [cursor=pointer]:
              - /url: "#contact-form"
          - generic [ref=e136]:
            - generic [ref=e137]:
              - heading "#thatsus" [level=2] [ref=e138]
              - paragraph [ref=e139]
              - paragraph [ref=e140]: "Da bist du ja – wir haben schon auf dich gewartet! Wir sind clicks digital – durch unsere 17-jährige Erfahrung sind wir eine der führenden Performance-Marketing-Agenturen und süchtig nach Reichweite, guten Google Rankings und echten Erfolgen, die wir unseren Kunden #aroundtheworld liefern."
              - paragraph [ref=e141]: "So digital unser Geschäft ist, so menschlich ist unser Miteinander. Unsere #teamkultur ist ein zentraler Baustein unseres Erfolges und unseres gesamten Unternehmens. Gemeinsam als #unique Team wollen wir tolle Ergebnisse erzielen und unsere Kunden glücklich machen. Wir schätzen und leben wechselseitiges Vertrauen, respektvollen Umgang, hohe Eigenverantwortlichkeit, Verbindlichkeit sowie Förderung & Forderung in einem ausgewogenen Maß."
              - paragraph [ref=e142]: "Kurz: Wir lieben Menschlichkeit!"
              - paragraph [ref=e143]
            - generic [ref=e144]:
              - heading "#thatswork" [level=2] [ref=e145]
              - paragraph [ref=e146]
              - list [ref=e147]:
                - listitem [ref=e148]: Durch unseren KI-First-Ansatz denken und entwickeln wir Lösungen konsequent auf einem neuen Level
                - listitem [ref=e149]: Du programmierst überwiegend auf PHP- und MySQL-basierte Softwarelösungen und Websites
                - listitem [ref=e150]: Du konzipierst zukunftssichere Schnittstellen, Datenbankstrukturen und komplexe Webanwendungen und setzt diese um
                - listitem [ref=e151]: Du wirkst am Support unserer Kunden mit und führst Relaunchs bestehender Projekte auf Basis Content-Management- & Shopsystemen durch (vorwiegend Magento, Shopware, WordPress, …)
                - listitem [ref=e152]: Außerdem unterstützt du uns bei der technischen Optimierung von Inhouse- und Kundenprojekten
                - listitem [ref=e153]: Du entwickelst Unit- und Integrationstests, erstellst Dokumentationen und wirkst an Scrum-Prozessen mit
                - listitem [ref=e154]: Zu deinen Aufgaben gehören ebenso die Anforderungsanalyse, die Konzeptionierung und das Schätzen von Entwicklungsaufwänden bei unseren Projekten
              - paragraph [ref=e155]
            - generic [ref=e156]:
              - heading "#profil" [level=2] [ref=e157]
              - paragraph [ref=e158]
              - list [ref=e159]:
                - listitem [ref=e160]: Du hast eine Ausbildung oder ein Studium im Bereich (Wirtschafts-) Informatik oder Wirtschaftsingenieurwesen erfolgreich abgeschlossen oder vergleichbare Qualifikation erlangt
                - listitem [ref=e161]: Du besitzt einschlägige Berufserfahrung im Entwicklungsumfeld
