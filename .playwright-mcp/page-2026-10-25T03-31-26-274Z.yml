            - heading "DIE INTERNATIONALE AUSRICHTUNG" [level=2] [ref=f73e150]
            - paragraph [ref=f73e151]: Internationale Erfahrung zählt heute zu den wichtigsten Voraussetzungen, um erfolgreich ins globale Fashion Business zu starten.
            - paragraph [ref=f73e152]: Auslandsaustausch sowie Auslandspraktika gehören ebenso zum Portfolio wie die Möglichkeit, an einer internationalen Universität den Bachelor-
          - paragraph [ref=f73e156]:
            - text: oder Master-Abschluss zu erwerben. Um Auslandsaufenthalte, etwa in China, England, Irland oder Italien, zu ermöglichen, setzen wir teilweise Drittmittel und eigene Förderbudgets ein, mit denen wir Stipendien für außergewöhnliche Qualifikationen zur Verfügung stellen können.
