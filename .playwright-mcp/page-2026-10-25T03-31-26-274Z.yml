          - generic [ref=f73e96]:
            - heading "Das Vier-Säulen-Ausbildungsmodell im Modedesign" [level=2] [ref=f73e97]
            - paragraph [ref=f73e98]: "Die FAHMODA hat das sogenannte „Vier-Säulen-Ausbildungskonzept“ entwickelt und etabliert. So können in nur acht Semestern drei Abschlüsse erzielt werden: Neben dem bisherigen Ausbildungsmodell mit Abschluss als staatl. geprüfter Mode-Designer und dem Gesellenbrief des Maßschneiderhandwerks – welches weiterhin bestehen bleibt –"
          - paragraph [ref=f73e103]:
            - text: kann zukünftig auch parallel der Bachelorabschluss in Betriebswirtschaftslehre in Kooperation mit der Fachhochschule des Mittelstands (FHM) erreicht werden. So können Absolventen in Zukunft beispielsweise die Abschluss-Kollektion nicht nur eigenständig entwerfen und fertigen, sondern diese durch einen professionellen Business-Plan im Hinblick auf die Marktchance plausibilisieren. Die BWL-Vorlesungen werden bereits ab dem 1. Semester in modernster Form durch Blended-Learning-Konzepte realisiert.
            - strong [ref=f73e105]:
              - link "Alle Details…" [ref=f73e106] [cursor=pointer]:
                - /url: https://fahmoda.de/abschluesse-an-der-fahmoda
