        - heading "Köln verbindet Menschen - genau wie wir" [level=1] [ref=f2e130]
        - generic [ref=f2e131]:
          - paragraph [ref=f2e132]:
            - text: Das
            - link "Team" [ref=f2e133] [cursor=pointer]:
              - /url: /ueber-uns/
            - text: von PS Direkt bringt Kandidatinnen und Kandidaten mit Unternehmen in Köln und der Region zusammen.
          - paragraph [ref=f2e134]: Wir vermitteln kaufmännische und IT-Positionen – branchenübergreifend und mit klarer fachlicher Passung.
          - paragraph [ref=f2e135]: Ob Direktvermittlung oder Arbeitnehmerüberlassung – wir begleiten den gesamten Vermittlungsprozess persönlich und strukturiert. Viele Einsätze sind so angelegt, dass sich daraus eine langfristige Zusammenarbeit mit Übernahmeperspektive entwickeln kann.
          - paragraph [ref=f2e136]: Wir setzen auf moderne KI-Technologien, kombiniert mit unserer langjährigen Erfahrung im Kölner Arbeitsmarkt. KI unterstützt unsere Arbeit – die menschliche Verbindung steht für uns immer im Mittelpunkt.
          - paragraph [ref=f2e137]:
