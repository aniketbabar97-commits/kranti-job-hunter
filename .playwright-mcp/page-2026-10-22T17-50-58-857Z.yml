          - text: "🚀 Were Hiring: Senior SAP Commerce Cloud (Hybris) Developer 📍 Location: Hyderabad | Bangalore | Chennai | Pune | Gurgaon | Noida 🏢 Work Mode: Temporary Remote 🕒 Experience: 10+ Years ⏰ Shift: 1:00 PM – 11:00 PM 📅 Notice Period: Immediate Joiners or Candidates Serving Notice Period (Up to 10 Days) 🔍 Key Skills Required: ✅ SAP Commerce Cloud (Hybris) 2011 to 2211+ ✅ SAP CCv2 Cloud Infrastructure (Azure-based) ✅ Dynatrace Monitoring amp; Kibana Logging ✅ Team Handling amp; Client Reporting ✅ Java (J2EE), Spring Framework (Core, MVC, Security) ✅ Spartacus (SAP Composable Storefront) amp; OCC APIs ✅ Backoffice, SmartEdit, PCM, WCMS, Solr Search ✅ OAuth2, SSO (SAML/OIDC), CI/CD Pipelines ✅ FlexibleSearch, HANA/SQL, Data Modeling ✅ Production Support, Performance Tuning amp; Troubleshooting 📧 Interested? Share your updated resume to"
