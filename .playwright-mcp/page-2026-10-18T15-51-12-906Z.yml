            - paragraph [ref=e40]: 🌍 Since 2017, more than 2 million customers across Europe and the US have trusted our products – from DIY enthusiasts to professionals. With 100,000+ monthly orders, we’ve grown into one of the leading e-commerce brands in our category. And we’re just getting started.
