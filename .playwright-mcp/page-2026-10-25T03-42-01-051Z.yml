  - main [ref=f122e82]:
    - paragraph [ref=f122e89]: Wir bei Severin glauben daran, dass echte Veränderung mit Menschen beginnt, die Lust haben, etwas zu bewegen. Wir suchen keine Lebensläufe, wir suchen Menschen mit Ideen. Menschen, die Dinge vorantreiben. Die ausprobieren, umdenken, mitgestalten wollen - in einem als Great Place to Work® ausgezeichneten Umfeld. Sag Hallo zu neuen Möglichkeiten. Und hallo zu uns.
    - generic [ref=f122e91]:
      - generic [ref=f122e93]:
        - heading "Das sind unsere Werte." [level=3] [ref=f122e94]
        - paragraph [ref=f122e95]: Bei Severin machen wir Premium für Alle möglich, mit Haltung, Herz und Hands-on-Mentalität. Unsere Werte sind dabei kein Beiwerk, sondern das, was uns antreibt. Du willst wissen, woran wir glauben? Sag Hallo zu unseren Möglichkeiten und einem kleinen Vorgeschmack darauf, was uns wichtig ist.
      - generic [ref=f122e96]:
        - generic [ref=f122e99]:
          - generic [ref=f122e100]:
            - img "Icons_Webseite_240x240px" [ref=f122e102]
            - heading "Zuverlässig" [level=6] [ref=f122e103]
            - paragraph [ref=f122e104]: "Bei uns kannst du dich nicht nur auf die Kaffeemaschine verlassen. Du willst wissen, woran du bist. Im Job, im Team, im Alltag? Bei Severin bekommst du genau das: echte Verlässlichkeit. Wir stehen zu dem, was wir sagen. In Meetings, im Miteinander, im Macher-Modus. Hallo Möglichkeiten heißt für dich: ein Umfeld, das dir Sicherheit gibt, um mutig zu sein."
          - generic [ref=f122e105]:
            - img "Icons_Webseite_240x240px2" [ref=f122e107]
            - heading "Passioniert" [level=6] [ref=f122e108]
            - paragraph [ref=f122e109]: "Wir lieben, was wir tun und lassen dich das jeden Tag spüren. Wenn du Energie mitbringst, geben wir dir Raum, sie zu entfalten. Bei Severin wirst du nicht ausgebremst, sondern bestärkt. Denn hier zählt, wie sehr du dich einbringst, nicht nur, was im Lebenslauf steht. Hallo Möglichkeiten heißt für dich: Deine Leidenschaft wird hier zur Wirkung."
          - generic [aria-hidden] [ref=f122e110]:
            - heading [level=6] [ref=f122e113]: Mutig
            - paragraph [ref=f122e114]: "Mut ist, wenn du bei uns auch mal 'Warum nicht?' sagen darfst. Hier darfst du ausprobieren, mitdenken, hinterfragen. Weil wir überzeugt sind: Innovation entsteht nicht durch Zustimmung, sondern durch neue Perspektiven. Hallo Möglichkeiten heißt für dich: Wir hören nicht nur zu, wir lassen machen."
          - generic [aria-hidden] [ref=f122e115]:
            - heading [level=6] [ref=f122e118]: Verantwortungsvoll
            - paragraph [ref=f122e119]: "Wir übernehmen Verantwortung. Nicht nur fürs Produkt, sondern auch füreinander. Bei Severin bist du nicht nur Teil eines Unternehmens, sondern Teil eines Teams, das aufeinander achtet. Nachhaltigkeit, Fairness, Haltung. Hallo Möglichkeiten heißt für dich: Du kannst hier nicht nur Karriere machen, sondern auch Sinn stiften."
