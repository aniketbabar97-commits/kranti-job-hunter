    - heading "Cookie-Einwilligung und Datenverarbeitung" [level=5] [ref=e6]
    - generic [ref=e7]: Wir verwenden Cookies und ähnliche Technologien, um Ihnen das bestmögliche Online-Erlebnis zu bieten. Mittels der eingesetzten Technologien können Informationen auf Ihrem Endgerät gespeichert, angereichert und gelesen werden. Mit einem Klick auf „Alle akzeptieren“ stimmen Sie dem Zugriff auf Ihr Endgerät zu sowie der Verarbeitung Ihrer Daten, der Webseiten- sowie partner- und geräteübergreifenden Erstellung und Verarbeitung von individuellen Nutzungsprofilen sowie der Weitergabe Ihrer Daten an Drittanbieter, die zum Teil Ihre Daten in Ländern außerhalb der europäischen Union verarbeiten (DSGVO Art. 49). Die Daten werden für Analysen, Retargeting und zur Ausspielung von personalisierten Inhalten und Werbung auf Seiten der Telekom MMS, auf Drittanbieterseiten sowie zu eigenen Zwecken von Partnern genutzt und mit Daten zusammengeführt. Weitere Informationen, auch zur Datenverarbeitung durch Drittanbieter und zum jederzeit möglichen Widerrufs Ihrer Einwilligung, finden Sie in den Einstellungen sowie in unseren Datenschutzhinweisen.
