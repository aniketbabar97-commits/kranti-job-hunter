        - main [ref=f1e68]:
          - generic [ref=f1e69]:
            - heading "(Senior) Software-Architekt (m/w/d)" [level=1] [ref=f1e71]
            - generic [ref=f1e72]:
              - generic [ref=f1e73]:
                - generic [ref=f1e74]: Vollzeit
                - generic [ref=f1e79]: Deutschland
                - generic [ref=f1e84]: Berufserfahrene
                - generic [ref=f1e89]: 08. Oktober 2026
                - generic [ref=f1e94]: Remote
              - generic [ref=f1e100]:
                - text: "Wer wir sind:"
                - paragraph [ref=f1e101]:
                  - strong [ref=f1e102]: "#einfach.erstklassig.arbeiten"
                - paragraph [ref=f1e103]: "Willkommen bei Schäfer Shop, wo wir seit 1975 Arbeitsumfelder gestalten, die dich inspirieren. Als führender Anbieter von Büro- und Betriebsausstattungen in Europa sind unsere 1.000 Teammitglieder stolz auf unsere Mission:"
                - paragraph [ref=f1e104]: Wir schaffen positive Arbeitsumfelder, die unsere Kunden erfolgreicher machen.
                - paragraph [ref=f1e105]: Bei Schäfer Shop sind wir eine Gemeinschaft von Machern und Visionären. Unsere Kultur ist geprägt von Zusammenarbeit, Innovation und Exzellenz. Wir suchen ständig nach talentierten Menschen, die unsere Leidenschaft teilen und unsere Mission vorantreiben.
                - paragraph [ref=f1e106]: Komm zu uns und hilf uns, die Zukunft der Arbeitswelt zu gestalten und werde Teil unserer Mission, dich erfolgreicher zu machen.
                - paragraph [ref=f1e107]:
                  - text: Ab sofort suchen wir einen
                  - strong [ref=f1e108]:
                    - emphasis [ref=f1e109]: (Senior) Software-Architekt (m/w/d)
                  - text: für unser
                  - emphasis
                  - strong [ref=f1e110]:
                    - emphasis [ref=f1e111]: Remote Team
                  - emphasis [ref=f1e112]: ":"
                - text: "Was dich erwartet:"
                - list [ref=f1e113]:
                  - listitem [ref=f1e114]:
                    - text: •
                    - strong [ref=f1e115]: "Softwarearchitektur weiterentwickeln:"
                    - text: Du gestaltest die Architektur unserer digitalen Plattformen und entwickelst gemeinsam mit den Squads technische Leitplanken weiter.
                  - listitem [ref=f1e116]:
                    - text: •
                    - strong [ref=f1e117]: "Engineering Excellence stärken:"
                    - text: Gemeinsam mit den Entwicklern verbesserst du Codequalität, Reviewkultur, Testing und Wartbarkeit.
                  - listitem [ref=f1e118]:
                    - text: •
                    - strong [ref=f1e119]: "Software aktiv entwickeln:"
                    - text: Du übernimmst konkrete Entwicklungsaufgaben und arbeitest flexibel in den Squads mit. Du bringst Dich in fachliche und technische Analysen, Lösungsdiskussionen und Reviews von Merge Requests ein.
                  - listitem [ref=f1e120]:
                    - text: •
                    - strong [ref=f1e121]: "Entwickler begleiten:"
                    - text: Du unterstützt die Entwickler durch Coaching und Mentoring und bist fachlicher Sparringspartner bei Architektur, Design und Implementierung.
                  - listitem [ref=f1e122]:
                    - text: •
                    - strong [ref=f1e123]: "Technische Entscheidungen führen:"
                    - text: Du führst wesentliche technische Entscheidungsprozesse über Teamgrenzen und Systeme hinweg. Du dokumentierst die Ergebnisse nachvollziehbar in Architecture Decision Records und vertrittst belastbare Entscheidungen.
                  - listitem [ref=f1e124]:
                    - text: •
                    - strong [ref=f1e125]: "Technische Orientierung geben:"
                    - text: Du berätst den Director, den Lead Software Engineering sowie angrenzende Rollen und Teams. Du ordnest technische Auswirkungen, Risiken und Handlungsbedarfe verständlich ein
                  - listitem [ref=f1e126]:
                    - text: •
                    - strong [ref=f1e127]: "Risiken und technische Schulden adressieren:"
                    - text: Du erkennst und bewertest wesentliche technische Risiken und technische Schulden. Du machst sie transparent, sorgst für klare Verantwortlichkeiten und stellst sicher, dass sie angemessen bearbeitet oder zur Entscheidung vorgelegt werden.
                - paragraph [ref=f1e128]
                - text: "Was du mitbringst:"
                - list [ref=f1e129]:
                  - listitem [ref=f1e130]: • Mehrjährige, fundierte Erfahrung in der Entwicklung komplexer Web-Anwendungen und verteilter Softwaresysteme auf Basis von Java und Spring Boot
                  - listitem [ref=f1e131]: • Nachweisbare Erfahrung in Softwarearchitektur, Solution Design und der Weiterentwicklung bestehender Systemlandschaften
                  - listitem [ref=f1e132]: • Die Fähigkeit, technische Fragestellungen strukturiert zu analysieren, Lösungsoptionen und deren Konsequenzen abzuwägen und belastbare Entscheidungen herbeizuführen
                  - listitem [ref=f1e133]: • Eine eigenverantwortliche Arbeitsweise sowie die Fähigkeit, technische Entscheidungen verständlich zu begründen, zu dokumentieren und gegenüber unterschiedlichen Stakeholdern zu vertreten
                  - listitem [ref=f1e134]: • Praktische Erfahrung mit Architekturprinzipien, Modularisierung, HTTP, REST und API-Contract-Design sowie verteilten Architekturen wie Microservices oder Self-Contained Systems
                  - listitem [ref=f1e135]: • Sehr gutes Verständnis von Engineering Excellence, insbesondere Code-Qualität, Review-Kultur, Wartbarkeit und nachhaltigem Umgang mit technischen Schulden
                  - listitem [ref=f1e136]: • Ausgeprägte Hands-on-Mentalität und die Bereitschaft, weiterhin aktiv Software zu entwickeln und technische Lösungen gemeinsam mit den Squads umzusetzen
                  - listitem [ref=f1e137]: • Freude daran, Entwickler fachlich zu coachen, Wissen zu vermitteln und technische Diskussionen auch bei unterschiedlichen Positionen konstruktiv zu führen
                - list [ref=f1e138]:
                  - listitem [ref=f1e139]:
                    - text: "• Vorerfahrung von Vorteil:"
                    - list [ref=f1e140]:
                      - listitem [ref=f1e141]: • E-Commerce und hochverfügbaren Web-Plattformen
                      - listitem [ref=f1e142]: • modernen Frontend-Architekturen und der Integration von Frontend und Backend, z.B. mit Next.js
                      - listitem [ref=f1e143]: • asynchroner Kommunikation und Event-driven Architecture, z. B. mit Kafka
                      - listitem [ref=f1e144]: • Kubernetes, Docker und modernen DevOps-Umgebungen
                      - listitem [ref=f1e145]: • GitLab, Git sowie einer professionellen Merge-Request- und Review-Kultur
                      - listitem [ref=f1e146]: • (Architecture) Decision Records bzw. vergleichbaren Methoden zur nachvollziehbaren Dokumentation technischer Entscheidungen
                      - listitem [ref=f1e147]: • KI-gestützter Softwareentwicklung und ggf. Spec-Driven Development
                - paragraph [ref=f1e148]
                - text: "Was wir dir bieten:"
                - list [ref=f1e149]:
                  - listitem [ref=f1e150]: • Die Möglichkeit zur völlig flexiblen und eigenverantwortlichen Remote-Arbeit
                  - listitem [ref=f1e151]: • Ausgewogene Arbeitszeiten für eine gesunde Work-Life-Balance
                  - listitem [ref=f1e152]: "• CYOD: Choose Your Own Device → Apple & Linux oder wenn es sein muss auch Windows"
                  - listitem [ref=f1e153]: • Unterstützung für die Einrichtung eines effizienten Homeoffice-Arbeitsplatzes
                  - listitem [ref=f1e154]: • Eine mehrwöchige Einarbeitungsphase, um optimal in die Aufgaben einzusteigen
                  - listitem [ref=f1e155]: • Individuelle Schulungen und Weiterbildungsmöglichkeiten (intern & extern)
                  - listitem [ref=f1e156]: • Eine offene Kommunikationskultur und die Möglichkeit, Ideen einzubringen
                  - listitem [ref=f1e157]: • Eine 39-Stunden-Woche und 30 Urlaubstage pro Jahr
                  - listitem [ref=f1e158]: • Regelmäßige Teamevents, um den Teamgeist zu fördern
                  - listitem [ref=f1e159]: • Betriebliche Altersvorsorge für eine sichere Zukunft
                  - listitem [ref=f1e160]: • Job Bike, attraktive Mitarbeiterrabatte, Urban Sports Mitgliedschaft uvm.
