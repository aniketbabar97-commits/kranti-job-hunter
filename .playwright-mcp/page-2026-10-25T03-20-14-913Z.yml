      - heading "Deine Aufgaben bei uns im Team:" [level=2] [ref=e32]
      - list [ref=e34]:
        - listitem [ref=e35]: Fachliche Leitung von Beratungsprojekten bei der Implementierung, Optimierung und dem Rollout von SAP-Lösungen im Vertriebsbereich (S/4HANA Sales, SAP Commerce Cloud)
        - listitem [ref=e36]: Eigenverantwortliche Aufnahme, Analyse und Optimierung von Geschäftsprozessen im Vertrieb sowie Erarbeitung ganzheitlicher, end-to-end-orientierter SAP-Lösungskonzepte
        - listitem [ref=e37]:
          - generic [ref=e38]: Customizing der relevanten SAP-Module inklusive DokumentationKonzeption und Steuerung von Integrationsszenarien zwischen S/4HANA Sales und Commerce Cloud
        - listitem [ref=e39]: Durchführung und Moderation von Workshops, Anforderungsanalysen und Fit-Gap-Analysen mit Fachbereichen und Management
        - listitem [ref=e40]: Konzeption und Begleitung von End-to-End-Prozessen entlang der gesamten Vertriebs- und Auftragsabwicklungskette
        - listitem [ref=e41]: Steuerung von Tests (Unit-, Integrations- und User-Acceptance-Tests) sowie Schulung und Coaching von Key Usern und Junior Consultants
        - listitem [ref=e42]: Schnittstellenkoordination zu angrenzenden Modulen (z. B. MM, FI/CO, PP, CRM)
        - listitem [ref=e43]: Übernahme von (Teil-)Projektleitung, Beratung auf Kunden-/Managementebene sowie strategische Weiterentwicklung bestehender SAP-Vertriebslösungen
    - generic [ref=e44]:
      - heading "Das bringst du mit:" [level=2] [ref=e46]
      - generic [ref=e47]:
        - list [ref=e48]:
          - listitem [ref=e49]: Abgeschlossenes Studium der Betriebswirtschaftslehre (idealerweise mit Schwerpunkt Rechnungswesen/Controlling), Wirtschaftsinformatik oder eine vergleichbare Ausbildung/Qualifikation mit einschlägiger Berufserfahrung als SAP-Berater im Vertriebsumfeld
          - listitem [ref=e50]: Mehrjährige Erfahrung als SAP SD Consultant bzw. in S/4HANA Sales sowie praxiserprobte Kenntnisse in SAP Commerce Cloud, insbesondere B2B-/B2C- und Omnichannel-Prozessen
          - listitem [ref=e51]: Sehr gute Kenntnisse im SD-Customizing, insbesondere Vertriebsbelegtypen, Preisfindung, Konditionstechnik, Verfügbarkeitsprüfung (ATP) und Kreditmanagement Erfahrung in der Integration von S/4HANA Sales und SAP Commerce Cloud, idealerweise über SAP Integration Suite/CPI
          - listitem [ref=e52]: Fundiertes Verständnis zentraler End-to-End-Vertriebsprozesse wie Order-to-Cash, Quote-to-Cash, Retouren- und Reklamationsabwicklung, Intercompany sowie grenzüberschreitender Vertrieb
          - listitem [ref=e53]: Erfahrung in der Integration mit angrenzenden Modulen wie MM, FI/CO, PP und CRM sowie im Zusammenspiel von Vertrieb, Logistik und Produktion
          - listitem [ref=e54]: Mehrjährige Erfahrung in S/4HANA-Migrations- und Implementierungsprojekten (Greenfield/Brownfield) sowie idealerweise Kenntnisse in Fiori, SAP BTP und SAP Analytics Cloud
          - listitem [ref=e55]: Erfahrung in der fachlichen Führung von (Teil-)Projektteams und Junior Consultants sowie in Workshops, Anforderungs- und Fit-Gap-Analysen mit Fachbereichen und Management
          - listitem [ref=e56]: Gute Deutsch- und Englischkenntnisse in Wort und Schrift, Reisebereitschaft und interkulturelle Kompetenz
        - paragraph [ref=e57]: "Von Vorteil:"
        - list [ref=e58]:
          - listitem [ref=e59]: Kenntnisse in SAP Ariba, SAP Service Cloud, Customer Service oder Field Service Management sowie relevante SAP-Zertifizierungen von Vorteil
