      - generic [ref=f10e47]:
        - paragraph [ref=f10e48]: Über IONOS
        - paragraph [ref=f10e49]: "Bei IONOS verwalten wir nicht nur Server, wir prägen mit unseren Lösungen die digitale Zukunft für über 6,2 Millionen Kundinnen und Kunden weltweit. Als Europas führender Hosting-Anbieter und Pionier für unabhängige Cloud-Lösungen bauen wir eine Infrastruktur der nächsten Generation: von souveränen Cloud-Architekturen und hochperformanten GPU-Clustern bis hin zu integrierten KI-Automatisierungstools."
        - paragraph [ref=f10e50]: "Was uns antreibt: Digitale Entscheidungsfreiheit für Europa und echter Impact für kleine und mittlere Unternehmen (KMU) sowie Großunternehmen. Wir arbeiten in agilen Teams, setzen auf transparente Strukturen und glauben daran, dass Exzellenz und Innovation nur mit echtem Teamgeist entstehen."
        - paragraph [ref=f10e51]: Bereit für Deinen nächsten Schritt? Werde ein Teil von IONOS und wachse mit uns.
        - link "Mehr erfahren" [ref=f10e52] [cursor=pointer]:
          - /url: "#description"
      - generic [ref=f10e57]:
        - paragraph [ref=f10e58]: Wir sind eine moderne E-Commerce-Division und verantworten im Rahmen der IONOS Group den internationalen Webauftritt von aktuell sieben Marken und somit einem der wichtigsten Vertriebskanäle unseres Unternehmens. Wir arbeiten sowohl in agilen, crossfunktionalen und interdisziplinären Teams als auch in Kombination mit agilem Projektmanagement für größere, komplexe Initiativen und Projekte.
        - paragraph [ref=f10e59]: Du übernimmst gerne Verantwortung und möchtest gemeinsam mit uns den Webauftritt von morgen mitgestalten? Dann bist du bei uns genau richtig!
        - paragraph [ref=f10e60]: Aufgabenbereich
        - list [ref=f10e61]:
          - listitem [ref=f10e62]: Als Product Owner übernimmst du die End-to-End-Verantwortung für einen Produktbereich unserer Websites und Online-Shops und/oder für eine Marke der IONOS Gruppe, zusammen mit funktionsübergreifenden Experten.
          - listitem [ref=f10e63]: Als Verantwortlicher für die Conversion-Rate übernimmst du die kontinuierliche Analyse und Interpretation der User Flows auf dem Portal und im Check-out-Funnel.
          - listitem [ref=f10e64]: Du führst eine kontinuierliche Erfolgskontrolle der wichtigsten Websites und Online-Shop-KPIs durch. Außerdem stellst du Reports für das Management bereit.
          - listitem [ref=f10e65]: Du erstellst und priorisierst Ihr Backlog mit Verbesserungen, basierend auf Nutzerfeedback, Geschäftszielen und Markteinblicken, und stimmst dies mit den Stakeholdern ab.
          - listitem [ref=f10e66]: Durchführung von methodischen Analysen, wie z.B. Markt- und Wettbewerbsbetrachtungen, um Nutzerbedürfnisse, Trends und Möglichkeiten für die Weiterentwicklung zu identifizieren.
          - listitem [ref=f10e67]: Du verstehst es, komplexe Nutzer- und Business-Anforderungen von verschiedenen Stakeholdern im Unternehmen in nahtlose Workflows und Konzeptideen zu übersetzen.
          - listitem [ref=f10e68]: Enge Zusammenarbeit in Crossfunktional Teams und Abstimmung mit allen relevanten Schnittstellen (Entwicklung, Technik, Agenturen, Produktmanagement, Product Marketing, Vertrieb, Customer Service u.a.).
          - listitem [ref=f10e69]: Du kennst aktuelle UX-Design-Trends und interessierst dich für innovative Konzepte. Du verstehst es, neue Ideen und Konzepte im Team und bei unseren Stakeholdern zu kommunizieren und zu vertreten.
        - paragraph [ref=f10e70]: Qualifikationen
        - list [ref=f10e71]:
          - listitem [ref=f10e72]: Du bist PO aus Leidenschaft und weißt, was du willst. Die Bedürfnisse unserer Nutzer treiben dich an. Den Grundstein deines Erfolgs bildet ein erfolgreiches Studium oder eine vergleichbare Ausbildung.
          - listitem [ref=f10e73]: Die Vor- und Nachteile von klassischen und agilen Vorgehensweisen sind dir aus mehrjähriger praktischer Erfahrung, optimalerweise im Bereich der Softwareentwicklung, bekannt.
          - listitem [ref=f10e74]: Du bringst die richtige Mischung aus Kreativität und unternehmerischem Kalkül mit.
          - listitem [ref=f10e75]: Du zeichnest dich durch analytisches Denkvermögen, viel Eigeninitiative, Engagement, Mut und ein strukturiertes, aber auch pragmatisches Vorgehen aus.
          - listitem [ref=f10e76]:
            - text: Du bist versiert im Umgang mit Stakeholdern sowie im Erstellen von Epics und
            - strong [ref=f10e77]: User Stories
            - text: und im Verantworten und Priorisieren des Product Backlogs.
          - listitem [ref=f10e78]: Du entwickelst gemeinsam mit den Stakeholdern die Produktvision weiter und füllst sie mit Leben.
          - listitem [ref=f10e79]: Du hast eine Leidenschaft für digitale Innovation und ein ausgeprägtes Interesse an neuen Technologien und Trends.
          - listitem [ref=f10e80]: Die Fähigkeit, in einem schnelllebigen, dynamischen Umfeld erfolgreich zu sein und sich schnell an sich ändernde Prioritäten und Anforderungen anzupassen.Persönlich zeichnen dich Qualitätsbewusstsein, Leistungsbereitschaft und Eigeninitiative aus.
          - listitem [ref=f10e81]: Du hast Spaß an technischen Themen und digitalen Produkten.
          - listitem [ref=f10e82]: Der Umgang mit Tools wie G-Suite, Microsoft Office, Atlassian JIRA oder Confluence ist kein Problem für dich.
          - listitem [ref=f10e83]: Sehr gute Deutsch- und Englischkenntnisse in Wort und Schrift.
        - paragraph [ref=f10e84]: Benefits
        - list [ref=f10e85]:
          - listitem [ref=f10e86]: Hybrides Arbeitsmodell mit Homeoffice-Möglichkeit.
          - listitem [ref=f10e87]: Flexible Arbeitszeiten durch Vertrauensarbeitszeit.
          - listitem [ref=f10e88]: An einigen Standorten eine bezuschusste Kantine und verschiedene kostenfreie Getränke.
          - listitem [ref=f10e89]: Moderne Büroflächen mit sehr guter Verkehrsanbindung.
          - listitem [ref=f10e90]: Diverse Mitarbeiterrabatte für Aktivitäten und Produkte.
          - listitem [ref=f10e91]: Mitarbeiterevents wie Sommer- und Winterfeiern, sowie Workshops.
          - listitem [ref=f10e92]: Zahlreiche Weiterbildungs- und Entwicklungsmöglichkeiten.
          - listitem [ref=f10e93]: Verschiedene Gesundheitsangebote, wie Sport- und Gesundheitskurse.
