              - generic [ref=f15e91]:
                - paragraph [ref=f15e93]
                - heading "Als ein weltweit führender Polymerspezialist entwickelt REHAU moderne Materialien, Technologien und Services für die Zukunft. Unsere Kerntreiber sind die fünf Megatrends Digitalisierung, Individualisierung, Nachhaltigkeit, Mobilität und New Work. Wir gestalten Fortschritt für mehr Lebensqualität – gestalte mit!" [level=3] [ref=f15e94]
                - paragraph [ref=f15e95]
                - heading [level=1] [ref=f15e96]:
                  - strong [ref=f15e97]: Application Consultant SAP Commerce (m/w/d)
                - paragraph [ref=f15e98]: am Standort Rehau oder Erlangen | ab Januar 2027 | Vollzeit | unbefristet | bis zu 50% mobiles Arbeiten möglich
              - generic [ref=f15e100]:
                - generic [ref=f15e101]:
                  - heading "Deine Mission:" [level=2] [ref=f15e103]
                  - generic [ref=f15e104]: Du machst digitales Einkaufen für unsere Kunden noch einfacher, effizienter und erfolgreicher. Gemeinsam mit internationalen Fachbereichen und IT-Teams entwickelst Du unser globales Kundenportal weiter und bringst innovative E-Commerce-Lösungen auf den Weg.
                - generic [ref=f15e106]:
                  - heading "Deine Aufgaben:" [level=2] [ref=f15e108]
                  - list [ref=f15e110]:
                    - listitem [ref=f15e111]:
                      - paragraph [ref=f15e112]: Du betreust den Betrieb und die Weiterentwicklung unseres globalen Kundenportals auf Basis von SAP Commerce.
                    - listitem [ref=f15e113]:
                      - paragraph [ref=f15e114]: Du übersetzt Business-Anforderungen in innovative digitale Lösungen, erstellst Konzepte, User Stories und die Umsetzungsvorgaben für die Entwicklung.
                    - listitem [ref=f15e115]: Du steuerst unsere internen und externen Entwicklungspartner und sorgst für Qualität, Effizienz und Termintreue.
                    - listitem [ref=f15e116]: Du stellst den reibungslosen Betrieb der Plattform sicher, führst Funktionstests durch und treibst Optimierungen voran.
                    - listitem [ref=f15e117]: Du arbeitest eng mit den internationalen Stakeholdern und IT-Teams zusammen und betreust unsere internationalen Key User im E-Commerce-Umfeld.
                    - listitem [ref=f15e118]:
                      - generic [ref=f15e119]: Du beobachtest Markt- und Technologietrends, leitest daraus innovative Lösungsansätze ab und gestaltest deren Umsetzung aktiv mit.
                - generic [ref=f15e120]:
                  - heading "Dein Profil:" [level=2] [ref=f15e122]
                  - list [ref=f15e124]:
                    - listitem [ref=f15e125]: Du verfügst über ein erfolgreich abgeschlossenes Studium der (Wirtschafts-)Informatik, Betriebswirtschaft oder vergleichbare Qualifikation. Alternativ verfügst Du über eine IT-Ausbildung mit mehrjähriger Erfahrung im Application Management.
                    - listitem [ref=f15e126]: Du bringst Erfahrung im Umfeld von E-Commerce-, Web- oder ERP-Anwendungen mit und kennst idealerweise die SAP-Module SAP Commerce sowie SAP ERP SD.
                    - listitem [ref=f15e127]: Du verstehst moderne Webarchitekturen, digitale Geschäftsprozesse und deren technische Umsetzung.
                    - listitem [ref=f15e128]: Du arbeitest souverän mit Fachbereichen, internationalen Stakeholdern und externen Partnern zusammen.
                    - listitem [ref=f15e129]: Agile Arbeitsweisen sind dir vertraut und du bewegst dich sicher in dynamischen Projektumgebungen.
                    - listitem [ref=f15e130]: Du überzeugst durch eine strukturierte, analytische und eigenverantwortliche Arbeitsweise sowie ausgeprägte Kommunikations- und Teamfähigkeit.
                    - listitem [ref=f15e131]: Sehr gute Deutsch- und Englischkenntnisse runden Dein Profil ab.
                - generic [ref=f15e132]:
                  - heading "Das kannst Du von uns erwarten:" [level=2] [ref=f15e134]
                  - list [ref=f15e136]:
                    - listitem [ref=f15e137]:
