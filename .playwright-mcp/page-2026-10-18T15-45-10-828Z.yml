              - listitem [ref=f39e84]:
                - strong [ref=f39e85]: "Persönliche Entwicklung:"
                - text: Wir entwickeln gemeinsam Karriereziele, die zu Dir passen – fachlich wie persönlich
              - listitem [ref=f39e86]:
                - strong [ref=f39e87]: "Starkes Team:"
                - text: Hands-On-Mentalität, enormer Zusammenhalt und eine Kultur, in der gegenseitige Unterstützung selbstverständlich ist
              - listitem [ref=f39e88]:
