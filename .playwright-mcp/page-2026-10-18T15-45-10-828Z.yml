          - generic [ref=f39e37]:
            - paragraph [ref=f39e38]:
              - text: Du willst nicht einfach nur Code schreiben, sondern technische Verantwortung übernehmen und unsere E-Commerce-Plattform mitprägen? Sauberer Code, performante Shops und messbare Conversion-Erfolge sind für Dich Anspruch, kein Nebenschauplatz. Dann könntest Du schon bald unser neuer
              - strong [ref=f39e39]: Senior Full Stack Developer (m/w/d)
              - text: sein.
            - paragraph [ref=f39e40]:
              - strong [ref=f39e41]: Über SHEKO
            - paragraph [ref=f39e42]: Als Online-Shop gestartet, sind wir heute eine der am schnellsten wachsenden Health & Nutrition Brands Deutschlands – mit Balance Shakes, Kollagen, Probiotika und Supplements, die in dm, Rossmann und Müller stehen. Inhabergeführt, profitabel, mit echtem Wachstum vor uns.
            - heading "Aufgaben" [level=2] [ref=f39e43]
            - list [ref=f39e44]:
              - listitem [ref=f39e45]:
                - strong [ref=f39e46]: "Shopify-Entwicklung auf Senior-Niveau:"
                - text: Du entwickelst neue Shopify-Themes von Grund auf (Liquid), pflegst und erweiterst bestehende Themes, baust individuelle Funktionalitäten und Custom-Apps und nutzt die Shopify APIs (REST & GraphQL) für maßgeschneiderte Lösungen
              - listitem [ref=f39e47]:
                - strong [ref=f39e48]: "Full-Stack-Features end-to-end:"
                - text: Vom Frontend (JavaScript/TypeScript, React) bis zum Backend (Node.js und/oder PHP, APIs, Integrationen) verantwortest Du Features von der Konzeption bis zum Go-live
              - listitem [ref=f39e49]:
                - strong [ref=f39e50]: "Refactoring, Performance & Code-Qualität:"
                - text: Du refactorst und modernisierst bestehenden Code, sorgst für sauberen, wartbaren Code, schnelle Ladezeiten und eine stabile technische Basis – inklusive Code Reviews und Etablierung von Best Practices
              - listitem [ref=f39e51]:
                - strong [ref=f39e52]: "Conversion-starke Landing Pages:"
                - text: Du baust und optimierst mobile-first Landing Pages und begleitest A/B-Tests von der Idee bis zur datenbasierten Auswertung
              - listitem [ref=f39e53]:
                - strong [ref=f39e54]: "Technische Architektur mitgestalten:"
                - text: Du bringst Dich bei Tool-Auswahl, Schnittstellen und der Weiterentwicklung unserer E-Commerce-Infrastruktur ein und triffst fundierte technische Entscheidungen
              - listitem [ref=f39e55]:
                - strong [ref=f39e56]: "Technische Pflege & Monitoring:"
                - text: Du verantwortest Updates, Performance-Monitoring und sorgst dafür, dass technisch alles zuverlässig läuft
              - listitem [ref=f39e57]:
                - strong [ref=f39e58]: "Wissen teilen:"
                - text: Du unterstützt das Team fachlich, gibst Deine Erfahrung weiter und hebst unseren technischen Standard insgesamt an
            - heading "Qualifikation" [level=2] [ref=f39e59]
            - paragraph [ref=f39e60]: Für diese Rolle suchen wir gezielt eine erfahrene Entwicklerin oder einen erfahrenen Entwickler, die oder der eigenverantwortlich arbeitet und technische Verantwortung übernehmen möchte. Entscheidend ist für uns, was Du in der Praxis bewegen kannst.
            - paragraph [ref=f39e61]:
              - strong [ref=f39e62]: "Das solltest Du mitbringen:"
            - list [ref=f39e63]:
              - listitem [ref=f39e64]:
                - strong [ref=f39e65]: +2 Jahre Erfahrung in der Shopify-Entwicklung
                - text: (Liquid, Theme-Entwicklung, Shopify APIs) – idealerweise aktuell und durchgehend bis heute
              - listitem [ref=f39e66]: Mehrjährige Erfahrung als Full Stack Developer
              - listitem [ref=f39e67]: Sehr gute Kenntnisse in JavaScript/TypeScript sowie in modernem Frontend (z. B. React)
              - listitem [ref=f39e68]: Solide Backend-Kenntnisse (Node.js und/oder PHP), Erfahrung mit REST-/GraphQL-APIs und Integrationen von Drittsystemen
              - listitem [ref=f39e69]: Sehr gute Kenntnisse in HTML & CSS sowie ein gutes Auge für UX und mobile Optimierung
              - listitem [ref=f39e70]: Sicherer Umgang mit Git und sauberen, nachvollziehbaren Entwicklungsprozessen
              - listitem [ref=f39e71]: Eigenständige, strukturierte Arbeitsweise und die Fähigkeit, technische Entscheidungen zu treffen und zu begründen
              - listitem [ref=f39e72]: Fließende Deutschkenntnisse
            - paragraph [ref=f39e73]:
              - strong [ref=f39e74]: "Bonuspunkte für:"
            - list [ref=f39e75]:
              - listitem [ref=f39e76]: Erfahrung mit Conversion-Rate-Optimierung und A/B-Testing
              - listitem [ref=f39e77]: Erfahrung mit Tools wie Google Analytics, Google Tag Manager oder Hotjar
              - listitem [ref=f39e78]: Erfahrung mit CI/CD und Performance-Optimierung
              - listitem [ref=f39e79]: Erfahrung mit weiteren E-Commerce- oder CMS-Systemen
            - heading "Benefits" [level=2] [ref=f39e80]
            - list [ref=f39e81]:
              - listitem [ref=f39e82]:
                - strong [ref=f39e83]: "Echte Gestaltungsfreiheit:"
