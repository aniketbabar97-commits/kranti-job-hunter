        - listitem [ref=e49]: // Java Backend Entwickler (m/w/d)
  - generic [ref=e55]:
    - heading "Java Backend Entwickler (m/w/d)" [level=2] [ref=e57]
    - generic [ref=e59]:
      - generic [ref=e60]:
        - paragraph [ref=e61]:
          - text: Seit über 75 Jahren ist MUSIK MEYER die Top-Adresse für den Exklusivvertrieb von Musikinstrumenten und Zubehör in Europa. Mit Leidenschaft entwickeln wir starke Marken und vertreiben hochwertige Produkte weltweit führender Hersteller. Als familiengeführtes Unternehmen mit rund 170 Mitarbeitenden im schönen Marburg an der Lahn verbinden wir die Sicherheit eines erfolgreichen Mittelstandsunternehmens mit der Dynamik der Musikbranche.
          - strong [ref=e62]: Zur Verstärkung unseres Teams im Bereich E-Commerce suchen wir zum nächstmöglichen Zeitpunkt einen erfahrenen und engagierten Java-Backend-Entwickler (m/w/d).
          - text: Kernaufgabe sind dabei unsere digitalen Prozesse, die die Warenwirtschaft, den E-Commerce und die internen sowie externen Systeme verbinden und somit die Grundlage für unsere täglichen Geschäftsabläufe bilden.Dabei setzen wir nicht auf starre Strukturen und vorgegebene Lösungswege. Unser Umfeld ist kreativ, dynamisch und geprägt von kurzen Entscheidungswegen. Wir suchen daher einen Java-Entwickler, der nicht nur Software entwickelt, sondern auch unsere Servicelandschaft aktiv mitgestaltet und weiterentwickelt.
        - heading [level=3] [ref=e63]:
          - strong [ref=e64]: Java Backend Entwickler (m/w/d)
        - heading "Deine Aufgaben:" [level=5] [ref=e65]
        - list [ref=e66]:
          - listitem [ref=e67]: Betreuung und Wartung unserer bestehenden Java-Backend-Anwendungen
          - listitem [ref=e68]: Konzeption und Implementierung neuer Backend-Funktionen und Services
          - listitem [ref=e69]: Entwicklung und Pflege von REST- und SOAP-Webservices sowie APIs
          - listitem [ref=e70]: Anbindung und Integration interner und externer Systeme
          - listitem [ref=e71]: Analyse und Optimierung bestehender Anwendungen, Schnittstellen und Geschäftsprozesse
          - listitem [ref=e72]: Aktive Mitgestaltung unserer Backend- und Service-Architektur
          - listitem [ref=e73]: Sicherstellung der Softwarequalität durch Code-Reviews und Unit-Tests.
        - heading "Das bringst Du mit:" [level=5] [ref=e74]
        - list [ref=e75]:
          - listitem [ref=e76]: Abgeschlossenes IT-Studium oder eine vergleichbare Ausbildung, z. B. als Fachinformatiker für Anwendungsentwicklung
          - listitem [ref=e77]: Mindestens 4 Jahre praktische Erfahrung in der Java-Backend-Entwicklung
          - listitem [ref=e78]: Sehr gute Java-Kenntnisse sowie Erfahrung mit Apache Tomcat und Maven
          - listitem [ref=e79]: Fundierte Erfahrung mit RESTful APIs und Kenntnisse in SOAP-Webservices
          - listitem [ref=e80]: Sicherer Umgang mit Git und Erfahrung mit Unit-Testing
          - listitem [ref=e81]: Erfahrung mit Eclipse, IntelliJ IDEA oder einer vergleichbaren Entwicklungsumgebung
          - listitem [ref=e82]: Idealerweise Kenntnisse in Spring / Spring Boot sowie SQL und relationalen Datenbanken
          - listitem [ref=e83]: Eigeninitiative, analytisches Denken und Freude daran, bestehende Lösungen weiterzuentwickeln
          - listitem [ref=e84]: Teamgeist, Kommunikationsstärke und die Bereitschaft, technische Verantwortung zu übernehmen
        - heading "Das erwartet dich:" [level=5] [ref=e85]
        - list [ref=e86]:
          - listitem [ref=e87]: "Gestaltungsspielraum: Du bringst eigene Ideen ein und wirkst an technischen Entscheidungen und deren Umsetzung mit"
          - listitem [ref=e88]: "Abwechslungsreiche Projekte: Anspruchsvolle Aufgaben rund um Java, E-Commerce und die Anbindung unserer Warenwirtschaft"
          - listitem [ref=e89]: "Eigenverantwortung: Du übernimmst Verantwortung für deine Lösungen und entwickelst unsere Systemlandschaft gemeinsam mit dem Team weiter"
          - listitem [ref=e90]: "Einarbeitung und Wissenstransfer: Ein erfahrenes und motiviertes Team unterstützt dich beim Einstieg in unsere Anwendungen und Prozesse"
          - listitem [ref=e91]: "Flexible Arbeitsgestaltung: Ein flexibles Arbeitszeitmodell und hybrides Arbeiten am Standort Marburg"
          - listitem [ref=e92]: "Fachliche Weiterentwicklung: Unterstützung bei Fortbildungen und Zertifizierungen"
          - listitem [ref=e93]: 30 Urlaubstage pro Jahr
          - listitem [ref=e94]: "Zusätzliche Leistungen: Betriebliche Altersvorsorge, Fahrrad- und E-Bike-Leasing, E-Ladestationen für Pkw und kostenlose Parkplätze"
          - listitem [ref=e95]: "Stabilität und kurze Wege: Ein etabliertes, inhabergeführtes Unternehmen mit offener Kommunikation und kurzen Entscheidungswegen"
          - listitem [ref=e96]: "Klare Zukunftsperspektive: Im Rahmen einer strukturierten Nachfolgeregelung übernimmst du schrittweise die technische Gesamtverantwortung für unsere Backend- und Servicelandschaft"
        - heading "Eckdaten:" [level=5] [ref=e97]
        - list [ref=e98]:
          - listitem [ref=e99]: "Position: Java Backend Entwickler (m/w/d)"
          - listitem [ref=e100]: "Standort: Marburg an der Lahn (Hessen), Hybrid"
          - listitem [ref=e101]: "Arbeitszeit: Vollzeit"
          - listitem [ref=e102]: "Besetzung: frühestmöglich"
        - paragraph [ref=e103]:
          - text: Das klingt nach Deinem nächsten beruflichen Schritt? Dann freuen wir uns auf Deine Bewerbung und darauf, dich persönlich kennenzulernen!Bitte nutze vorzugsweise unser
