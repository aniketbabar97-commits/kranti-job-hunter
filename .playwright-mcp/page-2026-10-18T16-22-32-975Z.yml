                - paragraph:
                  - strong: Deine Rolle – Business Analyst (Online-Shop Transformation) mit echter Wirkkraft
                - generic:
                  - paragraph: Du hast einen Blick für Zusammenhänge, möchtest die Digitalisierung im Handel aktiv gestalten und die Anforderungen von morgen strukturieren? Starte mit uns in die Zukunft der Online-Shop Transformation und übernimm eine Schlüsselrolle im Transformationsteam!
                  - paragraph
                  - generic:
                    - generic:
                      - img "Youtube video preview image"
                      - generic:
