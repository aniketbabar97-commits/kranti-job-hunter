                  - paragraph
                - paragraph:
                  - strong: "Darum geht es konkret:"
                - list:
                  - listitem: Erhebung, Analyse und Dokumentation fachlicher Anforderungen für den Online-Shop und digitale Prozesse
                  - listitem: Strukturierung, Optimierung und Automatisierung von Geschäftsprozessen
                  - listitem: Aufbereitung und Vermittlung von Domänen- sowie Prozesswissen für Projekt- und Entwicklungsteams
                  - listitem: Abstimmung mit internen/externen Stakeholdern und Schnittstellenfunktion zwischen Fachbereichen und IT
                  - listitem: Begleitung der Umsetzung unter Berücksichtigung regulatorischer und organisatorischer Anforderungen
                  - listitem: Erkennung fachlicher Risiken, Abhängigkeiten und Sicherstellung konsistenter Anforderungen während der Transformation
                - paragraph:
                  - strong: "Wir wünschen uns von dir:"
                - list:
                  - listitem: Abgeschlossenes Studium in Wirtschaftsinformatik, BWL, Informatik oder vergleichbare Qualifikation
                  - listitem: Mehrjährige Erfahrung als Business Analyst o. ä. im digitalen Umfeld
                  - listitem: Erfahrung in Anforderungsaufnahme, Geschäftsprozessmodellierung und -optimierung
                  - listitem: Kenntnisse agiler Arbeitsweisen sowie Stakeholder-Management über mehrere Teams hinweg
                  - listitem: Analytische, konzeptionelle Stärke und Kommunikationsfähigkeit; sehr gutes Deutsch, Englisch wünschenswert
                  - listitem: Idealerweise Erfahrung im E-Commerce- oder Omnichannel-Umfeld
                - paragraph:
                  - strong: "Das kannst du von uns erwarten:"
                - list:
                  - listitem: Flexibles Vollzeit- oder Teilzeitmodell (mind. 30 Stunden/Woche) und mobiles Arbeiten
                  - listitem: Ein kleines, schlagkräftiges Transformationsteam mit direkter Schnittstelle zu IT, Business und Marketing
                  - listitem: Vielfältige Entwicklungsmöglichkeiten und Verantwortung in strategischen Digitalprojekten
                  - listitem: Chance, die digitale Zukunft des Handels aktiv mitzugestalten
                  - listitem: Moderne, offene Arbeitsstrukturen und Zusammenarbeit auf Augenhöhe
                - paragraph
                - paragraph:
