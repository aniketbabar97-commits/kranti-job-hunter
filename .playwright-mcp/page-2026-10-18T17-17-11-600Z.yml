          - paragraph [ref=f3e240]: We use cookies on our website. Some of them are strictly necessary, while others are not, but help us to improve our online offering and to operate it economically. You can consent to the use of cookies that are not strictly necessary by clicking on the "Accept all cookies" button, or you can decide otherwise by clicking on "Reject unnecessary cookies ". In addition, you can individually consent to the use of certain cookie categories by clicking on the "Manage cookie settings" button. If you consent to the use of cookies that are not strictly necessary, you also consent in accordance with Art. 49 Para. 1 S. 1 lit. a GDPR to your data being processed in the USA. The USA is assessed by the European Court of Justice as a country with an insufficient level of data protection according to EU standards. In particular, there is a risk that your data may be processed by US authorities, for control and for monitoring purposes, possibly without the possibility of legal redress. If you click on " Reject unnecessary cookies ", the transmission described above will not take place.
