                - generic [ref=f2e89]:
                  - generic [ref=f2e90]:
                    - paragraph [ref=f2e91]: Du kennst Shopify nicht nur aus der täglichen Shop-Pflege, sondern weißt auch, wie man einen Shop von Grund auf aufbaut und kontinuierlich weiterentwickelt?
                    - paragraph [ref=f2e92]:
                      - text: Dann werde Teil unseres E-Commerce-Teams bei Holz-Richter! Als
                      - strong [ref=f2e93]: Shopify E-Commerce Manager / Product Owner (m/w/d)
                      - text: übernimmst du die Verantwortung für den Aufbau und die Weiterentwicklung neuer Shopify-Shops für casando. Dabei bekommst du viel Gestaltungsspielraum und die Möglichkeit, deine Projekte eigenständig von der Idee bis zur Umsetzung voranzutreiben.
                    - paragraph [ref=f2e94]: Du bewegst dich an der Schnittstelle zwischen E-Commerce, UX und Technik und sorgst dafür, dass unsere Shopify-Shops sowohl aus Kundensicht als auch technisch überzeugen.
                  - heading "Aufgaben" [level=2] [ref=f2e95]
                  - list [ref=f2e97]:
                    - listitem [ref=f2e98]: Du übernimmst als Product Owner die Verantwortung für den Aufbau und die Weiterentwicklung unserer Shopify-Shops.
                    - listitem [ref=f2e99]: Du setzt neue Shops möglichst eigenständig auf und entwickelst bestehende Lösungen kontinuierlich weiter.
                    - listitem [ref=f2e100]: Du konzipierst und optimierst Shop-Strukturen, Navigation, Landingpages und Customer Journeys mit Blick auf eine gute User Experience und Conversion.
                    - listitem [ref=f2e101]: Du konfigurierst Shopify, Themes und Apps und entscheidest, welche Lösungen für den jeweiligen Shop sinnvoll sind.
                    - listitem [ref=f2e102]: Du setzt Anpassungen im Shop eigenständig um und koordinierst bei Bedarf technische Anforderungen.
                    - listitem [ref=f2e103]: Du kümmerst dich um die Anbindung und das Zusammenspiel von Shopify mit weiteren Systemen, Schnittstellen und Middleware-Lösungen.
                    - listitem [ref=f2e104]: Du identifizierst Optimierungspotenziale und setzt neue Features, Tests und Verbesserungen eigenverantwortlich um.
                    - listitem [ref=f2e105]: Du behältst aktuelle Shopify-Entwicklungen, neue Funktionen, Apps und E-Commerce-Trends im Blick und prüfst, welche davon für unsere Shops relevant sind.
                  - heading "Qualifikation" [level=2] [ref=f2e106]
                  - list [ref=f2e108]:
                    - listitem [ref=f2e109]: Du hast fundierte praktische Erfahrung mit Shopify und hast idealerweise bereits selbstständig Shopify-Shops aufgebaut und weiterentwickelt.
                    - listitem [ref=f2e110]: Du verstehst Shopify nicht nur aus Anwendersicht, sondern bringst auch das notwendige technische Verständnis mit, um viele Anforderungen eigenständig umzusetzen.
                    - listitem [ref=f2e111]: Du kennst dich mit Shopify Themes, Apps und Schnittstellen aus; Kenntnisse im Bereich Middleware sind von Vorteil.
                    - listitem [ref=f2e112]:
                      - text: Idealerweise kannst du auch Anpassungen an Shopify-Themes selbst vornehmen. Kenntnisse in
                      - strong [ref=f2e113]: Liquid
                      - text: ", der Shopify-eigenen Template-Sprache, sowie in"
                      - strong [ref=f2e114]: HTML, CSS und JavaScript
                      - text: sind ein Plus.
                    - listitem [ref=f2e115]: Du kannst damit kleinere technische und gestalterische Änderungen möglichst eigenständig umsetzen, ohne für jede Anpassung auf Entwicklungsressourcen angewiesen zu sein.
                    - listitem [ref=f2e116]: Du bringst ein gutes Verständnis für E-Commerce, UX und Conversion-Optimierung mit und kannst technische und fachliche Anforderungen miteinander verbinden.
                    - listitem [ref=f2e117]: Du arbeitest sehr selbstständig, strukturiert und lösungsorientiert und übernimmst gerne Verantwortung für deine Projekte.
                    - listitem [ref=f2e118]: Du hast Lust, neue Shops von Beginn an mitzugestalten, eigene Ideen einzubringen und Entscheidungen aktiv voranzutreiben.
                    - listitem [ref=f2e119]: Du verfügst über sehr gute Deutschkenntnisse in Wort und Schrift.
                  - heading "Benefits" [level=2] [ref=f2e120]
