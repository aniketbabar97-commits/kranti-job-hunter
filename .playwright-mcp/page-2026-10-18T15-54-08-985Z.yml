        - generic [ref=e174]:
          - heading "StoSignature - bespoke façade surfaces" [level=2] [ref=e175]
          - paragraph [ref=e176]:
            - text: Historically façade surfaces have always been a composite of the material available and the skill of tradesmen involved. With our new Signature range we have developed and formalised a logical, structured approach to specifying rendered surfaces.
            - strong [ref=e177]: "Texture + Effects = unlimited combinations:"
            - text: Using state of the art through-coloured materials with additional effects such as metallic sheen coating, washes and glazes or applied granulates give you almost unlimited design scope.
