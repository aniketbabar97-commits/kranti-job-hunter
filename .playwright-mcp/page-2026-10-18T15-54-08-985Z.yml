        - heading "Unique facades, acoustic surfaces and more" [level=1] [ref=e137]
        - generic [ref=e140]:
          - 'heading "Insulated Façade Systems: the ideal solution for the residential sector" [level=2] [ref=e141]'
          - paragraph [ref=e142]: As one of the pioneers of external wall insulation systems, (EWI) sometimes referred to as insulated render or ETICs, we can look back on over 50 years of experience. We offer a variety of solutions for the insulation of new build housing and the upgrading/ refurbishment of existing building alike. Our systems offer an excellent solution for the reduction of heating or cooling cost and can make a considerable contribution to, for example, the EU’s goals of climate neutrality by 2050. When applied to our thermal insulation systems the choice of render, brick slips, veneers as well as portfolio of tiles and façade profiles are ideal for every kind of residential project.Whether small scale, domestic, single family housing, terraced housing or high rise apartments, we have a system for all technical demands and budget whilst simultaneously helping to reduce carbon emission.
