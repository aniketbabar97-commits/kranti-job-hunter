              - listitem [ref=f2e120]: Sicheres Auftreten und die Fähigkeit, komplexe Sachverhalte auch auf C-Level-Ebene überzeugend zu präsentieren
              - listitem [ref=f2e121]: Sicherer Umgang mit Jira, Confluence, Salesforce und MS Office
              - listitem [ref=f2e122]: Sehr gute Deutsch- und Englischkenntnisse in Wort und Schrift
