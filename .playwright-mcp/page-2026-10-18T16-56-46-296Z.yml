            - list [ref=f2e111]:
              - listitem [ref=f2e112]: Abgeschlossenes Studium, z. B. in BWL, E-Commerce, (Wirtschafts-)Informatik, Medien & Kommunikation oder eine vergleichbare Qualifikation
              - listitem [ref=f2e113]: Mindestens 3 Jahre Berufserfahrung als Product Owner (m/w/d) oder im Produktmanagement, idealerweise im B2B-E-Commerce oder bei Integrationsprojekten
              - listitem [ref=f2e114]: Erfahrung mit agilen Methoden wie Scrum oder Kanban
              - listitem [ref=f2e115]: Praxis in der Steuerung externer Dienstleister und Technologiepartner
              - listitem [ref=f2e116]: Grundverständnis von API- und Integrationsarchitekturen, insbesondere REST und Schnittstellenlogik
              - listitem [ref=f2e117]: Fundierte Kenntnisse gängiger Punchout-Standards wie cXML und OCI
              - listitem [ref=f2e118]: Erfahrung mit E-Procurement-Systemen wie SAP Ariba oder Coupa sowie Whitelabel-Lösungen von Vorteil
