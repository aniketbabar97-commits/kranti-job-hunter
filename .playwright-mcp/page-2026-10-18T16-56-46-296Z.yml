                - strong [ref=f2e102]: Punchout-Integrationen
              - listitem [ref=f2e103]:
                - text: Konzeption und strategischer Aufbau einer eigenen
                - strong [ref=f2e104]: Punchout-Lösung
              - listitem [ref=f2e105]: Analyse der bestehenden API- und Integrationslandschaft sowie Bewertung der technischen Machbarkeit
              - listitem [ref=f2e106]: Entwicklung von Produktvision, Lösungskonzept und Roadmap inklusive Ableitung konkreter Arbeitspakete
              - listitem [ref=f2e107]: Fachliche Leitung des Aufbauprojekts sowie Aufbereitung fundierter Entscheidungsgrundlagen für das C-Level
              - listitem [ref=f2e108]: Beratung des Sales-Teams bei fachlichen Fragen rund um Corporate Shops und Punchout
              - listitem [ref=f2e109]: Steuerung externer Technologiepartner sowie Begleitung von Qualitätssicherung und Produktevaluation
            - paragraph
