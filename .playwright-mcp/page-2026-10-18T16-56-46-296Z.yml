              - text: Als
              - emphasis [ref=f2e95]: Product Owner Shops & Punchout (m/w/d)
              - text: "übernimmst Du eine zentrale Rolle zwischen Produktmanagement, Business, Technologie und externen Partnern:"
            - list [ref=f2e96]:
              - listitem [ref=f2e97]:
                - text: Verantwortung für die Produktseite der bestehenden
                - strong [ref=f2e98]: Corporate-Shop-Lösung
                - text: und Steuerung des externen Dienstleisters
              - listitem [ref=f2e99]: Übersetzung von Kunden- und Businessanforderungen in klare Prioritäten, Roadmaps und Umsetzungspakete
