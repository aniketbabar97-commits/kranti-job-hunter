    - generic [ref=f1e52]:
      - 'heading "Dank eigenem Entwicklungsteam: Bei uns gestaltest du die digitale Zukunft" [level=2] [ref=f1e53]'
      - paragraph [ref=f1e54]: "Auch bei der digitalen Weiterentwicklung von Serviceleistungen wollen wir „Your most convenient partner“ sein. Den Rahmen bildet eine System- und Softwarelandschaft, die in der Branche Standards setzt – verantwortet von Corporate IT. Hier entwickeln wir unsere moderne, zunehmend cloudbasierte Infrastruktur kontinuierlich weiter. Ob digitale Lagerlogistik, E-Commerce-Lösungen, Datenmanagement oder viele weitere spannende Herausforderungen: Die außergewöhnliche Kombination aus dem Start-up-Spirit eines agilen Tätigkeitsbereichs und der Sicherheit eines leistungsstarken Konzerns wird dich überzeugen."
      - paragraph [ref=f1e55]
      - paragraph [ref=f1e56]:
        - link "Mehr über unsere Arbeitsweise erfahren" [ref=f1e57] [cursor=pointer]:
          - /url: "#arbeitsweise"
    - generic [ref=f1e62]:
      - figure [ref=f1e65]:
        - img "Flagge mit Lekkerland Logo" [ref=f1e67]
      - generic [ref=f1e68]:
        - heading [level=2] [ref=f1e69]:
          - generic [ref=f1e70]: "State-of-the-Art-Technologien:"
          - text: Corporate IT
        - paragraph [ref=f1e71]: "Das IT-Team: Die Spezialistinnen und Spezialisten verantworten die gesamte, europaweite System- und Softwarelandschaft von Lekkerland. Automatisierung, Security, DevOps: Dies sind nur einige der Themen, mit denen sich unsere IT intensiv beschäftigt. Sie konzipieren und betreiben eine hochmoderne IT-Infrastruktur, um die hohen Anforderungen von Lekkerland schnell umzusetzen und die Nutzer an jedem Standort bestmöglich zu unterstützen – mit neuesten Entwicklungsmethoden und Cloud-Technologien. Darüber hinaus unterstützt die IT in enger Zusammenarbeit die Fachbereiche – für eine effiziente Lagerlogistik, für einen produktiven Vertrieb und für den Erfolg vieler anderer Kolleginnen und Kollegen."
    - generic [ref=f1e76]:
      - heading "Unsere IT-Bereiche" [level=2] [ref=f1e78]
      - list [ref=f1e79]:
        - listitem [ref=f1e80]:
          - generic [ref=f1e81]:
            - figure "Lekkerland / Mark Feuerstake" [ref=f1e83]:
              - img "Lekkerland Mitarbeiterinnen gemeinsam vor dem Laptop" [ref=f1e85]
            - generic [ref=f1e87]:
              - heading "Geschäftsprozesse" [level=3] [ref=f1e88]
              - paragraph [ref=f1e89]: "Eng verzahnt und immer gemeinsam am Ball entwickeln und unterstützen wir unsere Fachbereiche. Ob Lagerlogistik, Vertrieb oder Controlling: Wir haben das Know-how, die Motivation und den technischen Background dazu."
        - listitem [ref=f1e90]:
          - generic [ref=f1e91]:
            - figure "Lekkerland / Mark Feuerstake" [ref=f1e93]:
              - img "Lekkerland Mitarbeiterinnen Unterhaltung vor dem Laptop" [ref=f1e95]
            - generic [ref=f1e97]:
              - heading "Entwicklung & Design" [level=3] [ref=f1e98]
              - paragraph [ref=f1e99]: Unsere agilen Teams konzipieren maßgeschneiderte IT-Lösungen in allen Geschäftsfeldern – vom Cloud- und Inhouse-Hosting über JAVA bis zum Advanced Business Application Programming. In Abstimmung mit unseren Stakeholdern entwickeln und verbessern wir kontinuierlich unsere IT-Produkte, um zügig und flexibel auf neue Anforderungen reagieren zu können.
        - listitem [ref=f1e100]:
          - generic [ref=f1e101]:
            - figure "Lekkerland / Mark Feuerstake" [ref=f1e103]:
              - img "Lekkerland Mitarbeiter vor dem Laptop" [ref=f1e105]
            - generic [ref=f1e107]:
              - heading "Technische IT" [level=3] [ref=f1e108]
              - paragraph [ref=f1e109]: In einer dynamischen Geschäftswelt gewährleistet unser Workplace-Management die Bereitstellung eines effizienten und leistungsstarken Arbeitsumfelds. Zudem sorgt das Platform- und Operations-Management mit der Verwaltung und Optimierung der technischen Infrastruktur für reibungslos funktionierende IT-Systeme.
    - generic [ref=f1e114]:
      - heading "Unter den Top 5 im E-Commerce" [level=2] [ref=f1e115]
      - paragraph [ref=f1e116]: "Das E-Commerce-Team: Hier ist das Ziel, den Kund:innen durch einen hohen Digitalisierungsgrad in der Kommunikation und Interaktion die bestmögliche Erfahrung in der Zusammenarbeit mit Lekkerland zu bieten. Mit dem digitalen Kundenportal und einem der umsatzstärksten B2B-Onlineshops in Deutschland wurde bereits ein erfolgreiches Fundament geschaffen. In der weiteren Entwicklung setzt der Bereich auf eine hochmoderne, cloudbasierte und skalierbare IT-Architektur. Agilität und Eigenverantwortung werden dabei großgeschrieben. In diesem Team wirkst du mit beim Ausbau der zentralen Plattform für Bestellung, Beratung, Serviceangebote und Kommunikation. So begeisterst du unsere Kund:innen für neue Online-Formate."
    - generic [ref=f1e119]:
      - heading "Unsere E-Commerce Bereiche" [level=2] [ref=f1e121]
      - list [ref=f1e122]:
        - listitem [ref=f1e123]:
          - generic [ref=f1e124]:
            - figure "Lekkerland / Studio2B GmbH" [ref=f1e126]:
              - img "Lekkerland Mitarbeiter telefoniert am Schreibtisch" [ref=f1e128]
            - generic [ref=f1e130]:
              - heading "Digitales Produktmanagement" [level=3] [ref=f1e131]
              - paragraph [ref=f1e132]: Unser Ziel ist, den größtmöglichen Mehrwert für unsere Kund:innen zu schaffen und die Zusammenarbeit komfortabel zu gestalten. Wir konzipieren, entwickeln und betreiben digitale Produkte in Zusammenarbeit mit Software Engineering und Digitalem Marketing & Operations, basierend auf Benutzeranalysen und Kundenfeedback. Der Austausch in cross-funktionalen Teams und die Kommunikation mit Stakeholdern sind dabei entscheidend.
        - listitem [ref=f1e133]:
          - generic [ref=f1e134]:
            - figure "Lekkerland / Mark Feuerstake" [ref=f1e136]:
              - img "Unterhaltung Lekkerland Mitarbeitende" [ref=f1e138]
            - generic [ref=f1e140]:
              - heading "Software Engineering" [level=3] [ref=f1e141]
              - paragraph [ref=f1e142]: Wir entwickeln und warten die System- und Softwarelandschaft, inklusive einer modernen, cloudbasierten Infrastruktur. Durch enge Zusammenarbeit mit Fachbereichen schaffen wir effiziente Lösungen für Vertrieb, Kundenservice und Logistik. Wir setzen hohe Standards in Architektur, Qualität, Sicherheit und Performance und unterstützen die Digitalisierung und Automatisierung von Geschäftsprozessen für eine optimale Kund:innen-Erfahrung.
        - listitem [ref=f1e143]:
          - generic [ref=f1e144]:
            - figure "Lekkerland / Eileen Schlüter" [ref=f1e146]:
              - img "Nahaufnahme Tastatur am Schreibtisch" [ref=f1e148]
            - generic [ref=f1e150]:
              - heading "Digitales Marketing & Operations" [level=3] [ref=f1e151]
              - paragraph [ref=f1e152]: Wir präsentieren kreativ Sortimente, Angebote und Aktionen in unserem Webshop und in der App, um Kund:innen über verschiedene Kanäle zu begeistern. Mit innovativen Lösungen schaffen wir kommerzielles Potenzial für unsere digitalen Touchpoints. Unsere Operations Manager und der Helpdesk sorgen für optimalen Kundenservice und einen reibungslosen Betrieb der digitalen Produkte.
    - generic [ref=f1e157]:
