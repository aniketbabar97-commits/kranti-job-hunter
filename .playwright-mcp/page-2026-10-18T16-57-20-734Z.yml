        - heading "Weltoffen und bodenständig" [level=2] [ref=f8e46]
        - generic [ref=f8e47]:
          - img "Mitarbeiter mit Lächeln bei der Arbeit." [ref=f8e52]
          - generic [ref=f8e53]:
            - paragraph [ref=f8e54]: "Bei QUIS verbinden wir das Beste aus zwei Welten: Die Dynamik eines Start ups mit unserer langjährigen Erfahrung aus der Wohnungsmarktanalytik."
            - paragraph [ref=f8e55]: Aktuell sind wir 7 Mitarbeiter am Standort in Hamburg-Othmarschen und erweitern das Team mit den besten Talenten, die unsere Begeisterung teilen, den Wohnungsmarkt transparent und besser verständlich zu machen.
            - paragraph [ref=f8e56]: Unser Team arbeitet kreativ und analytisch auf Augenhöhe miteinander sowohl im Büro als auch remote im Homeoffice.
            - paragraph [ref=f8e57]: Unser Erfolg basiert auf innovativen digitalen Lösungen, mit denen wir unseren Kunden durch maximale Transparenz, hohe Datenqualität und eine hervorragende User Experience überzeugen.
      - generic [ref=f8e58]:
        - heading "So arbeiten wir bei QUIS" [level=2] [ref=f8e59]
        - generic [ref=f8e60]:
          - img "QUIS-Team diskutiert und analysiert Immobiliendaten." [ref=f8e65]
          - paragraph [ref=f8e67]: Als Proptech bieten wir den Charme eines Startups in einer vielfältigen Branche. Wir haben den Anspruch, unseren Kunden mit hoher Datenqualität stets die besten Informationen für ihre Entscheidungen zu liefern. Dafür arbeiten wir in crossfunktionalen Teams zusammen, so dass wir unser unterschiedliches Wissen miteinander verbinden.
