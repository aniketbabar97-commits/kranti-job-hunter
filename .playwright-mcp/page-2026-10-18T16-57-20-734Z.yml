        - heading "Gestalte mit uns die Zukunft des Wohnungsmarktes" [level=1] [ref=f8e34]
        - paragraph [ref=f8e35]: Wir bei QUIS sind auf einer Mission, den Wohnungsmarkt durch innovative Technologien und datengestützte Lösungen transparenter zu gestalten. Zur Verstärkung unseres Teams suchen wir engagierte und motivierte Teamplayer, die mit uns die Immobilienbranche revolutionieren möchten. Bewirb dich jetzt und werde Teil eines dynamischen und zukunftsorientierten Teams.
        - generic [ref=f8e36]:
          - link "Stellenangebote" [ref=f8e37] [cursor=pointer]:
            - /url: "#jobs"
          - link "Bewirb dich jetzt" [ref=f8e39] [cursor=pointer]:
            - /url: https://jobapplication.hrworks.de/apply?companyId=u87e986&id=a5d8ec
      - img "Flagge mit QUIS-Logo und Einladung, QUIS beizutreten." [ref=f8e43]
    - generic [ref=f8e44]:
