              - paragraph [ref=f6e74]
              - paragraph [ref=f6e75]:
                - strong [ref=f6e76]: WE ARE ONE.
              - paragraph [ref=f6e77]:
                - strong [ref=f6e78]: Wir sind
                - text: mehr als ein IT- und SAP-Dienstleister – wir sind ein Team aus Menschen, die Unternehmen in die digitale Zukunft begleiten. Als Teil der All for One Group SE zählen wir zu den führenden SAP-Partnern im österreichischen Raum und unterstützen namhafte Unternehmen bei ihrer End-to-End-Transformation entlang der gesamten Wertschöpfungskette.
              - paragraph [ref=f6e79]: Mit unserer Kombination aus strategischer Beratung, Prozess-Know-how und technologischer Exzellenz schaffen wir Lösungen, die nicht nur Systeme verändern, sondern Unternehmen nachhaltig erfolgreicher machen. Dabei stehen Innovation, Teamgeist und Kundennähe im Mittelpunkt unseres Handelns.
              - paragraph [ref=f6e80]: "Bei uns arbeitest du in einem Umfeld, das von Vertrauen, Eigenverantwortung und echter Zusammenarbeit geprägt ist. Wir sind überzeugt: Außergewöhnliche Ergebnisse entstehen, wenn Menschen ihre Stärken bündeln – und Erfolg immer als Teamleistung verstehen."
              - paragraph [ref=f6e81]
              - paragraph [ref=f6e82]:
                - strong [ref=f6e83]: WE ARE ONE
                - text: "– ein Team, eine Vision, ein gemeinsamer Anspruch: die digitale Transformation unserer Kunden nachhaltig und messbar voranzubringen."
              - paragraph [ref=f6e84]
              - paragraph [ref=f6e85]
              - paragraph [ref=f6e86]:
                - text: Als
                - strong [ref=f6e87]: Delivery Executive
                - text: verantwortest Du den strategisch einen
                - strong [ref=f6e88]: Teil unseres CX-Kundenportfolios
                - text: und entwickeln diesen gemeinsam mit dem Client Executive weiter. Du bist der/die zentrale AnsprechpartnerIn innerhalb Ihrer Kundenaccounts und trägst die Gesamtverantwortung für alle Belange der Projektabwicklung. In dieser Führungsrolle stellst Du eine erstklassige Delivery Governance sicher, gewährleistest höchste Kundenzufriedenheit, leitest Dein Team in der Matrixorganisation und identifizierst kontinuierlich Wachstumspotenziale.
              - heading [level=3] [ref=f6e89]:
                - strong [ref=f6e90]
              - paragraph [ref=f6e91]:
                - strong [ref=f6e92]: Das macht deinen Job spannend
              - list [ref=f6e93]:
                - listitem [ref=f6e94]:
                  - strong [ref=f6e95]: "Trusted Advisor im SAP CX Umfeld:"
                  - text: Ganzheitliche Beratung unserer Kunden bei der Konzeption, Orchestrierung und Implementierung komplexer, zukunftsfähiger CX-Architekturen (Sales, Service, Commerce, Marketing und BTP).
                - listitem [ref=f6e96]:
                  - strong [ref=f6e97]: "Vordenker & Portfolio-Gestalter (Own IP):"
                  - text: Definition, Strukturierung und Weiterentwicklung unseres hauseigenen Service-Portfolios sowie innovativer Eigenentwicklungen zur kontinuierlichen Steigerung unseres Lieferstandards.
                - listitem [ref=f6e98]:
                  - strong [ref=f6e99]: "Wachstumstreiber im Presales:"
                  - text: Einbringung fachlicher Exzellenz in der Presales-Phase, Begeisterung von Neukunden in Workshops und Übersetzung von Business-Anforderungen in technologische Architekturen.
                - listitem [ref=f6e100]:
                  - strong [ref=f6e101]: "Own the Delivery:"
                  - text: Volle Verantwortung für Projekterfolg, Qualität und Finanzen sowie Steuerung der Delivery Governance und des Risikomanagements.
                - listitem [ref=f6e102]:
                  - strong [ref=f6e103]: "Drive the Customer Relationship:"
                  - text: Ausrichtung der Delivery an Kundenbedürfnissen, Steuerung von Eskalationen, Sicherstellung der Kundenzufriedenheit und Agieren als geschätzter Ansprechpartner für das Kunden-Management.
                - listitem [ref=f6e104]:
                  - strong [ref=f6e105]: "Grow the Account:"
                  - text: Gezielte Förderung von Cross- und Upselling gemeinsam mit dem Client Executive sowie Identifizierung von Erweiterungschancen in aktiven Projekten.
                - listitem [ref=f6e106]:
                  - strong [ref=f6e107]: "Lead the Team in Execution:"
                  - text: Matrixführung des Delivery-Teams sowie gezieltes Coaching von Consultants.
              - heading [level=3] [ref=f6e108]:
                - strong [ref=f6e109]
              - paragraph [ref=f6e110]
              - paragraph [ref=f6e111]
              - paragraph [ref=f6e112]:
                - strong [ref=f6e113]: Das erwartet dich
              - list [ref=f6e114]:
                - listitem [ref=f6e115]: Viele Freiräume bei einem der größten SAP-Partner weltweit mit einem sehr breiten Produkt- und Dienstleistungsportfolio
                - listitem [ref=f6e116]: Eine großartige Arbeitsatmosphäre, die geprägt ist durch Eigenverantwortung, viel Gestaltungsfreiraum und ein wertschätzendes Miteinander auf Augenhöhe
                - listitem [ref=f6e117]: Benefits wie Firmenwagen, Jobrad, Fitness, betriebliche Altersvorsorge, bis zu 3 Wochen Workation in der EU sind selbstverständlich
                - listitem [ref=f6e118]:
                  - strong [ref=f6e119]: "On top:"
                  - text: 25+5 Tage Urlaub, individuelle Karrierepfade und gezielte Weiterentwicklung
              - heading [level=3] [ref=f6e120]:
                - strong [ref=f6e121]
              - paragraph [ref=f6e122]
              - paragraph [ref=f6e123]
              - paragraph [ref=f6e124]:
                - strong [ref=f6e125]: Das bringst du mit
              - list [ref=f6e126]:
                - listitem [ref=f6e127]:
                  - text: Nachweisbare Erfolge und
                  - strong [ref=f6e128]: mindestens 5 Jahre Erfahrung in einer leitenden Delivery- oder Program-Management-Rolle
                  - text: sowie im Key Account Management im Beratungsumfeld oder Bereich Professional Services.
                - listitem [ref=f6e129]:
                  - strong [ref=f6e130]: Erfahrung in der Übernahme voller finanzieller, operationaler und qualitativer Verantwortung
                  - text: für komplexe, großflächige Projekte und Kundenportfolios.
                - listitem [ref=f6e131]:
                  - strong [ref=f6e132]: Praxiserprobte Führungskompetenz
                  - text: bei der Anleitung von Projektleitern, Beratern und cross-funktionalen Teams.
                - listitem [ref=f6e133]:
                  - strong [ref=f6e134]: Erfahrung in der engen Zusammenarbeit mit dem Vertrieb
                  - text: zur systematischen Weiterentwicklung und Erweiterung von Kundenkonten (Upselling / Cross-Selling).
                - listitem [ref=f6e135]:
                  - strong [ref=f6e136]: "Kundenorientierte Führung & Stakeholder Management:"
                  - text: Exzellente Kommunikations- und Verhandlungsfähigkeiten sowie die Eigenschaft, als vertrauenswürdiger Berater auf C-Level- und Management-Ebene zu agieren.
                - listitem [ref=f6e137]:
                  - strong [ref=f6e138]: "Governance & Risikomanagement:"
                  - text: Tiefgehendes Verständnis für Projekt-Governance, Risikominimierung, Controlling und Qualitätsstandards.
                - listitem [ref=f6e139]:
                  - strong [ref=f6e140]: "Konflikt- & Eskalationsmanagement:"
                  - text: Fähigkeit, komplexe Kundeneskalationen souverän zu steuern und lösungsorientiert zu verhandeln.
                - listitem [ref=f6e141]:
                  - text: Fundierte, Erfahrung im
                  - strong [ref=f6e142]: SAP CX Ökosystem
                  - text: (SAP Sales Cloud, SAP Service Cloud, SAP Commerce Cloud, SAP Emarsys oder SAP BTP).
                - listitem [ref=f6e143]:
                  - strong [ref=f6e144]: "Nice to have - AI & GenAI Expertise:"
                  - text: Erfahrung in der Konzeption, Beratung und Platzierung von Künstlicher Intelligenz im CX-Umfeld zur innovativen Weiterentwicklung unseres Portfolios
                - listitem [ref=f6e145]:
                  - strong [ref=f6e146]: "Strategisches & Unternehmerisches Denken:"
                  - text: Ausgeprägtes Gespür dafür, wie Technologie geschäftlichen Mehrwert generiert, um das Geschäft unserer Kunden nachhaltig weiterzuentwickeln.
                - listitem [ref=f6e147]:
                  - strong [ref=f6e148]: "Kommunikationsstärke & Empathie:"
                  - text: Souveränes, verbindliches Auftreten auf Management- und C-Level-Ebene gepaart mit hoher Empathie, um Kunden und eigene Teams gleichermaßen zu begeistern.
                - listitem [ref=f6e149]:
                  - strong [ref=f6e150]: "Change-Wille & Gestaltungsdrang:"
                  - text: Resilienz, Durchsetzungskraft und diplomatische Finesse zur erfolgreichen Moderation organisatorischer und technologischer Veränderungen.
                - listitem [ref=f6e151]:
                  - strong [ref=f6e152]: "Sprachkompetenz:"
                  - text: Ausgezeichnete Deutschkenntnisse auf C2-/muttersprachlichem Niveau für die souveräne Beratung im DACH-Raum sowie verhandlungssicheres Englisch für internationale Projektstrukturen.
              - heading [level=3] [ref=f6e153]:
                - strong [ref=f6e154]
              - heading [level=3] [ref=f6e155]:
                - strong [ref=f6e156]
              - paragraph [ref=f6e157]
              - paragraph [ref=f6e158]:
                - text: Für diese strategische Schlüsselposition bieten wir ein
                - strong [ref=f6e159]: attraktives Bruttojahresgehalt
                - strong [ref=f6e160]: ab EUR 90.000,- (auf Vollzeitbasis) +Dienstwagen
                - text: . Eine deutliche Überzahlung ist je nach Deiner spezifischen Qualifikation, Seniorität und Vorerfahrung für uns selbstverständlich.
              - paragraph [ref=f6e161]:
                - strong [ref=f6e162]
              - paragraph [ref=f6e163]
              - paragraph [ref=f6e164]:
                - strong [ref=f6e165]: Klingt nach deiner nächsten Destination?
              - paragraph [ref=f6e166]: Wir freuen uns auf deine Bewerbung! Sende uns deine Unterlagen direkt über unser Karriereportal. Für Fragen steht dir unser Talent Acquisition Team jederzeit gerne zur Verfügung.
