        - generic [ref=e104]:
          - generic [ref=e106]:
            - heading "Deine Aufgaben" [level=2] [ref=e107]
            - list [ref=e109]:
              - listitem [ref=e110]: Initiierung, Planung und Durchführung von übergreifenden IT-Projekten im Kontext der dm-App und des dm-Onlineshops, einschließlich Projektkommunikation, Stakeholder-Management und Steuerung externer Partner
              - listitem [ref=e111]: Analyse von Kundenbedürfnissen sowie von fachlichen, technischen und organisatorischen Anforderungen und Konzeption passender Lösungen und Prozesse
              - listitem [ref=e112]: Priorisierung und Steuerung der Umsetzung – von der Anforderung über die Einführung bis zur Überprüfung des erzielten Nutzens
              - listitem [ref=e113]: Weiterentwicklung der Themen über das einzelne Projekt hinaus – in Zusammenarbeit mit Produktteams und enger Abstimmung mit den Fachbereichen
          - generic [ref=e115]:
            - heading "Das bringst Du mit" [level=2] [ref=e116]
            - list [ref=e118]:
              - listitem [ref=e119]: Nachgewiesene Erfahrung als Product Owner oder Projektleiter sowie in der Zusammenarbeit mit Consultants, Entwicklern und internen Stakeholdern
              - listitem [ref=e120]: Erfahrung in der Konzeption und Umsetzung von Web- und/oder App-Lösungen, bevorzugt im Umfeld digitaler Gesundheitsdienstleistungen
              - listitem [ref=e121]: Technisches Verständnis, um Anforderungen einzuordnen und mit Entwicklern und technischen Stakeholdern auf Augenhöhe zu arbeiten
              - listitem [ref=e122]: Praktische Erfahrung in der Anwendung agiler Methoden sowie Interesse an E-Commerce und an digitalen Kundenerlebnissen – online wie im dm-Markt
              - listitem [ref=e123]: Die Fähigkeit, Themen kreativ zu gestalten, klar zu strukturieren und eigenverantwortlich voranzutreiben
              - listitem [ref=e124]: Ausgeprägte Teamfähigkeit, Kommunikationsstärke und Englischkenntnisse (mindestens C1) für die internationale Zusammenarbeit
          - generic [ref=e126]:
            - heading "Das bieten wir Dir" [level=2] [ref=e127]
            - list [ref=e129]:
              - listitem [ref=e130]:
                - strong [ref=e131]: "Dialogische Unternehmenskultur:"
                - text: Individuelle Stärken und Ideen unserer Mitarbeitenden sind das Fundament für die (Weiter-)Entwicklung unserer IT-Produkte. Dabei gehen wir offen mit neuen Technologien um, testen und nutzen dabei aktiv unsere Entscheidungsspielräume für ein optimales Ergebnis.
              - listitem [ref=e132]:
                - strong [ref=e133]: "Gesundheit & Vorsorge:"
                - text: "Für Deine Vorsorge bieten wir unterschiedliche Zusatzleistungen für individuelle Bedürfnisse an: von einem Zuschuss zu Deiner betrieblichen Altersvorsorge, einer attraktiven Berufsunfähigkeitsversicherung über Angebote für Deine physische und psychische Gesundheit bis hin zu Kooperationen mit Krankenkassen oder Fitness-Studios und hausinternen Kursen für Dein Wohlbefinden. Ein betriebliches Sozialmanagement rundet das Angebot ab."
              - listitem [ref=e134]:
                - strong [ref=e135]: "Lernen bei dmTECH:"
                - text: Die digitale dm-Lernwelt bietet Dir zeit- und ortsunabhängig über 250 Seminare und Workshops – vom Projektmanagement bis hin zu fachlichen Weiterbildungen. Du hast Zugang zur Lernplattform Udemy mit ihrem breit gefächerten Kursangebot und kannst zusätzlich an externen Events und Weiterbildungen teilnehmen.
              - listitem [ref=e136]:
                - strong [ref=e137]: "Für eine ausgewogene Work-Life-Balance:"
                - text: flexible Arbeitszeiten, mobiles Arbeiten, 37,5-Stunden-Woche und 30 Urlaubstage. Bei einer „Workation“ kannst Du sogar Urlaub und Arbeit verbinden.
              - listitem [ref=e138]:
                - strong [ref=e139]: "Arbeitsatmosphäre:"
                - text: Unsere Räume im „dialogicum" sind hell, großzügig und modern. Die neueste Technik und ergonomisches Mobiliar erleichtern Dir Deine Aufgaben. Im „culinarium" bieten wir Dir täglich frische Mahlzeiten, gesunde Snacks und süße Kleinigkeiten zum fairen Preis.
              - listitem [ref=e140]:
                - strong [ref=e141]: "Zusatzleistungen:"
                - text: Den Erfolg unserer Arbeitsgemeinschaft geben wir gern an Dich zurück – mit Zulagen wie Urlaubs- und Weihnachtsgeld, mit Sonderzahlungen und Warengutscheinen. Du bekommst außerdem 10 % Mitarbeiterrabatt in allen deutschen dm-Märkten und profitierst in vielen Onlineshops von exklusiven Angeboten für dm-Mitarbeitende. Darüber hinaus kannst Du zweimal jährlich aktuelle Smartphones, Tablets oder Laptops für Deinen Privatgebrauch preiswert leasen.
              - listitem [ref=e142]:
                - strong [ref=e143]: "Mobilität:"
                - text: Mit einem Zuschuss für das "Deutschlandticket Job" bist Du günstig unterwegs. Wenn Du lieber Fahrrad fährst, kannst Du auch das JobRad® nutzen. Auf unserem Gelände gibt es genügend Parkplätze, E-Ladestationen und eine Fahrradgarage. Eine S-Bahn-Station und der Anschluss zur Autobahn liegen in direkter Nähe.
