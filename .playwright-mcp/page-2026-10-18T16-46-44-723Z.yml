        - generic [ref=e80]:
          - heading "Job Details" [level=2] [ref=e81]
          - paragraph [ref=e84]: Für monatlich 7 Millionen Kunden, die unsere digitalen Touchpoints nutzen, tragen wir mit unseren digitalen Services maßgeblich zu einem modernen dm-Einkaufserlebnis bei. Mit rund 100 Millionen Sessions pro Monat und über 4.000 Filialen gestalten wir das Omnichannel-Shopping von morgen.Im Bereich Digital Commerce Experience verantworten wir die App, den Onlineshop und die Homepages von dm-drogerie markt in Deutschland sowie in weiteren dm-Ländern. In interdisziplinären, agilen Produktteams arbeiten wir eng zusammen, um unseren Kunden bestmögliche Einkaufserlebnisse zu bieten.Für die Weiterentwicklung unserer dm-App und des Onlineshops suchen wir einen IT-Consultant an der Schnittstelle zwischen Business und Technologie. Dazu gehört auch die digitale Einbindung von Gesundheitsdienstleistungen, die unsere Partner in ausgewählten dm-Märkten und online anbieten.Du begeisterst Dich für digitale Gesundheitsangebote und E-Commerce? Du willst spannende IT-Projekte voranbringen und herausfinden, welche Lösungen unseren Kundinnen und Kunden wirklich weiterhelfen? Dann freuen wir uns auf Deine Bewerbung!
