                  - heading "Über unseren Kunden" [level=2] [ref=f9e134]
                  - paragraph [ref=f9e135]: Für unseren erfolgreichen Partner sind wir auf der Suche nach einem SAP CX Consultant (m/w/d) zur unbefristeten Festanstellung. Unser Kunde ist ein innovativer IT-Dienstleister mit mehreren tausend Mitarbeitenden an zahlreichen Standorten europaweit. Das Unternehmen begleitet seine Kunden bei der digitalen Transformation und entwickelt Lösungen, die moderne Technologien, hohe Servicequalität und nachhaltigen Geschäftsnutzen verbinden.
                  - paragraph [ref=f9e136]: Klare Strukturen, ein wertschätzender Umgang und ein starker Fokus auf persönlicher und fachlicher Weiterentwicklung liegen unseren Partner besonders am Herzen. Mitarbeitende arbeiten in modernen, agilen Teams und erhalten die Möglichkeit, Verantwortung zu übernehmen, eigene Ideen einzubringen und an technologisch anspruchsvollen Projekten mitzuwirken. Dieses Umfeld schafft Stabilität und gleichzeitig Raum für Wachstum und echte Gestaltungsmöglichkeiten.
                  - heading "Aufgaben" [level=2] [ref=f9e137]
                  - list [ref=f9e138]:
                    - listitem [ref=f9e139]: Sie konzipieren und implementieren Lösungen im SAP Customer Experience Umfeld, beispielsweise in Sales Cloud, Service Cloud oder Commerce Cloud.
                    - listitem [ref=f9e140]: Sie optimieren End-to-End-Prozesse entlang der Customer Journey und integrieren SAP CX nahtlos in bestehende SAP-Landschaften wie S/4HANA.
                    - listitem [ref=f9e141]: Sie analysieren fachliche Anforderungen im Vertrieb, Service oder Marketing und setzen diese durch gezieltes Customizing und Erweiterungen um.
                    - listitem [ref=f9e142]: Sie beraten Kunden strategisch zur Weiterentwicklung ihrer SAP CX Architektur und treiben innovative Konzepte aktiv voran.
                  - heading "Profil" [level=2] [ref=f9e143]
                  - list [ref=f9e144]:
                    - listitem [ref=f9e145]: Fundierte Berufserfahrung im SAP CX-Umfeld.
                    - listitem [ref=f9e146]: Erfahrung im Umgang mit angrenzenden SAP-Modulen.
                    - listitem [ref=f9e147]: Sehr gute Deutschkenntnisse.
                  - heading "Ihre Vorteile" [level=2] [ref=f9e148]
                  - list [ref=f9e149]:
                    - listitem [ref=f9e150]: Attraktive Vergütung mit leistungsorientierten Boni.
                    - listitem [ref=f9e151]: Flexible Arbeitszeiten.
                    - listitem [ref=f9e152]: Hoher Homeoffice-Anteil.
                    - listitem [ref=f9e153]: 30 Urlaubstage zzgl. Sondertage.
                    - listitem [ref=f9e154]: Innovative Arbeitsumgebung mit modernster Technologie.
                    - listitem [ref=f9e155]: Weiterbildung und Entwicklung durch interne Schulungen, externe Fortbildungen und individuelle Programme (u. a. direkt bei SAP).
                    - listitem [ref=f9e156]: Gesundheits- und Vorsorgeleistungen, inklusive betrieblicher Altersvorsorge (BAV) und Krankenversicherungen.
                    - listitem [ref=f9e157]: Zuschüsse für Fitnessstudio-Mitgliedschaften oder Gesundheitsprogramme.
                    - listitem [ref=f9e158]: Psychologische Unterstützung und Wellness-Angebote zur Förderung der mentalen Gesundheit.
                    - listitem [ref=f9e159]: Teambuilding-Events und regelmäßige Firmenfeiern.
                    - listitem [ref=f9e160]: Elternzeit- und Kinderbetreuungsangebote, z. B. Zuschüsse oder Unterstützung bei der Suche nach Betreuungseinrichtungen.
                    - listitem [ref=f9e161]: Kultur- und Freizeitangebote, z. B. Firmenrabatte für Veranstaltungen und Freizeitaktivitäten.
                    - listitem [ref=f9e162]: Kostenlose Snacks und Getränke (Obst, Wasser, Kaffee).
                    - listitem [ref=f9e163]: Private Parkplätze und eine hervorragende Kantine mit eigener Küche.
                    - listitem [ref=f9e164]: Kostenloser General-Gesundheitscheck.
                  - heading "Kontakt" [level=2] [ref=f9e165]
                  - paragraph [ref=f9e166]: "Haben Sie Fragen zur Position oder möchten Sie sich direkt bewerben? Dann senden Sie mir gerne Ihre Bewerbungsunterlagen zu oder melden Sie sich bei Fragen jederzeit unter: prus@k4s.de"
                  - paragraph [ref=f9e167]: Denise Prus -- Recruiting SAP Ich freue mich darauf, von Ihnen zu hören!
