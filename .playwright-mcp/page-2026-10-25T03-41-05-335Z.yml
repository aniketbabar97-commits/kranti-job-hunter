  - article [ref=f104e54]:
    - heading "Ihre Karriere bei AEET" [level=2] [ref=f104e55]
    - generic [ref=f104e56]:
      - paragraph [ref=f104e57]: "Bewerbung als :"
      - list [ref=f104e58]:
        - listitem [ref=f104e59]: ››Bürokaufmann/-frau
        - listitem [ref=f104e60]: ››Kaufmann/-frau - Innendienstvertrieb
        - listitem [ref=f104e61]: ››Fachkraft - Marketing/Verkauf/Vertrieb
    - paragraph [ref=f104e62]: Als weltweit agierender Anbieter für Photovoltaiklösungen versteht sich die AEET Energy Group GmbH als alles umfassender Full-Service-Partner auf dem großen Betätigungsfeld der Photovoltaik. Die enge und reibungsfreie Zusammenarbeit mit Kunden, Planern und Monteuren zählt ebenso zu den Grundsätzen der AEET Energy Group GmbH wie ein umfassendes Serviceangebot und eine herausragende Qualität der Produkte. Für das Expertenteam der AEET Energy Group GmbH zählt die direkte Betreuung ihrer Partner und Kunden daher zu den wichtigsten Maximen des Unternehmens. Eigenständige Recherche potentieller Geschäftspartner im Handels und Handwerks Bereich, telefonischer Kaltakquise, telefonischer Betreuung bestehender Kunden und Emailverkehr mit sowohl neuen als auch bestehenden Kunden.
    - heading [level=3] [ref=f104e63]:
      - strong [ref=f104e64]: Ihre Aufgaben
    - list [ref=f104e65]:
      - listitem [ref=f104e66]: ››Alle im Büro anfallenden Tätigkeiten, insbesondere Termin
      - listitem [ref=f104e67]: ››Büro- und Reiseorganisation und anfallender Schriftverkehr.
      - listitem [ref=f104e68]: ››Unterstützung der Geschäftsführung sowie selbstständige Projektbetreuung.
      - listitem [ref=f104e69]: ››Schreiben von Notizen, Korrespondenz, tabellarischen Übersichten und zwar jeweils entweder nach handschriftlicher Vorlage oder Diktat.
      - listitem [ref=f104e70]: ››Bearbeitung und Versand der Korrespondenz sowie Organisation von Veranstaltungen, Schulungen, Workshops usw..
      - listitem [ref=f104e71]: ››Pflege spezifischer Listen (Projektliste, Projektmeldungen, etc.).
      - listitem [ref=f104e72]: ››Vorbereitende Buchhaltung
      - listitem [ref=f104e73]: ››Auftragsabwicklung
      - listitem [ref=f104e74]: ››Rechnungs-/Angebotserstellung
    - heading [level=3] [ref=f104e75]:
      - strong [ref=f104e76]: Unsere Anfordungen
    - list [ref=f104e77]:
      - listitem [ref=f104e78]: ››Sie sind motiviert, redegewandt und freundlich
      - listitem [ref=f104e79]: ››Sie sprechen fließend und dialektfrei deutsch und verfügen über eine angenehme Telefonstimme
      - listitem [ref=f104e80]: ››Der Umgang mit Geschäftskunden ist Ihnen vertraut
      - listitem [ref=f104e81]: ››Sie führen auch englischsprachige Telefonate souverän und können Telefonnotizen auf Englisch verfassen
      - listitem [ref=f104e82]: ››Sie verfügen über gute PC-Kenntnisse und sind Multitasking-fähig
      - listitem [ref=f104e83]: ››Sie verfügen über eine rasche Auffassungsgabe
      - listitem [ref=f104e84]: ››Sie bringen technisches Verständnis (für Telekommunikationsabläufe) mit
      - listitem [ref=f104e85]: "››Sie bringen folgende Kenntnisse mitbringen: Call Center Erfahrung bzw. Erfahrung in Telesales, MS Office."
    - paragraph [ref=f104e86]: Ein eigenverantwortlicher, zielorientierter und selbständiger Arbeitsstil sowie sicheres Auftreten runden Ihr Profil ab.
    - paragraph [ref=f104e87]:
      - strong [ref=f104e88]: Treten Sie in direkten Kontakt mit der AEET Energy Group GmbH!
      - text: Die Experten des Leitbetriebs der Photovoltaikbranche freuen sich darauf, mehr über Sie zu erfahren. Nach sorgfältiger Auswertung Ihrer Unterlagen setzt sich Ihr zukünftiger Ansprechpartner persönlich mit Ihnen in Verbindung. Wir garantieren die absolut diskrete Handhabung Ihrer Bewerbung.
    - paragraph [ref=f104e89]:
      - text: "Senden Sie uns Ihre aussagekräftigen Bewerbungsunterlagen inklusive Ihrer Gehaltsvorstellung sowie der Angabe Ihres frühestmöglichen Eintrittstermins per E-Mail oder Post, E-Mail:"
      - link "bewerbung@aeet24.com" [ref=f104e90] [cursor=pointer]:
        - /url: mailto:bewerbung@aeet24.com
    - paragraph [ref=f104e91]:
      - generic [ref=f104e92]: AEET Energy Group GmbH z.H HR-Management Lichtenstein 11 D-37581 Bad Gandersheim
