        - generic [ref=e231]:
          - heading [level=3] [ref=e233]:
            - strong [ref=e235]: Einer für Alle…
          - paragraph [ref=e237]: "Egal, ob im Produktmanagement, Marketing oder Personalwesen, egal, ob Abteilungsleiter:in, Azubi oder Praktikant:in: Denn wir wissen, wie wichtig jede und jeder Einzelne ist - dass wir uns auf unsere Mitarbeitenden verlassen können und unsere Mitarbeitenden sich auf uns."
        - generic [ref=e239]:
          - heading [level=3] [ref=e241]:
            - strong [ref=e243]: …und Alle für Einen.
          - paragraph [ref=e245]: "Als großes Team betreuen wir so viele Aufgaben wie möglich inhouse: Vom Callcenter über die Gestaltung der Kataloge, das eigene Fotostudio, Layout, die hauseigene Planungsabteilung für große Kundenaufträge und vieles mehr. Unser wesentlicher Zukunftstreiber und stark wachsender Vertriebskanal ist eCommerce. Zusätzlich sind wir aber auch mit unserem Katalog- und Direktgeschäft immer dort, wo unsere Kunden uns brauchen."
      - group "Photo album" [ref=e250]
      - generic [ref=e271]:
        - generic [ref=e275]:
          - heading "Wer wir sind" [level=2] [ref=e276]
          - paragraph [ref=e278]: Herzlich willkommen bei Schäfer Shop, wo wir unsere Leidenschaft und unser Engagement dafür einsetzen, Arbeitsumfelder zu gestalten, die dich zu Höchstleistungen inspirieren. Als einer der führenden Anbieter von Büro- und Betriebsausstattungen in Europa sind wir stolz darauf, unser Team von nahezu 1.000 talentierten Menschen vorzustellen, die gemeinsam an dieser Vision arbeiten.Komm zu uns und hilf uns dabei, die Zukunft der Arbeitswelt zu gestalten. Entdecke deine Karrieremöglichkeiten bei Schäfer Shop und werde Teil unserer Mission, Arbeitsumfelder zu schaffen, die dich erfolgreich machen.
        - generic [ref=e282]:
          - generic [ref=e283]:
            - generic [ref=e289]:
              - heading [level=3] [ref=e290]:
                - text: Eine
                - strong [ref=e291]: Gemeinschaft
              - paragraph [ref=e293]: Bei Schäfer Shop sind wir mehr als nur ein Unternehmen – wir sind eine Gemeinschaft von Machern und Visionären. Unser Erfolg basiert auf einer Kultur der Zusammenarbeit, Innovation und des unermüdlichen Strebens nach Exzellenz. Wir sind ständig auf der Suche nach talentierten und motivierten Menschen, die unsere Leidenschaft teilen und dazu beitragen möchten, unsere Mission Wirklichkeit werden zu lassen.
            - generic [ref=e299]:
              - heading [level=3] [ref=e300]:
                - generic [ref=e301]:
                  - text: Unsere
                  - strong [ref=e302]: Arbeitsweise
              - paragraph [ref=e304]: Wenn du dich uns anschließt, wirst du Teil eines Teams, das die Art und Weise, wie Menschen arbeiten, gestaltet und verbessert. Wir bieten dir nicht nur eine Karriere, sondern auch die Möglichkeit, einen echten Einfluss auf die Arbeitswelt unserer Kunden auszuüben. Unsere Arbeitsumgebungen sind geprägt von Offenheit, Zusammenarbeit und Wachstum – ein Ort, an dem deine Ideen und deine Leidenschaft willkommen sind.
          - generic [ref=e310]:
            - generic [ref=e311]:
              - heading [level=3] [ref=e312]:
                - text: Dein
                - strong [ref=e313]: Potential
              - paragraph [ref=e315]: Egal, ob du bereits Erfahrung in der Branche hast oder gerade am Anfang deiner Karriere stehst, bei Schäfer Shop gibt es spannende Möglichkeiten und Herausforderungen, auf die du dich freuen kannst. Wir sind bestrebt, unsere Mitarbeiterinnen und Mitarbeiter zu fördern, zu inspirieren und zu unterstützen, damit sie ihr volles Potenzial ausschöpfen können.
            - button "Bewirb Dich jetzt" [ref=e317] [cursor=pointer]
      - generic [ref=e329]:
        - heading [level=2] [ref=e330]:
          - text: Benefits
          - strong [ref=e332]: Was wir Dir bieten
        - paragraph [ref=e334]:
          - strong [ref=e335]: Viele Wege für Deine Zukunft
          - text: Bei uns bekommt jeder die Chance, in bereichsübergreifenden Projekten die Zukunft des Unternehmens aktiv mitzugestalten und kreativ zu sein. Wenn Du bei Schäfer Shop in einem Beruf startest, wirst Du nicht zwangsläufig immer in diesem arbeiten – es sei denn natürlich, Du möchtest. Du suchst neue Herausforderungen? Wir unterstützen Dich dabei, diese auch zu finden.
          - strong [ref=e336]: Individuelle Förderung
          - text: Wir sind stolz auf unsere Kolleg:innen und wollen jeden individuell fördern. Deshalb führen wir regelmäßig Mitarbeitergespräche, suchen den Austausch in interaktiven Fragerunden und bieten Dir unterschiedliche Schulungen und Weiterbildungen.
