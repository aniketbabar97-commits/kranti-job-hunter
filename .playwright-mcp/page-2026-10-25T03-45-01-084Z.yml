    - generic [ref=f14e211]:
      - paragraph [ref=f14e212]: We’re looking for people with drive, courage, and the will to achieve great things.
      - paragraph [ref=f14e213]: You want to grow fast – we offer the environment to make it happen. With responsibility from day one, genuine trust, honest feedback, and a team that challenges and supports you.
      - paragraph [ref=f14e214]: What matters most is how determined you are to learn, take ownership, and push yourself beyond your limits. Technology and Artificial Intelligence are our tools – our true drive is delivering real value to our customers.
      - paragraph [ref=f14e215]: That’s why we work with an innovation mindset, make quick decisions, and continuously improve. We embrace change with flexibility, curiosity, and the readiness to think in new ways at any time.
      - paragraph [ref=f14e216]: "And most importantly: Our CHECKitos pull together – on site and side by side. They support each other, share knowledge, give feedback, and celebrate success together."
      - paragraph [ref=f14e217]: CHECK24 is for everyone who wants to create. Not someday. Now.
