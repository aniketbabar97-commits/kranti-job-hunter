      - generic [ref=f52e30]:
        - generic [ref=f52e31]:
          - generic [ref=f52e32]: Produktdaten, Assets und Content fließen bei dir nicht irgendwie, sondern genau dorthin, wo sie hingehören? Dann bring mit uns die digitalen Produktwelten großer Marken in Form.Zur Verstärkung unseres Projektmanagement-Teams an den Standorten Leinfelden-Echterdingen und Neustetten (bei Rottenburg am Neckar) suchen wir zum nächstmöglichen Zeitpunkt Consultants und Projektmanager*innen (m/w/d) in Vollzeit.
          - generic [ref=f52e33]: Bei uns berätst und steuerst du Projekte rund um Product Information Management, Digital Asset Management und Content Management für Konzerne und große Mittelständler, unter anderem aus Automotive, Industrie und Handel. Du bist die Brücke zwischen Fachbereich, Technik und Dienstleistern und sorgst dafür, dass aus komplexen Systemlandschaften saubere, international ausgerollte Lösungen werden.
          - generic [ref=f52e34]: Dabei arbeitest du in gemischten Teams mit unseren Kolleg*innen in Belgrad. Dank unseres hybriden Arbeitsmodells kombinierst du flexible Remote-Tage mit persönlicher Zusammenarbeit im Office. Die Position ist zunächst auf 2 Jahre befristet.
        - generic [ref=f52e37]:
          - generic [ref=f52e38]: Wann?
          - generic [ref=f52e39]: jetzt
      - generic [ref=f52e43]:
        - generic [ref=f52e44]:
          - strong [ref=f52e45]: "Deine Aufgaben:"
          - list [ref=f52e46]:
            - listitem [ref=f52e47]: Beratung unserer Kunden bei Auswahl, Einführung, Weiterentwicklung und Integration von PIM- und DAM-Systemen
            - listitem [ref=f52e48]: Aufnahme und Analyse von Anforderungen gemeinsam mit Fachbereichen, Übersetzung in Konzepte, User Stories und Datenmodelle
            - listitem [ref=f52e49]: Planung, Steuerung und Koordination von Projekten inklusive Zeit-, Budget- und Ressourcenplanung
            - listitem [ref=f52e50]: Gestaltung von Content- und Asset-Workflows, Rechte- und Rollenkonzepten sowie Datenflüssen zwischen den Systemen
            - listitem [ref=f52e51]: Führung und Koordination von Projektteams an unseren deutschen Standorten und in Belgrad
            - listitem [ref=f52e52]: Transparentes Reporting an Kunden, Management und Projektteam
            - listitem [ref=f52e53]: Aktive Rolle in agilen Teams, als Product Owner, Scrum Master oder klassische Projektleitung, je nachdem, was das Projekt braucht
