        - heading "E-Commerce Developer / Projektleiter (m/w/d) in Festanstellung" [level=1] [ref=f32e175]
        - generic [ref=f32e176]:
          - paragraph [ref=f32e177]: "Wir suchen:"
          - heading "E-Commerce Developer / Projektleiter (m/w/d)" [level=1] [ref=f32e178]
          - paragraph [ref=f32e179]:
            - text: Zur Entwicklung eines neuen
            - strong [ref=f32e180]: E-Commerce-Systems
            - text: (Shop, Warenwirtschaft, CMS) und
            - strong [ref=f32e181]: zur Neuentwicklung von Software-Modulen
            - text: suchen wir
            - strong [ref=f32e182]: in Festanstellung
            - text: eine/n erfahrene/n
            - strong [ref=f32e183]: E-Commerce Developer
            - text: ", der/die sowohl tiefgehendes technisches Know-how als auch organisatorische Fähigkeiten mitbringt."
          - heading "Ihre Aufgaben" [level=3] [ref=f32e184]
          - list [ref=f32e185]:
            - listitem [ref=f32e186]:
              - strong [ref=f32e187]: Neuentwicklung des Shopsystems
              - text: (Shopware 6 oder Magento) in enger Kooperation mit einer Agentur.
            - listitem [ref=f32e188]:
              - strong [ref=f32e189]: Anbindung
              - text: "an ein Warenwirtschaftssystem nach Wahl (bidirektionaler Datenaustausch: Artikel, Lager, Bestellungen)."
            - listitem [ref=f32e190]:
              - strong [ref=f32e191]: Implementierung
              - text: und Entwicklung eines branchenspezifischen CMS zur Verwaltung von Produkt-, Auftrags- und Grafikdaten-Prozessen.
            - listitem [ref=f32e192]:
              - strong [ref=f32e193]: Projektleitung
              - text: ": von der Anforderungsanalyse über Entwicklung, Qualitätssicherung und Go-Live bis zum laufenden Betrieb und der Vermarktung selbst erstellter Komponenten."
            - listitem [ref=f32e194]:
              - strong [ref=f32e195]: Weiterentwicklung
              - text: der eigens entwickelten CMS-Module, mit der Perspektive, bei erfolgreicher Etablierung eine eigene Unternehmens-Unit dafür aufzubauen und zu leiten.
          - heading "Ihr Profil – gefragte Skills und Erfahrungen" [level=3] [ref=f32e196]
          - list [ref=f32e197]:
            - listitem [ref=f32e198]:
              - strong [ref=f32e199]: Fundierte Programmierkenntnisse
            - listitem [ref=f32e200]:
              - strong [ref=f32e201]: PHP
              - text: (idealerweise Erfahrung mit Frameworks oder Plugin-Entwicklung für Shopware/Magento).
            - listitem [ref=f32e202]:
              - strong [ref=f32e203]: Frontend-Technologien
              - text: ": HTML5, CSS3, JavaScript, ggf. JS-Frameworks (Vue.js, React o. Ä.)."
            - listitem [ref=f32e204]:
              - strong [ref=f32e205]: Datenbank-Know-how
              - text: ": Souveräner Umgang mit SQL (Erstellung, Optimierung komplexer Datenstrukturen)."
            - listitem [ref=f32e206]: Umgang mit Versionsverwaltung (Git) und Verständnis moderner Software-Architekturen.
            - listitem [ref=f32e207]:
              - strong [ref=f32e208]: E-Commerce- und CMS-Erfahrung
            - listitem [ref=f32e209]:
              - strong [ref=f32e210]: Shopware 6
              - text: oder
              - strong [ref=f32e211]: Magento
              - text: ": Entwicklung von Themes, Plugins und Schnittstellen."
            - listitem [ref=f32e212]:
              - strong [ref=f32e213]: CMS-Systeme
              - text: "(WordPress, TYPO3, Drupal o. Ä.): Vertrautheit mit der Verwaltung produkt- und auftragsbezogener Inhalte."
            - listitem [ref=f32e214]:
              - strong [ref=f32e215]: Workflow-Design
              - text: ": Erfahrung bei der Abbildung von Freigabe- und Kollaborationsprozessen (z. B. für Grafikdaten)."
            - listitem [ref=f32e216]:
              - strong [ref=f32e217]: Systemintegration & Schnittstellen
            - listitem [ref=f32e218]:
              - strong [ref=f32e219]: Bidirektionale Anbindung
              - text: von Warenwirtschaftssystemen (Artikel, Bestände, Bestellungen).
            - listitem [ref=f32e220]:
              - text: Erfahrung mit
              - strong [ref=f32e221]: REST-, SOAP-APIs
              - text: und Webhooks.
            - listitem [ref=f32e222]:
              - text: Fähigkeit zur
              - strong [ref=f32e223]: Fehleranalyse
              - text: und -behebung bei Schnittstellen und Datenflüssen.
            - listitem [ref=f32e224]:
              - strong [ref=f32e225]: Usability, User Experience & Conversion-Optimierung
            - listitem [ref=f32e226]:
              - text: Grundlegendes
              - strong [ref=f32e227]: UX/UI-Verständnis
              - text: ", um den Shop und das CMS benutzerfreundlich zu gestalten."
            - listitem [ref=f32e228]:
              - text: Erfahrung mit
              - strong [ref=f32e229]: A/B-Testing
              - text: und
              - strong [ref=f32e230]: Conversion-Optimierung
              - text: .
            - listitem [ref=f32e231]:
              - text: Idealerweise vertraut mit
              - strong [ref=f32e232]: SEO-Basics
              - text: und Analyse-Tools (Google Analytics, Matomo).
            - listitem [ref=f32e233]:
              - strong [ref=f32e234]: Projektmanagement und Teamführung
            - listitem [ref=f32e235]:
              - text: Erfahrung in der
              - strong [ref=f32e236]: Koordination externer Agenturen
              - text: und der Zusammenarbeit mit internen Abteilungen (IT, Grafik, Vertrieb).
            - listitem [ref=f32e237]:
              - text: Anwendung gängiger
              - strong [ref=f32e238]: Projektmanagement-Methoden
              - text: (agil oder klassisch) für eine strukturierte Arbeitsweise.
            - listitem [ref=f32e239]:
              - strong [ref=f32e240]: Kommunikationsstärke
              - text: ": Fähigkeit, technische Anforderungen verständlich aufzubereiten und verschiedene Stakeholder einzubeziehen."
            - listitem [ref=f32e241]:
              - strong [ref=f32e242]: Kaufmännisches Verständnis & Wachstumsstrategie
            - listitem [ref=f32e243]:
              - text: Grundkenntnisse in
