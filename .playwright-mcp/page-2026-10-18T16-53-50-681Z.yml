          - generic [ref=f15e66]:
            - heading "Senior Consultant | SAP CX (all genders)" [level=1] [ref=f15e68]
            - img "Senior Consultant | SAP CX (all genders), 1. Bild" [ref=f15e70]
          - generic [ref=f15e71]:
            - heading "IT mit Leidenschaft und Leidenschaft für IT" [level=2] [ref=f15e72]
            - generic [ref=f15e73]:
              - generic [ref=f15e74]: Du suchst nach einer Möglichkeit, deine Begeisterung für Technologie in einem inspirierenden Umfeld einzubringen? Werde Senior Consultant (all genders) bei cronos! Bei uns kannst du Verantwortung übernehmen und gemeinsam mit uns wachsen, in einem Umfeld voller Vielfalt, Innovation und Wertschätzung.
              - strong [ref=f15e77]: Wer wir sind
              - generic [ref=f15e78]: Gestalte die digitale Zukunft – werde Teil der cronos Gruppe! Die cronos Gruppe ist seit über 30 Jahren ein führender IT-Dienstleister und Berater für digitale Innovationen. Mit unserer Leidenschaft für IT, Expertise in vielfältigen Branchen und einem klaren Fokus auf Qualität unterstützen wir unsere Kund:innen bei der digitalen Transformation. Unsere Unternehmensgruppe umfasst Spezialisten in den Bereichen Customer Experience, Automatisierung, Digital Consulting, IT-Management und innovative Services – und genau hier kommst du ins Spiel!
          - generic [ref=f15e79]:
            - heading "Deine Aufgaben" [level=2] [ref=f15e80]
            - list [ref=f15e82]:
              - listitem [ref=f15e83]: "Du bist verantwortlich für die Einführung von Lösungen in folgenden Umfeldern: SAP Sales Cloud, SAP Service Cloud, SAP CI (BTP), SAP S/4HANA Customer Engagement, SAP CRM oder SAP Emarsys"
              - listitem [ref=f15e84]: Du erstellst individuelle Webapplikationen in der SAP Business Technology Platform (BTP), die auf die spezifischen Bedürfnisse unserer Kund:innen zugeschnitten sind
              - listitem [ref=f15e85]: Du erstellst und implementierst Schnittstellen, die eine reibungslose Datenübertragung zwischen verschiedenen Systemen gewährleisten und die Integration von SAP-Lösungen in bestehende IT-Landschaften unterstützen
              - listitem [ref=f15e86]: Du agierst in unseren Kundenprojekten als Teilprojektleiter:in, technische:r Entwicklungsverantwortliche:r oder Entwickler:in
          - generic [ref=f15e87]:
            - heading "Dein Profil" [level=2] [ref=f15e88]
            - list [ref=f15e90]:
              - listitem [ref=f15e91]: Abgeschlossenes MINT-Studium oder Berufsausbildung und bereits mehrjährige (mindestens 3 Jahre) Berufserfahrung sowie mehrjährige Projekterfahrung in der Einführung von SAP CX Softwarelösungen
              - listitem [ref=f15e92]: "Kenntnisse in einem der folgenden Bereiche: SAP Sales Cloud, SAP Service Cloud, SAP CI (BTP), SAP S/4HANA Customer Engagement, SAP CRM oder SAP Emarsys"
              - listitem [ref=f15e93]: Motivation, dich in neue Themenbereiche einzuarbeiten sowie Interesse an der Energieversorgungsbranche
              - listitem [ref=f15e94]: Kommunikationsstärke sowie eine ausgeprägte Beratungskompetenz und hohe Kundenorientierung
              - listitem [ref=f15e95]: Ausübung der Tätigkeit überwiegend in deinem Mobile Office oder von einem unserer cronos Standorte. Bei Bedarf sind Reisen zu unseren Kund:innen innerhalb des deutschsprachigen Raums eine willkommene Abwechslung
              - listitem [ref=f15e96]: Sehr gute Deutschkenntnisse in Wort und Schrift für direkten Kundenkontakt
          - generic [ref=f15e97]:
            - heading "Deine Benefits" [level=2] [ref=f15e98]
            - list [ref=f15e100]:
              - listitem [ref=f15e101]: "Onboarding: Es erwarten dich eine umfängliche Einarbeitung, Ausbildung und Events gemeinsam mit vielen anderen cronologen:innen."
              - listitem [ref=f15e102]: "Mobilität: Mit unserer Reisestelle und Benefits, wie z.B. Dienstwagen, 1. Klasse Bahnticket und Jobrad bleibst du sowohl geschäftlich als auch privat mobil."
              - listitem [ref=f15e103]: "Flexibilität: Dich erwartet ein gesunder Mix aus Projektarbeit bei unseren Kund:innen vor Ort, Office-Arbeit am nächstgelegenen cronos Standort und Remote-Anteil aus deinem Mobile Office."
              - listitem [ref=f15e104]: "Theorie & Praxis: Learning on the Job erweitert durch E-Learning-Angebote, Weiterbildungen und Zertifizierungen."
              - listitem [ref=f15e105]: "Ausstattung: High End IT-Ausstattung von Lenovo, Apple und Samsung."
              - listitem [ref=f15e106]: "kununu: „Most Wanted Employer“ und ”Top Company” seit 2022 für außergewöhnliche Unternehmenskultur mit Open Door Policy, Mentoring und flachen Hierarchien."
              - listitem [ref=f15e107]: Monatlicher 50€ hrmony Gutschein für Fitness-Center, Streaming, Shopping und vieles mehr.
          - generic [ref=f15e108]:
            - heading "Dein Team" [level=2] [ref=f15e109]
            - generic [ref=f15e111]:
              - text: Du wirst Teil des Marktführers für Customer Experience! Bei der
              - strong [ref=f15e112]: cronos customer experience
              - text: dreht sich alles um die Entwicklung und Implementierung innovativer Lösungen für Service-, Marketing- und Vertriebsprozesse auf Basis von SAP-Technologien. Wir unterstützen unsere Kund:innen bei ihrer digitalen Transformation und setzen dabei auf Expertise, Qualität und Kundenzufriedenheit.
