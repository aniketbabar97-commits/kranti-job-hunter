            - paragraph [ref=f1e53]: Die HUBER SE entwickelt, fertigt und vertreibt Maschinen und Anlagen für die kommunale und industrielle Wasser-/Abwasserreinigung sowie Schlammaufbereitung. Weltweit bieten wir mit unseren mehr als 60 Repräsentanzen innovative Produkte und Lösungen an.
            - paragraph [ref=f1e54]: Sie möchten mit Ihren Stärken zum Schutz eines der wertvollsten Rohstoffe – dem Wasser – beitragen? Gleichzeitig legen Sie Wert auf einen gesicherten Arbeitsplatz sowie eine langfristige Perspektive in einem wachstumsorientierten familiengeführten Unternehmen?
