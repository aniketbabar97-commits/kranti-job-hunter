    - paragraph [ref=e267]: Unsere Bereiche
    - list [ref=e271]:
      - listitem [ref=e272]:
        - generic [ref=e274]:
          - paragraph [ref=e277]: CONSULTING
          - paragraph [ref=e281]: Wir beraten unsere Kunden hinsichtlich E-Commerce Strategien und im Rahmen verschiedener Projekte. Das Consulting-Team leitet diese und koordiniert mit unseren Webdesignern und Developern die Umsetzung. Unsere Consultants wissen stets über die neusten Trends und Entwicklungen im E-Commerce Bescheid.
      - listitem [ref=e282]:
        - generic [ref=e284]:
          - paragraph [ref=e287]: DESIGN
          - paragraph [ref=e291]: Unsere kreativen Köpfe im Team konzipieren und gestalten tagtäglich unvergessliche Nutzererlebnisse. Sie sind die Ansprechpartner, wenn komplizierte Funktionen einfach visualisiert werden sollen. Sie wissen genau, was ein toller Shop benötigt und sind die Experten, wenn etwas richtig gut aussehen soll.
      - listitem [ref=e292]:
        - generic [ref=e294]:
          - heading "DEVELOPMENT" [level=3] [ref=e297]
          - paragraph [ref=e301]: Bei Fragen rund um die technische Realisierung ist es die Aufgabe unserer Developer, innovative Lösungen zu entwickeln, die sich sehen lassen können. Als Experten des technischen Bereiches arbeiten sie dabei eng mit unseren Consultants und Designern zusammen um State of the Art E-Shops zu erstellen.
    - generic [ref=e308]:
      - generic [ref=e309]:
        - paragraph [ref=e311]: So lernen wir uns kennen
        - paragraph [ref=e313]: Unser Bewerbungsprozess
      - generic [ref=e315]:
        - generic [ref=e316]:
          - heading [level=3] [ref=e318]:
            - strong [ref=e319]: "01"
          - paragraph [ref=e321]: Vorauswahl
          - paragraph [ref=e323]: Wenn deine Unterlagen gut zu uns passen, laden wir dich zu einem virtuellen Erstinterview mit Imke, unserer People & Culture Managerin, ein. So können wir uns besser kennenlernen und dir mehr zur Position und zu ABRIO erzählen.
        - generic [ref=e324]:
          - heading [level=3] [ref=e326]:
            - strong [ref=e327]: "02"
          - paragraph [ref=e329]: Interview
          - paragraph [ref=e331]: Nach einem erfolgreichen Erstgespräch folgt ein ca. 60-minütiges zweites Gespräch, das von einer Person aus deinem künftigen Team geführt wird. Dabei geht es vor allem um deine fachlichen Kompetenzen, deine Erwartungen und Wünsche und darum, ob wir zueinander passen.
        - generic [ref=e332]:
          - heading [level=3] [ref=e334]:
            - strong [ref=e335]: "03"
          - paragraph [ref=e337]: Kennenlernen
          - paragraph [ref=e339]: Zum Abschluss des Prozesses laden wir dich zu uns ins Office ein. So lernst du unser Team, unsere Arbeitsweise und unser Büro persönlich kennen und wir können gemeinsam prüfen, ob es fachlich und menschlich passt.
        - generic [ref=e340]:
          - heading [level=3] [ref=e342]:
            - strong [ref=e343]: "04"
          - paragraph [ref=e345]: Feedback
          - paragraph [ref=e347]: Nachdem wir uns zuletzt noch mit einer Referenzperson deiner Wahl ausgetauscht haben, senden wir dir deinen Arbeitsvertrag zu. Für Rückfragen aller Art stehen wir dir weiterhin stets zur Verfügung.
    - generic [ref=e351]:
      - heading "Das macht uns aus" [level=1] [ref=e353]
      - heading "Das sagt unser Team" [level=2] [ref=e355]
      - paragraph [ref=e357]: Authentizität ist einer unserer Core Values. Wie wir diesen Wert im Alltag leben, zeigen am besten die Menschen, die ABRIO ausmachen.
      - list [ref=e360]:
        - listitem [ref=e361]:
          - generic [ref=e363]:
            - img "Portrait von Nicholas Ozgowicz, Senior Consultant Digital Marketing & Sales bei ABRIO GmbH" [ref=e365]
            - generic [ref=e367]:
              - paragraph [ref=e369]: Nicholas
              - paragraph [ref=e371]: Senior Consultant Digital Marketing & Sales
              - paragraph [ref=e373]: Ich fühle mich schon seit dem ersten Tag bei ABRIO sehr wohl! Man hat viele Möglichkeiten seine Kompetenzen als Consultant zu erweitern und sich stetig zu verbessern. Zusätzlich wird man in seinen Expertenfeldern absolut wertgeschätzt. Des Weiteren ist durch das junge & dynamische Team der Zusammenhalt besonders stark.
    - generic [ref=e377]:
      - generic [ref=e379]:
        - heading "Im Herzen Frankfurts" [level=2] [ref=e380]
        - paragraph [ref=e381]: Mitten in Frankfurt am Main werden unsere Ideen Wirklichkeit! Die Lage in der Mitte Deutschlands ermöglicht es uns, mühelos Kunden im gesamten Land zu besuchen und ist gleichzeitig für unsere Teammitglieder, die alle in der Umgebung wohnen, gut zu erreichen!
        - paragraph [ref=e382]: Frankfurt ist eine Stadt mit einem reichen kulturellen Angebot und zahlreichen Möglichkeiten. Der lebhafte Geist des Unternehmertums ist immer wieder spannend, genau wie der Austausch mit jungen Unternehmerinnen und Unternehmern. Wir sind stolz, ein Teil dieser pulsierenden Stadt zu sein.
