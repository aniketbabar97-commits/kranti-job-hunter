            - generic "Wie läuft das Onboarding ab?" [ref=e441] [cursor=pointer]
            - generic [ref=e443]:
              - paragraph [ref=e444]: Damit du gut bei ABRIO ankommst, begleiten wir dich von Anfang an mit einem klar strukturierten Onboarding. Schon vor deinem Start erhältst du alle wichtigen Informationen, damit du dir einen ersten Überblick über unsere Tools, Technologien und Arbeitsweise verschaffen kannst.
              - paragraph [ref=e445]: An deinem ersten Tag lernst du in lockerer Atmosphäre erste Kolleg:innen aus den verschiedenen Teams kennen. Außerdem erhältst du dein Arbeitsgerät, richtest es mit unserer Checkliste ein und besprichst alle administrativen und organisatorischen Themen.
              - paragraph [ref=e446]: Deine Integration unterstützen wir zusätzlich durch einen Onboarding-Buddy, einen individuellen Onboardingplan, den du gemeinsam mit deiner Führungskraft abstimmst, regelmäßige Check-ins sowie fachliche Onboarding-Sessions. So weißt du jederzeit, was als Nächstes ansteht, an wen du dich wenden kannst und wie du Schritt für Schritt in deine Rolle hineinwächst.
