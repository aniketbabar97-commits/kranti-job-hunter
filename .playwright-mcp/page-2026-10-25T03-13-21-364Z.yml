    - generic [ref=e255]:
      - paragraph [ref=e257]: Du konntest deine gewünschte Stelle nicht finden?
      - paragraph [ref=e259]: Wir sind immer auf der Suche nach neuen Talenten. Vielleicht finden wir auch etwas für dich. Gerne nehmen wir eine Initiativbewerbung zu deiner gesuchten Stelle entgegen.
