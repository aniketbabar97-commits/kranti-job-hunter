      - paragraph [ref=e158]: 6 Gründe, Teil von ABRIO zu werden
      - generic [ref=e159]:
        - paragraph [ref=e160]: ABRIO ist eine führende E-Commerce Beratung im Bereich Shopify. Je nach Qualifikation und Interesse findest du bei uns deinen passenden Platz – entweder im Consulting, Design oder Development.
        - paragraph [ref=e161]: Was ABRIO besonders macht? Wir zeigen dir 6 Gründe, warum du bei uns richtig bist.
    - generic [ref=e165]:
      - generic [ref=e167]:
        - img "Ownership Icon" [ref=e169]
        - generic [ref=e171]:
          - heading "Ownership" [level=3] [ref=e173]
          - paragraph [ref=e175]: "Jede Rolle hat bei uns direkten Impact. Ob erste Praxiserfahrung, Berufseinstieg oder mehrjährige Erfahrung: Deine Arbeit trägt sichtbar zum Erfolg unserer Kundenbei. In unserem wachsenden Unternehmen übernimmst du Verantwortung und gestaltest mit, wie wir zusammenarbeiten und uns weiterentwickeln."
      - generic [ref=e177]:
        - img "Beruf Weiterbildung Icon" [ref=e179]
        - generic [ref=e181]:
          - heading "Weiterentwicklung" [level=3] [ref=e183]
          - paragraph [ref=e185]: Wir hinterfragen Bestehendes, denken Lösungen weiter und wachsen gemeinsam als Team. Deshalb schaffen wir mit modernen Technologien, individuellem Weiterbildungsbudget, Zertifizierungen und passenden Lernformaten Raum für deine Entwicklung.
      - generic [ref=e187]:
        - img "Team Zusammenhalt Icon" [ref=e189]
        - generic [ref=e191]:
          - heading "Team" [level=3] [ref=e193]
          - paragraph [ref=e195]: Professionell im Anspruch, persönlich im Miteinander. Unser interdisziplinäres Team verbindet Professionalität mit persönlichem Austausch, Offenheit und Spaß – im Projektalltag genauso wie bei regelmäßigen Team- und After-Work-Events.
      - generic [ref=e197]:
        - img "Full Service Icon" [ref=e199]
        - generic [ref=e201]:
          - heading "Vergütung" [level=3] [ref=e203]
          - paragraph [ref=e205]: Wir belohnen Leistung. Bei uns gibt es eine angemessene Vergütung sowie attraktive Bonuszahlungen. Außerdem steigt deine Vergütung spätestens mit dem Sprung auf das nächste Karrierelevel.
      - generic [ref=e207]:
        - img "Work Smart Glühbirne Icon" [ref=e209]
        - generic [ref=e211]:
          - heading "Work Smart" [level=3] [ref=e213]
          - paragraph [ref=e215]: Gute Arbeit entsteht dort, wo Fokus, Austausch und Freiraum zusammenkommen. Deshalb setzen wir auf eine hybride Arbeitskultur, flexible Arbeitszeiten, 30 Tage Urlaub und Workation-Möglichkeiten. So kannst du Verantwortung übernehmen, konzentriert arbeiten und gleichzeitig Raum für das schaffen, was dir persönlich wichtig ist.
      - generic [ref=e217]:
        - img "Location Frankfurt Icon" [ref=e219]
        - generic [ref=e221]:
          - heading "Location" [level=3] [ref=e223]
          - paragraph [ref=e225]: "Unser Büro liegt im Herzen Frankfurts: modern ausgestattet, stylisch eingerichtet und nur rund 10 Gehminuten bzw. eine Haltestelle vom Frankfurter Hauptbahnhof entfernt. Damit bist du bestens angebunden – egal ob du aus Frankfurt kommst oder pendelst."
    - generic [ref=e229]:
      - generic [ref=e231]:
        - img "Kununu Logo mit Rationg von 4.7 Sternen in Weiß" [ref=e233]
        - paragraph [ref=e235]: Was unsere 6 Gründe im Alltag bedeuten, können unsere Mitarbeitenden am besten erzählen. Überzeug dich selbst auf Kununu – dort werden wir seit 5 Jahren in Folge als Top Company ausgezeichnet.
        - link "mehr erfahren" [ref=e236] [cursor=pointer]:
