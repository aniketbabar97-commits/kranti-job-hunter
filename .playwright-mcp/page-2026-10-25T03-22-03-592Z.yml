          - generic [ref=e58]:
            - heading "Über die TAROX AG" [level=2] [ref=e59]
            - paragraph [ref=e61]: Das Unternehmen TAROX zählt zu den führenden IT-Anbietern ganzheitlicher Lösungen und umfassender Produktfamilien im deutschsprachigen Raum. Die Entwicklung vom TAROX Eigenmarken-Hersteller und Distributor ausgewählter Ware von Technologie- und Weltmarktführern hin zum Komplettlösungsanbieter dient dabei einer ganzheitlichen Betreuung der Auftraggeber.Zum Tragen kommen dabei Markt-Erfahrung aus mehr als 30 Jahren und das Know-How aus den fünf Kompetenzfeldern TAROX Systeme, Data Cloud, Security und Distribution. Ziel der vielfältigen Unterstützung ist es, reibungslose Geschäftsprozesse in einem guten Preis-Leistungs-Verhältnis zu präsentieren, um die Wertschöpfung zu fördern und ein effizienteres Arbeiten zu ermöglichen.
          - generic [ref=e62]:
            - heading "Deine Aufgaben" [level=2] [ref=e63]
            - list [ref=e66]:
              - listitem [ref=e67]: Weiterentwicklung, technische Optimierung und Pflege unserer Shopware-6-Plattformen
              - listitem [ref=e68]: Entwicklung und Anpassung individueller Plugins, Erweiterungen und Schnittstellen
              - listitem [ref=e69]: Umsetzung neuer Funktionen, Features und Landingpages in direkter Zusammenarbeit mit dem Marketing-Team
              - listitem [ref=e70]: Technische Begleitung von Kampagnen, Produktlaunches und digitalen Marketingmaßnahmen
              - listitem [ref=e71]: Monitoring, Analyse und kontinuierliche Optimierung der Performance von Website und Shop
              - listitem [ref=e72]: Troubleshooting und schnelle, effiziente sowie lösungsorientierte Behebung technischer Herausforderungen
              - listitem [ref=e73]: Enge Zusammenarbeit mit den Fachbereichen Marketing, Vertrieb, Einkauf und Produktmanagement
              - listitem [ref=e74]: "Optional: Unterstützung bei der Weiterentwicklung unserer Corporate Website auf Basis von WordPress"
          - generic [ref=e75]:
            - heading "Das bringst Du mit" [level=2] [ref=e76]
            - list [ref=e79]:
              - listitem [ref=e80]: Mehrjährige Erfahrung in der Shopware-Entwicklung, idealerweise mit Shopware 6
              - listitem [ref=e81]: Sehr gute Kenntnisse in PHP, Symfony, Twig, MySQL, HTML, CSS und JavaScript
              - listitem [ref=e82]: Erfahrung in der Plugin-Entwicklung und bei API-Anbindungen
              - listitem [ref=e83]: Technisches Verständnis für E-Commerce-Prozesse, UX und Performance
              - listitem [ref=e84]: Eine strukturierte, eigenständige und lösungsorientierte Arbeitsweise
              - listitem [ref=e85]: Kommunikationsstärke und Freude an der Zusammenarbeit mit verschiedenen Fachbereichen
              - listitem [ref=e86]: Teamgeist, Zuverlässigkeit und Verantwortungsbewusstsein
          - generic [ref=e87]:
            - heading "Das bieten wir Dir" [level=2] [ref=e88]
            - generic [ref=e89]:
              - paragraph [ref=e90]: "Bei TAROX bekommst Du eine Arbeitsumgebung, in der Du wachsen und Dich entfalten kannst:"
              - list [ref=e91]:
                - listitem [ref=e92]: Als festes Mitglied unseres Marketing-Teams gestaltest Du die Weiterentwicklung unserer digitalen Plattformen aktiv mit und bringst Deine eigenen Ideen ein.
                - listitem [ref=e93]: Direkte Zusammenarbeit mit kreativen Teams, Kampagnenverantwortlichen und Produktmanagern
                - listitem [ref=e94]: Hoher Gestaltungsspielraum und echte Verantwortung
                - listitem [ref=e95]: Moderne Ausstattung, flexible Arbeitszeiten und Möglichkeiten zum Homeoffice
                - listitem [ref=e96]: Eine offene Unternehmenskultur, kurze Entscheidungswege und ein starkes Miteinander
                - listitem [ref=e97]: Ein sicherer Arbeitsplatz in einem erfolgreichen IT-Unternehmen
          - generic [ref=e98]:
            - heading [level=2]
            - generic [ref=e99]:
              - paragraph [ref=e100]: Du findest Dich in der Beschreibung wieder? Dann überzeuge uns von Deinen Fähigkeiten und sende uns Deine aussagefähigen Bewerbungsunterlagen.
              - paragraph [ref=e101]: Bitte berücksichtigen Sie, dass die TAROX AG und sämtliche Tochtergesellschaften keine unaufgefordert zugesandten Bewerbungsunterlagen von Personalvermittlungsagenturen akzeptieren. Wir arbeiten mit bevorzugten Anbietern zusammen und werden ohne entsprechende Rahmenvereinbarung keine Vergütungszahlungen an Personalvermittlungsagenturen vornehmen. Sollten wir ein Kandidatenprofil von einer Personalvermittlungsagentur erhalten, mit der keine Rahmenvereinbarung besteht, und dieser Kandidat zu einem späteren Zeitpunkt im Rekrutierungsprozess berücksichtigt oder eingestellt werden, entstehen dadurch keine Ansprüche auf Seiten der Personalvermittlungsagentur.
