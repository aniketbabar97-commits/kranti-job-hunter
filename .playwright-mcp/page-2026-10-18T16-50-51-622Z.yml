        - paragraph [ref=f27e41]: Unsere IT ist ein zentraler Treiber für die digitale Zukunft der CBR Fashion Group. In den Bereichen Infrastruktur, Anwendungsentwicklung, Data & Analytics, Security und Support gestalten wir gemeinsam Lösungen und treiben Innovationen voran. Offenheit, Verantwortung und die Möglichkeit, eigene Ideen einzubringen, prägen unsere Kultur und machen uns als Team erfolgreich.
