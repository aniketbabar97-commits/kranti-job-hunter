      - generic [ref=f27e47]:
        - heading "DAS ERWARTET DICH" [level=3] [ref=f27e48]
        - list [ref=f27e49]:
          - listitem [ref=f27e50]: Gestalte als fachliche Klammer unserer E-Commerce-IT die technologische Zukunft unseres digitalen Geschäfts und setze Impulse für die Weiterentwicklung unserer Commerce-Landschaft
          - listitem [ref=f27e51]: Entwickle gemeinsam mit Business und IT Strategien, Roadmaps und Lösungen, die unser Online Business nachhaltig voranbringen
          - listitem [ref=f27e52]: Analysiere Anforderungen aus den Fachbereichen, denke sie weiter und übersetze sie in zukunftsfähige Technologien, Systeme und Prozesse
          - listitem [ref=f27e53]: Treibe Themen rund um Shopsysteme, Marktplätze, OMS, ERP, moderne Commerce-Plattformen und Systemintegrationen aktiv voran
          - listitem [ref=f27e54]: Bewerte neue Technologien und KI Potenziale mit Blick auf ihren Mehrwert und begleite deren erfolgreiche Einführung
          - listitem [ref=f27e55]: Übernimm die Steuerung bereichsübergreifender Initiativen und bringe Strategie, Technologie und Umsetzung wirkungsvoll zusammen
          - listitem [ref=f27e56]: Freu dich auf viel Gestaltungsspielraum, hohe Sichtbarkeit und die Möglichkeit, die digitale Zukunft der CBR Fashion Group aktiv mitzuprägen
      - generic [ref=f27e57]:
        - heading "DAS BRINGST DU MIT" [level=3] [ref=f27e58]
        - list [ref=f27e59]:
          - listitem [ref=f27e60]: Mehrjährige Erfahrung im B2C E-Commerce sowie ein gutes Gespür für die Verbindung von Business und IT
          - listitem [ref=f27e61]: Tiefes Verständnis für Commerce-Systemlandschaften, Integrationen sowie Technologien rund um Online-Shops, OMS, ERP und digitale Plattformen
          - listitem [ref=f27e62]: Erfahrung in der Steuerung von Transformationsprojekten, Technologieinitiativen oder komplexen Digitalisierungsprojekten
          - listitem [ref=f27e63]: Kommunikationsstärke, Überzeugungskraft und die Fähigkeit, Menschen für gemeinsame Ziele zu begeistern und mitzunehmen
          - listitem [ref=f27e64]: Strategischen Weitblick für digitale Trends, Innovationen und AI sowie sehr gute Deutsch- und Englischkenntnisse
      - generic [ref=f27e65]:
        - heading "WORKING WITH US" [level=3] [ref=f27e66]
        - list [ref=f27e67]:
          - listitem [ref=f27e68]:
            - strong [ref=f27e69]: "Tech with Impact:"
            - text: Arbeite mit moderner Hardware und effizienten Tools, die dir optimale Performance bieten. Wir setzen auf digitale Prozesse und ein starkes Team, damit du deine Ideen einfach und wirkungsvoll umsetzen kannst
          - listitem [ref=f27e70]:
            - strong [ref=f27e71]: "Be yourself:"
            - text: Ob Sneaker oder Sakko, bei uns zählt nicht, was du trägst, sondern wer du bist. Komm so, wie du dich wohlfühlst und zeig, was in dir steckt
          - listitem [ref=f27e72]:
            - strong [ref=f27e73]: "Open Mindset:"
            - text: Dich erwartet ein Umfeld mit flachen Hierarchien und kurzen Entscheidungswegen, ein individuelles Onboarding mit inspirierenden Welcome Days sorgt dafür, dass du dich von Anfang an gut aufgehoben fühlst
          - listitem [ref=f27e74]:
            - strong [ref=f27e75]: "Workplace:"
            - text: Unser Headquarter bietet dir Sonnenterrassen und eine direkte Lage am Kirchhorster See. Dank optimaler Verkehrsanbindung bist du schnell bei uns, egal ob über die Autobahn oder mit öffentlichen Verkehrsmitteln
          - listitem [ref=f27e76]:
            - strong [ref=f27e77]: "Wear what we love:"
            - text: Profitiere von 50 % Rabatt auf unsere Marken CECIL, Street One, Street One Studio und Street One MEN und werde selbst zum Markenbotschafter unserer Looks
          - listitem [ref=f27e78]:
            - strong [ref=f27e79]: "#OneTEAM:"
            - text: Gemeinsam erreichen wir mehr, feiern Erfolge, wachsen an neuen Herausforderungen und stärken den Zusammenhalt bei regelmäßigen Events
      - generic [ref=f27e80]: Bereit für den nächsten Schritt? Werde Teil unseres Teams und bring deine Stärken ein, um die Erfolgsgeschichte der CBR Fashion Group weiterzuschreiben. Wir freuen uns auf deine Bewerbung!
