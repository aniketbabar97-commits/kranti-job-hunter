              - text: Das sind Deine Aufgaben
              - list [ref=e131]:
                - listitem [ref=e132]: Analyse von Anforderungen aus Fachbereichen wie Einkauf, Category Management oder Kundenservice und Entwicklung von technischen Lösungskonzepten.
