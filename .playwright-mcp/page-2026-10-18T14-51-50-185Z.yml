              - generic [ref=f13e118]:
                - paragraph [ref=f13e119]: "Deine Aufgabe bei CGM: Als führendes Unternehmen im Bereich Softwarelösungen für das Gesundheitswesen sind wir in 19 Ländern tätig und beschäftigen fast 9.000 engagierte Mitarbeitende. Du wirst in einem dynamischen und innovativen Umfeld arbeiten, das voller Möglichkeiten steckt. Mit Deinem Einsatz und Deiner Leidenschaft hast Du die Gelegenheit, einen nachhaltigen Unterschied zu machen."
                - paragraph [ref=f13e120]
                - paragraph [ref=f13e121]: "CGM Leverages AI: Wir suchen Menschen, die die Kraft von KI im eHealth-Umfeld spüren, den Wandel mitgestalten wollen und mit neugieriger Leidenschaft erkennen, wie Technologie Gesundheit smarter, einfacher und besser machen kann."
                - paragraph [ref=f13e122]
                - paragraph [ref=f13e123]: Gemeinsam gestalten wir das Gesundheitssystem der Zukunft. Werde Teil unserer Mission und mache den Unterschied – für eine Welt, in der Wissen Leben rettet!
                - paragraph [ref=f13e124]
                - paragraph [ref=f13e125]: Bist Du leidenschaftlich an zukunftsweisenden Produkten interessiert? Hast Du das Talent, Ideen in konkrete, wertschöpfende Lösungen umzusetzen und dabei immer das große Ganze im Blick zu behalten? Dann suchen wir genau Dich!
              - paragraph [ref=f13e127]
              - paragraph [ref=f13e129]:
                - generic [ref=f13e130]: "Deine Aufgaben:"
              - generic [ref=f13e131]:
                - list [ref=f13e132]:
                  - listitem [ref=f13e133]:
                    - paragraph [ref=f13e134]: Übernahme der strategischen Verantwortung für die Produktvision und -strategie unserer SAP Commerce Cloud Plattform (B2B) im Bereich Commerce und Partner Portal.
                  - listitem [ref=f13e135]:
                    - paragraph [ref=f13e136]:
                      - text: Sicherstellung eines reibungslosen Betriebs sowie kontinuierlicher Weiterentwicklung eines Shops, der auf der innovativen
                      - generic [ref=f13e137]: SilverCart-Technologie
                      - text: basiert.
                  - listitem [ref=f13e138]:
                    - paragraph [ref=f13e139]: Effiziente Aufnahme, Priorisierung und Pflege des Product Backlogs in enger Zusammenarbeit mit relevanten Stakeholdern.
                  - listitem [ref=f13e140]:
                    - paragraph [ref=f13e141]:
                      - text: Präzise
                      - generic [ref=f13e142]: Übersetzung von Business-Anforderungen
                      - text: in klar strukturierte User Stories und aussagekräftige Akzeptanzkriterien.
                  - listitem [ref=f13e143]:
                    - paragraph [ref=f13e144]: Fachliche Anleitung und Steuerung eines agilen Entwicklerteams (Scrum/Kanban), um einen nachhaltigen Mehrwert durch strategische Release-Planung und inkrementelle Verbesserungen zu gewährleisten.
                  - listitem [ref=f13e145]:
                    - paragraph [ref=f13e146]: Engagierte Zusammenarbeit mit UI/UX-Design, Marketing, Vertrieb, IT-Architektur sowie externen Partnern, inklusive Überwachung und Analyse relevanter KPIs zur Bewertung von Features und Releases, unter Berücksichtigung von Sicherheits-, Datenschutz- und Performance-Vorgaben.
                - paragraph [ref=f13e147]
                - paragraph [ref=f13e148]:
                  - generic [ref=f13e149]: "Dein Profil:"
              - list [ref=f13e151]:
                - listitem [ref=f13e152]:
                  - paragraph [ref=f13e153]: Mindestens 3 Jahre Berufserfahrung als Product Owner oder in einer ähnlichen Funktion im E-Commerce-Umfeld und Erfahrung in der erfolgreichen Umsetzung digitaler Projekte.
                - listitem [ref=f13e154]:
                  - paragraph [ref=f13e155]:
                    - text: Ein abgeschlossenes Studium, vorzugsweise an einer renommierten Universität, im Bereich
                    - generic [ref=f13e156]: Wirtschaftsinformatik, Betriebswirtschaft, E-Commerce
                    - text: oder einem verwandten Fachgebiet, das Deine akademische Exzellenz unterstreicht
                - listitem [ref=f13e157]:
                  - paragraph [ref=f13e158]: Fundierte Kenntnisse in SAP Commerce Cloud (Hybris), idealerweise ergänzt durch Erfahrung mit der SAP CX Suite.
                - listitem [ref=f13e159]:
                  - paragraph [ref=f13e160]: Sicherer Umgang mit agilen Methoden (Scrum, SAFe) und Tools wie Jira und Confluence.
                - listitem [ref=f13e161]:
                  - paragraph [ref=f13e162]:
                    - text: Ein gutes Verständnis für digitale Geschäftsmodelle, hohe Serviceorientierung, und Neugier für neue Webtechnologien, sowie s
                    - generic [ref=f13e163]: ehr gute Kommunikationsfähigkeit
                    - text: ", starkes"
                    - generic [ref=f13e164]: Stakeholder-Management
                    - text: – fließende Deutsch- und Englischkenntnisse sind Voraussetzung.
            - generic [ref=f13e165]:
              - generic [ref=f13e166]:
                - paragraph [ref=f13e167]
                - paragraph [ref=f13e168]:
                  - generic [ref=f13e169]: "Das kannst Du von uns erwarten:"
              - generic [ref=f13e172]:
                - list [ref=f13e173]:
                  - listitem [ref=f13e174]:
                    - paragraph [ref=f13e175]: "Entwicklung: Unsere Inhouse Academy und unser Portfolio aus externen Kooperationspartnern unterstützen dich in deiner Weiterentwicklung."
                  - listitem [ref=f13e176]:
                    - paragraph [ref=f13e177]: "Work-Life-Balance: Nutze unser Job-Bike-Leasing-Angebot, die Bezuschussung der Mitgliedschaft in einem kooperierenden Fitnessstudio und/oder unsere diversen Trainingsangebote, um den sportlichen Ausgleich zur Arbeit zu finden."
                  - listitem [ref=f13e178]:
                    - paragraph [ref=f13e179]: "Health: Einmal im Jahr bieten wir allen Mitarbeitenden verschiedene Gesundheitsangebote an unserem Health-Day."
                  - listitem [ref=f13e180]:
                    - paragraph [ref=f13e181]: "Attraktiver Arbeitsplatz: Entspanne und genieße Deine Pausen in einem modernen und komfortablen Bereich für alle Mitarbeitenden und optimiere Deine Arbeitsumgebung für den maximalen Komfort, indem Du unsere ergonomische Beratung sowie diverse Gestaltungsmöglichkeiten Deines Arbeitsplatzes in Anspruch nimmst."
                  - listitem [ref=f13e182]:
                    - paragraph [ref=f13e183]: "Events: Nimm an internen Veranstaltungen und Aktivitäten teil, diese finden regelmäßig vor Ort aber auch remote statt."
