      - 'heading "We are hiring: Senior Pimcore Developer" [level=2] [ref=f10e115]'
      - paragraph [ref=f10e117]: Du fühlst Dich als waschechter Pimconaut und bist bereit, die digitale Welt zu erobern? Dann haben wir ein gemeinsames Ziel! Werde jetzt Teil unseres Teams. Together we own the digital world!
      - paragraph [ref=f10e119]: Wir bieten Dir die Chance, Deine Expertise in nationale und internationale Projekte einzubringen und echte Mehrwerte im Rahmen der Digitalisierung zu schaffen. Es warten spannende Projekte bei namhaften Kunden wie Continental, Klett, Freudenberg, Aliaxis und weitere auf Dich. Teamwork steht dabei jederzeit im Fokus. Bei uns bist Du kein Freelancer, sondern arbeitest eng und bereichsübergreifend mit dem gesamten Team zusammen, um somit unseren Kunden perfekte Lösungen auszuliefern.
