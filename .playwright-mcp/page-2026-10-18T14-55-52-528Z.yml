          - generic [ref=f26e79]: "In unseren Projekten entwickeln wir zielgerichtete Lösungen für den Connected Commerce – neu, innovativ und immer in bestmöglicher Qualität für unsere Kunden. Auf Basis bewährter Technologien, hochwertiger Daten sowie moderner Prozesse verbinden wir Touchpoints nahtlos miteinander. So schafft ein begeistertes und engagiertes Team, gemeinsam mit unseren Kunden, individuell abgestimmte Nutzererlebnisse. Dabei entsteht es. Das unverwechselbare hmmh-Gefühl: Es macht einfach Spaß hier zu arbeiten. Jeden Tag aufs Neue. Versprochen."
