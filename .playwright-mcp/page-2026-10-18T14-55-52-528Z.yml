            - list [ref=f26e47]:
              - listitem [ref=f26e48]: Als SAP Commerce / hybris Developer analysierst Du in deinem Team Kundenanforderungen, erstellst technische Designs und entwickelst Softwarekomponenten auf Basis der SAP Commerce / hybris E-Commerce Plattform.
              - listitem [ref=f26e49]: Du integrierst neue und geänderte Komponenten in die Systemlandschaft und unterstützt das Team auch im Support und in der Qualitätssicherung.
              - listitem [ref=f26e50]: An wechselnden Herausforderungen hast Du Spaß und bist neugierig, Dir neue Themengebiete in einem tollen Team zu erarbeiten.
              - listitem [ref=f26e51]: Unsere Homeoffice-Regelung ermöglicht dir, selbst zu entscheiden, ob Du von zu Hause oder im Büro arbeitest.
