            - list [ref=f26e55]:
              - listitem [ref=f26e56]: Du bringst im Idealfall ein relevantes abgeschlossenes Studium oder gleichwertige Berufserfahrungen in der Software-Entwicklung (Java) mit.
              - listitem [ref=f26e57]: Durch Deine jahrelangen Erfahrungen als professionelle*r Entwickler*in und Dein Know-How der SAP Commerce / hybris commerce suite bist Du ein*e Experte*in auf dem Gebiet.
              - listitem [ref=f26e58]: Großen Wert legst Du auf "test first" und eleganten, wartbaren Code.
              - listitem [ref=f26e59]: Außerdem sprichst Du mind. auf C1-Niveau deutsch und bringst sichere Englischkenntnisse mit.
              - listitem [ref=f26e60]: Dein Profil rundest Du mit einer schnellen Auffassungsgabe, hohem technischen Verständnis und analytischen Fähigkeiten ab.
