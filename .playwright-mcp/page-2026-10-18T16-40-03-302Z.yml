          - paragraph [ref=e102]: "Your role:"
          - list [ref=e103]:
            - listitem [ref=e104]: Develop and execute an AI and automation roadmap for the Western Europe Amazon e-commerce function
          - list [ref=e105]:
            - listitem [ref=e106]: Support in building a future-proof e-commerce strategy to help Philips win in AI-driven shopping environments, including Amazon Rufus, Alexa Shopping, Agentic Commerce, GEO
            - listitem [ref=e107]: Define how Philips Personal Health products are discovered, compared, ranked, and recommended by AI shopping assistants, moving beyond traditional keyword search toward conversational and agentic commerce
            - listitem [ref=e108]: Develop automated reports and alerts covering sales, traffic, conversion, media efficiency, share of search, digital shelf quality, pricing, availability, and portfolio performance
            - listitem [ref=e109]: Use predictive analytics and machine learning to support promotion effectiveness, sales trend identification and early risk detection
            - listitem [ref=e110]: Drive adoption of AI-enabled tools and workflows by training users, documenting processes, embedding new ways of working, and supporting change management
            - listitem [ref=e111]: Establish responsible AI and data governance standards, ensuring data quality, transparency, compliance, and alignment with business objectives
            - listitem [ref=e112]: Lead test-and-learn initiatives to validate new AI e-commerce opportunities, measure business impact, and scale successful use-cases across Western Europe Amazon markets
          - paragraph [ref=e113]: "You're the right fit if you have experience in:"
          - list [ref=e114]:
            - listitem [ref=e115]: Working with Amazon Vendor Central, Seller Central, Amazon Ads, retail media, or digital shelf platforms such as Profitero or Flywheel Commerce Cloud
          - list [ref=e116]:
            - listitem [ref=e117]: Using AI tools, machine learning models, automation platforms, or predictive analytics
            - listitem [ref=e118]: Scripting computer applications
            - listitem [ref=e119]: Working with AI-driven search, recommendation engines or conversational / agentic commerce
            - listitem [ref=e120]: Building dashboards, automated reports, or business intelligence solutions
            - listitem [ref=e121]: Working with media optimization, keyword analysis, pricing analytics, demand forecasting, or content optimization
            - listitem [ref=e122]: Working across EU markets and cross-functional teams.
          - paragraph [ref=e123]: Preferred Certifications
          - paragraph [ref=e124]: Certifications in AI, machine learning, data analytics, automation, Amazon Ads, Google Analytics, Power BI, Tableau, Python, SQL, or cloud analytics platforms are a plus.
