        - generic [aria-hidden] [ref=e186]:
          - paragraph [ref=e187]: At Philips, we believe that every human matters. As a global health-tech leader, we focus on improving people’s health and wellbeing through meaningful innovation. The people who work here share our passion and are motivated to bring this purpose to life.
          - paragraph [ref=e188]
          - paragraph [aria-hidden] [ref=e189]: For more than 130 years, we have been creating technologies and innovations that improve people's lives and support healthcare practitioners. Headquartered in the Netherlands and operating in more than 100 countries globally, we focus our advanced technology and deep clinical and consumer insights on Precision Diagnosis, Image Guided Therapy, Enterprise Informatics, Monitoring/ Connected Care, Sleep & Respiratory Care and Personal Health.
          - paragraph [aria-hidden] [ref=e190]
          - paragraph [aria-hidden] [ref=e191]: Together, we deliver better care for more people because we believe that every human matters. That's why we're taking steps to create an environment where we acknowledge and embrace our differences and uniqueness and listen to and value each other's views. When people feel cared for and listened to, they bring their best qualities to work, leading to better collaboration, communication, innovation and success.
          - paragraph [aria-hidden] [ref=e192]: It is the policy of Philips to provide equal employment and advancement opportunities to all qualified employees and applicants for employment without regard to race, color, religion, sex, pregnancy/childbirth or related medical conditions, age, ethnic or national origin, sexual orientation, gender identity or expression, physical or mental disability, genetic information, citizenship status, veteran or military status, marital or domestic partner status or any other characteristic protected by law. As an equal opportunity employer, Philips is committed to fostering a culture where all are treated with respect and professionalism.
          - paragraph [aria-hidden] [ref=e193]
