    - main [ref=f14e62]:
      - generic [ref=f14e67]:
        - generic [ref=f14e79]:
          - paragraph [ref=f14e82]: Wir freuen uns auf Dich
          - generic [ref=f14e84]:
            - paragraph [ref=f14e85]: „Herzlich willkommen bei der QUIS AG! Wir entwickeln und implementieren seit über 20 Jahren innovative IT-Lösungen für mittelständische Unternehmen sowie Enterprise Kunden. Die Basis unseres Erfolgs steckt in den Köpfen unserer Mitarbeiter, deshalb bieten wir Raum für eigene Ideen und unterstützen eigenverantwortliches Handeln.
            - paragraph [ref=f14e86]: Die offene Unternehmenskultur ermöglicht jedem Mitarbeiter, seine Vorstellungen einzubringen und die Arbeit mitzugestalten. Wir verstehen uns als wertschätzender, transparenter Arbeitgeber und fördern die Zufriedenheit wie auch das Potential unserer Mitarbeiter. Bei Fragen stehen wir Ihnen gerne zur Verfügung. Wir freuen uns darauf, Dich in unserem Team begrüßen zu dürfen!“
        - paragraph [ref=f14e101]: Werde ein Teil von uns
        - generic [ref=f14e105]:
          - paragraph [ref=f14e110]: Ausbildungsangebote
          - paragraph [ref=f14e113]: Unter Bildung versteht man die umfassende Entwicklung menschlicher Fähigkeiten und Fertigkeiten während des ganzen Lebens. Die Bereitschaft zum lebenslangen Lernen ist ein wesentlicher Bestandteil der persönlichen Lebens- und Berufsperspektiven.
          - link "JETZT ENTDECKEN" [ref=f14e117] [cursor=pointer]:
            - /url: https://quis.ag/ausbildungsangebote/
        - generic [ref=f14e127]:
          - paragraph [ref=f14e130]: Studienangebote
          - paragraph [ref=f14e133]: Ein duales Studium ermöglicht es nicht nur Theorie zu büffeln, sondern die erlernten Inhalte in der Praxis anwenden zu können. So bringst du nicht nur dich selbst voran, sondern auch uns als Unternehmen. Mit innovativen Lösungen und immer nah am Markt, weißt du, was auf dich zukommt.
          - link "JETZT ENTDECKEN" [ref=f14e137] [cursor=pointer]:
            - /url: https://quis.ag/studienangebote/
        - paragraph [ref=f14e154]: Nicht das Richtige dabei?
        - generic [ref=f14e162]:
          - paragraph [ref=f14e165]: Initiativbewerbung
          - paragraph [ref=f14e168]: Sie sind bereit für neue Herausforderungen, haben aber bei unseren offenen Stellen keine passende Job-Ausschreibung gefunden? Dann senden Sie uns einfach Ihre Initiativbewerbung zu!
          - link "JETZT BEWERBEN" [ref=f14e172] [cursor=pointer]:
            - /url: https://quis.ag/initiativbewerbung/
        - paragraph [ref=f14e189]: Das gibt es alles zusätzlich bei uns
