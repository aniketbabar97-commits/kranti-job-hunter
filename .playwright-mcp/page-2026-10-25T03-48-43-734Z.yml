        - paragraph [ref=f12e56]:
          - text: We’re looking for a senior engineer to join our ambitious team of 10. Rather than a typical job spec, this is a brief story about our journey at
          - link "Mirra" [ref=f12e57] [cursor=pointer]:
            - /url: https://au.linkedin.com/company/try-with-mirra?trk=public_post-text
          - text: "and where we are heading. If it sounds like something you'd be interested in being a part of then continue reading and drop me or Michael an email with your CV. Almost 4 years ago, we had a hypothesis that if we moved the purchase decision from the checkout screen to the customers home, we could create a better way for people to shop that would also drive better outcomes for merchants. So we built a super lean app, no bells and whistles and got it in the hands of a few customers who had a problem and were keen to see if we could solve it for them. (those merchants are still customers today). My personal background is heavy in agile product development. Which essentially means that I build products empirically and use real feedback, data (and market data) to decide what to build and what not to build. Something is only valuable if it's solving a customer problem. Fortunately I have a team of rockstar engineers who decide how we build these epic things. Back to the story... we used those early versions of the app to test, learn and adapt the product ensuring that it was a) helping customers shop and b) adding commercial value to the merchants. It was. We kept building and pushing. What started to blow us away was the merchant data and shopper feedback. What we started to witness was that Mirra wasn't just bringing in new orders but something unique was happening. More first-time customers were converting and building bigger baskets. They were also using less discounts to convert. We then started to look at repeat purchase data and saw that customers purchasing via Mirra were buying again 1.6 x more than non-Mirra customers and in much shorter retention cycles. We build and ship fast. Not for the sake of shipping new code but to deliver value to our customers. What started as a single product business has now developed into a platform with three live products and a fourth launching soon. This is what we need:"
          - strong [ref=f12e58]: Deep ecommerce background
          - text: "Strong commercial Shopify experience: themes, apps, checkout, Storefront and Admin APIs, webhooks, app extensions Other platforms (BigCommerce, Magento, WooCommerce, Salesforce Commerce Cloud) are a plus Understands how data flows across storefront, OMS, WMS, 3PL, payments and post-purchase tools"
          - strong [ref=f12e59]: Operationally minded
          - text: "Builds systems that scale: self-serve onboarding, automated setup, support deflection Judges every feature by how it’s supported, adopted and how it improves the business Comfortable as the technical voice on merchant calls"
          - strong [ref=f12e60]: Strong full-stack engineer
          - text: Senior JavaScript,
          - link "Node.js" [ref=f12e61] [cursor=pointer]:
            - /url: http://Node.js?trk=public_post-text
          - text: "and React Experience with AWS and MongoDB, or similar Pragmatic: ships working solutions quickly Brings AI tooling learnings to the team and keeps evolving their workflow (Old pic - now fully remote)"
