      - generic [ref=f53e215]:
        - generic [ref=f53e216]:
          - heading "Starte deine Ausbildung mit Zukunft" [level=3] [ref=f53e217]
          - paragraph [ref=f53e219]: "Du willst ins Berufsleben starten und dabei etwas lernen, das dich wirklich weiterbringt? Wir bilden in verschiedenen Bereichen aus – praxisnah, mit persönlicher Begleitung und guten Übernahmechancen. Egal, ob im Markt, in der Logistik, in der IT oder im Büro: Bei L. Stroetmann bekommst du eine Ausbildung mit Zukunft. Mit uns gehst du deinen Weg."
          - link "Berufe entdecken & durchstarten!" [ref=f53e220] [cursor=pointer]:
            - /url: https://karriere.stroetmann.de/ausbildung-studium
        - img "Junge Frau im blauen Hemd lächelt freundlich und lädt dich zu einer Karriere in der Food & Beverage Branche ein." [ref=f53e227]
      - generic [ref=f53e235]:
        - img "Zwei Mitarbeitende aus der Lebensmittelbranche lächeln freundlich, einer trägt Arbeitskleidung, die andere hält eine Gemüsekiste." [ref=f53e238]
        - generic [ref=f53e239]:
          - heading "Dein Arbeitgeber in Münster und darüber hinaus" [level=3] [ref=f53e240]
          - paragraph [ref=f53e242]: Als Familienunternehmen packen wir gemeinsam an – seit 235 Jahren. Ob Fachkraft, Quereinsteiger oder Schulabgänger – bei Stroetmann findet jeder seinen Platz im Team. Wir fördern deine persönliche Entwicklung, bieten dir Stabilität in einer sich wandelnden Welt und begegnen dir auf Augenhöhe. Bei uns zählt jede Stimme, denn gemeinsam gestalten wir die Zukunft. Auch deine?
          - link "Entdecke, was uns ausmacht!" [ref=f53e243] [cursor=pointer]:
            - /url: https://karriere.stroetmann.de/wir
      - generic [ref=f53e256]:
        - heading "Unsere vielfältige Unternehmensgruppe" [level=3] [ref=f53e257]
        - paragraph [ref=f53e260]: "Bei L. Stroetmann ist alles miteinander verbunden. Unsere Unternehmensgruppe vereint starke Marken, die Hand in Hand arbeiten: Saatgut für die Landwirtschaft, Tiernahrung für zufriedene Haustiere, Produktion hochwertiger Lebensmittel, Logistik, die alles bewegt, und Märkte, die Menschen versorgen. Ein Kreislauf, der funktioniert – seit 235 Jahren. Entdecke die Vielfalt deiner Möglichkeiten und werde Teil unseres Erfolgs."
        - link "Jetzt mehr erfahren!" [ref=f53e261] [cursor=pointer]:
          - /url: https://karriere.stroetmann.de/ueberblickunternehmensbereiche
