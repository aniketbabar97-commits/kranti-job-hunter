        - heading "Dein Arbeitgeber im Münsterland und darüber hinaus." [level=2] [ref=f53e52]
        - paragraph [ref=f53e54]: Du suchst einen Job, der wirklich zu dir passt – mit Sicherheit, Zusammenhalt und echten Entwicklungschancen? Dann bist du bei L. Stroetmann richtig. Als Familienunternehmen mit 1.800 Mitarbeitenden und Hauptsitz in Münster sind wir in den Bereichen Lebensmittel, Agrar, Tiernahrung und Immobilien tätig. Bei uns findest du nicht nur einen Job – sondern deinen Lebensmittelpunkt.
