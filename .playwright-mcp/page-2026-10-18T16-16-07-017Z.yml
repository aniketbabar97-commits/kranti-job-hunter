            - generic [ref=f5e81]:
              - heading "Product Manager Kundenportal E-Commerce (m/w/d) Biberach" [level=1] [ref=f5e83]:
                - generic [ref=f5e84]: Product Manager Kundenportal E-Commerce (m/w/d)
                - generic [ref=f5e85]: Biberach
              - generic [ref=f5e86]:
                - 'heading "Faszinierendes schaffen: Ihre Aufgaben" [level=2] [ref=f5e87]'
                - list [ref=f5e88]:
                  - listitem [ref=f5e89]: – Analyse von Markt-, Technologie- und Kundenanforderungen sowie deren Überführung in die kontinuierliche Weiterentwicklung des digitalen Ersatzteilmanagements im Kundenportal „MyLiebherr“
                  - listitem [ref=f5e90]: – End‑to‑End‑Verantwortung für digitale Ersatzteil‑ und Serviceprozesse entlang der gesamten Customer Journey übernehmen
                  - listitem [ref=f5e91]: – Anforderungen aus Vertrieb, Service, Kunden und weiteren Stakeholdern erfassen, priorisieren und in klare Prozess‑ und Systemanforderungen übersetzen
                  - listitem [ref=f5e92]: – Digitale Prozesse, User Flows und Service Blueprints konzipieren und optimieren – mit Fokus auf Nutzererlebnis, Effizienz und Skalierbarkeit
                  - listitem [ref=f5e93]: – Integrierbare Digital-Commerce-Lösungen im Parts-Umfeld weiterentwickeln (z. B. Schnittstellen, EDI- und Punchout-Anbindungen)
                  - listitem [ref=f5e94]: – Roadmap im Themenfeld Parts Digital Commerce definieren, priorisieren und steuern in enger Abstimmung mit divisionsübergreifenden Stakeholdern
                  - listitem [ref=f5e95]: – Integration der Lösungen in die MyLiebherr-Plattform sowie bestehende Kunden‑ und Partnerökosysteme sicherstellen
                  - listitem [ref=f5e96]: – Nutzung, Prozessqualität und Geschäftswirkung anhand geeigneter KPIs analysieren und zur kontinuierlichen Optimierung und Priorisierung nutzen
                  - listitem [ref=f5e97]: – Kommunikation und Enablement unterstützen, z. B. durch Koordination von Schulungs‑ und Marketingmaterialien sowie Formaten für Stakeholder
                - 'heading "Stärken einbringen: Ihre Qualifikationen" [level=2] [ref=f5e98]'
                - list [ref=f5e99]:
                  - listitem [ref=f5e100]: – Abgeschlossenes Studium im Bereich Wirtschaftsingenieurwesen, Wirtschaftsinformatik, Betriebswirtschaft oder vergleichbare Qualifikation
                  - listitem [ref=f5e101]: – Mehrjährige Erfahrung im Produkt‑ oder Projektmanagement, idealerweise im Digital-Commerce-, After-Sales- oder Ersatzteilumfeld
                  - listitem [ref=f5e102]: – Fundiertes Verständnis von End‑to‑End‑Prozessen im Parts‑ und Servicegeschäft sowie Erfahrung in System‑ und Prozessintegration
                  - listitem [ref=f5e103]: – Ausgeprägtes unternehmerisches und kundenorientiertes Denken kombiniert mit einer strukturierten, konzeptionellen Arbeitsweise
                  - listitem [ref=f5e104]: – Erfahrung in der Steuerung interdisziplinärer Teams und komplexer Stakeholder‑Strukturen
                  - listitem [ref=f5e105]: – Kenntnisse in agilen Arbeitsweisen sowie im Umgang mit gängigen Tools (z. B. Jira, Confluence)
                  - listitem [ref=f5e106]: – Sehr gute Deutsch‑ und Englischkenntnisse in Wort und Schrift
                  - listitem [ref=f5e107]: – Bereitschaft zu gelegentlichen Dienstreisen
                - 'heading "Freiraum nutzen: Ihre Vorteile" [level=2] [ref=f5e108]'
                - list [ref=f5e109]:
                  - listitem [ref=f5e110]: – Flexibilität im Alltag durch hybride Arbeitszeitmodelle, 30 Tage Urlaub und Gleitzeit
                  - listitem [ref=f5e111]: – Unterstützung bei vielen Lebensereignissen mit Zuwendungen und Sonderurlaubstagen
                  - listitem [ref=f5e112]: – Faire und leistungsgerechte Vergütung
                  - listitem [ref=f5e113]: "– Finanzielle Unterstützung für den Arbeitsweg: mit dem regionalen Jobticket oder Fahrtkostenzuschuss"
                  - listitem [ref=f5e114]: "– Gemeinsam wachsen: mit unserem vielseitigen Schulungsprogramm"
                  - listitem [ref=f5e115]: "– Zusammen Großes erreichen: Kollegen auf der ganzen Welt"
                  - listitem [ref=f5e116]: – Teamspirit meets Raum für Kreativität
                  - listitem [ref=f5e117]: – Sich mit leckeren Gerichten aus regionalen Lebensmitteln unserem Betriebsrestaurant stärken
                  - listitem [ref=f5e118]: "– Gesund unterwegs sein: mit unserem Bike-Leasing"
                  - listitem [ref=f5e119]: "– Für Ihr Wohlbefinden und Ihre Zukunft: Betriebsarzt, Vergünstigungen für Sport- und Freizeitaktivitäten sowie betriebliche Altersvorsorge"
                - paragraph [ref=f5e120]: Haben wir Ihr Interesse geweckt? Dann freuen wir uns über Ihre Online-Bewerbung. Bei Fragen kontaktieren Sie bitte Franziska Wekenmann.
                - paragraph [ref=f5e121]:
                  - strong [ref=f5e122]: One Passion. Many Opportunities.
