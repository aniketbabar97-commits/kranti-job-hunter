                - generic [ref=f4e243]: "Immobilienmarkt Duisburg 2026: Mieten steigen, Wohnungen auf Rekordniveau, Häuser stabilisieren sich"
                - paragraph [ref=f4e248]: "Der Duisburger Immobilienmarkt zeigt sich im Herbst 2026 in robuster Verfassung, entwickelt sich aber nicht in allen Segmenten gleich. Die Mieten steigen seit 2018 ohne Unterbrechung, Eigentumswohnungen haben ihre kurze Preisdelle nach 2022 überwunden und erreichen neue Höchststände. Bestandshäuser liegen dagegen weiterhin unter ihrem Rekordniveau von 2022. Gemeinsam ist allen Segmenten: Objekte finden deutlich schneller einen Mieter oder Käufer als noch vor zwei Jahren. Wir haben die Angebotsdaten von Januar 2018 bis Oktober 2026 ausgewertet und ordnen die Prognosen bis Oktober 2027 ein."
