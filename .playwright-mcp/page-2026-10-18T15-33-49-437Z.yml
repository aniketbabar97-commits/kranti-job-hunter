      - generic [ref=f3e26]:
        - paragraph [ref=f3e27]: Los geht's in Ihre berufliche Zukunft! Profitieren Sie von unserer großen regionalen Auswahl in unserem Stellenmarkt. Wir beraten Sie gerne persönlich und freuen uns darauf, Sie kennenzulernen.
        - paragraph [ref=f3e28]: Aus Gründen der Lesbarkeit haben wir auf der gesamten Website eine Geschlechtsform (Mitarbeiter, Bewerber, etc.) gewählt. Wir freuen uns über Bewerbungen von Menschen aller Geschlechter!
        - paragraph [ref=f3e29]: Wie geht’s weiter? Sie erhalten in der Regel innerhalb von fünf Tagen eine Eingangsbestätigung Ihrer Bewerbung. Wenn diese nicht innerhalb dieser Zeit bei Ihnen eingehen sollte, melden Sie sich bitte bei uns, damit wir Ihren Bewerbungseingang prüfen können. Wenn Sie keine Absage erhalten, melden wir uns im nächsten Schritt bei Ihnen, sobald Ihr Bewerberprofil auf eine unserer ausgeschriebenen Stellen passt und vereinbaren einen Telefontermin mit Ihnen. Dieser Schritt kann mitunter etwas Zeit in Anspruch nehmen, denn auch wenn eine Stellenausschreibung augenscheinlich zu Ihrem Bewerberprofil zu passen scheint, liegen uns weitere Anforderungsparameter zu den Positionen vor, die zu einem Bewerberprofil passen müssen. Wenn Sie von uns zu einem Telefontermin eingeladen werden, lernen wir uns dort kennen und wir stellen Ihnen die für Sie infrage kommenden Positionen vor.
