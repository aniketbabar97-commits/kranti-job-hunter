                  - text: ) von mir mitgeteilte personenbezogene Daten (z.B. Angaben im Bewerbungsformular, in gesendeten Dateien und Nachrichten) mit der von Microsoft Azure bereitgestellten API KI-gestützt auswertet und bei sich speichert, um mich später wegen für mich passender Stellenangebote zu kontaktieren. Dabei werden meine Daten durch die Microsoft Ireland Operations Ltd. (Daten siehe
                  - link "Impressum" [ref=f2e94] [cursor=pointer]:
                    - /url: https://www.microsoft.com/en-ie/store/b/imprint
                  - text: ) im Auftrag der Vesterling AG nur innerhalb der EU verarbeitet. Ich willige ein, dass die Vesterling AG diese Daten pseudonymisiert potenziellen Arbeitgebern übermittelt, so dass keine Rückschlüsse auf meine Identität gezogen werden können. Zweck dieser Verarbeitung ist es, mir Stellenangebote bei potenziellen Arbeitgebern zu vermitteln. Eine Weitergabe meiner Daten an potenzielle Arbeitgeber erfolgt ansonsten erst dann, wenn ich hierin nochmals gesondert eingewilligt habe. Sofern ich „besondere Kategorien personenbezogener Daten“ nach Art. 9 DSGVO (z.B. Schwerbehinderteneigenschaft) mitgeteilt habe, bezieht sich meine vorstehende Einwilligung auch auf diese Daten.
              - generic [ref=f2e95]:
                - checkbox [ref=f2e96]
                - generic [ref=f2e97]:
                  - text: Ich willige ein, dass die Vesterling AG mir ihren Newsletter per E-Mail zusenden darf, um mich regelmäßig über passende Stellenangebote zu informieren.Mir ist bewusst, dass diese Einwilligungen freiwillig sind und ich kann sie ohne Angabe von Gründen verweigern, ohne dass ich deswegen Nachteile zu befürchten hätte. Ich kann meine Einwilligungen auch jederzeit widerrufen. Den Widerruf kann ich durch eine E-Mail an Welcome@Vesterling.com oder im Fall des Newsletters durch Klicken auf den „Abbestellen“-Link in der jeweiligen Newsletter-E-Mail erklären. Im Fall eines Widerrufs werden meine Daten unverzüglich gelöscht, es sei denn, es bestehen gesetzliche Aufbewahrungsfristen, die eine längere Speicherung anordnen, oder ich habe eine gesonderte Einwilligung in eine längere Speicherung erteilt. Weitere Informationen zur Verarbeitung meiner personenbezogenen Daten und meiner Rechte kann ich der
