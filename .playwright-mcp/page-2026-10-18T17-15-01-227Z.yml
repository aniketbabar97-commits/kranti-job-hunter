              - generic [ref=f36e91]:
                - paragraph [ref=f36e93]
                - heading "Als ein weltweit führender Polymerspezialist entwickelt REHAU moderne Materialien, Technologien und Services für die Zukunft. Unsere Kerntreiber sind die fünf Megatrends Digitalisierung, Individualisierung, Nachhaltigkeit, Mobilität und New Work. Wir gestalten Fortschritt für mehr Lebensqualität – gestalte mit!" [level=3] [ref=f36e94]
                - paragraph [ref=f36e95]
                - heading [level=1] [ref=f36e96]:
                  - strong [ref=f36e97]: IT Project Manager SAP Commerce (m/w/d)
                - paragraph [ref=f36e98]: am Standort Erlangen oder Rehau | ab Januar 2027 | Vollzeit | unbefristet | bis zu 50% Mobiles Arbeiten möglich
              - generic [ref=f36e100]:
                - generic [ref=f36e101]:
                  - heading "Deine Mission:" [level=2] [ref=f36e103]
                  - paragraph [ref=f36e105]: In einer zunehmend digitalen Welt sorgst Du dafür, dass unsere Kundenplattformen jeden Tag ein Stück besser werden. Du identifizierst Optimierungspotenziale, treibst Innovationen voran und entwickelst gemeinsam mit unseren internationalen Teams digitale Lösungen, die unsere Kunden begeistern, Prozesse vereinfachen und nachhaltigen Mehrwert schaffen.
                - generic [ref=f36e106]:
                  - heading "Deine Aufgaben:" [level=2] [ref=f36e108]
                  - list [ref=f36e110]:
                    - listitem [ref=f36e111]:
                      - paragraph [ref=f36e112]: Du gestaltest die strategische Weiterentwicklung unseres globalen Kundenportals und angrenzenden digitalen Lösungen auf Basis von SAP Commerce.
                    - listitem [ref=f36e113]:
                      - paragraph [ref=f36e114]: Du leitest internationale E-Commerce- und Digitalisierungsprojekte von der Anforderungsaufnahme bis zum erfolgreichen Rollout.
                    - listitem [ref=f36e115]:
                      - paragraph [ref=f36e116]: Du berätst Fachbereiche und Stakeholder zu digitalen Geschäftsprozessen, E-Commerce-Strategien und innovativen technologischen Lösungsansätzen.
                    - listitem [ref=f36e117]:
                      - paragraph [ref=f36e118]: Du entwickelst gemeinsam mit unseren internationalen Teams nachhaltige Zielbilder, Roadmaps und Umsetzungskonzepte für die digitale Customer Journey.
                    - listitem [ref=f36e119]:
                      - paragraph [ref=f36e120]: Du steuerst interdisziplinäre Projektteams sowie externe Partner und behältst Qualität, Budget, Zeitpläne und Risiken im Blick.
                    - listitem [ref=f36e121]:
                      - paragraph [ref=f36e122]: Du identifizierst neue Technologien und Trends, treibst Innovationen voran.
                    - listitem [ref=f36e123]:
                      - paragraph [ref=f36e124]: Du fungierst als kompetenter Ansprechpartner für Key User und sorgst dafür, dass unsere E-Commerce-Lösungen ihr volles Potenzial im Business entfalten.
                - generic [ref=f36e125]:
                  - heading "Dein Profil:" [level=2] [ref=f36e127]
                  - list [ref=f36e129]:
                    - listitem [ref=f36e130]:
                      - paragraph [ref=f36e131]: Du verfügst über ein erfolgreich abgeschlossenes Studium der (Wirtschafts-)Informatik, Betriebswirtschaft oder eine vergleichbare Qualifikation sowie mehrjährige Erfahrung im E-Commerce-, SAP- oder IT-Projektmanagement-Umfeld.
                    - listitem [ref=f36e132]:
                      - paragraph [ref=f36e133]: Du hast bereits Erfahrung in der Steuerung komplexer Projekte und der Zusammenarbeit mit internationalen Stakeholdern gesammelt.
                    - listitem [ref=f36e134]:
                      - paragraph [ref=f36e135]: Idealerweise verfügst Du über Kenntnisse in SAP Commerce, SAP ERP SD sowie digitalen Vertriebs- und E-Commerce-Prozessen.
                    - listitem [ref=f36e136]:
                      - paragraph [ref=f36e137]: Du verstehst B2B-Geschäftsprozesse und kannst Business-Anforderungen in praxisnahe digitale Lösungen übersetzen.
                    - listitem [ref=f36e138]:
                      - paragraph [ref=f36e139]: Du verfügst über eine ausgeprägte Beratungs-, Kommunikations- und Moderationsfähigkeit und arbeitest selbstständig und strukturiert.
                    - listitem [ref=f36e140]:
                      - paragraph [ref=f36e141]: Sehr gute Deutsch- und Englischkenntnisse runden Dein Profil ab.
                - generic [ref=f36e142]:
                  - heading "Was wir Dir bieten:" [level=2] [ref=f36e144]
                  - list [ref=f36e146]:
                    - listitem [ref=f36e147]:
                      - generic [ref=f36e148]:
                        - text: 📦
                        - strong [ref=f36e149]: Ein attraktives Gesamtpaket
                        - text: ", bestehend aus wettbewerbsfähigem Gehalt, einem unbefristeten Arbeitsvertrag, systematischen Leistungs- und Talententwicklungsprozessen, betrieblicher Altersvorsorge, Flexzeitkonten, vermögenswirksamen Leistungen, Leasingangeboten, unserem Corporate Benefit Programm und Vielem mehr."
                    - listitem [ref=f36e150]:
                      - generic [ref=f36e151]:
                        - text: ⏰ Du arbeitest bei uns
                        - strong [ref=f36e152]: 38,6 Stunden/Woche in Vollzeit
                        - text: und hast Die Möglichkeit, Deinen Arbeitsort durch
                        - strong [ref=f36e153]: hybrides Arbeiten
                        - text: (bis zu 50% Remote Work möglich) äußerst flexibel zu gestalten. Gleichzeitig freuen wir uns, wenn Du Dich persönlich am Unternehmensstandort vernetzt und aktiv am Teamleben teilnimmst.
                    - listitem [ref=f36e154]:
