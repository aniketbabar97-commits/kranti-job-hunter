    - main [ref=f5e38]:
      - region "Job Description" [ref=f5e44]:
        - generic [ref=f5e46]: Team Lead eCommerce Platforms & Configurators (m/w/d)
        - generic [ref=f5e50]: Ennepetal
        - generic [ref=f5e54]: 10/5/26
        - generic [ref=f5e62]:
          - heading "Position overview" [level=1] [ref=f5e63]
          - paragraph [ref=f5e64]
          - paragraph [ref=f5e65]:
            - text: Der Bereich
            - strong [ref=f5e66]: eCommerce & Configurators
            - text: verantwortet ein umfassendes Lösungsökosystem aus Standard-Webshop und Proshop (4Xperts) auf Basis der SAP Commerce Cloud. Ziel ist es, ein nahtloses Kundenerlebnis über alle digitalen Touchpoints sowie eine durchgängige Integration in Kundenanwendungen und Shared Services sicherzustellen.
          - paragraph [ref=f5e67]: In Ihrer Rolle übernehmen Sie die strategische und operative Gesamtverantwortung für diese geschäftskritischen Plattformen und Services. Sie steuern deren Weiterentwicklung, gewährleisten eine hohe Servicequalität und treiben die kontinuierliche Optimierung sowie Innovation der Lösungen voran.
          - paragraph [ref=f5e68]
          - heading "Ihre Aufgaben" [level=1] [ref=f5e69]
          - list [ref=f5e70]:
            - listitem [ref=f5e71]: Fachliche und disziplinarische Führung sowie Steuerung des Teams eCommerce & Configurators innerhalb von Marketing, Sales & Service Solutions
            - listitem [ref=f5e72]: Aktive Unterstützung bei der Optimierung und Weiterentwicklung der Standard-Webshop- und Proshop-Lösungen (4Xperts) auf Basis der SAP Commerce Cloud hinsichtlich Zusammenarbeit, Architektur und Integrationspotenzialen (ERP, Customer Applications für Sales & Service sowie Shared Services)
            - listitem [ref=f5e73]: Abstimmung des Design- und Release-Managements mit allen angebundenen Customer Applications und Shared Services, um eine stabile End-to-End-Erfahrung für Kunden und Anwender sicherzustellen
            - listitem [ref=f5e74]: Sicherstellung, dass Geschäftsanforderungen über die offiziellen Change-Request-Prozesse übersetzt, priorisiert und implementiert werden
            - listitem [ref=f5e75]: Planung, Moderation und Nachbereitung von Workshops mit relevanten Stakeholdern unter Anwendung agiler und produktzentrierter Arbeitsweisen
            - listitem [ref=f5e76]: Nutzung von Künstlicher Intelligenz (KI) und Generativer KI zur Optimierung digitaler Kundenerlebnisse, Verbesserung der Personalisierung,
            - listitem [ref=f5e77]: Unterstützung des Managements in sämtlichen Belangen rund um die Führung und Weiterentwicklung des Teams eCommerce & Configurators
          - paragraph [ref=f5e78]
          - paragraph [ref=f5e79]
          - heading "Ihr Profil" [level=1] [ref=f5e80]
          - list [ref=f5e81]:
            - listitem [ref=f5e82]: Abgeschlossenes Studium im Bereich Betriebswirtschaft, Market Abgeschlossenes Studium im Bereich IT, Wirtschaftsinformatik oder eine vergleichbare Qualifikation
            - listitem [ref=f5e83]: Mehrjährige Erfahrung (mind. 5 Jahre) mit SAP Commerce Cloud sowie in der Umsetzung von eCommerce-Lösungen
            - listitem [ref=f5e84]: Erfahrung in SAP-Commerce-Projekten, idealerweise inklusive Implementierung und Rollout von SAP Commerce-Lösungen
            - listitem [ref=f5e85]: Erste Berührungspunkte mit dem Salesforce-Ökosystem sind von Vorteil
            - listitem [ref=f5e86]: Erfahrung im Projektmanagement sowie in der Führung von Teams (mind. 3 Jahre)
            - listitem [ref=f5e87]: Erfahrung in einem internationalen Umfeld, idealerweise in einer Konzernstruktur
            - listitem [ref=f5e88]: Verhandlungssichere Englischkenntnisse; Deutschkenntnisse sind ein Plus
            - listitem [ref=f5e89]: Ausgeprägte Kommunikations- und Organisationsstärke sowie Erfahrung im Stakeholder-Management
          - paragraph [ref=f5e90]
          - paragraph [ref=f5e91]
          - heading "Was wir bieten" [level=1] [ref=f5e92]
          - list [ref=f5e93]:
            - listitem [ref=f5e94]: Beste Chancen in einem global agierenden Konzern mit der Kultur eines Familienunternehmens
            - listitem [ref=f5e95]: Sehr gute interne Weiterentwicklungsmöglichkeiten
            - listitem [ref=f5e96]: Weiterbildungsangebote z.B. durch eine globale Learning Plattform + LinkedIn Learning
          - list [ref=f5e97]:
            - listitem [ref=f5e98]: Attraktives Gehaltspaket mit tariflichen Rahmenbedingungen
            - listitem [ref=f5e99]: Betriebliche Altersvorsorge
            - listitem [ref=f5e100]: Flexible Arbeitszeitgestaltung & Möglichkeiten zum Homeoffice
            - listitem [ref=f5e101]: 30 Tage Urlaub
            - listitem [ref=f5e102]: Externe Mitarbeiterberatung in allen Lebenslagen
          - paragraph [ref=f5e103]
          - paragraph [ref=f5e104]
          - heading "Wer wir sind" [level=1] [ref=f5e105]
          - paragraph [ref=f5e106]:
            - generic [ref=f5e107]: For every place that matters.
            - text: Von automatischen Türen bis hin zu cloudbasiertem Zutrittsmanagement – als ein weltweit führender Anbieter auf dem Markt für Zutrittslösungen für Schulen, Banken, Flughäfen, Krankenhäuser, Hotels und viele weitere ermöglichen wir es, sichere und nachhaltige Orte zu schaffen, an denen sich Menschen nahtlos bewegen können.
          - paragraph [ref=f5e108]: Mit über 160 Jahren Erfahrung und einem klaren Fokus auf Exzellenz und Innovation bieten wir spannende Möglichkeiten zur Weiterentwicklung in einem Umfeld, in dem Sie wirklich etwas bewirken können.
          - paragraph [ref=f5e109]: Bei dormakaba werden Sie ermutigt, Eigeninitiative zu zeigen, Ihre Fähigkeiten auszubauen und Ihre Karriere gemeinsam mit 16.000 Expertinnen und Experten weltweit zu gestalten, die täglich neue Maßstäbe in der Branche setzen.
          - paragraph [ref=f5e110]: Arbeiten Sie an einem Ort, an dem Sie zählen – bewerben Sie sich jetzt!
        - generic [ref=f5e114]:
          - heading "Company:" [level=2] [ref=f5e115]
          - text: dormakaba International Holding GmbH
