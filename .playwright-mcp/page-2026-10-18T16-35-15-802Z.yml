    - generic [ref=e105]:
      - heading "Ansehen, Anfassen und Erleben" [level=3] [ref=e109]
      - generic [ref=e110]: "Besuchen Sie unsere traumhafte Ausstellungswelt auf 6.000 Quadratmetern. Lassen Sie sich von der beeindruckenden Produktvielfalt und dem geschmackvollen Ambiente inspirieren. Die große Auswahl an Parkett, Vinyl-/Designböden, Innentüren, Terrassendielen, Gartenmöbel, Sonnenschirme, Zäune und Holz im Garten werden Sie begeistern. Viele unserer Fachberater kommen selbst aus dem Handwerk und wissen aus eigener Erfahrung, wie man Parkett, Türen, Terrassendielen etc. verarbeitet. Für Sie bedeutet das: persönliche und praxisnahe Beratung. Unsere erfahrenen Fachberater freuen sich auf Sie. Holz-Richter GmbH | Ihr Partner rund um das Thema Holz."
      - link "Unsere Ausstellung" [ref=e115] [cursor=pointer]:
        - /url: https://www.holz-richter.de/ueber-uns/ausstellungen/
    - generic [ref=e122]:
      - heading "Privatkunden" [level=3] [ref=e126]
      - generic [ref=e127]: Auf einer Gesamtbetriebsfläche von mehr als 100.000 Quadratmetern werden bei uns Holzfußböden, Zimmertüren, Schnittholz, Gartenholz und Gartenmöbel in einer Auswahl und Menge angeboten, wie man sie woanders kaum findet.
      - link "Mehr erfahren" [ref=e132] [cursor=pointer]:
        - /url: https://www.holz-richter.de/partner-und-leistungen/privatkunden/
    - generic [ref=e138]:
      - heading "Handel" [level=3] [ref=e142]
      - generic [ref=e143]: Die Holz-Richter GmbH versteht sich als Holz-Logistiker – Produkte, die Sie bei der Industrie nicht beziehen können, sind bei uns immer für Sie verfügbar.
      - link "Mehr erfahren" [ref=e148] [cursor=pointer]:
        - /url: https://www.holz-richter.de/partner-und-leistungen/handel/
    - generic [ref=e154]:
      - heading "casando.de" [level=3] [ref=e171]
      - generic [ref=e173]:
        - paragraph [ref=e174]: 2004 haben wir als einer der Allerersten begonnen, über unseren Onlineshop casando.de unsere Produkte online zu verkaufen.
        - paragraph [ref=e175]: Sie können rund um die Uhr auf casando Ihre Wunschprodukte bestellen und wir liefern diese ganz bequem zu Ihnen nach Hause.
        - paragraph [ref=e176]: Falls Sie Beratung wünschen, stehen Ihnen über 50 eigene Fachverkäufer zur Verfügung.
      - link "Zu casando" [ref=e180] [cursor=pointer]:
        - /url: https://www.casando.de/
      - heading "casando Community" [level=3] [ref=e189]
      - paragraph [ref=e192]: Lassen Sie sich von unseren exklusiven Videos und Ratgebern inspirieren – von praktischen Montagevideos über Produkt-Tests bis hin zu wertvollen Tipps & Tricks finden Sie hier hilfreiche Infos rund um unser vielfältiges Sortiment für drinnen und draußen.
      - link "Zur Community" [ref=e196] [cursor=pointer]:
