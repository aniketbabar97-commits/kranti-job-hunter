      - paragraph [ref=f100e124]
      - heading "Maßgeschneiderte Lösungen für Ihre PV-Anlage von der AEET Energy Group GmbH" [level=2] [ref=f100e125]
      - paragraph [ref=f100e126]: Die AEET Energy Group GmbH ist seit vielen Jahren im Bereich der Entwicklung und Installation der Photovoltaiktechnik tätig. Wir sind nicht nur in Deutschland, sondern weit über die Landesgrenzen hinaus bekannt. Das Besondere an der AEET Energy Group GmbH ist, dass Sie bei uns alles aus einer Hand erhalten. Wir beraten Sie zu den bestehenden Möglichkeiten für die Installation von Photovoltaikanlagen. Außerdem planen und installieren wir Ihre neue Anlage und wir führen die fortlaufenden Wartungs- und Reparaturarbeiten schnell, professionell und zuverlässig durch. Selbstverständlich können Sie uns für die Installation einer Anlage im Privathaushalt ebenso engagieren, wie für die Planung von Solarparks oder PV-Anlagen, die im gewerblichen Bereich zum Einsatz kommen sollen.
      - paragraph [ref=f100e129]: Wir beraten Sie entsprechend Ihres Bedarfs und entwickeln ein für Sie maßgeschneidertes Konzept.
    - generic [ref=f100e131]:
      - heading "Nutzen Sie die Sonnenenergie" [level=3] [ref=f100e132]
      - paragraph [ref=f100e133]: Die ersten Photovoltaikanlagen, die mit Hilfe von Sonnenstrahlung Energie erzeugen konnten, wurden bereits vor vielen Jahren entwickelt und die Technik schreitet unaufhaltsam fort. Doch diese PV-Technik hat den Bereich der Energieerzeugung revolutioniert. Wenn man bedenkt, dass die sogenannten fossilen Energien wie beispielsweise Erdöl oder Gas, die nach wie vor zur Energiegewinnung genutzt werden, in absehbarer Zeit erschöpft sind, erahnt man, wie wichtig die erneuerbare Energie durch die Sonnenstrahlung wirklich ist, denn sie ist unerschöpflich. Ein weiterer positiver Aspekt der Umrüstung auf eine moderne Photovoltaikanlage besteht für Sie in den sinkenden Energiekosten, die erheblich sein werden. Das Anliegen der AEET Energy Group GmbH ist es, Sie auf diese moderne, kostengünstig und umweltschonende Art der Energieerzeugung aufmerksam zu machen. Dabei vertrauen uns nicht nur unsere Kunden und Partner in Deutschland, sondern auch über die Landesgrenzen hinaus.
      - heading "Höchste Qualität von der AEET Energy Group GmbH" [level=3] [ref=f100e134]
      - paragraph [ref=f100e135]: Unser Anspruch besteht darin, Ihnen stets die beste Qualität anzubieten. Dies bezieht sich auf die Beratung und Planung ebenso, wie auf die modernen und technisch ausgereiften Solaranlagen, die wir installieren. Wir verwenden Solarmodule von höchster Qualität und legen obendrein einen großen Wert auf ein stimmiges Konzept. Wir wählen für Sie die PV-Anlage aus, die am besten zu Ihnen und Ihrem Bedarf passt. In die Planung werden daher Fakten wie die Dachneigung oder die Tragfähigkeit des Daches mit einbezogen. Auch den gewünschten Wirkungsgrad beachten wir selbstverständlich.Bei der Auswahl der Solarmodule achten wir zudem auf eine hohe Effizienz bei einer gleichzeitig langen Lebensdauer der Module. Um dauerhaft die beste Qualität anbieten zu können, prüfen und kontrollieren wir intern sämtliche von uns verarbeiteten Teile regelmäßig. Außerdem werden alle von uns verwendeten Komponenten hervorragend aufeinander abgestimmt, sodass diese sich bestmöglich ergänzen. Dies wiederum sorgt für die größtmögliche Effizienz Ihrer neuen PV-Anlage. Mit unseren Solaranlagen sparen Sie Energiekosten von mehr als 70 Prozent ein. Gleichzeitig füllen Sie den Stromspeicher, um diesen selbst zu nutzen. Übersteigt die Stromerzeugung Ihren Eigenbedarf, so wird der überproduzierte Strom in öffentliche Netze eingespeist. Lassen Sie sich gern beraten. Wir prüfen, welche Solaranlage für Sie infrage kommt und werden diese nach Ihren individuellen Ansprüchen planen und installieren, denn die AEET Energy Group GmbH ist seit vielen Jahren Ihr kompetenter Partner in Sachen Photovoltaik.
