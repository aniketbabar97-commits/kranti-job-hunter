        - generic [ref=f57e82]:
          - heading "Deine Ideen für eine innovative Customer Experience gesucht – Digitalisiere Sales & Service!" [level=2] [ref=f57e83]
          - link "Jetzt bewerben!" [ref=f57e85] [cursor=pointer]:
            - /url: https://www.telekom-mms.com/karriere/stellenboerse/Consultant-SAP-CX-mwd-de-f4349.html
          - paragraph [ref=f57e87]: "Jährlich mehr als 3.000 Kundenprojekte, 2.100 großartige Kolleg*innen, 10 attraktive Standorte – und mittendrin: Du. Mit der Telekom MMS gemeinsam für eine digitalisierte, zukunftsfähige und lebenswerte Welt. Dein Job. Für morgen. Und übermorgen. Standorte: Berlin, Bonn, Dresden, Hamburg, Jena, Leinfelden-Echterdingen (Stuttgart), Leipzig, Mannheim, München oder Rostock Wochenarbeitszeit: Vollzeit 38 h/ WocheReiseanteil: mittelSprachkenntnisse: verhandlungssicher in Deutsch und Englisch"
        - generic [ref=f57e88]:
          - heading "Das erwartet dich als Consultant SAP CX (m/w/d)" [level=2] [ref=f57e89]
          - list [ref=f57e91]:
            - listitem [ref=f57e92]: Du bringst deine Erfahrungen und Ideen ein, um digitale Lösungen im Bereich SAP Customer Experience zu beraten und zu gestalten
            - listitem [ref=f57e93]: Zudem moderierst du Workshops, entwickelst Projektansätze und stehst im kreativen Austausch mit allen Stakeholdern
            - listitem [ref=f57e94]: Dabei profitierst du von einem interdisziplinären Team digitaler Fachexpert*innen und moderner Methodik
            - listitem [ref=f57e95]: Aufgrund deiner Expertise im Bereich Sales- und Service Cloud V.2 und deinem breiten technischen Know-How übernimmst du die fachliche und technische Beratung zu Digitalprojekten, vornehmlich in den Customer Experience relevanten Bereichen Marketing, Vertrieb und Service
            - listitem [ref=f57e96]: Du berätst Konzerne, den Mittelstand aber auch Start-ups gleichermaßen kundenorientiert und professionell
            - listitem [ref=f57e97]: Du übernimmst Verantwortung für deine Kund*innen und deren Digitalisierungsprojekte
        - generic [ref=f57e98]:
          - heading "Das bringst du im Bereich SAP Customer Experience mit" [level=2] [ref=f57e99]
          - generic [ref=f57e100]:
            - list [ref=f57e101]:
              - listitem [ref=f57e102]: Mehrjährige Praxiserfahrung im Consulting & Interesse, Neues auszuprobieren und zu lernen
              - listitem [ref=f57e103]: Umfangreiches Knowhow im Bereich SAP Customer Experience Lösungen, insbesondere SAP Sales- und Service-Cloud V.2
              - listitem [ref=f57e104]: Verständnis für digitale Kernthemen wie moderne Applikationen, Datenhaltung, Commerce, Cloud etc.
              - listitem [ref=f57e105]: Kenntnis von sowie idealerweise Erfahrung mit weiteren digitalen Plattformen und Lösungsanbietern (CRM, Shop, CMS, CDP etc.)
              - listitem [ref=f57e106]: Fähigkeit, deine Ideen vor Fach- und IT-Entscheidern zu präsentieren sowie aktiv zuzuhören und zu verstehen
              - listitem [ref=f57e107]: Interesse an aktuellen Trends und Entwicklungen in der Digitalisierung
              - listitem [ref=f57e108]: Lösungsübergreifende Denkweise und Hands-on-Mentalität
            - paragraph [ref=f57e109]
            - paragraph [ref=f57e110]: Ein Plus, kein Muss
            - list [ref=f57e111]:
              - listitem [ref=f57e112]: Praxis im Projekt-Management
              - listitem [ref=f57e113]: Erfahrung mit SAP BTP
        - generic [ref=f57e114]:
          - heading "Unsere Benefits für dich" [level=2] [ref=f57e115]
          - generic [ref=f57e116]:
            - list [ref=f57e117]:
              - listitem [ref=f57e118]: Welcome Day – Ankommen und Netzwerken
              - listitem [ref=f57e119]: Flexibilität – flexible Arbeitszeit mit Überstundenausgleich
              - listitem [ref=f57e120]: Mobile Working – ortsungebundenes Arbeiten deutschlandweit möglich, mind. 1 Tag wöchentlich im Büro
              - listitem [ref=f57e121]: Workation – Arbeite bis zu 20 Tage im Jahr im EU-Ausland
              - listitem [ref=f57e122]: Weiterentwicklung – über 100 Weiterbildungen und Schulungen im Angebot
              - listitem [ref=f57e123]: Betriebliche Altersvorsorge – wir legen was für dich zur Seite
              - listitem [ref=f57e124]: Dienstreisen – Reisezeit ist Arbeitszeit
              - listitem [ref=f57e125]: Nachhaltigkeit – gemeinsam prägen wir das Leben und Arbeiten der Zukunft
            - paragraph [ref=f57e126]
            - paragraph [ref=f57e127]: Für diese Position sehen wir ein Bruttojahresgehalt in Höhe von 65.000 € bis 95.000 € vor. Die konkrete Einordnung erfolgt auf Basis objektiver und geschlechtsneutraler Kriterien, insbesondere der fachlichen Qualifikation, einschlägigen Berufserfahrung und des mit der Rolle verbundenen Verantwortungsumfangs.
            - paragraph [ref=f57e128]: Bei uns zählt der Mensch. Wir setzen uns aktiv für Entgeltgleichheit ein und gestalten unsere Vergütungsstrukturen transparent und diskriminierungsfrei. Unabhängig von Geschlecht, ethnischer Herkunft, Religion, Alter, sexueller Identität oder Behinderung leben wir Vielfalt und lehnen jede Form von Diskriminierung ab.
        - generic [ref=f57e129]:
          - heading "Bist du dabei?" [level=2] [ref=f57e130]
          - generic [ref=f57e131]:
            - paragraph [ref=f57e132]: Dann bewirb dich und zeig uns, wer du bist!
            - paragraph [ref=f57e133]: Du hast noch Fragen oder suchst nach fachspezifischen Informationen? Zögere nicht und kontaktiere mich.
            - paragraph [ref=f57e134]: "Josephine MärtensTelefon/ WhatsApp: +49 351 - 2820 - 7555"
