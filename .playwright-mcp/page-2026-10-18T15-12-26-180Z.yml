                        - text: "1992"
                - generic [ref=f67e187]:
                  - paragraph [ref=f67e188]: Als führender Digital Business Provider begleitet CANCOM Unternehmen, Organisationen und den öffentlichen Sektor in die digitale Zukunft. Das Leistungs- und Lösungsspektrum umfasst sowohl klassische Systemhaus-IT-Lösungen als auch datenbasierte Digital Solutions, Managed Services sowie Cloud Dienste. Mit Leidenschaft und Technologie begleiten wir die Digitale Evolution unserer Kunden und unterstützen sie dabei, die Komplexität ihrer IT zu reduzieren und neue Geschäftsmodelle zu entwickeln. Dafür bieten wir ein ganzheitliches Portfolio für alle IT- und Business-Anforderungen.
                  - paragraph [ref=f67e189]: Das Angebot der CANCOM Gruppe umfasst innovative Lösungen in den Bereichen Artificial Intelligence, Security & Network, Datacenter & Cloud, IoT-Solutions sowie Modern Workplace und enthält Dienste für den gesamten IT-Lifecycle – von der Bereitstellung von IT-Infrastrukturen, über die Planung und Integration, bis hin zu Support-, Managed Services und XaaS. Kunden profitieren dabei von der umfangreichen Expertise, mit der ihre vielfältigen Anforderungen in konkrete branchenspezifische IT-Lösungen übersetzt werden, um ihren Geschäftserfolg maßgeblich zu fördern.
                  - paragraph [ref=f67e190]: Die über 5.600 Mitarbeiter der international tätigen CANCOM Gruppe mit rund 80 Standorten in der DACH-Region, Belgien, der Slowakei, Rumänien und Tschechien sowie ein leistungsfähiges Partnernetzwerk gewährleisten Marktpräsenz und Kundennähe. Die CANCOM Gruppe wird von Rüdiger Rath (CEO) und Thomas Stark (CFO) geführt. Der Hauptsitz des Unternehmens ist in München. CANCOM erwirtschaftete 2024 einen Jahresumsatz von rund 1,7 Milliarden Euro. Die Konzern-Muttergesellschaft CANCOM SE ist an der Frankfurter Wertpapierbörse im TecDAX und SDAX (ISIN DE0005419105) notiert
