                - generic [ref=f67e95]:
                  - heading "ÜBER CANCOM" [level=5] [ref=f67e96]
                  - paragraph [ref=f67e97]: "Bei CANCOM erwartet dich ein innovatives, agiles und nachhaltiges Umfeld: Mehr als 5.600 Mitarbeiter arbeiten tagtäglich daran, mit Hilfe moderner IT-Lösungen die Zusammenarbeit und den Austausch in verschiedenen Lebensbereichen zu verbessern. Du hast Lust ein Teil davon zu sein und den nächsten Karriereschritt zu gehen? Dann werde Teil unserer Digital Journey. Wir freuen uns auf Menschen aus den unterschiedlichsten Fachrichtungen, die aufgeschlossen für Neues sind, innovative Einfälle haben und im Team gemeinsam Ziele voranbringen wollen."
                  - heading "DEINE NEUEN AUFGABEN" [level=5] [ref=f67e98]
                  - list [ref=f67e99]:
                    - listitem [ref=f67e100]:
                      - strong [ref=f67e101]: "Betrieb & Überwachung:"
                      - text: Du unterstützt beim Monitoring der SAP Commerce Cloud Umgebungen, um Performance-Engpässe und Fehler frühzeitig zu erkennen.
                    - listitem [ref=f67e102]:
                      - strong [ref=f67e103]: "Qualitätssicherung:"
                      - text: Du erstellst und wartest automatisierte Tests (Unit-, Integration- und UI-Tests), um eine hohe Release-Qualität sicherzustellen.
                    - listitem [ref=f67e104]:
                      - strong [ref=f67e105]: "CI/CD Pipeline:"
                      - text: Du begleitest den Deployment-Prozess und arbeitest an der Optimierung unserer DevOps-Workflows
                    - listitem [ref=f67e106]:
                      - strong [ref=f67e107]: "Incident Management:"
                      - text: Du unterstützt das Team bei der Fehlersuche und -behebung im laufenden Betrieb
                    - listitem [ref=f67e108]:
                      - strong [ref=f67e109]: "Feature-Entwicklung:"
                      - text: Du arbeitest zusammen mit dem Team an der Implementierung von Shop-Funktionalitäten in Back- und Frontend
                  - heading "DAS BRINGST DU MIT" [level=5] [ref=f67e110]
                  - list [ref=f67e111]:
                    - listitem [ref=f67e112]: Abgeschlossenes Studium der Informatik oder eine vergleichbare Ausbildung
                    - listitem [ref=f67e113]: Erste Kenntnisse in Java und der Spring-Framework-Umgebung
                    - listitem [ref=f67e114]: Grundverständnis von automatisiertem Software-Testing (z. B. JUnit) und der Funktionsweise von Cloud-Infrastrukturen
                    - listitem [ref=f67e115]: Hohes Qualitätsbewusstsein, analytisches Denkvermögen und die Bereitschaft, tief in komplexe Systeme einzutauchen.
                    - listitem [ref=f67e116]: Gute Deutsch- und Englischkenntnisse.
                  - heading "UNSERE BENEFITS" [level=5] [ref=f67e117]
                  - list [ref=f67e118]:
                    - listitem [ref=f67e119]: Flexible Arbeitszeiten und Mobile Office in Abstimmung mit dem Vorgesetzten
