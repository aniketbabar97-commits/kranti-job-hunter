          - paragraph [ref=e41]:
            - strong [ref=e42]: Immer nur Features umsetzen und Stillstand im Job? Du möchtest technische Entscheidungen und die Zukunft deines Arbeitgebers mitgestalten? Du hast es in der Hand.
          - paragraph [ref=e43]: Maify ist ein junges E-Commerce Beratungsunternehmen. Auf Basis von SAP Commerce Cloud (Hybris) entwickeln wir technisch anspruchsvolle Lösungen für Industrie und Handel.
          - paragraph [ref=e44]: Bei uns übernimmst du Verantwortung für technische Entscheidungen, gestaltest die Architektur mit und steuerst Kundenprojekte eigenständig im Remote-Setup.
          - paragraph [ref=e45]: Wir wachsen und suchen erfahrene Software Developer mit SAP Commerce-Hintergrund. Auch starke Frontend-/Backend-Profile mit Commerce-Erfahrung, die sich gezielt in SAP Commerce Cloud weiterentwickeln möchten, sind willkommen.
          - paragraph [ref=e46]: Klingt es spannend für dich? Dann sollten wir uns kennenlernen!
          - heading "Senior SAP Commerce/Hybris Developer (all genders) - remote, deutschlandweit" [level=1] [ref=e47]
          - paragraph [ref=e48]: ‍
          - heading "Das bieten wir dir:" [level=3] [ref=e49]
          - list [ref=e50]:
            - listitem [ref=e51]:
              - strong [ref=e52]: Sicherheit & Perspektive‍
              - text: Dies spiegelt sich in unserer soliden Auftragslage und in den Entwicklungsmöglichkeiten, die sich für dich als Teil unseres Teams erschließen.
            - listitem [ref=e53]:
              - strong [ref=e54]: Transparenz & direkter Austausch‍
              - text: Wir fördern das durch monatliche Unternehmensrunden und unser Weekly. Regelmäßiges Feedback gehört ebenfalls zu unserer Unternehmenskultur und fördert das gegenseitige Lernen.
            - listitem [ref=e55]:
              - strong [ref=e56]: Remote-Setup & Flexibilität‍
              - text: Damit du dein Bestes geben kannst, arbeitest du bei Maify 100 % remote innerhalb Deutschlands. Deine Hardware und Arbeitsumgebung sowie die Gestaltung deines Arbeitsplatzes wählst du ebenfalls frei.
              - strong: ‍
            - listitem [ref=e57]:
              - strong [ref=e58]: Deine Entwicklung & Potenzial‍
              - text: Wir wollen, dass du dein volles Potenzial entdecken und entfalten kannst. Mittels Schulungen und Weiterbildungen geben wir dir Freiraum, dich stärkenorientiert weiterzuentwickeln und zielorientiert zu denken und zu handeln.
            - listitem [ref=e59]:
              - strong [ref=e60]: Mitgestaltung & kurze Entscheidungswege‍
              - text: "Mitdenker gesucht! Wir geben deinen Ideen Raum und sind offen für Neues. Denn wir sind überzeugt: nur so entwickeln wir uns als Unternehmen stetig weiter. Du möchtest was bewegen? Bring dich gern ein."
            - listitem [ref=e61]:
              - strong [ref=e62]: Gesundheit & Wohlbefinden‍
              - text: Du kannst dich auf Angebote rund um deine Gesundheit wie z.B. Hansefit und auf unsere gemeinsamen Events freuen.
          - heading "Das erwartet dich:" [level=3] [ref=e63]
          - list [ref=e64]:
            - listitem [ref=e65]:
              - text: Als Mitglied eines agilen, verteilten Teams konzipierst und entwickelst du kundenspezifische
              - strong [ref=e66]: B2B- und B2C-Commerce-Lösungen
              - text: auf Basis von SAP Commerce Cloud in einer Lead Stellung.
            - listitem [ref=e67]:
              - text: Du gestaltest die
              - strong [ref=e68]: Softwarearchitektur
              - text: mit und übernimmst technische Ownership für deine Lösungen auf Basis des SAP Commerce Stacks.
            - listitem [ref=e69]:
              - text: Technische Themen in Kundenprojekten steuerst du eigenständig und berätst unsere Kunden als
              - strong [ref=e70]: technische Ansprechperson bzw. Trusted Advisor.
            - listitem [ref=e71]:
              - text: Du analysierst komplexe Anforderungen und entwickelst daraus tragfähige, kundenspezifische Lösungen, übernimmst
              - strong [ref=e72]: Tech-Lead-Verantwortung
              - text: oder entwickelst dich perspektivisch in diese Rolle.
            - listitem [ref=e73]:
              - text: Du begleitest
              - strong [ref=e74]: Cloud-Moves, technische Modernisierungen und Software-Upgrades
              - text: .
            - listitem [ref=e75]:
              - text: Du arbeitest mit
              - strong [ref=e76]: Git, Code Reviews, Clean Code und automatisierten Tests
              - text: und entwickelst unsere
              - strong [ref=e77]: Engineering-Standards
              - text: kontinuierlich weiter.
