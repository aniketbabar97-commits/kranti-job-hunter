              - generic [ref=f8e195]:
                - paragraph [ref=f8e196]: Mit Blick auf die zunehmende Nachfrage nach Cloud-Lösungen und Transformationsprojekten für die Customer Experience möchten wir unser SAP-CX-Know-how gezielt für das Projektgeschäft und den Service erweitern. Aktuell arbeiten wir mit einem kleinem Team aus Entwickler*innen und Consultants* aus zwei Fachbereichen in einem Transformationsprojekt sowie im Application Management Support für mehrere Kunden.
                - paragraph [ref=f8e197]:
                  - strong [ref=f8e198]: Das erwartet dich
                - list [ref=f8e199]:
                  - listitem [ref=f8e200]: Du berätst im Tandem mit einem weiteren Consultant unsere Kunden aus verschiedenen Branchen in Projekten zur Einführung von SAP CX Komponenten und übernimmst je nach Kompetenzlevel auch (Teil-)projektleitungsverantwortung
                  - listitem [ref=f8e201]: Du wirkst im Application-Management-Support mit und löst Tickets, bis das Team eine entsprechende Größe hat, um sich nur auf das Projektgeschäft zu fokussieren
                  - listitem [ref=f8e202]: Du unterstützt im Vertrieb und Presales bei der Erstellung von Demoszenarien sowie bei Angeboten und Ausschreibungen
                  - listitem [ref=f8e203]: Du entwickelst das Thema SAP CX aktiv weiter und bringst dein Wissen durch Sparring im CX-Team ein
                - paragraph [ref=f8e204]:
                  - strong [ref=f8e205]: Das bringst du mit
                - list [ref=f8e206]:
                  - listitem [ref=f8e207]: Mehrjährige Beratungserfahrung sowie Customizing-Kenntnisse in der SAP CX Cloud aus unterschiedlichen Kundenprojekten
                  - listitem [ref=f8e208]: End-to-End-Prozesskenntnisse von der Auftragseinsteuerung bis zur Rechnungslegung
                  - listitem [ref=f8e209]: Kenntnisse der Architektur für CX V2 und in JavaScript
                  - listitem [ref=f8e210]: Mindestens 50% Reisebereitschaft für Einsätze in Kundenprojekten in der DACH-Region
                  - listitem [ref=f8e211]: Gute Deutschkenntnisse, mindestens auf B2-Niveau
                - paragraph [ref=f8e212]:
                  - strong [ref=f8e213]: Das bieten wir dir
                - list [ref=f8e214]:
                  - listitem [ref=f8e215]: Einarbeitung für das Projekt-Onboarding vor-Ort und remote im Patenmodell und mit regelmäßigen jour fixes mit deiner Führungskraft
                  - listitem [ref=f8e216]: Monatliche Online-Meetings mit deinem Fachteam sowie ein jährliches Treffen mit dem gesamte Bereichsteam in Würzburg oder Oldenburg
                  - listitem [ref=f8e217]: Weiterbildungs- und Zertifizierungsmögklichkeiten, u. a. mit persönlicher SAP Learning Hub Lizenz und LinkedIn Learning
                  - listitem [ref=f8e218]: Entwicklungsmöglichkeit zum Teamlead für das CX-Team
                  - listitem [ref=f8e219]: Gleitzeitkonto flexibel in Voll- oder Teilzeit (20 - 40 Wochenstunden) + 30 Tage Urlaub (bei Vollzeit)
                  - listitem [ref=f8e220]: Homeoffice Möglichkeiten, von einzelnen Tagen bis hin zum Full Homeoffice, ohne feste Präsenztage
                  - listitem [ref=f8e221]: Duz-Kultur, Social Intranet, monatliche After-Work Veranstaltungen
                  - listitem [ref=f8e222]: "Sichere Jobperspektive: unbefristeter Arbeitsvertrag, Vielfalt bei Kunden und Branchen, EWE AG als starker Mutterkonzern"
                  - listitem [ref=f8e223]: "Für dein Wohlbefinden: Hansefit, fondsgebundenes arbeitgeberfinanziertes Altersvorsorgemodell, kostenfreie externe Sozial- und Gesundheitsberatung, (E-)Bike Leasing, Zeitwertkonto für berufliche Auszeiten"
