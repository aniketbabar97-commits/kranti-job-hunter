          - paragraph [ref=e90]: Die cronos Gruppe ist seit über 30 Jahren ein führender IT-Dienstleister und Berater für digitale Innovationen. Mit unserer Leidenschaft für IT, Expertise in vielfältigen Branchen und einem klaren Fokus auf Qualität unterstützen wir unsere Kunden bei der digitalen Transformation. Unsere Unternehmensgruppe umfasst Spezialisten in den Bereichen Customer Experience, IT-Management, Automatisierung und innovative Services – und genau hier kommst du ins Spiel! Als Teil der cronos Gruppe arbeitest Du in einem dynamischen, motivierten Team, das Ideen, Kreativität und Wissen teilt. Wir legen großen Wert auf partnerschaftliche Zusammenarbeit, offene Kommunikation und die kontinuierliche Weiterentwicklung unserer Mitarbeitenden. Bei uns kannst Du Verantwortung übernehmen, wachsen und gemeinsam mit uns die Erfolgsgeschichte der cronos Gruppe weiterschreiben.
