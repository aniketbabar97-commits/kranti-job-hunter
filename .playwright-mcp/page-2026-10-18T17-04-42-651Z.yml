          - generic [ref=e221]:
            - generic [ref=e222]:
              - heading "Wie ist es ein Azubi bei cronos zu sein?" [level=4] [ref=e223]
              - paragraph [ref=e224]: "Das sagt Olivia:"
              - generic [ref=e225]:
                - generic [ref=e226]:
                  - button "Was macht deinen Job hier besonders? +" [ref=e227] [cursor=pointer]
                  - paragraph [ref=e228]: Mein Job ist besonders, weil ich mit tollen Kolleg*innen zusammenarbeite, die immer hilfsbereit sind und mit denen die Arbeit Spaß macht. Ich schätze es sehr, dass ich remote arbeiten kann und mit allem Nötigen ausgestattet werde. Außerdem schätze ich es sehr, dass hier daran gearbeitet wird, die Gemeinschaft unter den Kolleg*innen zu stärken, zum Beispiel durch Teamevents oder Bürotage, bei denen man sich persönlich besser kennenlernen kann.
                - generic [ref=e229]:
                  - button "Wie würdest du die Atmosphäre im Team beschreiben? +" [ref=e230] [cursor=pointer]
                  - paragraph [ref=e231]: Die Atmosphäre im Team empfinde ich als sehr angenehm, offen und wertschätzend. Alle sind freundlich, respektvoll und unterstützen sich gegenseitig, wenn jemand Hilfe braucht. Gleichzeitig herrscht eine lockere Stimmung, es wird auch mal gescherzt und gemeinsam gelacht, was den Arbeitsalltag sehr angenehm macht und für eine gute Balance sorgt.
                - generic [ref=e232]:
                  - button "Was war dein persönliches Highlight in deiner Zeit hier? +" [ref=e233] [cursor=pointer]
                  - paragraph [ref=e234]: Mein persönliches Highlight war der Jahreskickoff 2025. Ich durfte zusammen mit Matthias Krüger auf der Bühne stehen und etwas über das Konzept der dualen Student*innen und Azubis erzählen, was für mich eine tolle Erfahrung war. Außerdem hatte ich dort die Gelegenheit, viele Kolleg*innen persönlich kennenzulernen, wodurch auch Freundschaften entstanden sind.
                - generic [ref=e235]:
                  - button "Welche Aspekte der Flexibilität hier sind für dich besonders wertvoll? +" [ref=e236] [cursor=pointer]
                  - paragraph [ref=e237]: Besonders wertvoll finde ich die Möglichkeit, von zuhause aus zu arbeiten, da ich so meinen Arbeitsalltag besser mit meinem Privatleben verbinden kann. Auch die Gleitzeit ist ein großer Pluspunkt für mich, weil ich dadurch meine Arbeit flexibel an meinen Alltag anpassen kann.
            - generic [ref=e240]:
              - heading "Olivia" [level=5] [ref=e241]
              - heading "Azubi" [level=6] [ref=e242]
