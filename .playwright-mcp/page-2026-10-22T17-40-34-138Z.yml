    - generic [ref=f1e188]:
      - heading "Our Success Stories" [level=2] [ref=f1e190]
      - paragraph [ref=f1e193]: "Different starting points, the same question: How can digital sales become a driver of growth? Here’s what came of it—from retailers and manufacturers we’ve often been working with for years."
      - generic [ref=f1e194]:
        - link [ref=f1e195] [cursor=pointer]:
          - /url: /en/success-cases/d2c-strategie-lavazza
          - article [ref=f1e196]:
            - img "Lavazza" [ref=f1e198]
            - generic [ref=f1e199]: Lavazza
            - heading "A Clear Course for the Direct Channel" [level=3] [ref=f1e200]
            - paragraph [ref=f1e203]: "The goal: to turn a leading international coffee brand’s own D2C channel into a true growth driver—with customer loyalty that extends beyond established marketplaces. foobar Agency analyzed the entire e-commerce journey, identified action items, prioritized them for implementation, and established structures that enable the company to independently manage and expand its direct-to-consumer business."
        - link [ref=f1e204] [cursor=pointer]:
          - /url: /en/success-cases/porta-moebel
          - article [ref=f1e205]:
            - img "From Legacy to Composable Commerce" [ref=f1e207]
            - generic [ref=f1e208]: porta Möbel
            - heading "From Legacy to Composable Commerce" [level=3] [ref=f1e209]
            - paragraph [ref=f1e212]: "Since 2019, foobar Agency has accompanied porta Möbel on its path to digital market leadership: from legacy analysis via incremental headless commerce to a full composable commerce architecture on MACH principles."
        - link [ref=f1e213] [cursor=pointer]:
          - /url: /en/success-cases/omnichannel-shop-heimtierbedarf
          - article [ref=f1e214]:
            - img "Hund" [ref=f1e216]
            - 'heading "Store Strength Becomes Online Strength: Omnichannel as a Growth Driver" [level=3] [ref=f1e217]'
            - paragraph [ref=f1e220]: "The goal: turn a leading pet supplies retailer's previously isolated online business into a profitable growth driver. After joint strategy work, foobar Agency built the platform from the ground up – live in six months, with expanded Click & Collect and a loyalty program that works everywhere."
