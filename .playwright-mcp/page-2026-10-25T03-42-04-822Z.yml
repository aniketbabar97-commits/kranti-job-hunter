    - generic [ref=f129e84]:
      - heading "Senior IT Manager Digital Platforms & Enterprise Applications (m/w/d)" [level=4] [ref=f129e85]
      - img "Banner_Stellenausschreibungen_2025_GPTW-2" [ref=f129e86]
      - generic [ref=f129e87]:
        - generic [ref=f129e88]: "Standort: Sundern"
        - generic [ref=f129e90]:
          - generic [ref=f129e91]: "Pensum: Vollzeit"
          - generic [ref=f129e92]: "Erfahrung: Berufserfahren"
      - generic [ref=f129e93]:
        - heading "Möglichkeiten. Seit 1892." [level=3] [ref=f129e94]
        - paragraph [ref=f129e95]: "Bei Severin geht es um mehr als nur Haushaltsgeräte. Wir schaffen echte Möglichkeiten. Seit über 130 Jahren entwickeln wir Produkte, die den Alltag leichter machen: mit Qualität, die bleibt, Design, das begeistert, und Technik, die nicht überfordert, sondern unterstützt."
        - paragraph [ref=f129e96]: "Unsere Mission: Premium für alle. Wir glauben, dass hochwertige, langlebige Produkte kein Privileg für wenige sein dürfen, sondern für alle Menschen zugänglich sein sollten. Und genau daran arbeiten wir. Jeden Tag. Mit Leidenschaft, Weitblick und einem Team, das mehr will, als nur mitlaufen."
        - paragraph [ref=f129e97]: "Was uns ausmacht? Echte Ideen, kurze Wege, viel Vertrauen. Bei uns wird nicht nur mitgearbeitet, sondern mitgestaltet. Mit Herz, Haltung und einem klaren Ziel vor Augen: Möglich machen."
        - paragraph [ref=f129e98]: Du willst mit deiner Arbeit echten Mehrwert schaffen und auch ein*e Möglichmacher*in sein? Dann gestalte mit uns Premium für alle.
        - paragraph [ref=f129e99]: Zur Verstärkung unseres IT & Digitalization Teams in Sundern (mit der Möglichkeit für mobiles Arbeiten) suchen wir ab sofort einen
        - paragraph [ref=f129e100]:
          - strong [ref=f129e101]:
            - strong [ref=f129e102]: Senior IT Manager Digital Platforms & Enterprise Applications
            - strong [ref=f129e103]: (m/w/d)
        - heading "Hallo deine Verantwortung" [level=3] [ref=f129e104]
        - paragraph [ref=f129e105]: "Als Senior IT Manager Digital Platforms & Enterprise Applications übernimmst du eine zentrale Rolle für die Weiterentwicklung und den nachhaltigen Betrieb unserer digitalen Applikations- und Plattformlandschaft. Du verbindest Enterprise Applications, Integration, digitale Plattformen, IT-Projektmanagement und Providersteuerung und sorgst gemeinsam mit unseren Fachbereichen, internen IT-Spezialisten und Technologiepartnern für eine sichere, skalierbare und langfristig beherrschbare IT-Landschaft. Im Einzelnen gehören dazu folgende Themen:"
        - list [ref=f129e107]:
          - listitem [ref=f129e108]:
            - strong [ref=f129e109]: "Enterprise Applications & Digital Platforms:"
            - text: Du entwickelst unsere Enterprise-Applikationslandschaft strategisch und operativ weiter – mit SAP S/4HANA Private Cloud als zentralem ERP-System sowie SAP BTP, Cloud-, SaaS- und Plattformlösungen.
          - listitem [ref=f129e110]:
            - strong [ref=f129e111]: "Enterprise Architecture:"
            - text: Du gestaltest gemeinsam mit dem Director IT & Digitalization eine skalierbare und wartbare Architektur, definierst technische Standards und bewertest neue Lösungen hinsichtlich Architektur, Nutzen, Aufwand und Risiken.
          - listitem [ref=f129e112]:
            - strong [ref=f129e113]: "Integration & E-Commerce:"
            - text: Du steuerst die Weiterentwicklung unserer API-, EDI- und BTP-basierten Integrationen und stellst stabile End-to-End-Prozesse zwischen SAP, Webshop, Marktplätzen und weiteren externen Systemen sicher.
          - listitem [ref=f129e114]:
            - strong [ref=f129e115]: "Application Lifecycle Management:"
            - text: Du etablierst klare Application-Ownership-Strukturen, steuerst Releases und Changes, entwickelst Roadmaps weiter und planst Migrationen sowie die Ablösung von Systemen und technischen Altlasten.
          - listitem [ref=f129e116]:
            - strong [ref=f129e117]: "Security & Governance by Design:"
            - text: Gemeinsam mit IT Security & Governance integrierst du Security, Datenschutz, Berechtigungen, Third-Party-Risiken, Business Continuity sowie Lifecycle- und Exit-Anforderungen frühzeitig in Architektur- und Lösungsentscheidungen
          - listitem [ref=f129e118]:
            - strong [ref=f129e119]: "IT-Projekt- & Demand-Management:"
            - text: Du strukturierst neue Anforderungen, priorisierst gemeinsam mit Business und IT und steuerst bereichsübergreifende Digitalisierungsprojekte inklusive Ressourcen-, Risiko- und Eskalationsmanagement.
          - listitem [ref=f129e120]:
            - strong [ref=f129e121]: IT
            - strong [ref=f129e122]: "Service & Provider Management:"
            - text: Du entwickelst unser Application-Management-Modell weiter, steuerst Incident-, Problem-, Change- und Release-Prozesse und führst SAP- und Technologiepartner über SLA, Servicequalität, Kosten und klare Verantwortlichkeiten.
          - listitem [ref=f129e123]:
            - strong [ref=f129e124]: "Architecture & Security Review:"
            - text: Du etablierst gemeinsam mit IT Security & Governance einen verbindlichen Review-Prozess für neue Anwendungen, Plattformen und Integrationen und begleitest bei geschäftskritischen Systemen eine dokumentierte Go-Live-Readiness.
          - listitem [ref=f129e125]:
            - strong [ref=f129e126]: "Management & Zusammenarbeit:"
            - text: Du bereitest technische und wirtschaftliche Entscheidungen belastbar vor, steuerst externe Spezialisten auf Augenhöhe und übernimmst bei kritischen Projekten und Störungen operative Verantwortung
        - heading "Hallo dein Potenzial" [level=3] [ref=f129e127]
        - list [ref=f129e129]:
          - listitem [ref=f129e130]: Du hast ein abgeschlossenes Studium im Bereich Informatik, Wirtschaftsinformatik oder eine vergleichbare Qualifikation.
          - listitem [ref=f129e131]: Du bringst mehrjährige Berufserfahrung in einer verantwortlichen IT-Funktion und Erfahrung mit komplexen Enterprise-Applikationslandschaften mit.
          - listitem [ref=f129e132]: Du verstehst integrierte Geschäftsprozesse und hast Erfahrung im IT-Projekt-, Provider- und Service-Management sowie mit Cloud-, Integrations- oder Plattformarchitekturen.
          - listitem [ref=f129e133]: Idealerweise kennst du SAP S/4HANA, SAP BTP, Integration Suite / Cloud Integration, EDI, APIs, E-Commerce oder vergleichbare Commerce- und Plattformlösungen.
          - listitem [ref=f129e134]: Kenntnisse in Jira / Confluence, ITIL sowie Cloud- und SaaS-Architekturen sind von Vorteil.
          - listitem [ref=f129e135]: Du musst nicht in jeder Technologie operativer Spezialist sein – entscheidend ist, dass du technische Zusammenhänge verstehst, Architekturentscheidungen beurteilen und Spezialisten fachlich steuern kannst.
          - listitem [ref=f129e136]: Du übernimmst eigenständig Verantwortung, priorisierst konsequent, denkst wirtschaftlich und kommunizierst sicher mit Fachbereichen, Technologiepartnern und Management.
          - listitem [ref=f129e137]: Du möchtest perspektivisch weitergehende Verantwortung für Enterprise Applications, Integration und digitale Plattformen innerhalb von IT & Digitalization übernehmen.
        - heading "Hallo deine Möglichmacher*innen-Vorteile" [level=3] [ref=f129e138]
        - list [ref=f129e140]:
          - listitem [ref=f129e141]: "Du wirst Teil eines Teams, dass auf Augenhöhe zusammenarbeitet: In dem neue Ideen gefragt sind. Und in dem du spürst: Du bist nicht nur eine weitere Personalnummer, du gestaltest mit."
          - listitem [ref=f129e142]: "Globale Teamarbeit: Wir arbeiten gemeinsam über Abteilungs- und Ländergrenzen hinweg an unserer Vision, Premium-Haushaltsgeräte für alle bezahlbar zu ermöglichen."
          - listitem [ref=f129e143]: "Come as you are: Bei uns zählt nicht das Wie, sondern das Ergebnis. Wir stehen für echtes Vertrauen, Flexibilität und ein Umfeld, in dem du dich wohlfühlst."
          - listitem [ref=f129e144]: "Deine Gesundheit wird bei uns groß geschrieben: Kostenfreies Wasser & Kaffee, frisches Obst und ein gut gefüllter Brotkorb, 30 Tage Urlaub, Zuschüsse zu Firmenfitness, kostenlose E-Bike oder E-Auto Ladestationen oder Aktionen mit Krankenkassen."
          - listitem [ref=f129e145]: "Business Bike, Altersvorsorge oder gemeinsam Teamevents: Wir feiern kleine Gesten genauso wie große Erfolge."
          - listitem [ref=f129e146]: "Vergünstigungen: Profitiere von attraktiven Rabatten auf unser gesamtes Severin Sortiment und über Corporate Benefits auch bei vielen weiteren Marken."
          - listitem [ref=f129e147]: "Sprachen lernen leicht gemacht: Du willst deine kommunikativen Fähigkeiten verbessern? Mit unserem 1:1 Sprachcoaching via Preply geht das ganz flexibel."
        - paragraph [ref=f129e148]:
          - strong [ref=f129e149]: Klingt nach deinem Ding?
        - paragraph
