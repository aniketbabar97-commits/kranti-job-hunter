      - generic [ref=f25e90]:
        - heading "Wer wir sind:" [level=2] [ref=f25e91]
        - paragraph
        - paragraph [ref=f25e92]: Die innovate Software GmbH ist spezialisiert auf die SAP-Beratung für E-Business, Mobile-Business und Customer-Relationship-Management.Unsere Kernkompetenzen befinden sich in der Beratung von Unternehmen und bei der Implementierung von unternehmensübergreifenden Geschäftsprozessen, um über verschiedene Kanäle mit Kunden und Lieferanten elektronisch unterstützt zu kommunizieren. Dabei steht im Fokus unserer Geschäftstätigkeit sowohl die strategische Beratung als auch die anschließende Implementierung und Entwicklung der Systeme, welche die elektronischen Geschäftsprozesse ermöglichen.
        - paragraph
      - generic [ref=f25e93]:
        - generic [ref=f25e94]:
          - generic [ref=f25e95]: Die SAP hat unser erfolgreiches Engagement und Know-how mit der Recognized Expertise Partnerschaft im Bereich SAP Commerce ausgezeichnet.
          - generic [ref=f25e98] [cursor=pointer]: ❮
          - generic [ref=f25e99] [cursor=pointer]: ❯
        - heading [level=2]
        - paragraph
    - generic [ref=f25e101]:
      - generic [ref=f25e102]:
        - heading "Ihre Aufgabenfelder:" [level=2] [ref=f25e103]
        - paragraph
        - list [ref=f25e104]:
          - listitem [ref=f25e105]:
            - generic [ref=f25e106]: "Backend-Entwicklung: Auf einem Spring-Applikationsserver programmieren Sie mit Java. Dabei bereiten Sie unter anderem Daten aus internen und externen Datenbanken (z. B. Azure SQL/MSQL bzw. SAP ERP, S/4HANA-System) für die weiteren Prozesse auf."
          - listitem [ref=f25e107]:
            - generic [ref=f25e108]: "Frontend-Entwicklung: Sie stellen die im Backend aufbereiteten Daten gemäß den spezifischen Kundenanforderungen in den jeweiligen E-Commerce-Storefronts dar. Technologien wie z. B. HTML, JSP (TAG), CSS (less), TypeScript, Angular, Node.js und JavaScript kommen hier zum Einsatz."
          - listitem [ref=f25e109]:
            - generic [ref=f25e110]: "Kundenspezifische Fullstack-Implementierungen: Sie entwickeln maßgeschneiderte Lösungen nach individuellen Kundenanforderungen in den jeweiligen Onlineshops."
          - listitem [ref=f25e111]:
            - generic [ref=f25e112]: "Code-Qualitätssicherungen: Sie gewährleisten eine hohe Codequalität, indem Sie z. B. Usertests durchführen oder Tools wie z. B. SonarQube einsetzen."
          - listitem [ref=f25e113]:
            - generic [ref=f25e114]: "Projektmanagement & Kundenkommunikation: Als Teammitglied beteiligen Sie sich gemeinsam mit Ihren Kollegen aktiv an der projektspezifischen Kommunikation mit unseren Kunden. Dies erfolgt unter anderem in virtuellen Meetings, per Telefon/E-Mail bzw. über Projektmanagement-Tools wie z. B. Jira."
        - paragraph [ref=f25e115]:
          - generic [ref=f25e116]: "Ihre mögliche Karriereentwicklung: Mit zunehmender Erfahrung können Sie eine verstärkte Verantwortung in der Projektleitung übernehmen. Dazu gehören u. a: Die Erstellung präziser Anforderungsanalysen, die Konzeption moderner Webanwendungen sowie Projektakquisen."
        - paragraph
      - generic [ref=f25e117]:
        - heading "Das bringen Sie mit:" [level=2] [ref=f25e118]
        - paragraph
        - list [ref=f25e119]:
          - listitem [ref=f25e120]:
            - generic [ref=f25e121]: "Abgeschlossenes Studium oder Berufsausbildung: Sie verfügen über ein abgeschlossenes Studium in (Wirtschafts-)Informatik, Wirtschaftsingenieurwesen, Mathematik oder einem vergleichbaren MINT-Fach. Alternativ haben Sie eine Ausbildung zum Fachinformatiker (m/w/d) für Anwendungsentwicklung, als staatlich anerkannter Informatiker (m/w/d) oder eine ähnliche Ausbildung im IT-Bereich abgeschlossen."
          - listitem [ref=f25e122]:
            - generic [ref=f25e123]: "Erste Berufserfahrung in der IT: Idealerweise konnten Sie bereits erste Praxiserfahrung in der Software- oder Webentwicklung sammeln und sind im Umgang mit der Versionsverwaltungs-Software Git vertraut."
          - listitem [ref=f25e124]:
            - generic [ref=f25e125]: "Analytisches Denken und IT-Affinität: Ihre ausgeprägten analytischen Fähigkeiten ermöglichen es Ihnen, IT-Zusammenhänge schnell zu erfassen und auf unsere E-Commerce-Kundenprojekte zu übertragen."
          - listitem [ref=f25e126]:
            - generic [ref=f25e127]: "Kenntnisse in objektorientierter Programmierung: Sie besitzen grundlegende Kenntnisse in objektorientierten Programmiersprachen, vorzugsweise Java (alternativ C# oder C++), und haben idealerweise erste Erfahrung mit Java-Webframeworks wie Spring."
          - listitem [ref=f25e128]:
            - generic [ref=f25e129]: "Grundkenntnisse in Frontendtechnologien: Idealerweise haben Sie bereits erste praktische Erfahrungen mit HTML, CSS und JavaScript gesammelt und können diese Technologien sicher anwenden."
          - listitem [ref=f25e130]:
            - generic [ref=f25e131]: "Sprachkenntnisse: Sehr gute Deutsch- und Englischkenntnisse in Wort und Schrift sind für Sie selbstverständlich."
          - listitem [ref=f25e132]:
            - generic [ref=f25e133]: "Eigenverantwortung und Teamorientierung: Sie arbeiten gerne sowohl im Team wie auch eigenständig und sind bereit, Verantwortung für Ihre Aufgaben zu übernehmen."
          - listitem [ref=f25e134]:
            - generic [ref=f25e135]: "Lernbereitschaft und Interesse an Innovationen: Sie zeichnen sich durch Begeisterung für neue Themen und die Bereitschaft zur kontinuierlichen Weiterentwicklung aus."
        - paragraph
