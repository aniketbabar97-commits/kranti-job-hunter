        - generic [ref=f5e141]:
          - generic [ref=f5e142]: "Einwilligung für erweiterte Verwendung:"
          - radiogroup "Einwilligung für erweiterte Verwendung:" [ref=f5e143]:
            - generic [ref=f5e146]:
              - heading "Prüfung weiterer Einsatzmöglichkeiten / Bewerbungspool" [level=2] [ref=f5e147]
              - paragraph [ref=f5e148]: Mit Ihrer ausdrücklichen Einwilligung werden wir Ihre Bewerbung auf weitere Einsatzmöglichkeiten in unserer Unternehmensgruppe prüfen und Ihr Profil dafür gegebenenfalls auch an andere Fachbereiche weiterleiten. Die Aufnahme in unseren Bewerbungspool erfolgt ausschließlich zu dem Zweck, Ihre Bewerbung im Rahmen einer zukünftigen freien Stelle berücksichtigen zu können. Dabei kann auch eine Kontaktaufnahme durch ein Unternehmen unserer Unternehmensgruppe erfolgen. Nach Erteilung der Einwilligung in die Aufnahme in den Bewerberpool speichern wir Ihre Daten 12 Monate Danach werden Ihre Daten automatische gelöscht. Sie haben auch hier das Recht nach Art. 7 Abs. 3 Satz 1 DSGVO, Ihre Einwilligung jederzeit mit Wirkung für die Zukunft zu widerrufen, ohne dass die Rechtmäßigkeit der aufgrund der Einwilligung bis zum Widerruf erfolgten Verarbeitung berührt wird; dadurch können Sie auch die Dauer der Verarbeitung bestimmen. Die Bereitstellung der personenbezogenen Daten für den Bewerberpool erfolgt freiwillig; wird sie nicht erteilt, entstehen keine Nachteile. Eine Berücksichtigung Ihrer Bewerbung bei zukünftigen freien Stellen kann jedoch in diesem Fall nicht mehr erfolgen. Sie können Ihre Einwilligung hierzu jederzeit widerrufen.
