        - generic [ref=f5e108]:
          - generic [ref=f5e109]: Einwilligung zum Datenschutz:*
          - radiogroup "Einwilligung zum Datenschutz:" [ref=f5e110]:
            - generic [ref=f5e113]:
              - heading "Datenschutzhinweise für Bewerberinnen und Bewerber" [level=2] [ref=f5e114]:
                - text: Datenschutzhinweise für Bewerberinnen und Bewerber
                - strong
              - paragraph [ref=f5e115]: Wir freuen uns sehr, dass Sie sich für eine Anstellung bei uns interessieren und sich für eine Stelle in einem Unternehmen unserer Gruppe bewerben oder beworben haben. Wir möchten Ihnen nachfolgend gerne Informationen zur Verarbeitung Ihrer personenbezogenen Daten im Zusammenhang mit Ihrer Bewerbung erteilen.
              - heading "Wer ist für Datenverarbeitung verantwortlich?" [level=3] [ref=f5e116]
              - paragraph [ref=f5e117]: "Verantwortlicher im Sinne des Datenschutzrechtes ist die MACS HOLDING GmbH, Storchennest 6, 91555 Feuchtwangen. Sie finden weitere Informationen zu unserem Unternehmen und Unternehmen unserer Gruppe, Angaben zu den vertretungsberechtigten Personen und auch weitere Kontaktmöglichkeiten in unserem Impressum unserer Internetseite: https://www.macs-holding.de/impressum.html."
              - heading "Welche Daten von Ihnen werden von uns verarbeitet? Und zu welchen Zwecken?" [level=3] [ref=f5e118]
              - paragraph [ref=f5e119]: Wir verarbeiten die Daten, die Sie uns im Zusammenhang mit Ihrer Bewerbung zugesendet haben, um Ihre Eignung für die Stelle (oder ggf. andere offene Positionen in unserer Unternehmensgruppe) zu prüfen und das Bewerbungsverfahren durchzuführen.
              - heading "Auf welcher rechtlichen Grundlage basiert das?" [level=3] [ref=f5e120]
              - paragraph [ref=f5e121]: Rechtsgrundlage für die Verarbeitung Ihrer personenbezogenen Daten in diesem Bewerbungsverfahren ist primär § 26 BDSG in der ab dem 25.05.2018 geltenden Fassung. Danach ist die Verarbeitung der Daten zulässig, die im Zusammenhang mit der Entscheidung über die Begründung eines Beschäftigungsverhältnisses erforderlich sind. Sollten die Daten nach Abschluss des Bewerbungsverfahrens ggf. zur Rechtsverfolgung erforderlich sein, kann eine Datenverarbeitung auf Basis der Voraussetzungen von Art. 6 DSGVO, insbesondere zur Wahrnehmung von berechtigten Interessen nach Art. 6 Abs. 1 lit. ) DSGVO erfolgen. Unser Interesse besteht dann in der Geltendmachung oder Abwehr von Ansprüchen.
              - heading "Wie lange werden die Daten gespeichert?" [level=3] [ref=f5e122]
              - paragraph [ref=f5e123]: Daten von Bewerber*innen werden im Falle einer Absage nach 6 Monaten gelöscht. Für den Fall, dass Sie einer weiteren Speicherung Ihrer personenbezogenen Daten zugestimmt haben, werden wir Ihre Daten in unseren Bewerber-Pool übernehmen. Dort werden die Daten nach Ablauf von 12 Monaten gelöscht. Sollten Sie im Rahmen des Bewerbungsverfahrens den Zuschlag für eine Stelle erhalten haben, werden die Daten aus dem Bewerberdatensystem in unser Personalinformationssystem überführt.
              - heading "An welche Empfänger werden die Daten weitergegeben?" [level=3] [ref=f5e124]
              - paragraph [ref=f5e125]: Wir nutzen für den Bewerbungsprozess einen spezialisierten Software-Anbieter. Dieser wird als Dienstleister für uns tätig und kann im Zusammenhang mit der Wartung und Pflege der Systeme ggf. auch Kenntnis von Ihren personenbezogenen Daten erhalten. Wir haben mit diesem Anbieter einen sog. Auftragsverarbeitungsvertrag abgeschlossen, der sicherstellt, dass die Datenverarbeitung in zulässiger Weise erfolgt. Ihre Bewerberdaten werden nach Eingang Ihrer Bewerbung von der Personalabteilung gesichtet. Geeignete Bewerbungen werden dann intern an die Abteilungsverantwortlichen für die jeweils offene Position zugestellt. Dann wird der weitere Ablauf abgestimmt. Im jeweiligen Unternehmen selbst haben grundsätzlich nur die Personen Zugriff auf Ihre Daten, die dies für den ordnungsgemäßen Ablauf unseres Bewerbungsverfahrens benötigen.
              - heading "Wo werden die Daten verarbeitet?" [level=3] [ref=f5e126]
              - paragraph [ref=f5e127]: Die Daten werden ausschließlich in Rechenzentren der Bundesrepublik Deutschland verarbeitet.
              - heading "Ihre Rechte als „Betroffene*r“" [level=3] [ref=f5e128]
              - paragraph [ref=f5e129]: Sie haben das Recht auf Auskunft über die von uns zu Ihrer Person verarbeiteten personenbezogenen Daten. Bei einer Auskunftsanfrage, die nicht schriftlich erfolgt, bitten wir um Verständnis dafür, dass wir dann ggf. Nachweise von Ihnen verlangen, die belegen, dass Sie die Person sind, für die Sie sich ausgeben. Ferner haben Sie ein Recht auf Berichtigung oder Löschung oder auf Einschränkung der Verarbeitung, soweit Ihnen dies gesetzlich zusteht. Ferner haben Sie ein Widerspruchsrecht gegen die Verarbeitung im Rahmen der gesetzlichen Vorgaben. Gleiches gilt für ein Recht auf Datenübertragbarkeit. Sie haben das Recht, sich über die Verarbeitung personenbezogenen Daten durch uns bei einer Aufsichtsbehörde für den Datenschutz zu beschweren.
              - heading "Unser Datenschutzbeauftragter" [level=3] [ref=f5e130]
              - paragraph [ref=f5e131]:
                - text: "Wir haben einen Datenschutzbeauftragten in unserem Unternehmen benannt. Sie erreichen diesen unter folgenden Kontaktmöglichkeiten: Herr Torsten Schmid c/o Schmid Datenschutz und Compliance GmbH Postanschrift: Bopfinger Str. 2 73466 Lauchheim Tel.: 07363 818 959 00 Fax: 07363 818 959 99 E-Mail:"
                - link "t.schmid@schmid-datenschutz.de" [ref=f5e132] [cursor=pointer]:
                  - /url: mailto:t.schmid@schmid-datenschutz.de
                - text: Sie haben das Recht, sich über die Verarbeitung personenbezogenen Daten durch uns bei einer Aufsichtsbehörde für den Datenschutz zu beschweren. Im Übrigen gelten unsere allgemeinen Datenschutzhinweise, die Sie unter https://www.macs-holding.de/datenschutz.html einsehen können.
            - paragraph [ref=f5e134]:
              - strong [ref=f5e135]: Ich habe die Datenschutzerklärung zur Kenntnis genommen und erteile die Einwilligung in die Erhebung und Nutzung meiner vorstehend eingegebenen Daten.
            - generic [ref=f5e136] [cursor=pointer]:
              - radio "Ja" [ref=f5e137]
              - text: Ja
            - generic [ref=f5e138] [cursor=pointer]:
              - radio "Nein" [ref=f5e139]
