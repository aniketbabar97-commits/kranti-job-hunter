  - main [ref=f7e31]:
    - generic [ref=f7e36]:
      - heading "(Senior) Consultant & Project Manager (m/f/d)" [level=1] [ref=f7e38]
      - paragraph [ref=f7e41]: Apply to join us as a new team member!
      - link "Apply Now" [ref=f7e43] [cursor=pointer]:
        - /url: "#contact"
    - generic [ref=f7e53]:
      - heading "We are foobar Agency" [level=2] [ref=f7e55]
      - paragraph [ref=f7e58]: foobar Agency helps retailers and manufacturers in the DACH region set up successful digital sales to business customers and consumers. To do this, we combine commerce, data and AI, all the way to agentic solutions. What counts for our clients is that digital investments show up in their results, and that is how we measure our projects. Our clients include porta Möbel, Segmüller, Lavazza, ABUS and HARTING.
    - generic [ref=f7e63]:
      - heading "Your Role" [level=2] [ref=f7e65]
      - paragraph [ref=f7e68]: You advise our clients on what a project should achieve and take responsibility for getting it there. As a (Senior) Consultant & Project Manager, you work on projects and products in commerce, data and AI, from the first workshop to go-live and beyond. You are the client's first point of contact, lead the collaboration with development and partners, and take on product ownership.
    - generic [ref=f7e73]:
      - heading "Your Tasks" [level=2] [ref=f7e75]
      - generic [ref=f7e77]:
        - heading "Advising" [level=3] [ref=f7e78]
        - list [ref=f7e79]:
          - listitem [ref=f7e80]:
            - generic [ref=f7e81]: You clarify with the client what a project should achieve and translate their business goals into product decisions.
          - listitem [ref=f7e82]:
            - generic [ref=f7e83]: You lead discovery workshops with business units and recommend what gets built and what does not.
          - listitem [ref=f7e84]:
            - generic [ref=f7e85]: After go-live, you check with the client whether the project moves the metrics it was started for.
        - heading "Managing" [level=3] [ref=f7e86]
        - list [ref=f7e87]:
          - listitem [ref=f7e88]:
            - generic [ref=f7e89]: You plan and manage several projects in parallel and are responsible for time, budget and quality.
          - listitem [ref=f7e90]:
            - generic [ref=f7e91]: "You take on product ownership: you prioritize the backlog and make scope decisions with the client."
          - listitem [ref=f7e92]:
            - generic [ref=f7e93]: You raise conflicting goals early and bring about decisions.
          - listitem [ref=f7e94]:
            - generic [ref=f7e95]: You work closely with development, UX and data teams and support releases, go-lives and further development afterwards.
          - listitem [ref=f7e96]:
            - generic [ref=f7e97]: You use AI in your own work and help develop our methods further.
        - paragraph [ref=f7e98]:
          - strong [ref=f7e99]: As a Senior,
          - text: you advise clients up to executive level, lead larger or strategic projects, are a fixed part of proposals and pitches, and support colleagues with your experience.
    - generic [ref=f7e104]:
      - heading "Your Profile" [level=2] [ref=f7e106]
      - list [ref=f7e109]:
        - listitem [ref=f7e110]:
          - generic [ref=f7e111]: Several years of experience in consulting, project management or product ownership on technical digital projects, ideally at an agency or consultancy.
        - listitem [ref=f7e112]:
          - generic [ref=f7e113]: Experience with projects in commerce, data or AI. Experience with agentic solutions is a plus.
        - listitem [ref=f7e114]:
          - generic [ref=f7e115]: You think in terms of the client's metrics and can explain to business units what a technical decision means for their business.
        - listitem [ref=f7e116]:
          - generic [ref=f7e117]: You manage budget and scope confidently, even when several projects run in parallel.
        - listitem [ref=f7e118]:
          - generic [ref=f7e119]: You work agile or traditional, depending on what the project needs.
        - listitem [ref=f7e120]:
          - generic [ref=f7e121]: You talk to clients as equals and address conflicts before they become expensive.
        - listitem [ref=f7e122]:
          - generic [ref=f7e123]: Experience running workshops with business units or executives is a plus.
        - listitem [ref=f7e124]:
          - generic [ref=f7e125]: Very good German (at least C1) and good English.
    - generic [ref=f7e130]:
      - heading "What You Can Expect" [level=2] [ref=f7e132]
      - list [ref=f7e135]:
        - listitem [ref=f7e136]:
          - generic [ref=f7e137]: Projects with retailers and manufacturers on a modern composable stack, with partners such as commercetools, Snowflake and others.
        - listitem [ref=f7e138]:
          - generic [ref=f7e139]: Direct collaboration with management and short decision paths.
        - listitem [ref=f7e140]:
          - generic [ref=f7e141]: Exchange with other consultants, project managers and product owners on the team.
        - listitem [ref=f7e142]:
          - generic [ref=f7e143]: A clear path from Project Manager to Senior, with the opportunity to contribute to discovery, pitches and consulting.
        - listitem [ref=f7e144]:
          - generic [ref=f7e145]: "Professional development is built in: you suggest conferences, courses or certifications, and we plan them together."
        - listitem [ref=f7e146]:
          - generic [ref=f7e147]: AI tools and modern hardware as a natural part of the work.
        - listitem [ref=f7e148]:
          - generic [ref=f7e149]: "Salary: €60,000 to €88,000 gross per year, depending on experience and level."
    - generic [ref=f7e159]:
      - heading "Why foobar Agency?" [level=2] [ref=f7e161]
      - paragraph [ref=f7e164]: "The client interface is where it is decided whether a project shows up in the client's results. That is why we combine consulting and delivery in one role and give it real responsibility: for the goals, for the scope and for the client relationship."
    - generic [ref=f7e166]:
      - heading "What It Means to Work With Us" [level=2] [ref=f7e168]
      - generic [ref=f7e170]:
        - article [ref=f7e171]:
          - generic [ref=f7e172]:
            - heading "An environment that keeps evolving" [level=3] [ref=f7e173]
            - paragraph [ref=f7e175]: We are shifting our focus further toward consulting, data and AI, and you help shape that.
        - article [ref=f7e176]:
          - generic [ref=f7e177]:
            - heading "Room to shape things" [level=3] [ref=f7e178]
            - paragraph [ref=f7e180]: You bring in ideas and influence how we work.
        - article [ref=f7e181]:
          - generic [ref=f7e182]:
            - heading "Working together on site" [level=3] [ref=f7e183]
            - paragraph [ref=f7e185]: Our modern Munich office has plenty of creative space. We spend half our time there together, because our work thrives on direct exchange. On top of that, there is home office and workation.
        - article [ref=f7e186]:
          - generic [ref=f7e187]:
            - heading "Professional development" [level=3] [ref=f7e188]
            - paragraph [ref=f7e190]: Training and time to try out new technologies.
        - article [ref=f7e191]:
          - generic [ref=f7e192]:
            - heading "A team that sticks together" [level=3] [ref=f7e193]
            - paragraph [ref=f7e195]: Flat hierarchies, open communication and colleagues who support each other.
