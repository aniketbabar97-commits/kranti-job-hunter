            - heading "Deine Aufgaben" [level=2] [ref=e154]
            - list [ref=e156]:
              - listitem [ref=e157]: Konzeption, Entwicklung und Betrieb von Backend-Services und APIs mit Schwerpunkt auf Aufbereitung von Produktdaten aus verschiedenen Quellsystemen und deren Ausspielung und Auslieferung an dm-App, Onlineshop und weitere digitale Touchpoints
              - listitem [ref=e158]: Mitgestaltung der Software-Architektur und aktive Beteiligung an Technologieentscheidungen im Team
              - listitem [ref=e159]: Sicherstellung von Performance, Verfügbarkeit, Skalierbarkeit und Security unserer Systeme
              - listitem [ref=e160]: Sicherung der Codequalität durch Code-Reviews, Pair-Programming und automatisierte Tests
              - listitem [ref=e161]: Enge Zusammenarbeit mit Consultants, Frontend-Entwicklern und anderen Produktteams
              - listitem [ref=e162]: Bei Bedarf Mitarbeit im Team der Frontend-Entwicklung
          - generic [ref=e164]:
            - heading "Das bringst Du mit" [level=2] [ref=e165]
            - list [ref=e167]:
              - listitem [ref=e168]: Mehrjährige Erfahrung in der Backend-Entwicklung und mit event-getriebenen Architekturen, idealerweise mit Java oder Kotlin und Spring Boot
              - listitem [ref=e169]: Fundiertes Verständnis von Microservices-Architekturen und RESTful APIs sowie Erfahrung mit cloud-gehosteten Systemen und CI/CD-Pipelines
              - listitem [ref=e170]: Grundkenntnisse in Frontend-Technologien (z. B. TypeScript, React)
              - listitem [ref=e171]: Agiles Mindset sowie eigenverantwortliches und lösungsorientiertes Arbeiten
              - listitem [ref=e172]: Ausgeprägte Kommunikationsstärke und Teamgeist – du arbeitest gern im Team, bringst Ideen ein und holst andere ab
              - listitem [ref=e173]: Fließende Deutsch- und Englischkenntnisse (mindestens C1)
          - generic [ref=e175]:
            - heading "Das bieten wir Dir" [level=2] [ref=e176]
            - list [ref=e178]:
              - listitem [ref=e179]:
                - strong [ref=e180]: "Dialogische Unternehmenskultur:"
                - text: Individuelle Stärken und Ideen unserer Mitarbeitenden sind das Fundament für die (Weiter-)Entwicklung unserer IT-Produkte. Dabei gehen wir offen mit neuen Technologien um, testen und nutzen dabei aktiv unsere Entscheidungsspielräume für ein optimales Ergebnis.
              - listitem [ref=e181]:
                - strong [ref=e182]: "Gesundheit & Vorsorge:"
                - text: "Für Deine Vorsorge bieten wir unterschiedliche Zusatzleistungen für individuelle Bedürfnisse an: von einem Zuschuss zu Deiner betrieblichen Altersvorsorge, einer attraktiven Berufsunfähigkeitsversicherung über Angebote für Deine physische und psychische Gesundheit bis hin zu Kooperationen mit Krankenkassen oder Fitness-Studios und hausinternen Kursen für Dein Wohlbefinden. Ein betriebliches Sozialmanagement rundet das Angebot ab."
              - listitem [ref=e183]:
                - strong [ref=e184]: "Lernen bei dmTECH:"
                - text: Die digitale dm-Lernwelt bietet Dir zeit- und ortsunabhängig über 250 Seminare und Workshops – vom Projektmanagement bis hin zu fachlichen Weiterbildungen. Du hast Zugang zur Lernplattform Udemy mit ihrem breit gefächerten Kursangebot und kannst zusätzlich an externen Events und Weiterbildungen teilnehmen.
              - listitem [ref=e185]:
                - strong [ref=e186]: "Für eine ausgewogene Work-Life-Balance:"
                - text: flexible Arbeitszeiten, mobiles Arbeiten, 37,5-Stunden-Woche und 30 Urlaubstage. Bei einer „Workation“ kannst Du sogar Urlaub und Arbeit verbinden.
              - listitem [ref=e187]:
                - strong [ref=e188]: "Arbeitsatmosphäre:"
                - text: Unsere Räume im „dialogicum" sind hell, großzügig und modern. Die neueste Technik und ergonomisches Mobiliar erleichtern Dir Deine Aufgaben. Im „culinarium" bieten wir Dir täglich frische Mahlzeiten, gesunde Snacks und süße Kleinigkeiten zum fairen Preis.
              - listitem [ref=e189]:
                - strong [ref=e190]: "Zusatzleistungen:"
                - text: Den Erfolg unserer Arbeitsgemeinschaft geben wir gern an Dich zurück – mit Zulagen wie Urlaubs- und Weihnachtsgeld, mit Sonderzahlungen und Warengutscheinen. Du bekommst außerdem 10 % Mitarbeiterrabatt in allen deutschen dm-Märkten und profitierst in vielen Onlineshops von exklusiven Angeboten für dm-Mitarbeitende. Darüber hinaus kannst Du zweimal jährlich aktuelle Smartphones, Tablets oder Laptops für Deinen Privatgebrauch preiswert leasen.
              - listitem [ref=e191]:
                - strong [ref=e192]: "Mobilität:"
                - text: Mit einem Zuschuss für das "Deutschlandticket Job" bist Du günstig unterwegs. Wenn Du lieber Fahrrad fährst, kannst Du auch das JobRad® nutzen. Auf unserem Gelände gibt es genügend Parkplätze, E-Ladestationen und eine Fahrradgarage. Eine S-Bahn-Station und der Anschluss zur Autobahn liegen in direkter Nähe.
