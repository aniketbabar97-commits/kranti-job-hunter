          - heading "Job Details" [level=2] [ref=e140]
          - generic [ref=e142]:
            - paragraph [ref=e143]: Für monatlich 7 Millionen Kundinnen und Kunden, die unsere digitalen Touchpoints nutzen, tragen wir mit unseren digitalen Services maßgeblich zu einem modernen dm-Einkaufserlebnis bei. Mit rund 100 Millionen Sessions pro Monat und über 4.000 Filialen gestalten wir das Omnichannel-Shopping von morgen.
            - paragraph [ref=e144]: Im Bereich Digital Commerce Experience verantworten wir die App, den Onlineshop und die Homepages von dm-drogerie markt in Deutschland sowie in weiteren dm-Ländern. In interdisziplinären, agilen Produktteams arbeiten wir eng zusammen, um unseren Kundinnen und Kunden bestmögliche Einkaufserlebnisse zu bieten.
            - paragraph [ref=e145]: Für die Neu- und Weiterentwicklung unserer Systeme und Services suchen wir Software Engineers mit Schwerpunkt Backend – und der Bereitschaft, auch im Frontend mitzuwirken. Du begeisterst Dich für moderne Technologien, nutzt KI nicht nur als Werkzeug, sondern denkst aktiv mit, wie sie Softwareentwicklung verändert, und willst diesen Wandel gemeinsam mit uns gestalten? Dann freuen wir uns auf Deine Bewerbung!
            - paragraph [ref=e146]: "Unser typischer Tech-Stack: Spring Boot Microservices | Java, Kotlin | TypeScript | React | RESTful APIs | Kafka | PostgreSQL | GCP | VMware Tanzu | GitLab CI | Datadog"
