        - heading [level=2] [ref=f65e338]:
          - strong [ref=f65e339]: "Mission Stroetmann:"
          - strong [ref=f65e340]: Willkommen in deiner Welt
        - paragraph [ref=f65e342]: Tauche ein in die Stroetmann-Welten und erlebe, wo und mit wem du bei uns arbeiten würdest. Hier bekommst du einen echten Eindruck davon, wie vielfältig deine Zukunft bei uns aussehen kann.
      - generic [ref=f65e363]:
        - heading "Deine zukünftigen Kolleg:innen erzählen" [level=2] [ref=f65e364]
        - generic [ref=f65e365]:
          - paragraph [ref=f65e366]: "Echt und direkt: Erfahre aus erster Hand, wie Zusammenhalt und Perspektiven bei L. Stroetmann gelebt werden. Kolleg:innen aus dem Bereich Kaufmännisch erzählen von ihrem Alltag, ihren Highlights und warum sie gerne Teil der Stroetmann-Welt sind."
          - paragraph
      - paragraph [ref=f65e375]:
        - strong [ref=f65e378]: „Ich bin als Azubi bei Stroetmann angefangen und leite heute den Geschäftsbereich Tiernahrung. Bei meiner täglichen Arbeit schätze ich dabei insbesondere das Vertrauen, das mir und meinem Team von dem Vorstand entgegengebracht wird.“
        - strong [ref=f65e379]: Ralf Hülsmann
        - strong [ref=f65e381]: Geschäftsführer Stroetmann Tiernahrung
      - generic [ref=f65e394]:
        - heading "Tiernahrungs-Profi in Handel und Produktion." [level=3] [ref=f65e395]
        - paragraph [ref=f65e397]:
          - text: Als
          - strong [ref=f65e398]: Stroetmann Tiernahrung GmbH & Co. KG
          - text: handeln und produzieren wir für unsere tierischen Freunde. Wir sind Großhändler und Produzent zugleich und garantieren die passende Logistik. Eine Kombination von der unsere Kunden profitieren. Als Großhändler für Tiernahrungsprodukte versorgen wir Fachmärkte, Baumärkte, Drogerien, Lebensmitteleinzelhändler und den Onlinehandel täglich mit hochwertiger Tiernahrung. Über 5.000 Artikel bekannter Marken-Hersteller finden in unserem Lager in Münster Platz und bieten unseren Kunden eine hervorragende Auswahl. In unserer Produktionsstätte in Münster-Amelsbüren produzieren wir Vogel- und Nagerfutter in Top-Qualität nach strengen IFS-Kriterien.
