      - generic [ref=f65e76]:
        - heading "Das erwartet Dich:" [level=2] [ref=f65e77]
        - generic [ref=f65e78]:
          - paragraph [ref=f65e79]:
            - strong [ref=f65e80]: Vor Ort / 2 Tage pro Woche Home-Office möglich
          - paragraph [ref=f65e81]:
            - strong [ref=f65e82]: "Du entwickelst unsere Shops auf Shopware 6 weiter, die B2C-Shops ebenso wie unseren B2B-Shop Tiernahrungsprofi: Du schreibst eigene Plugins, baust neue Funktionen in Storefront und Administration und sorgst dafür, dass unsere Systeme sauber zusammenspielen."
          - list [ref=f65e83]:
            - listitem [ref=f65e84]: Entwicklung eigener Shopware-Plugins und Erweiterungen mit PHP und Symfony
            - listitem [ref=f65e85]: Anpassungen in der Storefront mit Twig und JavaScript sowie in der Administration mit Vue.js
            - listitem [ref=f65e86]: "Anbindung und Pflege der Schnittstellen zu unserem ERP Microsoft Dynamics 365 Business Central: Artikel, Preise, Bestände, Aufträge"
            - listitem [ref=f65e87]: Datenfluss aus unserem PIM Perfion nach Shopware über die Integrationsplattform Alumio
            - listitem [ref=f65e88]: Automatisierung wiederkehrender Prozesse, zum Beispiel mit Make oder n8n
            - listitem [ref=f65e89]: Updates von Shopware und Plugins planen, testen und einspielen sowie Fehler im laufenden Betrieb beheben
            - listitem [ref=f65e90]: Optimierung von Ladezeiten, Caching und Stabilität, auch unter Last in der Black Week
            - listitem [ref=f65e91]: Code Reviews für Tools, die Kollegen (m/w/d) mit KI-Unterstützung gebaut haben, und deren Überführung in stabile Lösungen
      - generic [ref=f65e95]:
        - heading "Das solltest du mitbringen:" [level=2] [ref=f65e96]
        - generic [ref=f65e97]:
          - paragraph [ref=f65e98]:
            - strong [ref=f65e99]: Du kennst Shopware nicht nur als Anwender, sondern weißt, wie Plugins, Datenmodell und Schnittstellen technisch zusammenspielen. Anforderungen setzt Du eigenständig um, von der ersten Analyse bis zum Deployment.
          - list [ref=f65e100]:
            - listitem [ref=f65e101]: Mehrjährige Erfahrung in der Entwicklung mit Shopware 6
            - listitem [ref=f65e102]: Sehr gute Kenntnisse in PHP 8 und Symfony
            - listitem [ref=f65e103]: Erfahrung mit der Data Abstraction Layer sowie mit Admin API und Store API
            - listitem [ref=f65e104]: Sicherer Umgang mit MySQL, Git und Composer
            - listitem [ref=f65e105]: Gute Kenntnisse in Twig, Grundkenntnisse in Vue.js
            - listitem [ref=f65e106]: Erfahrung mit REST- und OData-Schnittstellen sowie mit Deployments, Staging-Umgebungen und sauberen Update-Routinen
            - listitem [ref=f65e107]: Eigenverantwortliche, strukturierte Arbeitsweise sowie gute Deutschkenntnisse in Wort und Schrift
      - generic [ref=f65e111]:
        - heading "Das bekommst du von uns:" [level=2] [ref=f65e112]
        - list [ref=f65e114]:
          - listitem [ref=f65e115]: Familienunternehmen
