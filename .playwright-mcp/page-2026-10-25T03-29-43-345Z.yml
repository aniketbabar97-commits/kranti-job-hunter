      - heading "Dein Weg zu uns - Dein Bewerbungsprozess" [level=2] [ref=f65e135]
      - generic [ref=f65e139]:
        - generic [ref=f65e141]:
          - article [ref=f65e142]:
            - generic [ref=f65e143]: Schritt 1
            - generic [ref=f65e146]: Deine Bewerbung
            - paragraph [ref=f65e148]: Du bewirbst dich ganz einfach online über unser Bewerbungsformular. Anschließend prüfen wir deine Unterlagen sorgfältig und verschaffen uns einen ersten Eindruck.
          - article [ref=f65e149]:
            - generic [ref=f65e150]: Schritt 2
            - generic [ref=f65e153]: Erstkontakt
            - paragraph [ref=f65e155]: In der Regel nehmen wir telefonisch Kontakt mit dir auf, um die nächsten Schritte zu besprechen und erste Fragen zu klären. Optional führen wir ein erstes Kennenlernen per Videocall via Microsoft Teams durch.
          - article [ref=f65e156]:
            - generic [ref=f65e157]: Schritt 3
            - generic [ref=f65e160]: Persönliches Kennenlernen
            - paragraph [ref=f65e162]: Im persönlichen Gespräch vor Ort lernen wir uns intensiver kennen. Je nach Position kann ein weiteres Gespräch folgen, um offene Punkte zu vertiefen oder mit weiteren Führungskräften oder Teammitgliedern in den Austausch zu gehen.
          - article [ref=f65e163]:
            - generic [ref=f65e164]: Schritt 4
            - generic [ref=f65e167]: Vertragsangebot
            - paragraph [ref=f65e169]: Wenn alles passt, erhältst du von uns ein Vertragsangebot und alle wichtigen Informationen zu deinem Start.
          - article [ref=f65e170]:
            - generic [ref=f65e171]: Schritt 5
            - generic [ref=f65e174]: Dein Start bei uns
            - paragraph [ref=f65e176]: Willkommen im Team! Wir sorgen dafür, dass du dich von Anfang an gut aufgehoben fühlst und unterstützen dich beim Einstieg.
        - button "Weiter" [ref=f65e177] [cursor=pointer]
