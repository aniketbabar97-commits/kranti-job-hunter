            - generic [ref=f46e73]:
              - paragraph [ref=f46e74]: "Die MHW Bike-House GmbH: Seit über 30 Jahren verkaufen wir in unserem über 2.000 m² großen Radcenter in Schwäbisch Hall Fahrräder, E-Bikes und Zubehör. Inzwischen sind wir zu einem der größten Online-Versandhändler für alle Arten von Fahrrädern und Zubehör aufgestiegen und werden weiter wachsen."
              - paragraph [ref=f46e75]: Deshalb suchen wir Verstärkung für unser Marketing-Team. Wenn du also Lust und Motivation hast, Dinge in dieser spannenden Branche voranzutreiben und umzusetzen, freuen wir uns, dich kennenzulernen.
              - separator [ref=f46e76]: ···
              - 'heading "Jobart: Vollzeit" [level=4] [ref=f46e77]'
              - heading "Deine Aufgaben bei uns:" [level=3] [ref=f46e78]
              - list [ref=f46e79]:
                - listitem [ref=f46e80]: Erstellung von Konzepten und Strategien zum Wachstum unserer Online-Shops
                - listitem [ref=f46e81]: Umsetzung der Maßnahmen in Zusammenarbeit mit dem Entwicklerteam und externen Dienstleistern
                - listitem [ref=f46e82]: Pflege des Shopware-Shops (Plugin-Aktualisierungen, Shop-Updates usw.)
                - listitem [ref=f46e83]: Aufbereiten von Produktdaten für den Import
                - listitem [ref=f46e84]: Umsetzen von SEO-Strategien
              - heading "Das bringst du mit:" [level=3] [ref=f46e85]
              - list [ref=f46e86]:
                - listitem [ref=f46e87]: Berufserfahrung im Bereich E-Commerce in einem Unternehmen oder einer Agentur
                - listitem [ref=f46e88]: Erfahrung mit Shopware 6
                - listitem [ref=f46e89]: Begriffe wie Customer Journey, User Experience, Back- und Frontend sind für dich keine Fremdwörter
                - listitem [ref=f46e90]: Sehr gute Kenntnisse in HTML, CSS und TWIG (optional PHP, Java oder MySQL)
                - listitem [ref=f46e91]: Erfahrung mit Adobe Creative Cloud, insbesondere Photoshop und InDesign (optional Illustrator, Premiere und Lightroom)
                - listitem [ref=f46e92]: Leidenschaft für die Themen Webentwicklung, Design, SEO
                - listitem [ref=f46e93]: Erfahrung mit WordPress und im Printbereich
                - listitem [ref=f46e94]: Gute MS Office Kenntnisse – insbesondere Excel
              - heading "Wir bieten dir:" [level=3] [ref=f46e95]
              - list [ref=f46e96]:
                - listitem [ref=f46e97]: Ein interessantes und vielseitiges Aufgabengebiet in einem mittelständischen Unternehmen mit flachen Hierarchien und einer spannenden Branche
                - listitem [ref=f46e98]: Verantwortung und eine hohe Selbstständigkeit sowie Gestaltungsmöglichkeiten
                - listitem [ref=f46e99]: Interne und externe Weiterbildungsmöglichkeiten
                - listitem [ref=f46e100]: Vergünstigter Personaleinkauf
                - listitem [ref=f46e101]: Diverse Mitarbeiterevents
