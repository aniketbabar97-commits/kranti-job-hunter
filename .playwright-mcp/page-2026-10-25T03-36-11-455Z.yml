        - generic [ref=f26e199]:
          - heading "Eine Oase in der Arbeitswelt" [level=2] [ref=f26e200]
          - 'heading "Unsere Kultur: Innovation, Eigenverantwortung & Teamgeist" [level=2] [ref=f26e201]'
          - paragraph [ref=f26e202]: Unser Unternehmen ist mehr als nur ein Arbeitsplatz – es ist ein Ort, an dem Innovation auf Gemeinschaft trifft und Mitarbeiter nicht nur Kollegen, sondern Teil eines harmonischen Teams sind. Mit flachen Hierarchien, einem kollegialen Miteinander und einer modernen, technikaffinen Arbeitsweise schaffen wir ein Umfeld, in dem sich jeder wohlfühlen und aktiv einbringen kann.
          - heading "Wohlfühlatmosphäre & Benefits, die wirklich zählen" [level=2] [ref=f26e203]
          - paragraph [ref=f26e204]: "Wir legen großen Wert darauf, dass sich unsere Mitarbeiter nicht nur beruflich, sondern auch persönlich entfalten können. Das beginnt beim frisch gekochten Mittagessen und reicht über kostenfreie Getränke, Obst und Fitness-Snacks bis hin zu einer Hansefit-Mitgliedschaft. Unser Standort im Grünen lädt zu kleinen Pausen-Walks ein, und wer seinen Hund mitbringen möchte – herzlich willkommen! Zwei Tage Homeoffice pro Woche bieten zusätzliche Flexibilität. Und das Beste: Jeder darf seine eigene Playlist hören und seinen Arbeitsplatz so gestalten, wie es am besten passt."
          - heading "Karriere & Entwicklungsmöglichkeiten" [level=2] [ref=f26e205]
          - paragraph [ref=f26e206]: Egal ob in Verkauf, Grafik, Programmierung, Produktion oder Import – bei uns gibt es vielseitige Entwicklungsperspektiven. Wir fördern unsere Mitarbeiter durch Mentoring, Weiterbildungsbudgets und die Möglichkeit, z. B. einen Ausbilderschein oder sonstige Fortbildungen zu machen. Wer sich engagiert, hat die Chance, Verantwortung zu übernehmen und seine eigene Karriere aktiv zu gestalten.
          - heading "Unsere Vision & deine Rolle darin" [level=2] [ref=f26e207]
          - paragraph [ref=f26e208]: Wir wachsen stetig und haben große Pläne für die Zukunft. Um unsere Position weiter auszubauen, setzen wir auf ein starkes Team, das Innovation lebt und Herausforderungen mit Begeisterung annimmt. Unsere Mitarbeiter spielen dabei eine zentrale Rolle – denn unser Erfolg entsteht durch ihre Ideen, ihr Engagement und ihre Leidenschaft.
          - heading "Dein perfekter Arbeitsplatz?" [level=2] [ref=f26e209]
          - blockquote [ref=f26e210]: „Ich bin zufrieden und will nichts ändern.“
          - paragraph [ref=f26e211]: Wenn du in einem Jahr zurückblickst und das sagen kannst, dann wissen wir, dass wir unser Ziel erreicht haben.
          - paragraph [ref=f26e212]:
            - strong [ref=f26e213]: Willst du Teil dieser besonderen Unternehmenskultur werden?
            - text: Dann freuen wir uns darauf, dich kennenzulernen!
          - generic [ref=f26e215]:
            - paragraph [ref=f26e216]: "✉️ Bewirb dich jetzt per E-Mail:"
            - paragraph [ref=f26e217]:
              - link "jobs@pro-discount.one" [ref=f26e218] [cursor=pointer]:
                - /url: mailto:jobs@pro-discount.one
