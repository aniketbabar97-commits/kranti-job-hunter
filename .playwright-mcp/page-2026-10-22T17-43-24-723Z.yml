        - generic [ref=f2e165]:
          - heading "Vollständige Stellenbeschreibung" [level=4] [ref=f2e166]
          - generic [ref=f2e167]:
            - paragraph [ref=f2e168]: "#WorkConnectGrow"
            - paragraph [ref=f2e169]: Wie sorgt man dafür, dass Produktdaten zuverlässig dort ankommen, wo sie gebraucht werden – über Systemgrenzen hinweg, bei Handelspartnern und angebundenen Services? Mit guter Integration.
            - paragraph [ref=f2e170]: Als Software Engineer - Integration entwickelst und betreibst Du im Development Team unserer PIM-Lösung BYRD die Anwendungen und Schnittstellen, die genau das möglich machen. Du entwickelst bestehende Integrationen weiter, programmierst neue Lösungen und sorgst dafür, dass Daten zuverlässig, skalierbar und performant durch unsere Systeme fließen.
            - paragraph [ref=f2e171]: "Dabei arbeitest Du mit modernen Cloud-Technologien in der Google Cloud und hast direkten Einfluss darauf, wie unsere Plattform mit der digitalen Welt verbunden ist. Deine Arbeit ist damit weit mehr als „Daten von A nach B“ zu bewegen: Du sorgst dafür, dass komplexe Datenflüsse zuverlässig funktionieren und schaffst die technische Grundlage für erfolgreichen Digital Commerce."
            - paragraph [ref=f2e172]: Deine Aufgaben
            - list [ref=f2e173]:
              - listitem [ref=f2e174]: Du stellst den stabilen Betrieb unserer Anwendungen sicher und entwickelst sie kontinuierlich weiter, damit Produktdaten zuverlässig aufgenommen, aufbereitet und an unsere Handelspartner ausgeliefert werden.
              - listitem [ref=f2e175]: Du entwickelst unser Datenmodell weiter und setzt neue fachliche Anforderungen an den Produkt-Content technisch um.
              - listitem [ref=f2e176]: Du betreust unsere Schnittstellen zu angebundenen Systemen und Services - unter anderem zu GDSN, SFTP und Asset-Systemen.
              - listitem [ref=f2e177]: Du analysierst Störungen in unseren Datenflüssen, findest die Ursachen und entwickelst nachhaltige Lösungen, damit Fehler möglichst gar nicht erst wieder auftreten.
              - listitem [ref=f2e178]: Du überwachst unsere Integrationsanwendungen und sorgst mit einem zuverlässigen Monitoring dafür, dass mögliche Störungen früh erkannt werden.
              - listitem [ref=f2e179]: Gemeinsam mit dem Entwicklungsteam gestaltest Du die technische Weiterentwicklung unserer Lösungen und wirkst bei Architekturentscheidungen aktiv mit.
            - paragraph [ref=f2e180]: Dein Talent
            - list [ref=f2e181]:
              - listitem [ref=f2e182]: Studium der (Wirtschafts-) Informatik oder eine vergleichbare technisch orientierte Ausbildung
              - listitem [ref=f2e183]: Sehr gute Kenntnisse in Ruby oder Java und die Bereitschaft, mit Ruby zu arbeiten
              - listitem [ref=f2e184]: Mehrjährige Erfahrung in der Entwicklung und im Betrieb verteilter Anwendungen
              - listitem [ref=f2e185]: Erfahrung mit nachrichten- und dateibasierten Datenflüssen sowie mit APIs
              - listitem [ref=f2e186]: Erfahrung mit Kubernetes und Cloud-Plattformen, idealerweise mit der Google Cloud
              - listitem [ref=f2e187]: Sicherer Umgang mit Linux, Git und CI/CD-Pipelines
              - listitem [ref=f2e188]: Analytisches Vorgehen bei Störungen in Produktivsystemen
              - listitem [ref=f2e189]: Erfahrung in agilen Entwicklungsumgebungen (z. B. Scrum)
              - listitem [ref=f2e190]: Sehr gute Deutsch- und/ oder Englischkenntnisse
              - listitem [ref=f2e191]: "Von Vorteil: Erfahrung mit GDSN/ GS1"
            - paragraph [ref=f2e192]: Unser Angebot für Dich
            - list [ref=f2e193]:
              - listitem [ref=f2e194]: Arbeiten im Homeoffice und / oder an unserem Standort in Köln mit Blick auf den Rhein
              - listitem [ref=f2e195]: Flexible Arbeitszeitgestaltung
              - listitem [ref=f2e196]: Kostenlose Mitgliedschaft (M Paket) im Urban Sports Club
              - listitem [ref=f2e197]: Option auf Workation
              - listitem [ref=f2e198]: Parkplatz im Rheinauhafen-Parkhaus oder Deutschlandticket
              - listitem [ref=f2e199]: Getränke, gesunde Snacks & Nespresso
              - listitem [ref=f2e200]: Subventionierte Mittagessen von mealmates
              - listitem [ref=f2e201]: Modernes Equipment von Apple
              - listitem [ref=f2e202]: Interne Fortbildungen, Teilnahme an Seminaren
              - listitem [ref=f2e203]: Teambuilding Meet-up s
              - listitem [ref=f2e204]: Experten-Netzwerk
            - paragraph [ref=f2e205]: Über uns
            - paragraph [ref=f2e206]: BAYARD ist ein Unternehmen der Markant Gruppe und unterstützt Hersteller, Marken und Händler dabei, ihre Produktdaten über den gesamten Product Content Lifecycle hinweg erfolgreich zu managen. Mit langjähriger Erfahrung in den Bereichen Product Information Management (PIM), Data Syndication und Product Experience Management, umfassender Beratungskompetenz sowie der eigenen Technologie BYRD begleitet BAYARD Unternehmen bei der Optimierung ihrer Produktdatenprozesse und der kanalübergreifenden Bereitstellung von Produktinformationen.
            - paragraph [ref=f2e207]: Die Product Content Lifecycle Management Technologie BYRD vereint PIM, Product Content Syndication, GDSN und KI-gestützte Prozesse in einer zentralen Lösung für skalierbares Product Content Management. Mit BYRD steuern Unternehmen ihre Produktinformationen effizient und schaffen die Grundlage für überzeugende Produkterlebnisse, Retail Media, KI-Anwendungen und nachhaltigen Erfolg im Digital Commerce.
            - paragraph [ref=f2e208]: Führende Handelsunternehmen wie die Schwarz Gruppe, Douglas, Migros und Colruyt sowie Konsumgüterhersteller wie Danone, die Radeberger-Gruppe, Werner & Mertz und Cosnova vertrauen auf die Lösungen und Services von BAYARD, um ihre Datenqualität sowie die Effizienz bei der Beschaffung, Aggregation und Syndication von Product Content nachhaltig zu steigern.
            - paragraph [ref=f2e209]: Bist du begeistert? Be part of the change!
            - paragraph [ref=f2e210]: "Sende uns einfach Deine Bewerbung mit Angabe Deiner Gehaltsvorstellung und Deinem frühestmöglichen Starttermin per E-Mail an: office+softwareengineerintegration@bayard-consulting.com."
            - paragraph [ref=f2e211]: "Dein Ansprechpartner für diese Position ist Bent Auweiler. Bei weiteren Fragen zur Stellenausschreibung kannst Du Dich gerne auch telefonisch an uns wenden: +49 221 716 185 0 oder wirf einen Blick in unsere FAQ auf unserer Karriereseite."
            - paragraph [ref=f2e212]: WIR FREUEN UNS AUF DEINE BEWERBUNG!
            - paragraph [ref=f2e213]: "Gehalt: 60.000,00€ - 70.000,00€ pro Jahr"
            - paragraph [ref=f2e214]: "Leistungen:"
            - list [ref=f2e215]:
