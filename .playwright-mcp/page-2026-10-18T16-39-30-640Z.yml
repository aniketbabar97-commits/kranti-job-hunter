          - generic [ref=e31]: Ergänze unser Team
        - heading "PIM-Consultant (m/w/d)" [level=2] [ref=e32]
      - paragraph [ref=e37]: "Wir konzipieren und realisieren neue E-Commerce-Projekte oder optimieren ihre bereits bestehende Lösungen - egal ob Onlineshop, Marktplatz, PIM (Product Information Management) Web oder App-Entwicklung. Wir wollen digitale Zukunft gestalten – und sie beschleunigen mit dir als: PIM-Consultant (m/w/d) Du möchtest in einem abwechslungsreichen, kreativen Umfeld mit persönlichen Freiräumen arbeiten? Und du scheust weder die Verantwortung noch die Herausforderungen, die deine Projekte mit sich bringen? Dann starte bei uns durch! Als PIM-Consultant (w/m/d) hilfst du unseren Kund:Innen, ihre Produktdaten optimal zu nutzen. Du berätst sie bei der Einführung und Verbesserung von PIM-Systemen und unterstützt sie bei der Umsetzung ihrer digitalen Projekte."
    - generic [ref=e40]:
      - img "Mitarbeiterin am Macbook" [ref=e42]
      - generic [ref=e44]:
        - heading "Deine Aufgaben in Kurzform" [level=2] [ref=e45]
        - list [ref=e48]:
          - listitem [ref=e51]: Du analysierst die Anforderungen unserer Kund:Innen und entwickelst maßgeschneiderte Lösungen für ihr Produktdatenmanagement.
          - listitem [ref=e54]: Du gestaltest Datenmodelle, Rechte- und Rollenkonzepte sowie Produktdatenprozesse und integrierst diese in die Systeme unserer Kunden.
          - listitem [ref=e57]: Du bist der Ansprechpartner für unsere Kund:Innen und dein Team – von der Planung bis zur Umsetzung und Erfolgsmessung.
          - listitem [ref=e60]: Du sorgst für Transparenz im Projektverlauf und hilfst unseren Kund:Innen, Hindernisse selbstständig zu überwinden.
    - generic [ref=e62]:
