        - generic [ref=f9e117]:
          - heading "Wie bewerbe ich mich am Besten?" [level=3] [ref=f9e118]
          - paragraph [ref=f9e119]: Wir leben in einem digitalen Zeitalter, weshalb wir ausschließlich digitale Bewerbungen akzeptieren. Hierfür bieten wir, neben der klassischen Bewerbung per E-Mail mit relevanten Dateianhängen, auch unbürokratische Bewerbungsprozesse im Schnellverfahren. Wir nehmen uns lieber Zeit, um mit Dir persönlich zu sprechen, als Deine Zeit für die Erstellung und Zusammenstellung von "unbedingt erforderlichen" Dokumenten zu vergeuden. Unbedingt erforderlich bist nämlich nur Du, nicht aber Deine ganzen Papiere. Wenn Du diese hast, sende sie gerne mit, wenn nicht, verschwende keine Zeit, lass uns lieber reden!
