        - generic [ref=f4e55]:
          - heading [level=3] [ref=f4e56]:
            - strong [ref=f4e57]: About GetYourGuide
          - paragraph [ref=f4e58]: GetYourGuide is the globally leading marketplace for unforgettable travel experiences. Travelers use GetYourGuide to discover the best things to do in a destination. Since its founding in 2009, people from all over the world have booked more than 150 million tours, activities, and attraction tickets through GetYourGuide. Powered by a global team of over 800 travel experts and technologists, we are headquartered in Berlin and have 17 local offices around the world.
          - heading [level=3] [ref=f4e59]:
            - strong [ref=f4e60]: "The Mission:"
          - paragraph [ref=f4e61]: "GetYourGuide knows a lot about travelers, and we want to make better use of that data. Identity, booking history, browsing behavior, care conversations, preferences and predictions all sit in separate systems, in different shapes. The User Platform team is a brand new function with truly outsized opportunity for impact. They are building the traveler context layer: resolving who someone is across devices and sessions, and turning scattered signals into a shared, interpretable, and predictive understanding that every team can build on. As this function matures, the scope will extend to our other users over time."
          - heading [level=3] [ref=f4e62]:
            - strong [ref=f4e63]: "You will:"
          - list [ref=f4e64]:
            - listitem [ref=f4e65]: Work with engineers, designers, and analysts
            - listitem [ref=f4e66]: Help to enable your mission team to iterate fast and learn about our customers by designing, launching, and iterating on A/B experiments
            - listitem [ref=f4e67]: Maintain high-quality standards and continuously improve our code base, system, and processes
            - listitem [ref=f4e68]: Design and develop efficient solutions that can continue to scale
            - listitem [ref=f4e69]: Mentor other team members and be involved with hiring
            - listitem [ref=f4e70]: Contribute to the team’s roadmap and long-term strategy
            - listitem [ref=f4e71]: Work with Java, Spring Boot, MySQL, PostgreSQL, GraphQL, Kafka, and Kubernetes
          - heading [level=3] [ref=f4e72]:
            - strong [ref=f4e73]: "Who you are:"
          - list [ref=f4e74]:
            - listitem [ref=f4e75]: 6+ years of software development experience
            - listitem [ref=f4e76]: Expertise in web application development using component-based frameworks
            - listitem [ref=f4e77]: High proficiency in Java
            - listitem [ref=f4e78]: Experience designing architecture and deployment of web applications & services
            - listitem [ref=f4e79]: Experience with writing tests
            - listitem [ref=f4e80]: Ability to turn ideas into fast, reliable, and maintainable code
            - listitem [ref=f4e81]: Positive, proactive team player who is passionate about their craft
            - listitem [ref=f4e82]: Customer-centric prioritization and data-driven decision-making
            - listitem [ref=f4e83]: Mature judgment in choosing when and how to use AI tools, proactively lead the team in adopting and evaluating new AI technologies, and support others in applying AI effectively while maintaining strong standards for quality, security, and governance.
            - listitem [ref=f4e84]: Excellent written and verbal communication skills in English, with the ability to clearly explain technical concepts to others
          - heading [level=3] [ref=f4e85]:
            - strong [ref=f4e86]: "Bonus points for:"
          - list [ref=f4e87]:
            - listitem [ref=f4e88]: Experience with A/B testing, hypothesis building, and event-based analytics
            - listitem [ref=f4e89]: Prior experience working in the e-commerce space
            - listitem [ref=f4e90]: Prior experience in start-up environments
          - heading [level=3] [ref=f4e91]:
            - strong [ref=f4e92]: "How we set you up for success:"
          - list [ref=f4e93]:
            - listitem [ref=f4e94]: Annual personal growth budget and mentorship programs for continuous learning and development
            - listitem [ref=f4e95]: Work from anywhere in the world for 30 days per year
            - listitem [ref=f4e96]: A hybrid working approach with three days of in-office collaboration (Mon, Tue, Thur) and two days of optional at-home focus time.
            - listitem [ref=f4e97]: Opportunities to collaborate and socialize with team members through quarterly team events and yearly company-wide events
            - listitem [ref=f4e98]: Monthly transportation and fitness budget
            - listitem [ref=f4e99]: Discounts for you, your friends, and family on GetYourGuide activities
            - listitem [ref=f4e100]: Language reimbursement program
            - listitem [ref=f4e101]: Health and wellness benefits
          - paragraph [ref=f4e102]: And more…
          - heading [level=3] [ref=f4e103]:
            - strong [ref=f4e104]: We look forward to hearing from you
          - paragraph [ref=f4e105]:
            - text: Unlock your full potential and join our mission to create unforgettable experiences for millions around the world. If you have the skills and passion for joining our team, we invite you to apply by submitting your CV/resume in English through the form below. Check out
            - link "how we hire" [ref=f4e106] [cursor=pointer]:
              - /url: https://www.getyourguide.careers/how-we-hire
            - text: for tips and visibility into our process and check out
            - link "life at GetYourGuide." [ref=f4e107] [cursor=pointer]:
              - /url: https://www.getyourguide.careers/life-at-getyourguide
            - text: If you have any further questions, please do not hesitate to contact us via jobs@getyourguide.com.
          - heading [level=3] [ref=f4e108]:
            - strong [ref=f4e109]: We are an equal opportunity employer
          - paragraph [ref=f4e110]: We commit that every qualified person will be evaluated according to skills regardless of age, gender identity, ethnicity, sexual orientation, disability status, or religion. Please refrain from including your picture and age with the application.
