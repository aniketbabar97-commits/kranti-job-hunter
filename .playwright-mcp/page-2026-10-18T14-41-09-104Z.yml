          - generic [ref=f18e90]:
            - generic [ref=f18e92]:
              - heading "Über unseren Kunden" [level=2] [ref=f18e93]
              - generic [ref=f18e94]:
                - paragraph [ref=f18e95]: Für unseren erfolgreichen Partner sind wir auf der Suche nach einem SAP CX Consultant (m/w/d) zur unbefristeten Festanstellung.
                - paragraph [ref=f18e96]: Unser Kunde ist ein innovativer IT-Dienstleister mit mehreren tausend Mitarbeitenden an zahlreichen Standorten europaweit. Das Unternehmen begleitet seine Kunden bei der digitalen Transformation und entwickelt Lösungen, die moderne Technologien, hohe Servicequalität und nachhaltigen Geschäftsnutzen verbinden. Klare Strukturen, ein wertschätzender Umgang und ein starker Fokus auf persönlicher und fachlicher Weiterentwicklung liegen unseren Partner besonders am Herzen. Mitarbeitende arbeiten in modernen, agilen Teams und erhalten die Möglichkeit, Verantwortung zu übernehmen, eigene Ideen einzubringen und an technologisch anspruchsvollen Projekten mitzuwirken.
                - paragraph [ref=f18e97]: Dieses Umfeld schafft Stabilität und gleichzeitig Raum für Wachstum und echte Gestaltungsmöglichkeiten.
            - generic [ref=f18e98]:
              - heading "Aufgaben" [level=2] [ref=f18e99]
              - list [ref=f18e101]:
                - listitem [ref=f18e102]:
                  - paragraph [ref=f18e103]: Sie konzipieren und implementieren Lösungen im SAP Customer Experience Umfeld, beispielsweise in Sales Cloud, Service Cloud oder Commerce Cloud
                - listitem [ref=f18e104]:
                  - paragraph [ref=f18e105]: Sie optimieren End to End Prozesse entlang der Customer Journey und integrieren SAP CX nahtlos in bestehende SAP-Landschaften wie S 4HANA
                - listitem [ref=f18e106]:
                  - paragraph [ref=f18e107]: Sie analysieren fachliche Anforderungen im Vertrieb, Service oder Marketing und setzen diese durch gezieltes Customizing und Erweiterungen um
                - listitem [ref=f18e108]:
                  - paragraph [ref=f18e109]: Sie beraten Kunden strategisch zur Weiterentwicklung ihrer SAP CX Architektur und treiben innovative Konzepte aktiv voran
            - generic [ref=f18e110]:
              - heading "Profil" [level=2] [ref=f18e111]
              - list [ref=f18e113]:
                - listitem [ref=f18e114]:
                  - paragraph [ref=f18e115]: Fundierte Berufserfahrung im SAP CX-Umfeld
                - listitem [ref=f18e116]:
                  - paragraph [ref=f18e117]: Erfahrung im Umgang mit angrenzenden SAP-Modulen
                - listitem [ref=f18e118]:
                  - paragraph [ref=f18e119]: Sehr gute Deutschkenntnisse
            - generic [ref=f18e120]:
              - heading "Ihre Vorteile" [level=2] [ref=f18e121]
              - list [ref=f18e123]:
                - listitem [ref=f18e124]:
                  - paragraph [ref=f18e125]: Attraktive Vergütung mit leistungsorientierten Boni
                - listitem [ref=f18e126]:
                  - paragraph [ref=f18e127]: Flexible Arbeitszeiten
                - listitem [ref=f18e128]:
                  - paragraph [ref=f18e129]: Hoher Homeoffice Anteil
                - listitem [ref=f18e130]:
                  - paragraph [ref=f18e131]: 30 Urlaubstage zzgl. Sondertage
                - listitem [ref=f18e132]:
                  - paragraph [ref=f18e133]: Innovative Arbeitsumgebung mit modernster Technologie
                - listitem [ref=f18e134]:
                  - paragraph [ref=f18e135]: Weiterbildung und Entwicklung durch interne Schulungen, externe Fortbildungen und individuelle Programme (u. a. direkt bei SAP)
                - listitem [ref=f18e136]:
                  - paragraph [ref=f18e137]: Gesundheits- und Vorsorgeleistungen, inklusive betrieblicher Altersvorsorge (BAV) und Krankenversicherungen
                - listitem [ref=f18e138]:
                  - paragraph [ref=f18e139]: Zuschüsse für Fitnessstudio-Mitgliedschaften oder Gesundheitsprogramme
                - listitem [ref=f18e140]:
                  - paragraph [ref=f18e141]: Psychologische Unterstützung und Wellness-Angebote zur Förderung der mentalen Gesundheit
                - listitem [ref=f18e142]:
                  - paragraph [ref=f18e143]: Teambuilding-Events und regelmäßige Firmenfeiern
                - listitem [ref=f18e144]:
                  - paragraph [ref=f18e145]: Elternzeit- und Kinderbetreuungsangebote, z. B. Zuschüsse oder Unterstützung bei der Suche nach Betreuungseinrichtungen
                - listitem [ref=f18e146]:
                  - paragraph [ref=f18e147]: Kultur- und Freizeitangebote, z. B. Firmenrabatte für Veranstaltungen und Freizeitaktivitäten
                - listitem [ref=f18e148]:
                  - paragraph [ref=f18e149]: Kostenlose Snacks und Getränke (Obst, Wasser, Kaffee)
                - listitem [ref=f18e150]:
                  - paragraph [ref=f18e151]: Private Parkplätze und eine hervorragende Kantine mit eigener Küche
                - listitem [ref=f18e152]:
                  - paragraph [ref=f18e153]: Kostenloser General-Gesundheitscheck
