          - listitem [ref=f5e34]:
            - text: Sie kümmern sich um die
            - strong [ref=f5e35]: Schnittstellen und Integrationen
            - text: und arbeiten dabei eng mit internen Teams und den begleitenden externen Dienstleistern zusammen
          - listitem [ref=f5e36]:
            - text: Sie gestalten die
            - strong [ref=f5e37]: Weiterentwicklung der SAP-CX-Landschaft
            - text: aktiv mit und übernehmen perspektivisch auch Anforderungsmanagement und Betreuung im laufenden Betrieb
