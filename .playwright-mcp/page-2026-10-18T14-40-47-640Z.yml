        - list [ref=f5e57]:
          - listitem [ref=f5e58]: Sie verfügen über mehrjährige Erfahrung mit SAP CX und idealerweise über Kenntnisse in der Administration und im Customizing. Alternativ sind auch fundierte SAP-CRM-Kenntnisse interessant, wenn Sie Lust haben, sich in SAP CX weiterzuentwickeln
          - listitem [ref=f5e59]: Sie verstehen Customer-Experience- und Geschäftsprozesse und können fachliche Anforderungen aufnehmen, analysieren und in praktikable SAP-Lösungen übersetzen
          - listitem [ref=f5e60]: Sehr gute Deutschkenntnisse in Wort und Schrift sowie gute Englischkenntnisse für die Zusammenarbeit im internationalen Umfeld
          - listitem [ref=f5e61]: Sie arbeiten eigenständig, kommunikationsstark und lösungsorientiert und haben Freude daran, eine neue SAP-CX-Landschaft aktiv mit aufzubauen und langfristig weiterzuentwickeln
