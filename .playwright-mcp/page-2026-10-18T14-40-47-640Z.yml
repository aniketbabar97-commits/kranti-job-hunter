          - listitem [ref=f5e40]:
            - strong [ref=f5e41]: "Sicherer Arbeitsplatz:"
            - text: Arbeiten Sie bei einem wirtschaftlich sehr erfolgreichen und zukunftssicheren Unternehmen mit langfristiger Perspektive
          - listitem [ref=f5e42]:
            - strong [ref=f5e43]: "38-Stunden-Woche:"
            - text: Eine gute Balance zwischen anspruchsvoller Aufgabe und persönlicher Zeit
          - listitem [ref=f5e44]:
            - strong [ref=f5e45]: "Flexibles Arbeiten:"
            - text: Sie profitieren von einem sehr flexiblen Mix aus mobilem Arbeiten und Präsenz im Büro – ganz nach Aufgabe und persönlicher Situation
          - listitem [ref=f5e46]:
            - strong [ref=f5e47]: "Starkes Team:"
            - text: Ein altersgemischtes Team mit erfahrenen Kolleginnen und Kollegen sowie jüngeren Teammitgliedern sorgt für unterschiedliche Perspektiven und einen guten Wissenstransfer
          - listitem [ref=f5e48]:
            - strong [ref=f5e49]: "Gestaltungsspielraum:"
            - text: Eine spannende SAP-CX-Aufgabe mit viel Raum, die neue Lösung mit aufzubauen und langfristig weiterzuentwickeln
          - listitem [ref=f5e50]:
            - strong [ref=f5e51]: "Weiterentwicklung:"
            - text: Fundierte Einarbeitung sowie fachliche und persönliche Entwicklungsmöglichkeiten in einem modernen IT-Umfeld
          - listitem [ref=f5e52]:
            - strong [ref=f5e53]: "Attraktive Zusatzleistungen:"
            - text: Betriebliche Altersvorsorge, JobRad, Deutschlandticket, Zuschüsse z. B. zur Kinderbetreuung sowie weitere Unterstützungsangebote
          - listitem [ref=f5e54]:
            - strong [ref=f5e55]: "Gute Rahmenbedingungen:"
            - text: 30 Tage Urlaub plus 24.12. und 31.12., Kantine, moderne IT-Infrastruktur, gute Verkehrsanbindung und Firmenparkplätze
        - paragraph
