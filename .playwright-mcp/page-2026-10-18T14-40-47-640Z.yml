          - strong [ref=f5e23]: Ratbacher GmbH
          - text: "- Wir sind eine der führenden IT Personalberatungen der DACH-Region. Unsere Vision? Wir bringen IT-Spezialisten mit den attraktivsten Arbeitgebern zusammen. Seit 2006 motiviert uns diese verantwortungsvolle Aufgabe täglich zu Bestleistungen. Mit einem Netzwerk von über 7.000 Top-Unternehmen und bereits über 16.000 erfolgreichen Vermittlungen besitzen wir die nötige Expertise, Ihnen den Weg zum neuen Traumjob zu ebnen! Bewerben Sie sich jetzt und nutzen Sie über die Position hinaus unser umfangreiches Netzwerk an exklusiven Stellenangeboten."
      - generic [ref=f5e24]: SAP CX Berater (m/w/d) - SAP CX Consultant
