            - generic [ref=f7e154]:
              - generic [ref=f7e155]: Hinweis zu Cookies
              - text: "Unsere Seite verwendet Cookies. Diese haben zwei Funktionen: Zum einen sind sie erforderlich für die grundlegende Funktionalität unserer Website. Zum anderen können wir mit Hilfe der Cookies Marketing- und Websiteinhalte optimieren und so unsere Angebote für Sie immer weiter verbessern. Hierzu werden pseudonymisierte Daten von Website-Besuchern gesammelt und ausgewertet. Indem Sie \"Alles akzeptieren\" klicken, stimmen Sie dieser Verwendung zu.Dies umfasst auch Ihre Einwilligung in die Übermittlung bestimmter personenbezogener Daten in Drittländer, u.a. die USA, nach Art. 49 (1) (a) DSGVO. Bitte beachten Sie, dass für derartige Übermittlungen von personenbezogenen Daten derzeit (noch) kein entsprechendes Datenschutzniveau wie innerhalb der EU/des EWR besteht. Insbesondere können Regierungsbehörden in den USA die Möglichkeit haben, Zugang zu Ihren Daten zu erhalten, ohne dass es effektive Abhilfemaßnahmen gibt. Auch Auskünfte zum Umgang mit Ihren Daten bei den US-Behörden sind nur sehr eingeschränkt bis gar nicht möglich. Wir haben auf diese behördlichen Maßnahmen keinen Einfluss. Bitte berücksichtigen Sie diese Informationen für Ihre Entscheidung."
              - generic [ref=f7e158]:
                - generic [ref=f7e159]: Sie können Ihre Einwilligung jederzeit widerrufen.
