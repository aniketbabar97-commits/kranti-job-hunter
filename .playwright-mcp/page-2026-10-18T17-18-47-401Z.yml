            - generic [ref=f16e156]: Ja, ich möchte in die Bewerberdatenbank der All for One Group aufgenommen werden und ich bin damit einverstanden, dass die All for One Group SE meine angegebenen Daten 24 Monate speichert, um mich künftig auf vakante Positionen innerhalb der All for One Group aufmerksam zu machen, die zu meinem Profil passen. Die Kontaktaufnahme erfolgt telefonisch, per E-Mail oder per Post. Mir ist bekannt, dass diese Einwilligung jederzeit frei widerruflich ist. Meine Einwilligung kann ich jederzeit per E-Mail an Bewerbung@all-for-one.com widerrufen. Durch den Widerruf der Einwilligung wird die Rechtmäßigkeit, der aufgrund der Einwilligung bis zum Widerruf erfolgten Verarbeitung nicht berührt.
