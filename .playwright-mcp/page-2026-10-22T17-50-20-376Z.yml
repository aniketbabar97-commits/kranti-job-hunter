      - generic [ref=f77e86]:
        - heading "Das sind wir" [level=3] [ref=f77e87]
        - paragraph [ref=f77e88]: "Wir sind ein europäischer IT-Solutions Provider. Unser Ziel: Durch passgenaue IT-Dienstleistungen unterstützen wir unsere Kunden dabei effizienter zu werden. Wir setzen auf modernste Technologien und maßgeschneiderte Lösungen. Ganz wichtig: Höchste Qualität auf Augenhöhe – wir arbeiten stets partnerschaftlich und respektvoll mit unseren Kunden und im Team. Das Ergebnis – wir agieren international, sind aber auf dem Boden geblieben! Als Familienunternehmen mit mehr als 9.000 MitarbeiterInnen in 17 europäischen Ländern verbinden wir globale Reichweite mit familiären Werten. Wenn unsere Stellenausschreibung Dein Interesse weckt, dann melde Dich einfach. Wir freuen uns! Noch ein kurzer Hinweis zum obligatorischen Sternchen (*): Wir suchen M/E/N/S/C/H/E/N – Deine Stärken und Deine Persönlichkeit zählen. Alles andere ist super, wenn es Dich glücklich macht. Wir leben Vielfalt und Chancengleichheit schon lange, das ist nichts Neues für uns. Come as you are! FAQ – Transparenz im Vermittlungsprozess Bei wem bin ich angestellt?"
