            - paragraph [ref=e181]
            - paragraph [ref=e182]
            - paragraph [ref=e183]:
              - strong [ref=e184]:
                - generic [ref=e185]: Datenverarbeitung beim Bewerbungsprozess
            - paragraph [ref=e186]:
              - generic [ref=e187]: Im Rahmen des Bewerbungsverfahrens benötigen wir von Ihnen die Angaben, die als Pflichtfelder in unserem Bewerbungsformular gekennzeichnet sind. Rechtsgrundlage für die Verarbeitung dieser Daten ist Art. 6 Abs. 1 S. 1 lit. b DSGVO, da die Daten für die Entscheidung über die Begründung eines Beschäftigungsverhältnisses erforderlich sind. Eine Datenverarbeitung zu anderen Zwecken erfolgt nicht.
            - paragraph [ref=e188]:
              - generic [ref=e189]: Darüber hinaus können Sie selbst entscheiden, ob Sie uns weitere Informationen mitteilen, die im Bewerbungsportal als nicht verpflichtend markiert sind. Die Bereitstellung dieser Daten erfolgt freiwillig und ist für die Bewerbung nicht zwingend erforderlich. Sofern Sie uns Daten zu Ihrer Person freiwillig mitteilen, verarbeiten wir diese Daten auf der Grundlage Ihrer jederzeit widerrufbaren Einwilligung gemäß Art. 6 Abs. 1 S.1 lit. a DSGVO. Ihre Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen. Bitte wenden Sie sich hierfür an recruiting@cbr.de.
            - paragraph [ref=e190]: Mit der Übermittlung Ihrer Bewerbungsunterlagen werden diese automatisch ausgelesen und in unserem Bewerbermanagementsystem erfasst. Hierbei werden alle mitgesendeten Dokumente (Anschreiben, Lebenslauf, Zeugnisse und sonstige Nachweise) sowie die darin enthaltenen Informationen gespeichert.
            - paragraph [ref=e191]: Sollten Sie uns Ihre Bewerbungsunterlagen noch persönlich oder auf dem Postweg übermitteln, digitalisieren wir diese zunächst und erfassen sie anschließend ebenfalls in unserem Bewerbermanagementsystem. Die Originalunterlagen senden wir Ihnen umgehend wieder zurück.
            - paragraph [ref=e192]:
              - generic [ref=e193]: Sofern nach dem Bewerbungsverfahren ein Arbeitsvertrag geschlossen wird, speichern wir die Daten aus Ihrer Bewerbung, die für die Durchführung Ihres Beschäftigungsverhältnisses benötigt werden. Rechtsgrundlage für diese Verarbeitung ist Art. 6 Abs. 1 S. 1 lit. b DSGVO. Bei erfolgloser Bewerbung werden Ihre Unterlagen nach Ablauf von 6 Monaten gelöscht. Rechtsgrundlage dieser Verarbeitung ist Art. 6 Abs. 1 S. 1 lit. f DSGVO. Die Verarbeitung bis zur Löschung erfolgt in unserem berechtigten Interesse, uns gegen etwaige die Bewerbung betreffende Klagen zur Wehr setzen zu können. Wir verarbeiten nur die personenbezogenen Daten, die Sie uns im Rahmen des Bewerbungsverfahrens zur Verfügung stellen.
            - paragraph [ref=e194]:
              - generic [ref=e195]: Dies gilt nicht, wenn Sie ausdrücklich in eine längere Speicherung Ihrer Daten einwilligen, damit Ihre Bewerbung, sofern Sie für eine andere zu besetzende Stelle der CBR Fashion Group in Frage kommen, an den jeweiligen Fachbereich weitergeleitet und Sie ggf. anschließend per E-Mail kontaktiert werden. Auf Basis Ihrer Einwilligung werden Ihre Daten sodann für die Dauer von 1 Jahr weiterverarbeitet, um Ihre Bewerbung auch bei anderen oder zukünftigen Stellenausschreibungen berücksichtigen zu können. Rechtsgrundlage für die Speicherung der Bewerbungsunterlagen und die Kontaktaufnahme zu Ihnen im Fall einer passenden Stelle ist Art. 6 Abs. 1 lit. a DSGVO. Ihre Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen. Bitte wenden Sie sich hierfür an recruiting@cbr.de.
            - paragraph [ref=e196]:
              - strong [ref=e197]:
                - generic [ref=e198]: Wer verarbeitet Ihre Daten?
            - paragraph [ref=e199]:
              - generic [ref=e200]: Die Bewerbungsverfahren werden von der CBR Service GmbH (Imkerstraße 4, Isernhagen, Germany) übernommen. Sofern sich ihre Bewerbung nicht an die CBR Service GmbH selbst richtet, agiert dieses Unternehmen als Auftragsverarbeiter, der zur streng weisungsgebundenen Datenverarbeitung verpflichtet ist.
            - paragraph [ref=e201]:
              - generic [ref=e202]: Das Bewerberportal wird von der concludis GmbH, Auenweg 3, 50679 Köln betrieben. Die Webseite wird auf Servern der Hetzner Online AG, Stuttgarter Str. 1 in 91710 Gunzenhausen gehostet. Ihr Lebenslauf wird automatisiert von dem Parsing-Tool der Firma Textkernel BV bearbeitet. Das Parsing findet auf einem Server in Deutschland statt. Ihre Daten werden nach dem Parsing-Vorgang bei Textkernel BV gelöscht. Die Verarbeitung der von Ihnen gesendeten Daten findet daher auch durch diese Firmen statt. Mit der concludis GmbH besteht ein Vertrag zur Auftragsverarbeitung gemäß Artikel 28 DSGVO.
            - paragraph [ref=e203]
            - paragraph [ref=e204]:
              - strong [ref=e205]:
                - generic [ref=e206]: Datensicherheit
              - generic [ref=e208]: Wir treffen Vorkehrungen zum Schutz Ihrer Daten und um Missbrauch von außen zu verhindern. Dabei werden Maßnahmen wie Verschlüsselung (SSL-Verschlüsselung), Firewalls, Hacker-Abwehr-Programme und manuelle Sicherheitsvorkehrungen angewendet. Die SSL-Verschlüsselung ist aktiv, wenn die Adresse mit "https://" beginnt. Bitte beachten Sie, dass auf unseren Seiten die Technologie JavaScript™ zum Einsatz kommt.
            - paragraph [ref=e209]:
              - generic [ref=e210]: Störungen des Service, Einstellung oder Änderung des Service oder Löschen von DatenWir gewährleisten nicht, dass das Angebot zu bestimmten Zeiten zur Verfügung steht. Störungen, Unterbrechungen oder einen etwaigen Ausfall des Online-Angebots schließen wir nicht aus. Die Server werden regelmäßig sorgfältig gesichert. Soweit Daten an uns - gleich in welcher Form - übermittelt werden, wird Ihnen jedoch empfohlen, Sicherheitskopien zu fertigen. Wir behalten uns vor, diesen Service jederzeit zu ändern, zu erweitern, zu beschränken oder ganz einzustellen. Eine Haftung von uns für gelöschte Daten oder Datenverluste ist deshalb ausgeschlossen.
            - paragraph [ref=e211]:
              - generic [ref=e212]: Ihre Rechte als betroffene Person
            - paragraph [ref=e214]: "Bei der Verarbeitung Ihrer personenbezogenen Daten gewährt die DSGVO Ihnen als betroffene Person bestimmte Rechte:"
            - paragraph [ref=e215]:
              - generic [ref=e216]: Auskunftsrecht (Art. 15 DSGVO)
            - paragraph [ref=e217]: Sie haben das Recht eine Bestätigung darüber zu verlangen, ob Sie betreffende personenbezogene Daten verarbeitet werden; ist dies der Fall, so haben Sie ein Recht auf Auskunft über diese personenbezogenen Daten und auf die in Art. 15 DSGVO im Einzelnen aufgeführten Informationen.
            - paragraph [ref=e218]:
              - generic [ref=e219]: Recht auf Berichtigung (Art. 16 DSGVO)
            - paragraph [ref=e220]: Sie haben das Recht, unverzüglich die Berichtigung Sie betreffender unrichtiger personenbezogener Daten und ggf. die Vervollständigung unvollständiger Daten zu verlangen.
            - paragraph [ref=e221]:
              - generic [ref=e222]: Recht auf Löschung (Art. 17 DSGVO)
            - paragraph [ref=e223]: Sie haben das Recht, zu verlangen, dass Sie betreffende personenbezogene Daten unverzüglich gelöscht werden, sofern einer der in Art. 17 DSGVO im Einzelnen aufgeführten Gründe zutrifft.
            - paragraph [ref=e224]:
              - generic [ref=e225]: Recht auf Einschränkung der Verarbeitung (Art. 18 DSGVO)
            - paragraph [ref=e226]: Sie haben das Recht, die Einschränkung der Verarbeitung zu verlangen, wenn eine der in Art. 18 DSGVO aufgeführten Voraussetzungen gegeben ist, z. B. wenn Sie Widerspruch gegen die Verarbeitung eingelegt haben, für die Dauer der Prüfung durch den Verantwortlichen.
            - paragraph [ref=e227]:
              - generic [ref=e228]: Recht auf Datenübertragbarkeit (Art. 20 DSGVO)
            - paragraph [ref=e229]: In bestimmten Fällen, die in Art. 20 DSGVO im Einzelnen aufgeführt sind, haben Sie das Recht, die Sie betreffenden personenbezogenen Daten in einem strukturierten, gängigen und maschinenlesbaren Format zu erhalten bzw. die Übermittlung dieser Daten an einen Dritten zu verlangen.
            - paragraph [ref=e230]:
              - generic [ref=e231]: Widerrufsrecht (Art. 7 DSGVO)
            - paragraph [ref=e232]: Sofern die Verarbeitung von Daten auf Grundlage Ihrer Einwilligung erfolgt, sind Sie nach Art. 7 Abs. 3 DSGVO berechtigt, die Einwilligung in die Verwendung Ihrer personenbezogenen Daten jederzeit zu widerrufen. Bitte beachten Sie, dass der Widerruf erst für die Zukunft wirkt. Verarbeitungen, die vor dem Widerruf erfolgt sind, sind davon nicht betroffen.
            - paragraph [ref=e233]:
              - generic [ref=e234]: Widerspruchsrecht (Art. 21 DSGVO)
            - paragraph [ref=e235]:
              - generic [ref=e236]: Werden Daten auf Grundlage von Art. 6 Abs. 1 S. 1 lit. f DSGVO (Datenverarbeitung zur Wahrung berechtigter Interessen) oder auf Grundlage von Art. 6 Abs. 1 S. 1 lit. e DSGVO (Datenverarbeitung zur Wahrung öffentlichen Interesse oder in Ausübung öffentlicher Gewalt) erhoben, steht Ihnen das Recht zu, aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit gegen die Verarbeitung Widerspruch einzulegen. Wir verarbeiten die personenbezogenen Daten dann nicht mehr, es sei denn, es liegen nachweisbar zwingende schutzwürdige Gründe für die Verarbeitung vor, die gegenüber Ihren Interessen, Rechten und Freiheiten überwiegen, oder die Verarbeitung dient der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen.
            - paragraph [ref=e237]:
              - generic [ref=e238]: Beschwerderecht bei einer Aufsichtsbehörde (Art. 77 DSGVO)
            - paragraph [ref=e239]: Sie haben gem. Art. 77 DSGVO das Recht auf Beschwerde bei einer Aufsichtsbehörde, wenn Sie der Ansicht sind, dass die Verarbeitung der Sie betreffenden Daten gegen datenschutzrechtliche Bestimmungen verstößt. Das Beschwerderecht kann insbesondere bei einer Aufsichtsbehörde in dem Mitgliedstaat Ihres gewöhnlichen Aufenthaltsorts, Ihres Arbeitsplatzes oder des Orts des mutmaßlichen Verstoßes geltend gemacht werden.
            - paragraph [ref=e240]:
              - generic [ref=e241]: Geltendmachung Ihrer Rechte
            - paragraph [ref=e242]: Sofern vorstehend nichts anderes beschrieben wurde, wenden Sie sich zur Geltendmachung Ihrer Betroffenenrechte bitte an die im Impressum genannte Stelle.
            - paragraph [ref=e243]:
              - generic [ref=e244]: Kontaktdaten des Datenschutzbeauftragten
            - paragraph [ref=e246]: "Unser externer Datenschutzbeauftragter steht Ihnen gerne für Auskünfte zum Thema Datenschutz unter folgenden Kontaktdaten zur Verfügung:"
