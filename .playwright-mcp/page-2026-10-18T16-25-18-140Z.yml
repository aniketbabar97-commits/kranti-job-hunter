          - generic [ref=e111]: Datenschutzhinweise
          - generic [ref=e113]:
            - paragraph [ref=e114]:
              - strong [ref=e116]:
                - generic [ref=e117]: Datenerhebung, - speicherung und – nutzung bei Registrierung im Bewerberportal
            - paragraph [ref=e118]: Wir bieten Ihnen die Möglichkeit, sich über unser Bewerberportal bei der CBR Service GmbH und den mit der CBR Service GmbH verbundenen Unternehmen zu bewerben.
            - paragraph [ref=e119]: Der Schutz Ihrer persönlichen Daten ist uns besonders wichtig. Wir möchten Sie deshalb im Folgenden über die Verarbeitung Ihrer Daten im Rahmen der Nutzung des Bewerbungsportals informieren.
            - paragraph [ref=e120]: Verantwortlich für die nachfolgend dargestellte Datenerhebung und -verarbeitung ist das Unternehmen der CBR Fashion Group, an das sich Ihre Bewerbung richtet.
            - paragraph [ref=e121]:
              - strong [ref=e122]:
                - generic [ref=e123]: Welche Informationen werden von uns erfasst?
            - paragraph [ref=e124]:
              - strong [ref=e125]:
                - generic [ref=e126]: "Datenverarbeitung bei Besuch des Bewerbungsportals:"
            - paragraph [ref=e127]:
              - generic [ref=e128]: Nutzungsdaten
            - paragraph [ref=e129]: "Die folgenden Kategorien von technischen Daten werden beim Besuch des Bewerberportals vom Webserver erhoben:"
            - paragraph [ref=e130]:
              - generic [ref=e131]: "IP-Adresse: Die IP-Adresse des Geräts, von dem aus die Webseite besucht wird.User-Agent: Der User-Agent des Browsers, der zum Besuch der Webseite verwendet wird.URL: Die URL der aufgerufenen Webseite.HTTP-Statuscode: Der HTTP-Statuscode, der als Antwort auf die Anfrage zurückgegeben wird.Größe der Antwort: Die Größe der Antwort, die vom Server an den Client zurückgegeben wird.Referer: Der Referer der Webseite, von der aus die aktuelle Webseite aufgerufen wurde.Zeitstempel: Der Zeitstempel, zu dem die Anfrage verarbeitet wurde.Dauer: Die Dauer, die benötigt wurde, um die Anfrage zu verarbeiten."
            - paragraph [ref=e132]:
              - generic [ref=e133]: Rechtsgrundlage der Verarbeitung der Nutzungsdaten ist Art. 6 Abs. 1 S. 1 lit. f DSGVO. Die Verarbeitung erfolgt in dem berechtigten Interesse, die Inhalte des Portals bereitzustellen und eine Geräte- sowie browseroptimierte Darstellung sicherzustellen.
            - paragraph [ref=e134]
            - paragraph [ref=e135]:
              - generic [ref=e136]: Erforderliche Cookies
            - paragraph [ref=e137]: Auf unseren Webseiten setzen wir Cookies ein, die zur Nutzung des Portals erforderlich sind. Cookies sind kleine Textdateien, die auf Ihrem Endgerät gespeichert und ausgelesen werden können. Man unterscheidet zwischen Session-Cookies, die wieder gelöscht werden, sobald Sie ihren Browser schließen und permanenten Cookies, die über die einzelne Sitzung hinaus gespeichert werden.
            - paragraph [ref=e138]: Wir nutzen diese erforderlichen Cookies nicht für Analyse-, Tracking- oder Werbezwecke.
            - paragraph [ref=e139]: Teilweise enthalten diese Cookies lediglich Informationen zu bestimmten Einstellungen und sind nicht personenbeziehbar. Sie können auch notwendig sein, um die Benutzerführung, Sicherheit und Umsetzung der Seite zu ermöglichen.
            - paragraph [ref=e140]:
              - generic [ref=e141]: Wir nutzen diese Cookies auf Grundlage unseres berechtigten Interesses nach Art. 6 Abs. 1 S. 1 lit. f DSGVO.
            - paragraph [ref=e142]: Sie können Ihren Browser so einstellen, dass er Sie über die Platzierung von Cookies informiert. Zudem können Sie diese jederzeit über die entsprechende Browsereinstellung löschen und das Setzen neuer Cookies verhindern. Bitte beachten Sie, dass unsere Webseiten dann gegebenenfalls nicht vollständig angezeigt werden können und einige Funktionen technisch nicht mehr zur Verfügung stehen.
            - paragraph [ref=e143]: "Wir verwenden folgende erforderliche Cookies:"
