      - img "Gruppenbild von Administration & Management mit Hello-Schritzug im Hintergrund" [ref=f59e27]
      - generic [ref=f59e29]:
        - heading "Projektmanager m/w/d" [level=1] [ref=f59e31]
        - generic [ref=f59e32]:
          - generic [ref=f59e34]:
            - paragraph [ref=f59e35]:
              - text: Schon gewusst? Wir zählen zu den größten deutschen E-Commerce-Unternehmen und suchen nach Verstärkung in
              - strong [ref=f59e36]: Würzburg
            - paragraph [ref=f59e37]
            - generic [ref=f59e38]: "Du liebst es, Projekte zu planen, zu koordinieren und erfolgreich umzusetzen? Dann bist du bei uns genau richtig. Als Projektmanager m/w/d bist du für den Aufbau unserer neuer Online-Shops für unterschiedliche Märkte, Produkte und Zielgruppen verantwortlich und begleitest die Projekte von der ersten Idee bis zum Go-Live.Du koordinierst sowohl interne Teams – etwa aus IT, Marketing und Sales – als auch externe Dienstleister und sorgst dafür, dass Zeitpläne eingehalten, Budgets berücksichtigt und Qualitätsstandards erfüllt werden.Du übernimmst nicht nur die Organisation, sondern bereicherst unsere Projekte auch mit kreativen Impulsen: Du erkennst Optimierungspotenziale, entwickelst eigene Ideen und trägst aktiv dazu bei, dass unsere Vorhaben effizienter und erfolgreicher umgesetzt werden. Technisches Verständnis gehört für dich selbstverständlich dazu – auch wenn du nicht selbst codierst, erkennst du Zusammenhänge, kannst Abläufe einschätzen und triffst fundierte Entscheidungen. Gleichzeitig bist du kommunikativ, erklärst komplexe Zusammenhänge verständlich und hältst alle Beteiligten stets auf dem Laufenden.Du gestaltest Prozesse aktiv mit, übernimmst Verantwortung für Ergebnisse und siehst direkt, wie deine Arbeit den Erfolg unserer Online-Shops beeinflusst. Organisationstalent, Kreativität, Struktur und Teamgeist zeichnen dich aus und machen dich zu einem wertvollen Teil unseres Teams."
          - generic [ref=f59e40]:
            - paragraph [ref=f59e41]: Du hast dich in der Beschreibung wiedergefunden?
            - list [ref=f59e42]:
              - listitem [ref=f59e43]: Du hast ein abgeschlossenes Studium im Bereich Wirtschaft, Wirtschaftsinformatik, IT oder eine vergleichbare Ausbildung
              - listitem [ref=f59e44]: Du hast Erfahrung im Projektmanagement, idealerweise im digitalen oder E-Commerce-Umfeld
              - listitem [ref=f59e45]: Du hast bereits Projekte mit IT-Bezug oder den Aufbau von Webshops begleitet
              - listitem [ref=f59e46]: Du bringst technisches Verständnis mit
              - listitem [ref=f59e47]: Du bist sicher im Umgang mit MS Office und Projektmanagement-Tools
              - listitem [ref=f59e48]: Du bist kommunikativ, strukturiert und behältst auch bei mehreren Projekten den Überblick
              - listitem [ref=f59e49]: Du sprichst Deutsch und Englisch sicher; weitere Sprachen sind ein Plus
            - paragraph [ref=f59e50]
            - paragraph [ref=f59e51]: Worauf wartest du? Bewirb dich bei uns!
