      - generic [ref=f38e1082]:
        - paragraph [ref=f38e1084]:
          - text: "*Alle Preise inkl. gesetzl. Mehrwertsteuer zzgl."
          - link "Versandkosten" [ref=f38e1085] [cursor=pointer]:
            - /url: /versandkosten
          - text: und ggf. Nachnahmegebühren, wenn nicht anders angegeben.
        - paragraph [ref=f38e1086]:
          - superscript [ref=f38e1087]: "1"
          - text: "Bei Zahlungseingang bis 12 Uhr (Mo. bis Fr., nicht an Feiertagen, ausgeschlossen folgende Zahlungsweisen: Finanzierungen, Überweisung) erfolgt der Versand am selben Tag, wenn alle Bestellpositionen für den Sofortversand qualifiziert sind. Bitte prüfe, welcher Artikel bzw. welche Rahmengröße per Sofortversand möglich ist. Ab einem Warenkorbwert höher als 1.000 € ist für das EU-Ausland (inkl. Schweiz) nur der Standardversand möglich."
        - paragraph [ref=f38e1088]:
          - superscript [ref=f38e1089]: "2"
          - text: Du erhälst einen 10€ Gutschein. Pro Person nur einmal möglich. Mindestbestellwert 60€. Cube-Artikel ausgeschlossen. Gutscheine sind nicht kombinierbar.
        - paragraph [ref=f38e1090]:
          - superscript [ref=f38e1091]: "4"
          - text: Voraussetzung ist die Zusage der finanzierenden Bank. Weitere Informationen zur Finanzierung findest du hier. Gilt nicht für bereits reduzierte Artikel.
        - paragraph [ref=f38e1092]:
          - superscript [ref=f38e1093]: "5"
          - text: Beispielrechnung d. Leasinganbieters Jobrad bei 3.000 Euro Bruttogehalt, Steuerklasse 1, keine Kinder. Beispielrechnungen sind immer unverbindlich. Zur verbindlichen Berechnung sollte der Steuerberater kontaktiert werden.
        - paragraph [ref=f38e1094]:
          - superscript [ref=f38e1095]: "6"
          - text: Gilt nicht für E-Bikes und nicht für Zubehör unter 50 €.
        - paragraph [ref=f38e1096]:
          - superscript [ref=f38e1097]: "7"
          - text: Gilt nicht für Artikel in der Kategorie Outdoor.
        - paragraph [ref=f38e1098]:
          - superscript [ref=f38e1099]: "8"
          - text: Der niedrigste Preis in den letzten 30 Tagen vor der Preisermäßigung.
        - paragraph [ref=f38e1100]: Diese Seite ist geschützt durch reCAPTCHA, die Google Datenschutzerklärung und Nutzungsbedingungen gelten.
        - paragraph [ref=f38e1101]: Gutscheine sind maximal 3 Jahre ab dem Ausstellungsdatum gültig.
