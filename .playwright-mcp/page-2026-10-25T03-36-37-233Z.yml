              - text: "bist du immer bestens ausgestattet. Diese Hersteller stehen für höchste Qualität, innovative Technologie und Langlebigkeit – genau das, was du von deinem neuen Bike erwartest. Unsere Philosophie der Qualität setzt sich auch bei unserem Fahrradzubehör fort. Bei uns findest du alles, was du für eine sichere und komfortable Fahrt benötigst:"
