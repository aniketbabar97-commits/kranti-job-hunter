            - generic [ref=f55e84]:
              - text: Deine Aufgaben
              - list [ref=f55e85]:
                - listitem [ref=f55e86]:
                  - text: Du verantwortest die
                  - strong [ref=f55e87]: operative und kommerzielle Weiterentwicklung unseres Shopify-Shops
                  - text: mit Fokus auf Umsatz, Conversion Rate, AOV und Kundenerlebnis.
                - listitem [ref=f55e88]:
                  - text: Du analysierst die
                  - strong [ref=f55e89]: Customer Journey
                  - text: und identifizierst systematisch Potenziale in Kategorien, Produktseiten, Navigation, Warenkorb und Checkout.
                - listitem [ref=f55e90]:
                  - text: Du entwickelst und priorisierst
                  - strong [ref=f55e91]: CRO-Maßnahmen und Tests
                  - text: und setzt diese gemeinsam mit Design, Development und externen Partnern um.
                - listitem [ref=f55e92]:
                  - text: Du optimierst unser
                  - strong [ref=f55e93]: Shop-Merchandising
                  - text: "-- von Produktplatzierungen und Kategorien über Bundles bis zu Cross- und Upselling."
                - listitem [ref=f55e94]:
                  - text: Du planst und steuerst
                  - strong [ref=f55e95]: E-Commerce-Aktionen und Promotions
                  - text: gemeinsam mit Performance Marketing, CRM und Product & Brand.
                - listitem [ref=f55e96]:
                  - text: Du analysierst relevante Shop- und Kundendaten und leitest daraus
                  - strong [ref=f55e97]: konkrete Maßnahmen zur Verbesserung unserer E-Commerce-KPIs
                  - text: ab.
                - listitem [ref=f55e98]:
                  - text: Du stellst die kontinuierliche
                  - strong [ref=f55e99]: technische und inhaltliche Weiterentwicklung des Shops
                  - text: sicher und koordinierst Anforderungen, Umsetzung und Qualitätssicherung.
                - listitem [ref=f55e100]:
                  - text: Du verantwortest E-Commerce-Projekte wie
                  - strong [ref=f55e101]: Shop-Relaunches, Landingpages, neue Features, Tools oder internationale Expansion
                  - text: .
                - listitem [ref=f55e102]:
                  - text: Du stellst gemeinsam mit IT und externen Partnern das reibungslose Zusammenspiel von
                  - strong [ref=f55e103]: Shopify, ERP, Tracking, CRM und weiteren Systemen
                  - text: sicher.
                - listitem [ref=f55e104]:
                  - text: Du arbeitest eng mit
                  - strong [ref=f55e105]: Performance Marketing, CRM, Product & Brand, Design, IT und Customer Relations
                  - text: zusammen und bringst deine E-Commerce-Perspektive aktiv in Entscheidungen ein.
              - text: Deine Mission Deine Verantwortung Dein Profil
              - list [ref=f55e106]:
                - listitem [ref=f55e107]:
                  - text: Du hast
                  - strong [ref=f55e108]: mindestens 5 Jahre relevante Erfahrung im E-Commerce
                  - text: ", idealerweise im D2C-, FMCG- oder Consumer-Umfeld."
                - listitem [ref=f55e109]:
                  - text: Du besitzt
                  - strong [ref=f55e110]: sehr gute praktische Shopsystem(Shopify)-Kenntnisse
                  - text: und hast Shops nicht nur betreut, sondern aktiv weiterentwickelt.
                - listitem [ref=f55e111]:
                  - text: Du verstehst die zentralen E-Commerce-KPIs wie
                  - strong [ref=f55e112]: Conversion Rate, AOV, CLV, Umsatz und Funnel Performance
                  - text: und kannst daraus konkrete Maßnahmen ableiten.
                - listitem [ref=f55e113]:
                  - text: Du hast Erfahrung mit
                  - strong [ref=f55e114]: Conversion-Optimierung, Customer Journey und datengetriebener Shop-Weiterentwicklung
                  - text: .
                - listitem [ref=f55e115]:
                  - text: Du arbeitest sicher mit Analyse- und Tracking-Tools wie
                  - strong [ref=f55e116]: Google Analytics und Google Tag Manager
                  - text: ; Erfahrung mit CRM- und Marketing-Automation-Systemen wie Klaviyo oder HubSpot ist von Vorteil.
                - listitem [ref=f55e117]:
                  - text: Grundkenntnisse in
                  - strong [ref=f55e118]: HTML, CSS oder Shopify Liquid
                - listitem [ref=f55e119]: Du kannst Projekte eigenständig strukturieren, priorisieren und mit internen sowie externen Partnern erfolgreich umsetzen.
                - listitem [ref=f55e120]:
                  - text: Du denkst
                  - strong [ref=f55e121]: unternehmerisch, datengetrieben und lösungsorientiert
                  - text: ", übernimmst Verantwortung und willst messbaren Impact schaffen."
                - listitem [ref=f55e122]: Sehr gute Deutschkenntnisse sowie gute Englischkenntnisse runden dein Profil ab.
              - text: Warum wir?
              - list [ref=f55e123]:
                - listitem [ref=f55e124]:
                  - strong [ref=f55e125]: "Sinnstiftende Aufgabe:"
                  - text: Deine Tätigkeit bei Lebenskraftpur hat massiven Einfluss auf die Gesundheit aller Menschen und verfolgt ein höheres Ziel als die reine Umsatzgenerierung.
                - listitem [ref=f55e126]:
                  - strong [ref=f55e127]: "Leistungskultur:"
                  - text: Überdurchschnittliche Leistung und innovatives Handeln belohnen wir dir mit unterschiedlichen Bausteinen.
                - listitem [ref=f55e128]:
                  - strong [ref=f55e129]: "Inhabergeführtes Unternehmen:"
                  - text: Unternehmensentscheidungen und -Investitionen können schnell vom Inhaber und ohne Mitsprache von Investoren umgesetzt werden.
                - listitem [ref=f55e130]:
                  - strong [ref=f55e131]: "Investitionsbereitschaft:"
                  - text: Wir stellen dir alle notwendigen Tools und Ressourcen bereit, sodass du dich in deiner Arbeit voll entfalten kannst.
                - listitem [ref=f55e132]:
                  - strong [ref=f55e133]: "Selbstverwirklichung:"
                  - text: Wir geben dir durch flache Hierarchien, schnelle Entscheidungswege und Vertrauen in deine Arbeit den nötigen Gestaltungsspielraum für die effiziente und schnelle Umsetzung unserer Ziele und Ideen.
                - listitem [ref=f55e134]: "**Fachliche und persönliche Entwicklung:**Um deine fachliche und persönliche Entwicklung zu gewährleisten, bieten wir dir zeitlichen Raum und das passende Handwerk, z.B. durch Expertenwissen oder Weiterbildungsmöglichkeiten."
                - listitem [ref=f55e135]:
                  - strong [ref=f55e136]: "Gesundheitskultur:"
                  - text: Wir möchten mit unserer Vision und Mission ein Umdenken bewirken. Damit beginnen wir im Inneren und haben diesen Begriff für Lebenskraftpur definiert und umgesetzt, um zur Gesundheit unserer Mitarbeiter aktiv beizutragen.
              - text: Was du bei uns bekommst Woran wir Erfolg messen Arbeitsbedingungen & Ausstattung
              - list [ref=f55e137]:
                - listitem [ref=f55e138]: Du arbeitest full remote von zu Hause (innerhalb Deutschland)
                - listitem [ref=f55e139]: Quartalsweise & für wichtige Anlässe laden wir dich nach Waghäusel ein für jeweils 2-3 Tage, um mit dem Team zusammen vor Ort zu arbeiten
                - listitem [ref=f55e140]: 31 Tage Urlaub (Weihnachten und Silvester sind geschenkt)
                - listitem [ref=f55e141]: Flexible Arbeitszeiten
                - listitem [ref=f55e142]: Betriebliche Altersvorsorge und Wachstumsbonus
                - listitem [ref=f55e143]: Jährlicher Lebenskraftpur Gesundheitsgutschein
                - listitem [ref=f55e144]: 25 % Mitarbeiter-Rabatt und Produktproben
                - listitem [ref=f55e145]: Weitere Rabatte und Vergünstigungen durch corporate benefits
                - listitem [ref=f55e146]: Zellverfügbares Wasser und Matcha-Flatrate in allen Küchen
                - listitem [ref=f55e147]: Zugang zum mentalen Gesundheitsprogramm OpenUp
                - listitem [ref=f55e148]: Gemeinsame Ausflüge und Betriebsfeste stärken unseren Teamgeist
                - listitem [ref=f55e149]: u.v.m.
              - text: Dein Weg bei uns
              - list [ref=f55e150]:
                - listitem [ref=f55e151]: Unser erstes Kennenlernen findet über einen Videocall statt (max. 15 Minuten).
                - listitem [ref=f55e152]: Wenn du uns überzeugst und wir auch dein Interesse geweckt haben, laden wir dich anschließend persönlich ein und zeigen dir unsere Räumlichkeiten.
