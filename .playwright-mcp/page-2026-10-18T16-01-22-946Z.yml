          - heading "Lead Consultant SAP CX / CRM (m/w/d)" [level=1] [ref=e37]
          - generic [ref=e43]:
            - heading "Unternehmensbeschreibung" [level=1] [ref=e44]
            - paragraph [ref=e45]: Arvato Systems unterstützt mit rund 3.500 Mitarbeitenden als international agierender IT-Spezialist namhafte Unternehmen bei der Digitalen Transformation. Ausgeprägtes Branchen-Know-how, hohes technisches Verständnis und ein klarer Fokus auf Kundenbedürfnisse zeichnen uns aus. Im Team entwickeln wir innovative IT-Lösungen, bringen unsere Kunden in die Cloud, integrieren digitale Prozesse und übernehmen den Betrieb sowie die Betreuung von IT-Systemen. Als Teil von Bertelsmann stehen wir auf dem soliden Fundament eines deutschen Weltkonzerns. Zugleich setzen wir auf unser starkes strategisches Partner-Netzwerk mit internationalen Top-Playern wie AWS, Google, Microsoft oder SAP. Wir machen die digitale Welt einfacher, effizienter und sicherer und unsere Kunden erfolgreicher.
            - heading "Stellenbeschreibung" [level=1] [ref=e46]
            - paragraph [ref=e47]:
              - text: Ohne Menschen, deren Herz voll und ganz für IT schlägt, geht es nicht.
              - strong [ref=e48]
              - text: Darum suchen wir dich als
              - strong [ref=e49]: Lead Consultant SAP CX / CRM (m/w/d)
              - text: . Werde Teil unserer modernen, hybriden Arbeitskultur an unseren deutschlandweiten Standorten – Gütersloh, Köln, Berlin, Hamburg oder München – und genieße die Flexibilität, mobil, z. B. im Homeoffice, tätig zu sein.
            - paragraph [ref=e50]
            - list [ref=e51]:
              - listitem [ref=e52]: Du berätst und unterstützt unsere Kunden – mit dem Branchenschwerpunkt Handel, Fashion und Consumer Products – bei der Planung, Konzeption und Einführung von Handels- und CRM-Prozessen
              - listitem [ref=e53]: Du bist verantwortlich für die Vorbereitung und Durchführung von Workshops mit den Fachbereichen und der IT
              - listitem [ref=e54]: Du übernimmst die Analyse kundenspezifischer Anforderungen und die Konzeption neuer Geschäftsprozesse
              - listitem [ref=e55]: Du gestaltest gemeinsam mit unseren Kunden deren Handels- und CRM-Prozesse mit Hilfe der SAP CX Cloud Suite (insbesondere Sales, Service & Marketing)
              - listitem [ref=e56]: Du definierst User Stories und entwickelst die technische Architektur unserer Lösungen zur Umsetzung der Kundenanforderungen
              - listitem [ref=e57]: Du entwickelst aktiv das Team weiter und übernimmst eine fachliche Führungsrolle
            - heading "Qualifikationen" [level=1] [ref=e58]
            - list [ref=e59]:
              - listitem [ref=e60]: Du hast ein erfolgreich abgeschlossenes (technisches) Studium und Erfahrung im agilen IT-Projektmanagement
              - listitem [ref=e61]: Du bringst fundiertes Know-how im Requirements Engineering und in der Business-Analyse mit
              - listitem [ref=e62]: Du verfügst über tiefgreifende Kenntnisse in den SAP CX Cloud-Komponenten (Sales & Service Cloud V2, Emarsys, CDC & CDP)
              - listitem [ref=e63]: Du bist kommunikationsstark und verstehst es, Anforderungen präzise vom Kunden in die Entwicklung zu übertragen
              - listitem [ref=e64]: Sehr gute Deutsch- sowie gute Englischkenntnisse runden dein Profil ab
            - paragraph [ref=e65]
            - paragraph [ref=e66]: Auch wenn du nicht alle unsere Wünsche erfüllst, zögere nicht dich bei uns zu bewerben, denn WEITERENTWICKLUNG unserer Mitarbeitenden wird bei uns großgeschrieben und eröffnet dir in unserem Unternehmen vielfältige Möglichkeiten.
            - heading "Zusätzliche Informationen" [level=1] [ref=e67]
            - paragraph [ref=e68]: Interessiert? Dann bewirb dich über unser Online-Bewerbungsformular mit deinem Lebenslauf und deiner Gehaltsvorstellung. Wir wollen ein fairer und inklusiver Arbeitgeber sein. Wir schätzen die unterschiedlichen Perspektiven, die eine vielfältige Belegschaft einbringt. Daher suchen wir aktiv nach Menschen, die unser Unternehmen durch ihre Identität, ihren Hintergrund und ihre persönlichen Erfahrungen bereichern, mit oder ohne Behinderung.
            - paragraph [ref=e69]
            - paragraph [ref=e70]
            - paragraph [ref=e71]
            - paragraph [ref=e72]:
              - strong [ref=e73]: "Informationspflichten im Zusammenhang mit der Erhebung deiner personenbezogenen Daten:"
            - paragraph [ref=e74]: Verantwortlicher für den Datenschutz bei deiner Bewerbung ist die in der Stellenausschreibung angegebene Firma. Die Firma verarbeitet deine Daten zwecks Begründung eines Beschäftigungsverhältnisses auf Grundlage des Art. 6 (1) b DSGVO / § 26 (1) 1 BDSG.
            - paragraph [ref=e75]:
              - text: Die Speicherdauer deiner Daten richtet sich an den Fristen des jeweiligen Landes aus beginnend mit Abschluss des Einstellungsprozesses. Diese findest du
              - link "hier" [ref=e76] [cursor=pointer]:
                - /url: https://bertelsmann-hr.de/docs/Overview_of_Data_Retention_Periods_DE.pdf
              - text: .
            - paragraph [ref=e77]: Den Datenschutzbeauftragten der Firma kannst du unter der o.g. Postanschrift erreichen.
            - paragraph [ref=e78]:
