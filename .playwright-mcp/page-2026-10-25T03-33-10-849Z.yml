      - img "Gruppenbild FLYERALARM IT-Team mit „Let’s get IT started“-Slogan" [ref=f20e27]
      - generic [ref=f20e29]:
        - heading "Professional Software Developer m/w/d Kotlin/Java" [level=1] [ref=f20e31]
        - generic [ref=f20e32]:
          - generic [ref=f20e34]:
            - paragraph [ref=f20e35]: Schon gewusst? Wir zählen zu den größten deutschen E-Commerce-Unternehmen und suchen deutschlandweit nach Verstärkung.
            - paragraph [ref=f20e36]
            - text: "Digitale Fertigungsprozesse, E-Commerce, anspruchsvolle IT-Landschaften und agiles Mindset – wir sind mehr als ein cooler Druck- und Marketingpartner für KMUs. Wir verbinden Softwareentwicklung mit unseren Fertigungsprozessen und entwickeln agile Lösungen, die zu einer optimierten und automatisierten Produktion führen. Klingt spannend? Dann lies unbedingt weiter, denn wir suchen zur Verstärkung unseres Teams einen Professional Software Developer m/w/d Kotlin/Java. Vielleicht ja dich? In dieser Position trägst du gemeinsam mit deinem Team die technische Verantwortung für die Entwicklung innovativer und skalierbarer Lösungen. Gemeinsam mit eurem Product Owner planst du die Anforderungen an eure Systeme und setzt diese um. Dabei hast du nicht nur die Entwicklung im Blick, sondern kümmerst dich auch um den Betrieb und die Wartung der von euch bereitgestellten Services. Auch beim Thema DevOps bist du gefragt: Du unterstützt dabei, DevOps-Methoden in eurem Arbeitsalltag anzuwenden und weiterzuentwickeln. Automatisierung und effiziente Prozesse sind für dich dabei keine Fremdwörter. Dein Wissen teilst du gerne mit anderen und unterstützt weniger erfahrene Personen im Team durch einen proaktiven Wissensaustausch. Auch die Dokumentation unserer Anwendungen und Systeme gehört zu deinen Aufgaben. Dabei entwickelst du gemeinsam mit deinem Team Werkzeuge und Prozesse kontinuierlich weiter. Agile Softwareentwicklung gehört bei uns zum Alltag. Kanban, Scrum, Pair- und Mob-Programming sowie Code Reviews sind dir daher ein Begriff und du hast Lust, diese Methoden aktiv in eure Zusammenarbeit einzubringen. Dabei arbeitest du analytisch, strukturiert und lösungsorientiert und bringst deine Ideen ein, wenn es darum geht, gemeinsam gute technische Lösungen zu entwickeln."
          - generic [ref=f20e38]:
            - paragraph [ref=f20e39]: "Klingt gut? Dann sind es nur noch wenige Schritte zu FLYERALARM. Denn natürlich haben auch wir einige Anforderungen an dich:"
            - list [ref=f20e40]:
              - listitem [ref=f20e41]: Du hast eine erfolgreich abgeschlossene Ausbildung im Bereich Softwareentwicklung oder ein abgeschlossenes Studium mit Informatik-Hintergrund
            - list [ref=f20e42]:
              - listitem [ref=f20e43]: Du hast bereits Erfahrung in der Backend-Entwicklung mit Kotlin/Java sowie Spring Boot gesammelt
            - list [ref=f20e44]:
              - listitem [ref=f20e45]: Du kennst dich mit Clean-Code-Prinzipien aus und legst Wert auf eine gute Architektur und exzellente Code-Qualität
            - list [ref=f20e46]:
              - listitem [ref=f20e47]: Du zeichnest dich durch deine agile Denkweise und die Offenheit für Methoden wie Continuous Integration und die gemeinsame Verantwortung für Code aus
            - list [ref=f20e48]:
              - listitem [ref=f20e49]: Du hast idealerweise bereits Erfahrung im DevOps-Setup, beispielsweise mit Docker, GitLab und Bitbucket, gesammelt
            - list [ref=f20e50]:
              - listitem [ref=f20e51]: Du hast bereits mit relationalen Datenbanken und SQL gearbeitet.
            - list [ref=f20e52]:
              - listitem [ref=f20e53]: Du zeichnest dich durch deine analytische, strukturierte und lösungsorientierte Arbeitsweise aus
            - list [ref=f20e54]:
              - listitem [ref=f20e55]: Du verfügst über eine hohe Kommunikationsstärke und kannst dich sicher mit unterschiedlichen Ansprechpartnern austauschen
            - list [ref=f20e56]:
              - listitem [ref=f20e57]: Du sprichst gutes Deutsch und gutes Englisch
            - paragraph [ref=f20e58]
            - paragraph [ref=f20e59]: Worauf wartest du? Bewirb dich bei uns!
