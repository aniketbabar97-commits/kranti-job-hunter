        - paragraph [ref=f20e236]:
          - text: Wir verwenden Cookies und andere Technologien, die für den Betrieb unserer Webseite technisch notwendig sind. Mit Ihrer Zustimmung verwenden wir zudem auch optionale Cookies zu Analyse- & Marketingzwecken, für eine verbesserte Nutzererfahrung, für einfache Interaktion & Funktionalitäten, zur Erfolgsmessung sowie zu Targeting & Werbezwecken. Über „Alle Cookies akzeptieren“ stimmen Sie der Verwendung aller Cookies zu. Über „Nur essenzielle Cookies zulassen“ können sie das Setzen aller Cookies – mit Ausnahme der technisch notwendigen Cookies – ablehnen. Bitte beachten Sie, dass es hierdurch zu einer Beeinträchtigung der Nutzererfahrung unserer Webseite kommen kann. Wenn Sie individuelle Einstellungen vornehmen möchten, klicken Sie auf „Cookie-Einstellung“ – dort können Sie Ihre Zustimmung auch jederzeit mit Wirkung für die Zukunft widerrufen.
