            - paragraph [ref=e36]:
              - emphasis [ref=e37]: Wer sind wir?
            - paragraph [ref=e38]: Active Nutrition International GmbH (ANI) ist ein dynamisches wachstumsorientiertes Unternehmen in der Sporternährungsbranche, das mit seinen drei starken Marken – Powerbar, Dymatize und Premier Protein – weltweit Athleten und Fitnessbegeisterte mit hochwertigen, innovativen Produkten unterstützt. Seit über 30 Jahren prägen wir den Markt für Sportnahrung, insbesondere in Zentral- und Westeuropa und setzen stets neue Maßstäbe in der Branche.
            - paragraph [ref=e39]:
              - text: 🚴‍♂️
              - strong [ref=e40]: Powerbar
              - text: ": Energiegeladene Produkte für Ausdauersportler"
            - paragraph [ref=e41]:
              - text: 🏋️‍♂️
              - strong [ref=e42]: Dymatize
              - text: ": Proteine und Nahrungsergänzungen für Deine Erfolge im Fitnessstudio"
            - paragraph [ref=e43]:
              - text: 🍫
              - strong [ref=e44]: Premier Protein
              - text: ": Leckere Lean-Protein-Produkte für den Alltag"
            - paragraph [ref=e45]: Als Teil von BellRing Brands, einem globalen Player im Bereich der Sporternährung, ist Active Nutrition International mit Sitz in München und eigener Produktionsstätte in Voerde, eine wichtige Tochtergesellschaft für den internationalen Markt.
            - paragraph [ref=e46]:
              - text: Als
              - strong [ref=e47]: Developer (m/w/d) E-Commerce
              - text: bist du für den Betrieb, die Weiterentwicklung und die Vernetzung unserer digitalen Commerce- und CRM-Landschaft verantwortlich. Gemeinsam mit den Teams aus Marketing, Sales und Customer Service entwickelst du skalierbare digitale Lösungen und treibst die digitale Transformation unseres internationalen E-Commerce-Geschäfts aktiv voran.
            - heading "Aufgaben" [level=2] [ref=e48]
            - paragraph [ref=e49]:
              - emphasis [ref=e50]: Deine Rolle bei uns
              - strong [ref=e51]: 🚀
            - list [ref=e52]:
              - listitem [ref=e53]:
                - strong [ref=e54]: "Shopify-Landschaft betreiben & weiterentwickeln:"
                - text: Du übernimmst die technische Konfiguration, Administration und kontinuierliche Optimierung unserer internationalen Shopify-Landschaft (Shopify Plus). Dabei setzt du neue Features um, stellst eine hervorragende User Experience sowie eine hohe Performance sicher und identifizierst Standardisierungsmöglichkeiten im internationalen Umfeld.
              - listitem [ref=e55]:
                - strong [ref=e56]: "CRM-Architektur aufbauen & steuern:"
                - text: Du entwickelst, konfigurierst und optimierst unsere CRM-Systeme (z. B. Brevo, Klaviyo oder HubSpot), um Customer Journey zu automatisieren, Inhalte zu personalisieren und die Conversion und Konsumentenzufriedenheit nachhaltig zu steigern.
              - listitem [ref=e57]:
                - strong [ref=e58]: "Prozess- und Integrationsplattformen betreuen:"
                - text: Du planst, entwickelst und verwaltest Schnittstellen sowie automatisierte Workflows über Integrationsplattformen wie Make.com. So sorgst du für einen reibungslosen Datenaustausch zwischen Shopify, CRM, ERP, Social-Media-Plattformen und weiteren Systemen.
              - listitem [ref=e59]:
                - strong [ref=e60]: "Systemarchitektur & Datenflüsse optimieren:"
                - text: Du stellst die Datenintegrität über alle Systeme hinweg sicher und entwickelst unsere Systemlandschaft kontinuierlich weiter. Dabei optimierst du Schnittstellen und Prozesse für eine effiziente und skalierbare digitale Infrastruktur.
              - listitem [ref=e61]:
                - strong [ref=e62]: "Zusammenarbeit & Support:"
                - text: Du arbeitest eng mit den Teams aus Marketing, Sales und Customer Service zusammen, um technische Anforderungen in funktionierende digitale Lösungen zu übersetzen und die Weiterentwicklung unserer Systeme aktiv voranzutreiben.
            - heading "Qualifikation" [level=2] [ref=e63]
            - paragraph [ref=e64]:
              - emphasis [ref=e65]: Deine Erfahrungen & Skills
              - strong [ref=e66]: 💪
            - list [ref=e67]:
              - listitem [ref=e68]:
                - strong [ref=e69]: "Praktische Erfahrungen & Schnittstellenkompetenz:"
                - text: Du verfügst über 4 bis 6 Jahre fundierte Berufserfahrung in einer vergleichbaren Position an der Schnittstelle von E-Commerce, Technologie und CRM.
              - listitem [ref=e70]:
                - strong [ref=e71]: "Shopify-Expertise:"
                - text: Du bringst ein tiefes technisches Verständnis der Shopify-Plattform mit, einschließlich Konfiguration, Theme-Anpassungen, App-Integrationen sowie der Shopify-API-Landschaft.
              - listitem [ref=e72]:
                - strong [ref=e73]: "CRM-Know-how:"
                - text: Du hast nachweisbare Erfahrung in der technischen Konfiguration, Datenmodellierung und Automatisierung von CRM-Lösungen
              - listitem [ref=e74]:
                - strong [ref=e75]: "Integration & Automation-Skills:"
                - text: Du verfügst über sehr gute Kenntnisse in der Entwicklung und Konfiguration von Integrations- und Automatisierungslösungen, idealerweise mit Tools wie Make.com, sowie in der Anbindung unterschiedlicher API-Schnittstellen.
              - listitem [ref=e76]:
                - strong [ref=e77]: Business-Verständnis
                - text: ": Du besitzt ein gutes kaufmännisches Verständnis für Geschäftsprozesse. Erfahrungen in der FMCG-Branche sind von Vorteil"
              - listitem [ref=e78]:
                - strong [ref=e79]: "Soft skills:"
                - text: Du bringst Eigeninitiative sowie eine schnelle Auffassungsgabe mit und kannst dich schnell in komplexe Problemstellungen einarbeiten
            - heading "Benefits" [level=2] [ref=e80]
            - paragraph [ref=e81]:
              - emphasis [ref=e82]: Warum Active Nutrition International?
            - list [ref=e83]:
              - listitem [ref=e84]:
                - strong [ref=e85]: "💰 Attraktive Vergütung:"
                - text: Ein wettbewerbsfähiges Gehaltspaket inklusive Unternehmensbonus
              - listitem [ref=e86]:
                - text: 🕒
                - strong [ref=e87]: Flexibilität
                - text: ": Hybrides Arbeiten und flexible Arbeitszeiten sind bei uns Standard."
              - listitem [ref=e88]:
                - text: 🎁
                - strong [ref=e89]: Attraktive Benefits
                - text: ": 30 Tage Urlaub + Sonderurlaub, Weihnachtsgeld, monatliche Wertgutscheine, Geburtstagsgutschein, Bike Leasing, betriebliche Altersvorsorge sowie Kantinenzuschuss"
              - listitem [ref=e90]:
                - text: 💝
                - strong [ref=e91]: Mitarbeiterrabatte
                - text: ": Vergünstigungen für Produkte von uns für dich, Family & Friends"
              - listitem [ref=e92]:
                - strong [ref=e93]: 🎯 Entwicklungsmöglichkeiten
                - text: ": Die Gelegenheit, Expertise in einem wachsenden und innovativen Unternehmen einzubringen und dessen Zukunft aktiv mitzugestalten."
              - listitem [ref=e94]:
                - text: 🎉
                - strong [ref=e95]: Teamgeist
                - text: ": Freu dich auf regelmäßige Team- und Firmenevents."
              - listitem [ref=e96]:
                - strong [ref=e97]: "🤝 Flache Hierarchien:"
                - text: Wir setzen auf transparente Kommunikation, enge Zusammenarbeit zwischen den Teams und eine offene Du-Kultur.
