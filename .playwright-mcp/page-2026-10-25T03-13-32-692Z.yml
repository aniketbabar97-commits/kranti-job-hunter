style=\\\"color:#121317\\\">sicher mit den gängigen MS-Office-Anwendungen umgehst und dich gerne in digitale Tools einarbeitest.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- sowie gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Durch flexible Arbeitszeiten und 2 - 3 Tage Präsenz pro Woche im Büro helfen wir dir, Arbeit und Privatleben in Balance zu halten.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt innovative E-Commerce-Projekte mit bekannten D2C Brands und setzt aktuelle Trends und Technologien direkt in der Praxis ein.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickeln und wertvolle Praxiserfahrung zu sammeln.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten. </span></p></li></ul>\",\"options_photo\":\"off\",\"sharing_description\":\"Frankfurt am Main · Hybrid · Start flexibel · 3 bis 6 MonateStell dir vor, es ist dein erster Tag bei ABRIO: Dein Team empfängt dich herzlich, dein Onboarding ist vorbereitet und beim gemeinsamen Team\",\"guid\":\"1t7y3\",\"tags\":[\"Studierende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"praktikum-hr-recruiting-employer-branding-mwd-3\",\"category_code\":\"recruitment_hr\",\"translations\":{\"de\":{\"description\":\"<p><strong><span style=\\\"color:#121317\\\">Frankfurt am Main · Hybrid · Start flexibel · 3 bis 6 Monate<br></span></strong><span style=\\\"color:#121317\\\"><br>Stell dir vor, es ist dein erster Tag bei ABRIO: Dein Team empfängt dich herzlich, dein Onboarding ist vorbereitet und beim gemeinsamen Team-Lunch lernst du deine neuen Kolleg:innen kennen. Schon bald hilfst du mit, weitere Talente für ABRIO zu begeistern.</span></p><p><span style=\\\"color:#121317\\\">Als Digital-Commerce-Beratung aus Frankfurt unterstützen wir führende Marken bei ihrem Wachstum. Damit auch unser Team weiterwächst, hilfst du uns, passende Talente zu finden, neue Kolleg willkommen zu heißen und ABRIO als Arbeitgeber sichtbar zu machen.<br>Dabei sammelst du praktische Erfahrung im Recruiting und Employer Branding, bringst eigene Ideen ein und wächst mit regelmäßigem Feedback in deine Aufgaben hinein. Klingt spannend? Dann freuen wir uns darauf, dich kennenzulernen!</span></p><p><strong><span style=\\\"color:#121317\\\"><br>SO SIEHT DEIN PRAKTIKUM AUS</span></strong></p><ul><li></li></ul><ul><li><p><strong><span style=\\\"color:#121317\\\">Talent Acquisition – passende Menschen finden und begeistern:</span></strong> <span style=\\\"color:#121317\\\">Du erhältst durch deine Unterstützung im Bewerbermanagement und im Active Sourcing spannende Einblicke in die Welt des Recruitings. Dabei identifizierst du passende Talente und entwickelst kreative Ansprachekonzepte.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Talent Management – unsere Kolleg:innen begleiten:</span></strong> <span style=\\\"color:#121317\\\">Du unterstützt unsere People-Prozesse vom Onboarding bis zum Offboarding. Du hilfst dabei, den Einstieg neuer Kolleg:innen vorzubereiten, Informationen übersichtlich aufzubereiten und organisatorische Abläufe zuverlässig zu gestalten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Employer Branding – ABRIO als Arbeitgeber erlebbar machen:</span></strong> <span style=\\\"color:#121317\\\">Ob Kampagnen, Mitarbeitenden-Testimonials oder neue Benefits – mit deinem Gespür für starke Ideen lässt du unsere Arbeitgebermarke glänzen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Culture &amp; Feel Good – Zusammenarbeit mitgestalten:</span></strong> <span style=\\\"color:#121317\\\">Du bist an der Planung und Durchführung von internen und externen Events beteiligt und erstellst Konzepte, die unser Teamgefühl fördern und unsere Arbeitgebermarke stärken.</span></p></li></ul>\",\"title\":\"Praktikum HR – Recruiting & Employer Branding (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2758064/normal_sharing_3goao37v63ha.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p><span style=\\\"color:#121317\\\">dich mindestens im 3. Semester deines Studiums befindest, idealerweise in einem Studiengang wie BW