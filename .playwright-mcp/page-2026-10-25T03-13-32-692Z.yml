ing mitbringst und neue Trends und Entwicklungen spannend findest.</span></p></li><li><p><span style=\\\"color:#121317\\\">idealerweise erste Berührungspunkte mit Performance Marketing, SEO oder Datenanalyse hattest – Vorkenntnisse sind ein Plus, aber kein Muss.</span></p></li><li><p><span style=\\\"color:#121317\\\">gerne mit Zahlen und Daten arbeitest, Excel sicher nutzt und gleichzeitig ein gutes Gespür für Content und visuelle Details hast sowie Ergebnisse in PowerPoint überzeugend auf den Punkt bringst.</span></p></li><li><p><span style=\\\"color:#121317\\\">dich in einem dynamischen, technologiegetriebenen Umfeld wohlfühlst und KI-Tools selbstverständlich und gezielt für deine Arbeit nutzt.</span></p></li><li><p><span style=\\\"color:#121317\\\">eine hohe Lernbereitschaft mitbringst, Feedback aktiv nutzt und dich schnell in neue Themen einarbeitest.</span></p></li><li><p><span style=\\\"color:#121317\\\">Aufgaben selbstständig anpackst, zuverlässig arbeitest und Verantwortung für deine Themen übernimmst.</span></p></li><li><p><span style=\\\"color:#121317\\\">du gerne im Team arbeitest, offen kommunizierst und gemeinsam mit anderen gerne die besten Lösungen findest.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- sowie gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt innovative E-Commerce-Projekte mit bekannten D2C Brands und setzt aktuelle Trends und Technologien direkt in der Praxis ein.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickeln und wertvolle Praxiserfahrung zu sammeln.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.</span></p></li></ul>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist der erste Tag deines Praktikums bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet und nach einem gemeinsa\",\"guid\":\"1dw3b\",\"tags\":[\"Studierende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"praktikum-digital-marketing-e-commerce-mwd\",\"category_code\":\"advertising\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Stell dir vor, es ist der erste Tag deines Praktikums bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet und nach einem gemeinsamen Team-