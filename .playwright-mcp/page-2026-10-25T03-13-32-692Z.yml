entwickelst du die Marketingfunktion einer spezialisierten Digital-Commerce-Beratung weiter. Du schärfst u\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Du willst B2B-Marketing nicht nur „betreuen“, sondern eine Marke sichtbar aufbauen? Bei ABRIO entwickelst du die Marketingfunktion einer spezialisierten Digital-Commerce-Beratung weiter. Du schärfst unsere Positionierung im Shopify- und Enterprise-E-Commerce-Umfeld, entwickelst Content- und LinkedIn-Formate, steuerst Partner- und Event-Marketing und machst aus Sichtbarkeit qualifizierte Nachfrage. Dabei arbeitest du direkt mit der Geschäftsführung und Sales zusammen – mit Budget, Ownership und viel Gestaltungsspielraum.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Strategische B2B-Positionierung</span></strong><span style=\\\"color:#121317\\\">: In enger Zusammenarbeit mit der Geschäftsführung entwickelst du die Marketing Strategy von ABRIO weiter, schärfst unsere B2B-Positionierung inklusive Messaging, USP, ICP und Value Proposition und stärkst unsere Wahrnehmung im Digital-Commerce, Shopify- und Enterprise-E-Commerce-Umfeld.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">B2B Branding &amp; Brand Management: </span></strong><span style=\\\"color:#121317\\\">Du verantwortest unser B2B Branding über Website, LinkedIn Marketing, PR, Content Marketing und Events hinweg und stellst eine hochwertige, konsistente Markenpräsenz über alle relevanten Kanäle sicher.</span></p></li><li><p class=\\\"MsoLi