d modernen Frontends und möchtest E-Commerce-Lösungen für D2C-, B2C- und B2B-Marken bauen? Bei ABRIO entwickelst du performante Shopify-Frontends, setzt Features um und wächst mit Mentoring in Kundenprojekten. Shopify-Erfahrung ist ein Plus, kein Muss.</span></p><p class=\\\"MsoNormal\\\" style=\\\"text-align:justify;\\\"><span style=\\\"color:#121317\\\">ABRIO ist eine der führenden Digital Commerce Beratungen mit Sitz in Frankfurt am Main. Unser Ziel: Die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Ansätzen und maßgeschneiderten Lösungen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!<br><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Projektarbeit im Commerce-Umfeld: </span></strong><span style=\\\"color:#121317\\\">Du arbeitest in einem interdisziplinären Team mit Developern, Designern und Marketing-Experten an anspruchsvollen Shopify-Migrations- und Plattformprojekten sowie modernen Onlineshops für namhafte Kunden aus dem D2C-, B2C- und B2B-Umfeld.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Frontend Development:</span></strong><span style=\\\"color:#121317\\\"> Du entwickelst moderne, performante und responsive Frontends für E-Commerce-Plattformen und setzt Anforderungen sauber in skalierbare Lösungen um.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Shopify-Weiterentwicklung &amp; Features: </span></strong><span style=\\\"color:#121317\\\">Du erweiterst Shopify-Funktionen mit passenden Apps und verbesserst so gezielt die User Experience.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Technische Umsetzung:</span></strong><span style=\\\"color:#121317\\\"> Du nutzt moderne Technologien wie TypeScript und gäng