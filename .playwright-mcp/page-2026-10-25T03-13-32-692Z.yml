stehst und Lust hast, im nächsten Schritt deinen Fokus auf die technische Beratung, Qualitätssicherung und fachliche Führung, statt auf reines Coding, zu legen.</span></p></li><li><p class=\\\"MsoListParagraph\\\"><span style=\\\"color:#121317\\\">fachliche Anforderungen sicher in technische Konzepte und strukturierte, umsetzbare Arbeitspakete für das Team übersetzen kannst.</span></p></li><li><p><span style=\\\"color:#121317\\\">souverän im Kundenkontakt auftrittst, Entscheidungen zu Trade-offs (Risiken, Qualität) vor- und aufbereitest und Lösungen klar präsentierst.</span></p></li><li><p class=\\\"MsoListParagraph\\\"><span style=\\\"color:#121317\\\">Erfahrung mit Cloud-Infrastrukturen, DevOps-Praktiken und CI/CD-Pipelines mitbringst.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- und gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Du bringst deine Erfahrung und Perspektive aktiv ein und prägst die Zusammenarbeit in einem offenen, wertschätzenden Team. Regelmäßige Teamevents stärken dabei den gemeinsamen Austausch.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance: </span></strong><span style=\\\"color:#121317\\\">30 Tage Urlaub und ein kleines Extra für deine Auszeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken, leitest dein Team und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Lead Engineer (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten, professionellen Team empfangen und tauchst nach einem ersten gemeinsamen Lunch direk\",\"guid\":\"ucr9g\",\"tags\":[\"Berufserfahrene\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"lead-engineer-mwd\",\"category_code\":\"internet\",\"translations\":{\"de\":{\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Lead Engineer (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Du wirst herzlich von einem motivierten, professionellen Team empfangen und tauchst nach einem ersten gemeinsamen Lunch direkt in die Welt des E-Commerce ein.</span></p><p><span style=\\\"color:#121317\\\">Schnell lernst du unsere vielfältigen Projekte kennen: von Plattformmigrationen auf Shopify über individuelle Apps für unsere Kunden bis hin zu Frontend-Funktionalitäten zur Verbesserung der Customer Experience und Middleware-Komponenten für die Integration von Shopify in komplexe Enterprise-Architekturen – für spannende Marken aus D2C, B2C und B2B.</span></p><p><span style=\\\"color:#121317\\\">Dabei wird schnell klar: Bei ABRIO kannst du deine Erfahrung und technische Kompetenz voll einbringen. Dein Blick für skalierbare Architekturen, robuste Solution Designs und deine Stärke in der fachlichen Führung von Mitarbeitenden und Kunden werden sofort geschätzt.</span></p><p><span style=\\\"color:#121317\\\">In abwechslungsreichen E-Commerce-Projekten arbeitest du eng mit Consultants, Senior Developern, Requirements Engineers und den Ansprechpartnern auf Kundenseite zusammen. Du bringst Struktur in komplexe Shopify-Setups, entwickelst Zielbilder für skalierbare E-Commerce-Architekturen und verantwortest die Konzeption sowie Umsetzung der Anforderungen.</span></p><p><span style=\\\"color:#121317\\\">So wirst du schnell ein wichtiger Teil von ABRIO – einer führenden Digital-Commerce-Beratung und Shopify-Plus-Partner aus Frankfurt. Gemeinsam verbessern wir die E-Commerce-Welt unserer Kunden nachhaltig mit modernen Technologien, innovativen Ansätzen und maßgeschneiderten Lösungen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Beratung &amp; technische Konzeption:</span></strong><span style=\\\"color:#121317\\\"> Du analysierst Kundenanforderungen, begleitest Workshops zu Commerce-Architekturen und übersetzt fachliche Ziele in skalierbare technische Konzepte. Gemeinsam mit Consultants und Requirements Engineers strukturierst du Anforderungen und unterstützt bei der Priorisierung von Backlogs.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Solution Architecture:</span></strong><span style=\\\"color:#121317\\\"> Du entwickelst technische Zielbilder und Integrationsarchitekturen für Shopify-basierte Enterprise-Commerce-Lösungen. Dabei verantwortest du die Auswahl geeigneter Technologien, Integrationsstrategien sowie die Konzeption von Apps, Frontend-Lösungen und Middleware-Komponenten.</span></p></li><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Technische Führung &amp; Delivery:</span></strong><span style=\\\"color:#121317\\\"> Du führst Entwicklerteams fachlich in Projekten, strukturierst Arbeitspakete und triffst zentrale technische Entscheidungen in Abstimmung mit dem Kunden. Dabei stellst du sicher, dass Architekturkonzepte sauber umgesetzt werden und Projekte technisch erfolgreich geliefert werden.</span></p></li><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Kundenarbeit:</span></strong><span style=\\\"color:#121317\\\"> Du bist technischer Ansprechpartner für unsere Kunden, präsentierst Architekturkonzepte und unterstützt bei technischen Entscheidungen rund um skalierbare Commerce-Plattformen.</span></p></li><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Engineering Excellence &amp; Qualität:</span></strong><span style=\\\"color:#121317\\\"> Du entwickelst unsere Engineering-Standards weiter, führst Code- und Architektur-Reviews durch und stellst sicher, dass unsere Lösungen höchsten Qualitätsansprüchen hinsichtlich Skalierbarkeit, Performance und Wartbarkeit entsprechen.</span></p></li></ul>\",\"title\":\"Lead Engineer (m/w/d)\",\"highlight\":null,\"sharing_image\":null,\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><span style=\\\"color:#121317\\\">3+ Jahre Berufserfahrung als Developer in Projekten mit komplexen Anwendungs-, Integrations- und Service-Architekturen mitbringst – z. B. im Beratungs- oder Konzernumfeld. Auch wenn du noch nicht alle Anforderungen erfüllst, aber großes Interesse daran hast, dich in Richtung Solution Architecture und technische Führung weiterzuentwickeln, freuen wir uns auf deine Bewerbung.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein Studium im Bereich (Wirtschafts-)Informatik, Ingenieurwissenschaften, Mathematik oder einer vergleichbaren Fachrichtung absolviert hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">Spaß daran hast, mit hoher Eigenverantwortung in agilen Setups zu arbeiten und idealerweise erste Erfahrung in der fachlichen Führung mitbringst.</span></p></li><li><p><span style=\\\"color:#121317\\\">Kundenanforderungen im Kontext integrierter technischer Lösungen verstehst und Lust hast, im nächsten Schritt deinen Fokus auf die technische Beratung, Qualitätssicherung und fachliche Führung, statt auf reines Coding, zu legen.</span></p></li><li><p class=\\\"MsoListParagraph\\\"><span style=\\\"color:#121317\\\">fachliche Anforderungen sicher in technische Konzepte und strukturierte, umsetzbare Arbeitspakete für das Team übersetzen kannst.</span></p></li><li><p><span style=\\\"color:#121317\\\">souverän im Kundenkontakt auftrittst, Entscheidungen zu Trade-offs (Risiken, Qualität) vor- und aufbereitest und Lösungen klar präsentierst.</span></p></li><li><p class=\\\"MsoListParagraph\\\"><span style=\\\"color:#121317\\\">Erfahrung mit Cloud-Infrastrukturen, DevOps-Praktiken und CI/CD-Pipelines mitbringst.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- und gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Du bringst deine Erfahrung und Perspektive aktiv ein und prägst die Zusammenarbeit in einem offenen, wertschätzenden Team. Regelmäßige Teamevents stärken dabei den gemeinsamen Austausch.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance: </span></strong><span style=\\\"color:#121317\\\">30 Tage Urlaub und ein kleines Extra für deine Auszeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken, leitest dein Team und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"sharing_title\":\"Lead Engineer (m/w/d)\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Lead Engineer (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten, professionellen Team empfangen und tauchst nach einem ersten gemeinsamen Lunch direk\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Lead Engineer (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Du wirst herzlich von einem motivierten, professionellen Team empfangen und tauchst nach einem ersten gemeinsamen Lunch direkt in die Welt des E-Commerce ein.</span></p><p><span style=\\\"color:#121317\\\">Schnell lernst du unsere vielfältigen Projekte kennen: von Plattformmigrationen auf Shopify über individuelle Apps für unsere Kunden bis hin zu Frontend-Funktionalitäten zur Verbesserung der Customer Experience und Middleware-Komponenten für die Integration von Shopify in komplexe Enterprise-Architekturen – für spannende Marken aus D2C, B2C und B2B.</span></p><p><span style=\\\"color:#121317\\\">Dabei wird schnell klar: Bei ABRIO kannst du deine Erfahrung und technische Kompetenz voll einbringen. Dein Blick für skalierbare Architekturen, robuste Solution Designs und deine Stärke in der fachlichen Führung von Mitarbeitenden und Kunden werden sofort geschätzt.</span></p><p><span style=\\\"color:#121317\\\">In abwechslungsreichen E-Commerce-Projekten arbeitest du eng mit Consultants, Senior Developern, Requirements Engineers und den Ansprechpartnern auf Kundenseite zusammen. Du bringst Struktur in komplexe Shopify-Setups, entwickelst Zielbilder für skalierbare E-Commerce-Architekturen und verantwortest die Konzeption sowie Umsetzung der Anforderungen.</span></p><p><span style=\\\"color:#121317\\\">So wirst du schnell ein wichtiger Teil von ABRIO – einer führenden Digital-Commerce-Beratung und Shopify-Plus-Partner aus Frankfurt. Gemeinsam verbessern wir die E-Commerce-Welt unserer Kunden nachhaltig mit modernen Technologien, innovativen Ansätzen und maßgeschneiderten Lösungen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Beratung &amp; technische Konzeption:</span></strong><span style=\\\"color:#121317\\\"> Du analysierst Kundenanforderungen, begleitest Workshops zu Commerce-Architekturen und übersetzt fachliche Ziele in skalierbare technische Konzepte. Gemeinsam mit Consultants und Requirements Engineers strukturierst du Anforderungen und unterstützt bei der Priorisierung von Backlogs.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Solution Architecture:</span></strong><span style=\\\"color:#121317\\\"> Du entwickelst technische Zielbilder und Integrationsarchitekturen für Shopify-basierte Enterprise-Commerce-Lösungen. Dabei verantwortest du die Auswahl geeigneter Technologien, Integrationsstrategien sowie die Konzeption von Apps, Frontend-Lösungen und Middleware-Komponenten.</span></p></li><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Technische Führung &amp; Delivery:</span></stro