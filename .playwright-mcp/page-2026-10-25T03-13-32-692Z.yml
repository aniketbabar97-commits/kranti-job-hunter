am mit uns weiterzuentwickeln.</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">E-Commerce &amp; Growth Consulting: </span></strong><span style=\\\"color:#121317\\\">Du berätst unsere Kunden zu Themen wie E-Commerce-Wachstum, D2C, Conversion-Optimierung, Funnel-Performance und digitalen Wachstumshebeln.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Projektarbeit mit wachsender Verantwortung:</span></strong><span style=\\\"color:#121317\\\"> Du übernimmst Verantwortung für eigene Themen und Teilprojekte und steuerst Kundenprojekte – je nach Erfahrung – gemeinsam mit erfahrenen Kolleg:innen oder zunehmend eigenständig.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Strategie bis Umsetzung: </span></strong><span style=\\\"color:#121317\\\">Du entwickelst Growth-Roadmaps, priorisierst Maßnahmen und bringst diese gemeinsam mit unseren Kunden und internen Teams in die Umsetzung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Performance &amp; Analyse: </span></strong><span style=\\\"color:#121317\\\">Du identifizierst Potenziale anhand relevanter KPIs wie Umsatzentwicklung, Conversion Rate, ROAS, Retention, AOV oder Customer Lifetime Value und leitest daraus konkrete Handlungsempfehlungen ab.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Kundenkommunikation:</span></strong><span style=\\\"color:#121317\\\"> Du arbeitest direkt mit Kunden und Stakeholdern zusammen, bereitest Themen strukturiert auf und entwickelst dich Schritt für Schritt zu einer verlässlichen Ansprechperson auf Kundenseite.</span></p></li></ul>\",\"title\":\"E-Commerce Consultant (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2714183/normal_sharing_pv1f7pymncfk.png\",\"requirements\":\"<p><strong