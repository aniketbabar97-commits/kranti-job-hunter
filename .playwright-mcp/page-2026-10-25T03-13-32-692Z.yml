evorzugter Arbeitsort?\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><span style=\\\"color:#121317\\\">eingeschrieben bist und dich mindestens im dritten Semester deines Studiums befindest – beispielsweise in BWL mit Schwerpunkt Personal, Personalmanagement, (Wirtschafts-)Psychologie oder einem vergleichbaren Studiengang.</span></p></li><li><p><span style=\\\"color:#121317\\\">unser Team mit 16–20 Stunden pro Woche unterstützen kannst und dich auf die Zusammenarbeit in unserem Frankfurter Büro und im Homeoffice freust.</span></p></li><li><p><span style=\\\"color:#121317\\\">motiviert und lernbereit bist und dich schnell in spannende, verantwortungsvolle Aufgaben einarbeiten möchtest oder idealerweise schon erste Erfahrung in HR, Recruiting oder Employer Branding gesammelt hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein Organisationstalent bist, ein Händchen für kreative Recruitingideen hast und du Lust hast, dich mit dem Thema Employer Branding zu beschäftigen und unsere Arbeitgebermarke zu stärken.</span></p></li><li><p><span style=\\\"color:#121317\\\">eine selbstständige und strukturierte Arbeitsweise mitbringst und du dich selbst zugänglich und empathisch beschreibst.</span></p></li><li><p><span style=\\\"color:#121317\\\">sicher im Umgang mit den gängigen MS-Office-Anwendungen bist und gerne digital arbeitest.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- sowie gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Mit flexiblen Arbeitszeiten und abgestimmten Präsenzzeiten gestalten wir gemeinsam eine gute Balance zwischen Studium und Job.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickeln und wertvolle Praxiserfahrung zu sammeln.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Frankfurt am Main · Hybrid · Start ab sofort · 16–20 Stunden pro WocheStell dir vor, es ist dein erster Tag als Werkstudent:in HR bei ABRIO. Dein Team empfängt dich herzlich, dein Onboarding ist vorbe\",\"guid\":\"ggfmg\",\"tags\":[\"Studierende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"werkstudent-hr-recruiting-employer-branding-mwd\",\"category_code\":\"recruitment_hr\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">Frankfurt am Main · Hybrid · Start ab sofort · 16–20 Stunden pro Woche</span></strong></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als Werkstudent:in HR bei ABRIO. Dein Team empfängt dich herzlich, dein Onboarding ist vorbereitet und beim gemeinsamen Team-Lunch lernst du deine neuen Kolleg:innen kennen. Schon bald hilfst du selbst dabei, weitere Talente für ABRIO zu begeistern.</span></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Als Digital-Commerce-Beratung aus Frankfurt unterstützen wir führende Marken bei ihrem digitalen Wachstum. Im People-&amp;-Culture-Team gestaltest du mit, wie wir passende Menschen gewinnen, neue Kolleg:innen begleiten und unsere Arbeitgebermarke erlebbar machen.</span></p><p><span style=\\\"color:#121317\\\">Dabei bringst du dein Wissen aus dem Studium ein, sammelst praktische Erfahrung im Recruiting und Personalmanagement und übernimmst nach deiner Einarbeitung eigene Aufgaben. Regelmäßiges Feedback unterstützt dich dabei, fachlich und persönlich weiterzuwachsen. Klingt spannend? Dann freuen wir uns darauf, dich kennenzulernen!</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Talent Acquisition – passende Menschen finden und begeistern:</span></strong> <span style=\\\"color:#121317\\\">Du erhältst durch deine Unterstützung im Bewerbermanagement und im Active Sourcing spannende Einblicke in die Welt des Recruitings. Dabei identifizierst du passende Talente und entwickelst kreative Ansprachekonzepte.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Talent Management – unsere Kolleg:innen begleiten:</span></strong> <span style=\\\"color:#121317\\\">Du unterstützt unsere People-Prozesse vom Onboarding bis zum Offboarding. Du hilfst dabei, den Einstieg neuer Kolleg:innen vorzubereiten, Informationen übersichtlich aufzubereiten und organisatorische Abläufe zuverlässig zu gestalten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Employer Branding – ABRIO als Arbeitgeber erlebbar machen:</span></strong> <span style=\\\"color:#121317\\\">Ob Kampagnen, Mitarbeitenden-Testimonials oder neue Benefits – mit deinem Gespür für starke Ideen lässt du unsere Arbeitgebermarke glänzen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Culture &amp; Feel Good – Zusammenarbeit mitgestalten:</span></strong> <span style=\\\"color:#121317\\\">Du bist an der Planung und Durchführung von internen und externen Events beteiligt und erstellst Konzepte, die unser Teamgefühl fördern und unsere Arbeitgebermarke stärken.</span></p></li></ul>\",\"title\":\"Werkstudent HR – Recruiting & Employer Branding (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2758301/normal_sharing_3s958mhao3bc.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><span style=\\\"color:#121317\\\">eingeschrieben bist und dich mindestens im dritten Semester deines Studiums befindest – beispielsweise in BWL mit Schwerpunkt Personal, Personalmanagement, (Wirtschafts-)Psychologie oder einem vergleichbaren Studiengang.</span></p></li><li><p><span style=\\\"color:#121317\\\">unser Team mit 16–20 Stunden pro Woche unterstützen kannst und dich auf die Zusammenarbeit in unserem Frankfurter Büro und im Homeoffice freust.</span></p></li><li><p><span style=\\\"color:#121317\\\">motiviert und lernbereit bist und dich schnell in spannende, verantwortungsvolle Aufgaben einarbeiten möchtest oder idealerweise schon erste Erfahrung in HR, Recruiting oder Employer Branding gesammelt hast.</span></p></li><li><p><sp