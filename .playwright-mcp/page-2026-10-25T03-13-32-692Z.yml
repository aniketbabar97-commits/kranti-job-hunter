zient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken, leitest dein Team und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Senior Developer (m/w/d) bei ABRIO. Nach einem gemeinsamen Team-Lunch tauchst du direkt in anspruchsvolle Shopify-Migrations- und Plattformprojekte für führen\",\"guid\":\"wh2wn\",\"tags\":[\"Berufserfahrene\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"senior-developer-mwd\",\"category_code\":\"internet\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Senior Developer (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Nach einem gemeinsamen Team-Lunch tauchst du direkt in anspruchsvolle Shopify-Migrations- und Plattformprojekte für führende Marken aus D2C, B2C und B2B ein.</span></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Schnell merkst du: Hier kannst du deine Erfahrung aus mehreren Jahren Webentwicklung einbringen, technische Verantwortung übernehmen und die technologische Ausrichtung anspruchsvoller E-Commerce-Projekte aktiv mitgestalten. Du entwickelst performante, skalierbare E-Commerce-Lösungen und löst komplexe technische Herausforderungen.</span></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Dabei geht deine Rolle über die reine Umsetzung hinaus: Du bringst deine Expertise in Architektur, Solution Design und strategische Technologieentscheidungen ein, arbeitest eng mit UX/UI Design, Consulting, Requirements Engineering und unseren Kunden zusammen und hast die Möglichkeit, fachliche Verantwortung im Team zu übernehmen und andere Engineers weiterzuentwickeln.</span></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">ABRIO ist eine führende Digital-Commerce-Beratung mit Sitz in Frankfurt am Main. Unser Ziel: die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen.</span></p><p><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH</span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Build &amp; Ship:</span></strong><span style=\\\"color:#121317\\\"> Du entwickelst moderne, performante und barrierearme E-Commerce-Anwendungen und bringst Features von der Idee bis in Production.</span></p></li></ul><ul><li><p><strong><span style=\\\"color:#121317\\\">Technischer Umsetzungspartner:</span></strong><span style=\\\"color:#121317\\\"> Du begleitest unsere Kunden als technischer Umsetzungspartner, bewertest Optionen, erklärst komplexe Architekturentscheidungen verständlich und entwickelst gemeinsam tragfähige Lösungen.</span></p></li></ul><ul><li><p><strong><span style=\\\"color:#121317\\\">Von Business zu Tech:</span></strong><span style=\\\"color:#121317\\\"> Du übersetzt Anforderungen und Geschäftsziele gemeinsam mit Consulting und Requirements Engineering in klare technische Konzepte, sinnvolle Backlogs und umsetzbare Lösungen.</span></p></li></ul><ul><li><p><strong><span style=\\\"color:#121317\\\">Architecture &amp; Solution Design:</span></strong><span style=\\\"color:#121317\\\"> Du gestaltest skalierbare Shopify-Architekturen, Integrationen und technische Zielbilder – vom Frontend über Apps und APIs bis hin zu Middleware und angebundenen Systemen.</span></p></li></ul><ul><li><p><strong><span style=\\\"color:#121317\\\">Ownership im Projekt:</span></strong><span style=\\\"color:#121317\\\"> Du übernimmst die technische Führung für größere Features und Workstreams, triffst Entscheidungen und bringst Themen gemeinsam mit dem Team zuverlässig ins Ziel.</span></p></li></ul><ul><li><p><strong><span style=\\\"color:#121317\\\">Raise the Bar:</span></strong><span style=\\\"color:#121317\\\"> Du hinterfragst bestehende Lösungen, gibst Feedback in Code- und Architecture-Reviews und entwickelst unsere Engineering-Practices weiter. Gleichzeitig gibst du deine Erfahrung weiter, stehst weniger erfahrenen Engineers als Sparringspartner zur Seite und unterstützt sie durch fachliches Coaching und Mentoring in ihrer Entwicklung.</span></p></li></ul>\",\"title\":\"Senior Developer (m/w/d)\",\"highlight\":null,\"sharing_image\":null,\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><span style=\\\"color:#121317\\\">4+ Jahre Berufserfahrung als Developer in Projekten mit komplexen Anwendungs-, Integrations- und Service-Architekturen mitbringst – idealerweise im Beratungs- oder Agenturumfeld. Auch wenn du noch nicht alle Anforderungen erfüllst, aber Lust hast, dich fachlich weiterzuentwickeln und mehr technische Verantwortung zu übernehmen, freuen wir uns auf deine Bewerbung.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Kenntnisse in JavaScript beziehungsweise TypeScript sowie Erfahrung mit React, </span><a rel=\\\"noopener\\\" target=\\\"_blank\\\" href=\\\"http://Next.js\\\"><span style=\\\"color:#121317\\\">Next.js</span></a><span style=\\\"color:#121317\\\"> oder vergleichbaren Technologien hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein Studium im Bereich (Wirtschafts-)Informatik, Ingenieurwissenschaften, Mathematik oder einer vergleichbaren Fachrichtung absolviert hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">Spaß daran hast, mit hoher Eigenverantwortung in agilen Setups zu arbeiten und dein Wissen aktiv ins Team einzubringen.</span></p></li><li><p><span style=\\\"color:#121317\\\">Kundenanforderungen im Kontext integrierter technischer Lösungen verstehst und Lust hast, neben dem Coding mehr Verantwortung für technische Konzeption, Qualität und eine erfolgreiche Umsetzung zu übernehmen.</span></p></li><li><p class=\\\"MsoListParagraph\\\"><span style=\\\"color:#121317\\\">fachliche Anforderungen sicher in technische Konzepte und strukturierte, umsetzbare Arbeitspakete für das Team übersetzen kannst.</span></p></li><li><p><span style=\\\"color:#121317\\\">souverän im Kundenkontakt auftrittst, Entscheidungen zu Trade-offs (Risiken, Qualität) vor- und aufbereitest und Lösungen klar präsentierst.</span></p></li><li><p class=\\\"MsoListParagraph\\\"><span style=\\\"color:#121317\\\">Erfahrung mit Cloud-Infrastrukturen, DevOps-Praktiken und CI/CD-Pipelines mitbringst.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- und gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Du bringst deine Erfahrung und Perspektive aktiv ein und prägst die Zusammenarbeit in einem offenen, wertschätzenden Team. Regelmäßige Teamevents stärken dabei den gemeinsamen Austausch.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance: </span></strong><span style=\\\"color:#121317\\\">30 Tage Urlaub und ein kleines Extra für deine Auszeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken, leitest dein Team und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p>\",\"sharing_title\":\"Senior Developer (m/w/d)\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Senior Developer (m/w/d) bei ABRIO. Nach einem gemeinsamen Team-Lunch tauchst du direkt in anspruchsvolle Shopify-Migrations- und Plattformprojekte für führen\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Senior Developer (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Nach einem gemeinsamen Team-Lunch tauchst du direkt in anspruchsvolle Shopify-Migrations- und Plattformprojekte für führende Marken aus D2C, B2C und B2B ein.</span></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Schnell merkst du: Hier kannst du deine Erfahrung aus mehreren Jahren Webentwicklung einbringen, t