Performance kontinuierlich zu verbessern.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Datenanalyse &amp; Insights: </span></strong><span style=\\\"color:#121317\\\">Du wertest relevante Marketing- und E-Commerce-Daten aus, erkennst Zusammenhänge und leitest daraus konkrete Optimierungsmöglichkeiten ab.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Content-Erstellung</span></strong><span style=\\\"color:#121317\\\">: Du unterstützt bei der Entwicklung und Aufbereitung von Content für unterschiedliche digitale Kanäle und Kundenprojekte.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Reporting &amp; Präsentationen: </span></strong><span style=\\\"color:#121317\\\">Du bereitest Ergebnisse und Handlungsempfehlungen verständlich auf und bringst sie in Reportings und PowerPoint-Präsentationen auf den Punkt.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">E-Commerce ganzheitlich kennenlernen:</span></strong><span style=\\\"color:#121317\\\"> Neben deinem Schwerpunkt bekommst du die Möglichkeit, auch in Bereiche wie CRM, CRO oder SEO einzutauchen und so weitere Hebel im E-Commerce kennenzulernen.</span></p></li></ul>\",\"title\":\"Praktikum - Digital Marketing & E-Commerce (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2735521/normal_sharing_sgudr1k3lunr.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p><span style=\\\"color:#121317\\\">dich in einem höheren Bachelor- oder Masterstudiengang in BWL, E-Commerce, Marketing, Digital Business oder einem vergleichbaren Studiengang mit Digital- und Business-Bezug befindest.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein starkes Interesse an E-Commerce und Digital Marketing mitbringst und neue Trends und Entwicklungen spannend findest.</span></p></li><li><p><span style=\\\"color:#121317\\\">idealerweise erste Berü