ahrung und Perspektive aktiv ein und prägst die Zusammenarbeit in einem offenen, wertschätzenden Team. Regelmäßige Teamevents stärken dabei den gemeinsamen Austausch.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance: </span></strong><span style=\\\"color:#121317\\\">30 Tage Urlaub und ein kleines Extra für deine Auszeit: ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für fü