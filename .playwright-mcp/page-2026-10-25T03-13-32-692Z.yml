vitäten – wir nehmen uns bewusst Zeit füreinander.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag</span></strong><span style=\\\"color:#121317\\\">: Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Faire Vergütung &amp; attraktive Benefits:</span></strong><span style=\\\"color:#121317\\\"> Attraktive Bonuszahlungen und eine Benefitcard mit monatlich 50,00€ netto steuerfreiem Sachbezug ergänzen eine faire Vergütung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein:</span></strong><span style=\\\"color:#121317\\\"> Mit Unterstützung übernimmst du Verantwortung, entwickelst dich weiter und gehst den nächsten Schritt in deiner Karriere.</span></p><p style=\\\"min-height: 1.7em;\\\"></p></li></ul><p><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Consultant – CRO &amp; Digital Growth (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gemei\",\"guid\":\"fsbep\",\"tags\":[\"Berufserfahrene\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"consultant-cro-digital-growth-mwd-1\",\"category_code\":\"consulting\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Consultant – CRO &nbsp;&amp; Digital Growth (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gemeinsamen Team-Lunch startest du direkt in die Welt des E-Commerce – mit spannenden Shopify-, Plattform- und Optimierungsprojekten für führende Marken aus den Bereichen D2C, B2C und B2B.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Du hast sofort gemerkt: Hier kannst du dein analytisches Denken, dein CRO-Expertenwissen und deinen Blick für digitale Kundenerlebnisse einbringen, um messbare Verbesserungen für unsere Kunden zu schaffen. Du entwickelst gemeinsam mit unseren UX-/UI-Expert:innen Hypothesen,</span><a rel=\\\"noopener\\\" target=\\\"_blank\\\" href=\\\"#_msocom_1\\\"><span style=\\\"color:#121317\\\">[NO1]</span></a><span style=\\\"color:#121317\\\">&nbsp; steuerst A/B-Tests, priorisierst Maßnahmen nach Business Impact und bringst Design, Development und Kunden an einen Tisch.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">ABRIO ist eine der führenden Digital Commerce Beratungen mit Sitz in Frankfurt am Main. Unser Ziel: die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Ansätzen und maßgeschneiderten Lösungen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!<br><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">CRO: </span></strong><span style=\\\"color:#121317\\\">Du bist eine unserer zentralen Ansprechpersonen für Conversion Rate Optimization bei unseren starken D2C-, B2C- und B2B-Kunden. Neben deinem klaren CRO-Fokus bringst du deine Expertise auch in ausgewählte generalistische E-Commerce-Consulting-Themen ein.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Test &amp; Learn: </span></strong><span style=\\\"color:#121317\\\">Du analysierst Nutzerverhalten, Conversion-Funnel, Shop-Performance und zentrale KPIs, leitest fundierte Hypothesen ab und nutzt KI als Hebel, um Testing schneller, besser und skalierbarer zu machen.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Schnittstellenmanagement:</span></strong><span style=\\\"color:#121317\\\"> Du übersetzt CRO-Ideen in präzise Briefings für Design und Development, koordinierst Tests und stellst sicher, dass Maßnahmen effizient, sauber und im Sinne des Kunden umgesetzt werden. In regelmäßigen Jour fixes mit deinen Kunden präsentierst du Reportings, besprichst Learnings und leitest nächste Schritte ab.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Digital Growth:</span></strong><span style=\\\"color:#121317\\\"> Du steuerst die Weiterentwicklung unserer Bestandskunden im Bereich Maintenance und Shopoptimierung. Dabei koordinierst du Audits, Page-Speed-Analysen und Feature-Implementierungen, priorisierst Anforderungen gemeinsam mit dem Kunden und sorgst als Schnittstelle zwischen Kunden, Design und Development für eine erfolgreiche Umsetzung.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">E-Commerce Consulting:</span></strong><span style=\\\"color:#121317\\\"> Neben klassischen CRO-Projekten arbeitest du auch an Optimierungsthemen rund um Shopify, Themeintegrationen und der kontinuierlichen Weiterentwicklung bestehender Shops.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">CRO Excellence:</span></strong><span style=\\\"color:#121317\\\"> Du bringst deine Expertise ein, entwickelst bestehende CRO-Standards, Prozesse und Quality-Assurance-Ansätze weiter und bewertest neue Partner-Tools, um datengetriebene Optimierung im Team noch wirksamer und skalierbarer zu machen.</span></p></li></ul>\",\"title\":\"Consultant – CRO & Digital Growth (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2649286/normal_sharing_da9v8smasv49.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><span style=\\\"color:#121317\\\">idealerweise 3+ Jahre Erfahrung im E-Commerce-Umfeld im Bereich Conversion Rate Optimization in einer Agentur oder einer D2C-Brand gesammelt hast.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">einen Hochschulabschluss in BWL, Digital Marketing, E-Commerce, Psychologie, Kommunikation oder einem vergleichbaren Bereich erfolgreich abgeschlossen hast.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">sehr gute Kenntnisse in Analytics-Tools (z. B. Adobe Analytics, GA4, Microsoft Clarity, Hotjar) und Experimentation-Tools (z. B. Kameleoon, AB Tasty, ABlyft, Optimizely) mitbringst, diese sicher zur Analyse, Hypothesenbildung und Testauswertung einsetzt und Lust hast, CRO- und Testing-Setups aktiv weiterzuentwickeln.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">datengetrieben denkst, Hypothesen strukturiert aus Analysen ableitest und fundierte Kenntnisse in Landing-Page-Optimierung sowie ein gutes Verständnis für UX-Prinzipien mitbringst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">dich selbst als analytische und zahlenaffine Person mit echter Begeisterung für digitale Geschäftsmodelle, Online-Shops, Customer Journeys und Performance-Optimierung beschreibst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">kommunikationsstark bist und dich auf Deutsch und Englisch professionell mit Kunden und internen Teams austauschen kannst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">selbstständig priorisierst, lösungsorientiert arbeitest und einen hohen Anspruch an Qualität, Prozesse und Kundenerlebnis mitbringst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">Lust hast, Expert:in in deinem Schwerpunkt zu sein und gleichzeitig über den Tellerrand zu schauen.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance</span></strong><span style=\\\"color:#121317\\\">: 30 Tage Urlaub und ein kleines Extra für deine Auszeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen:</span></strong><span style=\\\"color:#121317\\\"> Durch flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche helfen wir dir, Arbeit und Privatleben in Balance zu halten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt:</span></strong><span style=\\\"color:#121317\\\"> Mit einem persönlichen Weiterbildungsbudget kannst du dein Wachstum individuell voranbringen. Ob Zertifizierungen, Schulungen oder persönliches Mentoring – Wachstum ist für uns von großer Bedeutung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact:</span></strong><span style=\\\"color:#121317\\\"> Du arbeitest an innovativen E-Commerce-Projekten mit führenden Marken, setzt aktuelle Technologien ein und übernimmst schrittweise mehr Verantwortung in Projekten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts</span></strong><span style=\\\"color:#121317\\\">: Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt</span></strong><span style=\\\"color:#121317\\\">: Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag</span></strong><span style=\\\"color:#121317\\\">: Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Faire Vergütung &amp; attraktive Benefits:</span></strong><span style=\\\"color:#121317\\\"> Attraktive Bonuszahlungen und eine Benefitcard mit monatlich 50,00€ netto steuerfreiem Sachbezug ergänzen eine faire Vergütung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein:</span></strong><span style=\\\"color:#121317\\\"> Mit Unterstützung übernimmst du Verantwortung, entwickelst dich weiter und gehst den nächsten Schritt in deiner Karriere.</span></p><p style=\\\"min-height: 1.7em;\\\"></p></li></ul><p><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p>\",\"sharing_title\":\"Consultant – CRO & Digital Growth (m/w/d)\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Consultant – CRO &amp; Digital Growth (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gemei\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Consultant – CRO &nbsp;&amp; Digital Growth (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gemeinsamen Team-Lunch startest du direkt in die Welt des E-Commerce – mit spannenden Shopify-, Plattform- und Optimierungsprojekten für führende Marken aus den Bereichen D2C, B2C und B2B.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Du hast sofort gemerkt: Hier kannst du dein analytisches Denken, dein CRO-Expertenwissen und deinen Blick für digitale Kundenerlebnisse einbringen, um messbare Verbesserungen für unsere Kunden zu schaffen. Du entwickelst gemeinsam mit unseren UX-/UI-Expert:innen Hypothesen,</span><a rel=\\\"noopener\\\" target=\\\"_blank\\\" href=\\\"#_msocom_1\\\"><span style=\\\"color:#121317\\\">[NO1]</span></a><span style=\\\"color:#121317\\\">&nbsp; steuerst A/B-Tests, priorisierst Maßnahmen nach Business Impact und bringst Des