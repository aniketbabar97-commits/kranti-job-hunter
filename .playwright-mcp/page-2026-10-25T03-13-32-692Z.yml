updated_at\":\"2026-08-05 07:31:22 UTC\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p><span style=\\\"color:#121317\\\">mindestens 3 Jahre Erfahrung im B2B-Marketing hast und Marken skaliert, weiterentwickelt oder im Brand Management aktiv gesteuert hast – von der Positionierung bis zur konsistenten Umsetzung über alle relevanten Kanäle.</span></p></li><li><p><span style=\\\"color:#121317\\\">über ein abgeschlossenes Studium im Bereich (Digital) Marketing, Medienmanagement, Betriebswirtschaftslehre oder einer vergleichbaren Fachrichtung verfügst.</span></p></li><li><p><span style=\\\"color:#121317\\\">contentgetriebenes Marketing und LinkedIn-B2B-Branding beherrschst und dich im Sparring mit der Geschäftsführung wohlfühlst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">Budgets (mit-)verantwortet hast und Wirkung über KPIs und Tracking messbar machen kannst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">Tools wie LinkedIn, CMS (Webflow/WordPress), SEO-Tools und Google Analytics sicher nutzt.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">mit echter Aufbau-Mentalität dafür brennst, kontinuierlich Neues auszuprobieren, Veränderungen aktiv anzustoßen und ABRIO gezielt als Premium-Partner im DACH-Markt und im Enterprise-Segment zu positionieren.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">Lust auf hohe Ownership hast, strategisch vorausdenkst und gleichzeitig hands-on sowie zuverlässig mit hohem Qualitätsanspruch operativ umsetzt.</span></p></li><li><p class=\\\"MsoListParagraphCxSpLast\\\"><span style=\\\"color:#121317\\\">sehr gute Deutsch- und gute Englischkenntnisse mitbringst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Du bringst deine Erfahrung und Perspektive aktiv ein und prägst die Zusammenarbeit in einem offenen, wertschätzenden Team. Regelmäßige Teamevents stärken dabei den gemeinsamen Austausch.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance: </span></strong><span style=\\\"color:#121317\\\">30 Tage Urlaub und ein kleines Extra für deine Auszeit: ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\" style=\\\"min-height: 1.7em;\\\"></p></li></ul><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als B2B Brand- &amp; Growth-Marketing-Manager (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gem\",\"guid\":\"p5utg\",\"tags\":[\"Berufserfahrene\",\"Senior\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"b2b-brand-growth-marketing-manager-mwd-1\",\"category_code\":\"consulting\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"MsoNormal\\\"><span style=\\\"color:#27272A\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">B2B Brand- &amp; Growth-Marketing-Manager (m/w/d)</span></strong> <span style=\\\"color:#27272A\\\">bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gemeinsamen Team-Lunch tauchst du direkt in die Welt von Shopify und der Enterprise-E-Commerce-Beratung ein – mit dem klaren Ziel, ABRIO im DACH-Markt als differenzierte Premium-Marke weiter auszubauen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#27272A\\\">Du merkst schnell: Hier kannst du wirklich gestalten. Gemeinsam mit der Geschäftsführung entwickelst du unser Marketing strategisch weiter und setzt zentrale Initiativen auch operativ um. Deine Mission ist es, ABRIO im DACH-Markt klar zu positionieren und unsere Marke bei Kunden, Partnern und Talenten nachhaltig zu stärken. Dafür baust du unser Marketing Schritt für Schritt weiter aus, entwickelst eine klare Positionierung und sorgst mit hochwertigem Content, relevanten Partnerschaften sowie Events dafür, dass ABRIO im Enterprise-E-Commerce-Umfeld als Premium-Beratung wahrgenommen wird.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#27272A\\\">ABRIO ist eine der führenden Digital Commerce Beratungen mit Sitz in Frankfurt am Main. Unser Ziel: Die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Ansätzen und maßgeschneiderten Lösungen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#27272A\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Strategische B2B-Positionierung</span></strong><span style=\\\"color:#121317\\\">: In enger Zusammenarbeit mit der Geschäftsführung entwickelst du die Marketingstrategie von ABRIO weiter, schärfst unsere B2B-Positionierung inklusive Messaging (USP, ICP, Value Proposition) und sorgst für eine konsistente Ausspielung über alle relevanten Kanäle.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Brand Management: </span></strong><span style=\\\"color:#121317\\\">Du verantwortest eine hochwertige und einheitliche Markenpräsenz über Website, LinkedIn, PR, Content und Events hinweg, orchestrierst intern relevante Bereiche (z. B. Employer Branding) und stellst die Qualität in der Umsetzung sicher.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Awareness &amp; Thought Leadership: </span></strong><span style=\\\"color:#121317\\\">Über Content-Formate, relevante Partnerschaften sowie Event- und Messeauftritte sorgst du dafür, dass ABRIO im Premiumsegment als Thought Leader im Shopify- und Enterprise-E-Commerce-Umfeld etabliert wird.</span></p></li><li><p class=\\\"MsoListParagraphCxSpLast\\\"><strong><span style=\\\"color:#121317\\\">KPI-driven Growth: </span></strong><span style=\\\"color:#121317\\\">Du definierst gemeinsam mit uns geeignete KPIs entlang von Brand Awareness, Engagement und Anfragequalität und entwickelst unser Marketing datenbasiert weiter.</span></p></li><li><p class=\\\"MsoListParagraphCxSpLast\\\"><strong><span style=\\\"color:#121317\\\">Teamaufbau &amp; Schnittstellenarbeit:</span></strong><span style=\\\"color:#121317\\\"> Du startest als zentrale Marketingrolle bei ABRIO, arbeitest eng mit Geschäftsführung, Recruiting und Sales zusammen und übernimmst perspektivisch eine wichtige Rolle beim weiteren Ausbau unseres Marketingteams.</span></p></li></ul>\",\"title\":\"B2B Brand- & Growth-Marketing-Manager (m/w/d)\",\"highlight\":null,\"sharing_image\":null,\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p><span style=\\\"color:#121317\\\">mindestens 3 Jahre Erfahrung im B2B-Marketing hast und Marken skaliert, weiterentwickelt oder im Brand Management aktiv gesteuert hast – von der Positionierung bis zur konsistenten Umsetzung über alle relevanten Kanäle.</span></p></li><li><p><span style=\\\"color:#121317\\\">über ein abgeschlossenes Studium im Bereich (Digital) Marketing, Medienmanagement, Betriebswirtschaftslehre oder einer vergleichbaren Fachrichtung verfügst.</span></p></li><li><p><span style=\\\"color:#121317\\\">contentgetriebenes Marketing und LinkedIn-B2B-Branding beherrschst und dich im Sparring mit der Geschäftsführung wohlfühlst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">Budgets (mit-)verantwortet hast und Wirkung über KPIs und Tracking messbar machen kannst.</span></p></li><li><p class=\\\"MsoListParagraphCxSpMiddle\\\"><span style=\\\"color:#121317\\\">Tools wie LinkedIn, CMS (Webflow/WordPr