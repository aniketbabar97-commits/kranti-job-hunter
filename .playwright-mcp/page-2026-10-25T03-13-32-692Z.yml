",\"note\":null}],\"postal_code\":\"60325\",\"city\":\"Frankfurt\",\"options_title\":\"off\",\"department\":\"Consulting\",\"created_at\":\"2026-06-23 09:22:28 UTC\",\"hybrid\":true,\"experience_code\":\"entry_level\",\"highlight\":null,\"max_hours_per_week\":null,\"employment_type_code\":\"fulltime_permanent\",\"updated_at\":\"2026-08-05 06:37:46 UTC\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">ein Studium mit Bezug zu Wirtschaft, E-Commerce, Marketing, Medien, Kommunikation, Wirtschaftsinformatik oder einer vergleichbaren Fachrichtung abgeschlossen hast.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">großes Interesse an E-Commerce, digitalen Geschäftsmodellen und Growth Marketing mitbringst und verstehen möchtest, wie Online-Shops, Marketing-Kanäle, Customer Journeys und digitale Sales-Prozesse zusammenspielen.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">erste praktische Berührungspunkte durch Praktika, Werkstudententätigkeiten, Uni-Projekte oder Nebenjobs gesammelt hast – zum Beispiel im E-Commerce, Online-Marketing, CRM, Consulting, Projektmanagement oder einem Agentur-/Start-up-Umfeld.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">kommunikationsstark bist und Freude daran hast, gemeinsam mit Kunden und deinem Team Ideen in konkrete Maßnahmen, Präsentationen und Projektpläne zu übersetzen.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">analytisch denkst, strukturiert arbeitest und Lust hast, dich in Zahlen, Zielgruppen, Kundenbedürfnisse und digitale Prozesse hineinzudenken.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">dich als neugieriges Generalistentalent verstehst, das gerne dazulernt, Verantwortung übernimmt und flexibel zwischen Strategie, Analyse, Projektmanagement und Umsetzung mitdenkt.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Teil eines unternehmerisch denkenden Teams werden möchtest, das digitale Wachstumsprojekte für Kunden vorantreibt – und du Lust hast, dabei fachlich und persönlich schnell zu wachsen.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">sehr gute Deutschkenntnisse und gute Englischkenntnisse mitbringst.</span></p><p style=\\\"min-height: 1.7em;\\\"></p></li></ul><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance</span></strong><span style=\\\"color:#121317\\\">: 30 Tage Urlaub und ein kleines Extra für deine Auszeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen:</span></strong><span style=\\\"color:#121317\\\"> Durch flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche helfen wir dir, Arbeit und Privatleben in Balance zu halten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt:</span></strong><span style=\\\"color:#121317\\\"> Mit einem persönlichen Weiterbildungsbudget kannst du dein Wachstum individuell voranbringen. Ob Zertifizierungen, Schulungen oder persönliches Mentoring – Wachstum ist für uns von großer Bedeutung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact:</span></strong><span style=\\\"color:#121317\\\"> Du arbeitest an innovativen E-Commerce-Projekten mit führenden Marken, setzt aktuelle Technologien ein und übernimmst schrittweise mehr Verantwortung in Projekten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts</span></strong><span style=\\\"color:#121317\\\">: Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt</span></strong><span style=\\\"color:#121317\\\">: Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag</span></strong><span style=\\\"color:#121317\\\">: Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Faire Vergütung &amp; attraktive Benefits:</span></strong><span style=\\\"color:#121317\\\"> Attraktive Bonuszahlungen und eine Benefitcard mit monatlich 50,00€ netto steuerfreiem Sachbezug ergänzen eine faire Vergütung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein:</span></strong><span style=\\\"color:#121317\\\"> Mit Unterstützung übernimmst du Verantwortung, entwickelst dich weiter und gehst den nächsten Schritt in deiner Karriere.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Du interessierst dich für E-Commerce, digitale Geschäftsmodelle und die Frage, wie Marken online besser verkaufen? Bei ABRIO lernst du als (Junior) Consultant E-Commerce &amp; Digital Growth (m/w/d), \",\"guid\":\"uk8ge\",\"tags\":[\"Berufseinsteigende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"junior-consultant-e-commerce-digital-growth-mwd\",\"category_code\":\"consulting\",\"translations\":{\"de\":{\"description\":\"<p><span style=\\\"color:#121317\\\">Du interessierst dich für E-Commerce, digitale Geschäftsmodelle und die Frage, wie Marken online besser verkaufen? Bei ABRIO lernst du als </span><strong><span style=\\\"color:#121317\\\">(Junior) Consultant E-Commerce &amp; Digital Growth (m/w/d)</span></strong><span style=\\\"color:#121317\\\">, wie moderne D2C-, B2C- und B2B-Shops wachsen: von Shop-Optimierung und Performance-Marketing über Customer Journeys bis hin zu Projektsteuerung und Kundenberatung.</span></p><p><span style=\\\"color:#121317\\\">Wir suchen kein fertiges Spezialistenprofil, sondern ein neugieriges Generalistentalent mit analytischem Denken, Kommunikationsstärke und Lust, sich tief in E-Commerce-Themen einzuarbeiten.</span></p><p><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!<br></span><strong><span style=\\\"color:#121317\\\"><br>Frankfurt am Main | Hybrid: 2–3 Tage Büro/Woche | Vollzeit | ab sofort</span></strong><span style=\\\"color:#121317\\\"><br><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">E-Commerce &amp; Growth Beratung:</span></strong><span style=\\\"color:#121317\\\"> Du lernst, unsere Kunden ganzheitlich in relevanten E-Commerce- und Growth-Marketing-Themen zu beraten: von digitalen Marketing-Setups wie Social, Paid, E-Mail und CRM über Shop-Optimierung bis hin zur Weiterentwicklung digitaler Sales-Prozesse.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">Kundenzentrierung:</span></strong><span style=\\\"color:#121317\\\"> Gemeinsam mit deinem Team arbeitest du eng mit unseren Kunden zusammen, verstehst ihre Ziele und Herausforderungen und übersetzt diese Schritt für Schritt in klare Maßnahmen – immer mit Blick auf Wachstum, Kundenerlebnis und langfristige Partnerschaften.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">Projektmanagement:</span></strong><span style=\\\"color:#121317\\\"> Du unterstützt bei der Planung, Koordination und Umsetzung digitaler Projekte, bringst interne Spezialist:innen zusammen und sorgst dafür, dass Aufgaben, Timings und nächste Schritte transparent bleiben.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">Analyse &amp; Performance:</span></strong><span style=\\\"color:#121317\\\"> Du wirkst bei der Analyse von Shop-, Marketing- und Vertriebsdaten mit, erkennst Optimierungspotenziale entlang der Customer Journey und leitest daraus gemeinsam mit deinem Team konkrete Handlungsempfehlungen ab.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">Trends &amp; Innovation:</span></strong><span style=\\\"color:#121317\\\"> Du beobachtest aktuelle Entwicklungen im E-Commerce, Growth Marketing und digitalen Handel, bringst eigene Ideen ein und entwickelst gemeinsam mit dem Team neue Ansätze für unsere Kunden.</span></p></li></ul>\",\"title\":\"(Junior) Consultant E-Commerce & Digital Growth (m/w