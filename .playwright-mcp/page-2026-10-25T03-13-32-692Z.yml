ie Grundlage für ein wachsendes Team im Bereich E-Commerce &amp; Digital Growth. Wenn du heute bereits Teamlead bist oder den nächsten Schritt in Richtung fachlicher und perspektivisch disziplinarischer Führung gehen möchtest, findest du bei uns den Raum dafür.</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"PDq2pG_selectionAnchorContainer\\\"><strong><span style=\\\"color:#121317\\\">Strategische Kundenberatung: </span></strong><span style=\\\"color:#121317\\\">Du berätst Entscheider:innen auf Kundenseite zu E-Commerce-Wachstum, Digitalstrategie, D2C-Entwicklung, Conversion-Optimierung, Customer Acquisition, Retention und operativer Skalierung. Dabei übersetzt du komplexe Herausforderungen in klare Roadmaps und priorisierte Maßnahmen.</span></p></li><li><p class=\\\"PDq2pG_selectionAnchorContainer\\\"><strong><span style=\\\"color:#121317\\\">End-to-End-Verantwortung für Kundenprojekte: </span></strong><span style=\\\"color:#121317\\\">Du steuerst anspruchsvolle E-Commerce- und Digital-Growth-Projekte eigenständig – inklusive Budget, Scope, Timing, Qualität, Stakeholder-Management und Ergebnisverantwortung. Du sorgst dafür, dass aus Strategien konkrete Wirkung entsteht.</span></p></li><li><p class=\\\"PDq2pG_selectionAnchorContainer\\\"><strong><span style=\\\"color:#121317\\\">Growth &amp; Performance-Steuerung: </span></strong><span style=\\\"color:#121317\\\">Du identifizierst Wachstumshebel entlang des gesamten Funnels, entwickelst Maßnahmen zur Umsatzsteigerung und machst Fortschritt anhand relevanter KPIs sichtbar – etwa Conversion Rate, Umsatzentwicklung, ROAS, Retention, AOV, CAC oder Customer Lifetime Value.</span></p></li><li><p class=\\\"PDq2pG_selectionAnchorContainer\\\"><strong><span style=\\\"color:#121317\\\">Business Development &amp; Account Growth: </span></strong><span style=\\\"color:#121317\\\">Du erkennst Upsell- und Cross-Sell-Poten