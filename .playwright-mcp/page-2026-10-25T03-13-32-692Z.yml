 Design Tools, wie bspw. Axure, Figma, Sketch, InVision, Adobe Creative Suite etc. hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein echter Teamplayer bist und deine Aufgaben selbstständig, zuverlässig und verantwortungsvoll erledigst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Mit flexiblen Arbeitszeiten und abgestimmten Präsenzzeiten gestalten wir gemeinsam eine gute Balance zwischen Studium und Job.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt innovative E-Commerce-Projekte mit bekannten D2C Brands und setzt aktuelle Trends und Technologien direkt in der Praxis ein.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickeln und wertvolle Praxiserfahrung zu sammeln.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.&nbsp;</span></p></li></ul>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Werkstudent UX/UI Design (m/w/d) bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet un\",\"guid\":\"o8lst\",\"tags\":[\"Studierende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"werkstudent-uxui-design-mwd-1\",\"category_code\":\"design\",\"translations\":{\"de\":{\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Werkstudent UX/UI Design (m/w/d)</span></strong> <span style=\\\"color:#121317\\\">bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet und nach einem ersten gemeinsamen Team-Lunch tauchst du direkt in die faszinierende Welt des E-Commerce ein – innovative und strategische E-Commerce und Digital Marketing Projekte mit führenden Marken aus den Bereichen FMCG, OTC, Fashion und Beauty.</span></p><p><span style=\\\"color:#121317\\\">Du hast sofort gemerkt: Hier kannst du viel lernen, etwas bewegen, selbst Strategien entwickeln und Wissen aus dem Studium praktisch anwenden.</span></p><p><span style=\\\"color:#121317\\\">ABRIO ist eine der führenden Digital Commerce Beratung mit Sitz in Frankfurt am Main. Unser Ziel: Die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Marketingansätzen und maßgeschneiderten Lösungen.</span></p><p><span style=\\\"color:#121317\\\">In deinem Werkstudium wirst du dich vom ersten Tag an einbringen können sowie Trends und Strategien, die unsere Kunden noch erfolgreicher machen, kennenlernen. Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><strong><span style=\\\"color:#121317\\\">Start: </span></strong><span style=\\\"color:#121317\\\">ab Oktober oder flexibel</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Stundenumfang: m</span></strong><span style=\\\"color:#121317\\\">indestens 16 Stunden, idealerweise 20 Stunden</span></p></li></ul><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><strong><span style=\\\"color:#121317\\\">UI Design: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt bei der Entwicklung des UI-Designs von Online-Shops, Websites und Marketing-Kampagnen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">UX-Design: </span></strong><span style=\\\"color:#121317\\\">Du kreierst Ideen zur Konzeption von Wireframes und Prototypen für verschiedene Anwendungsbereiche im Web.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Designsprache: </span></strong><span style=\\\"color:#121317\\\">Du entwickelst mithilfe des Teams für unsere Kunden eine Designsprache auf Basis von Corporate Design und Design-Segmenten und baust diese stetig weiter aus.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Team &amp; Ownership: </span></strong><span style=\\\"color:#121317\\\">Als fester Bestandteil unseres Designteams erhältst du umfangreiche Einblicke in die Bereiche UI, UX, Ads sowie Testing und kannst Projekte von Anfang bis Ende mitbetreuen.</span></p></li></ul>\",\"title\":\"Werkstudent UX/UI Design (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2764504/normal_sharing_1vf3nsbpnymf.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><span style=\\\"color:#121317\\\">dich in einem Studium im Bereich (Kommunikations)Design, Usability, Computer Science, Medieninformatik, Interface Design oder einer vergleichbaren Fachrichtung befindest.</span></p></li><li><p><span style=\\\"color:#121317\\\">idealerweise durch Nebenjobs und Praktika erste Erfahrung im Bereich UI/UX Design sammeln konntest.</span></p></li><li><p><span style=\\\"color:#121317\\\">eine schnelle Auffassungsgabe hast und motiviert bist, dich stets auf dem neusten Stand der Innovationen zu halten.</span></p></li><li><p><span style=\\\"color:#121317\\\">schon erste Erfahrung mit UI Design Tools, wie bspw. Axure, Figma, Sketch, InVision, Adobe Creative Suite etc. hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein echter Teamplayer bist und deine Aufgaben selbstständig, zuverlässig und verantwortungsvoll erledigst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Mit flexiblen Arbeitszeiten und abgestimmten Präsenzzeiten gestalten wir gemeinsam eine gute Balance zwischen Studium und Job.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt innovative E-Commerce-Projekte mit bekannten D2C Brands und setzt aktuelle Trends und Technologien direkt in der Praxis ein.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickeln und wertvolle Praxiserfahrung zu sammeln.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.&nbsp;</span></p></li></ul>\",\"sharing_title\":\"Werkstudent UX/UI Design (m/w/d)\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Werkstudent UX/UI Design (m/w/d) bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet un\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </sp