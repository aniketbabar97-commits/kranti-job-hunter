ässliche Ansprechperson für Kund:innen, koordinierst Stakeholder und bringst deine Erfahrung aktiv in die Weiterentwicklung unserer Beratungsansätze ein.</span> </p></li></ul>\",\"title\":\"Senior E-Commerce Consultant (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2672557/normal_sharing_pv1f7pymncfk.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><span style=\\\"color:#121317\\\">mindestens </span><strong><span style=\\\"color:#121317\\\">3 Jahre relevante Berufserfahrung</span></strong><span style=\\\"color:#121317\\\"> im E-Commerce, Digital Marketing, Consulting, in einer Digitalberatung bzw. -agentur oder in einer vergleichbaren Funktion gesammelt hast.</span></p></li><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><span style=\\\"color:#121317\\\">bereits Kundenprojekte, E-Commerce-Initiativen oder digitale Wachstumsmaßnahmen mitverantwortet oder eigenständig gesteuert hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein gutes Verständnis für Growth, Conversion-Rate-Optimierung, Customer Acquisition, Funnel-Optimierung und KPI-getriebenes Arbeiten mitbringst.</span></p></li><li><p><span style=\\\"color:#121317\\\">gerne mit Kund:innen und Stakeholdern arbeitest und komplexe Themen verständlich strukturieren kannst.</span></p></li><li><p><span style=\\\"color:#121317\\\">strategisch denken und operativ umsetzen kannst: Du entwickelst Ideen, priorisierst Maßnahmen und bringst Themen pragmatisch voran.</span></p></li><li><p><span style=\\\"color:#121317\\\">Ownership zeigst, verlässlich kommunizierst und auch bei mehreren parallelen Themen den Überblick behältst.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutschkenntnisse und gute Englischkenntnisse mitbringst.</span></p><p style=\\\"min-height: 1.7em;\\\"></p></li></ul><p><strong><span style=\\\"col