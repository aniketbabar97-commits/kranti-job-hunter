st die Zusammenarbeit in einem offenen, wertschätzenden Team. Regelmäßige Teamevents stärken dabei den gemeinsamen Austausch.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance: </span></strong><span style=\\\"color:#121317\\\">30 Tage Urlaub und ein kleines Extra für deine Auszeit: ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\" style=\\\"min-height: 1.7em;\\\"></p></li></ul><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Du willst B2B Marketing nicht nur steuern, sondern eine Marketingfunktion mit echtem Business Impact aufbauen? Bei ABRIO übernimmst du als Lead Brand &amp; Growth Marketing Manager B2B (w/m/d) eine ze\",\"guid\":\"ur16m\",\"tags\":[\"Berufserfahrene\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"lead-brand-growth-marketing-manager-b2b-wmd\",\"category_code\":\"consulting\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Du willst B2B Marketing nicht nur steuern, sondern eine Marketingfunktion mit echtem Business Impact aufbauen? Bei ABRIO übernimmst du als </span><strong><span style=\\\"color:#121317\\\">Lead Brand &amp; Growth Marketing Manager B2B (w/m/d)</span></strong> <span style=\\\"color:#121317\\\">eine zentrale Rolle für Brand, Growth und Thought Leadership – in enger Zusammenarbeit mit Geschäftsführung und Sales. Du schärfst unsere Positionierung im Shopify- und Enterprise-E-Commerce-Umfeld, entwickelst skalierbare Content- und Demand-Formate und machst aus Sichtbarkeit messbare Nachfrage.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"MsoListParagraphCxSpFirst\\\"><strong><span style=\\\"color:#121317\\\">Strategische B2B-Positionierung</span></strong><span style=\\\"color:#121317\\\">: In enger Zusammenarbeit mit der Geschäftsführung entwickelst du die Marketing Strategy von ABRIO weiter, schärfst unsere B2B-Positionierung inklusive Messaging, USP, ICP und Value Proposition und stärkst unsere Wahrnehmung im Digital-Commerce, Shopify- und Enterprise-E-Commerce-Umfeld.</span></p>