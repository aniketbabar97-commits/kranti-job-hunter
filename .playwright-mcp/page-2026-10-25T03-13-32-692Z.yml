erantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Du entwickelst seit mehreren Jahren moderne Webanwendungen und möchtest in anspruchsvollen Kundenprojekten mehr Verantwortung übernehmen, ohne dich vom operativen Coding zu entfernen? Als Senior Fulls\",\"guid\":\"ttsde\",\"tags\":[\"Berufserfahrene\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"senior-fullstack-engineer-mwd-e-commerce\",\"category_code\":\"internet\",\"translations\":{\"de\":{\"description\":\"<p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Du entwickelst seit mehreren Jahren moderne Webanwendungen und möchtest in anspruchsvollen Kundenprojekten mehr Verantwortung übernehmen, ohne dich vom operativen Coding zu entfernen?</span></p><p class=\\\"isSelectedEnd\\\"><span style=\\\"color:#121317\\\">Als </span><strong><span style=\\\"color:#121317\\\">Senior Fullstack Engineer (m/w/d) – E-Commerce</span></strong> <span style=\\\"color:#121317\\\">bei ABRIO entwickelst du performante und skalierbare E-Commerce-Lösungen für führende Marken aus D2C, B2C und B2B. Dabei setzt du komplexe Anforderungen eigenständig um, bringst deine Erfahrung in technische Konzepte ein und unterstützt das Team dabei, hochwertige und nachhaltige Lösungen zu entwickeln.</span></p><p><span style=\\\"color:#121317\\\">Dein Schwerpunkt liegt auf der Entwicklung moderner, nutzerzentrierter Webanwendungen. Gleichzeitig arbeitest du eng mit UX/UI Design, Consulting, Requirements Engineering und unseren Kunden zusammen.</span></p><p class=\\\"MsoNormal\\\"><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Entwicklung moderner Webanwendungen:</span></strong><span style=\\\"color:#121317\\\"> Du entwickelst und optimierst hochwertige, performante und barrierearme E-Commerce-Anwendungen mit modernen Webtechnologien.</span></p></li><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Kundenarbeit:</span></strong><span style=\\\"color:#121317\\\"> Du bist technischer Ansprechpartner für unsere Kunden, präsentierst Architekturkonzepte und unterstützt bei technischen Entscheidungen rund um skalierbare Commerce-Plattformen.</span></p></li><li><p class=\\\"pf0\\\"><strong><span style=\\\"color:#121317\\\">Beratung &amp; technische Konzeption:</span></strong><span style=\\\"color:#121317\\\"> Du analysierst Kundenanforderungen, begleitest Workshops zu Commerce-Architekturen und übersetzt fachliche Ziele in skalierbare technische Konzepte. G