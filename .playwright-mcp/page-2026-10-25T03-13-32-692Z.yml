zeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen</span><strong><span style=\\\"color:#121317\\\">.</span></strong><span style=\\\"color:#121317\\\">&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Wir bieten flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche. So gestaltest du deinen Arbeitsalltag eigenständig und kannst deine Projekte effizient voranbringen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Wir investieren gezielt in deine Entwicklung – mit einem persönlichen Weiterbildungsbudget für Weiterbildungen, Zertifizierungen und Coaching.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Leistung wird belohnt: </span></strong><span style=\\\"color:#121317\\\">Neben einer Vergütung, die deiner Erfahrung und Verantwortung entspricht, erhältst du attraktive Bonuszahlungen mit klarer Leistungsorientierung und eine Benefitcard mit monatlich 50,00€ netto – flexibel einsetzbar und jeden Monat ein Plus.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Bei ABRIO gestaltest du anspruchsvolle E-Commerce-Projekte für führende Marken und triffst Entscheidungen, die echte Ergebnisse erzeugen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und übernimm Verantwortung: </span></strong><span style=\\\"color:#121317\\\">Du treibst Themen aktiv voran, bringst deine Erfahrung ein und setzt deine mehrjährige Expertise gezielt ein, um echte Ergebnisse zu erzielen und unser Team voranzutreiben.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unser tägliches Handeln. Bei uns bekommst du den Raum, Verantwortung zu übernehmen und Entscheidungen zu treffen, die spürbare Qualität und Wirkung entfalten.&nbsp;</span></p></li></ul><ul><li><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Eine hochwertige Arbeitsumgebung mit moderner Ausstattung für fokussiertes Arbeiten, kreativen Austausch und produktive Zusammenarbeit.&nbsp;</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p class=\\\"Paragraph SCXW86644790 BCX0\\\"><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"sharing_title\":\"Senior UX/UI Designer (m/w/d)\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Senior UX/UI Designer (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten und kreativen Team empfangen. Nach einem ersten gemeinsamen Team-Lunch tauchs\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">Senior UX/UI Designer (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Du wirst herzlich von einem motivierten und kreativen Team empfangen. Nach einem ersten gemeinsamen Team-Lunch tauchst du direkt in die Welt des E-Commerce ein – mit spannenden Projekten für führende Marken aus den Bereichen D2C, B2C und B2B.</span></p><p><span style=\\\"color:#121317\\\">Du merkst sofort: Hier kannst du deine Design-Expertise mit deiner Leidenschaft für Teamführung und -weiterentwicklung verbinden. Du leitest dein Designteam, entwickelst effiziente Prozesse und sorgst dafür, dass jedes Detail sitzt – von der ersten Idee bis zum finalen Interface. Gleichzeitig bist du nah an unseren Kunden – vom Startup bis zum DAX-Konzern – und berätst sie zu Trends, Best Practices und kreativen Lösungen.</span></p><p><span style=\\\"color:#121317\\\">ABRIO ist eine der führenden Digital Commerce Beratungen mit Sitz in Frankfurt am Main. Unser Ziel: Die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Ansätzen und maßgeschneiderten Lösungen – und Design spielt für uns dabei eine zentrale Rolle.</span></p><p><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Teamführung</span></strong><span style=\\\"color:#121317\\\">: Du begleitest unser dreiköpfiges Team aus aufstrebenden UX/UI-Designern und förderst sie fachlich wie persönlich.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Prozesssteuerung</span></strong><span style=\\\"color:#121317\\\">: Du verantwortest die Steuerung des Teams und der Projekte, etablierst klare Standards und bist zugleich operativ im Kundengeschäft aktiv, um starke UX/UI-Ergebnisse zu erreichen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">UX/UI Design</span></strong><span style=\\\"color:#121317\\\">: Vom Start-up bis zum DAX-Konzern – du verstehst die unterschiedlichen Anforderungen und Bedürfnisse unserer Kunden und beeindruckst ab Tag 1 mit der Erstellung von User Journeys, Wireframes und interaktiven Prototypen in Figma.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Qualitätssicherung</span></strong><span style=\\\"color:#121317\\\">: Du konzipierst und planst praxisnahe UX/UI-Workshops, hältst das Team über Tools, Trends und Designprinzipien auf dem Laufenden und steigerst so kontinuierlich unsere Designqualität.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Markttrends:</span></strong><span style=\\\"color:#121317\\\"> Du hast die neuesten E-Commerce-Trends im Blick, recherchierst und vergleichst Best Practices und kannst so unsere Kunden kompetent beraten.</span></p></li></ul>\",\"options_salutation\":\"required\",\"close_at\":null,\"state_name\":\"Hessen\",\"mailbox_email\":\"job.6vpl7@abriogmbh.recruitee.com\",\"salary\":{\"max\":null,\"min\":null,\"period\":null,\"currency\":null},\"options_phone\":\"required\",\"options_cv\":\"required\",\"remote\":false,\"location\":\"Frankfurt, Hessen, Deutschland\",\"cover_image\":null,\"max_hours\":null,\"locations_question_type\":\"multiple_choice\",\"company_name\":\"ABRIO GmbH\",\"country_code\":\"DE\",\"min_hours_per_week\":null,\"title\":\"Senior UX/UI Designer (m/w/d)\",\"id\":2477754,\"open_questions\":[{\"id\":3766625,\"position\":1,\"options\":{},\"required\":true,\"body\":\"Wann wäre dein frühestmögliches Startdatum?\",\"kind\":\"date\",\"translations\":{\"de\":{\"body\