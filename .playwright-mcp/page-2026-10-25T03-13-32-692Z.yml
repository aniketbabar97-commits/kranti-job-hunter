e etc. hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein echter Teamplayer bist und deine Aufgaben selbstständig, zuverlässig und verantwortungsvoll erledigst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Durch flexible Arbeitszeiten und 2 - 3 Tage Präsenz pro Woche im Büro helfen wir dir, Arbeit und Privatleben in Balance zu halten.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Mit einem persönlichen Weiterbildungsbudget kannst du dein Studium um wertvolle Berufserfahrung ergänzen und fachlich weiter wachsen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt innovative E-Commerce-Projekte mit bekannten D2C Brands und setzt aktuelle Trends und Technologien direkt in der Praxis ein.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickel