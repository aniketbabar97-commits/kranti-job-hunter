) Consultant E-Commerce & Digital Growth (m/w/d)\",\"sharing_description\":\"Du interessierst dich für E-Commerce, digitale Geschäftsmodelle und die Frage, wie Marken online besser verkaufen? Bei ABRIO lernst du als (Junior) Consultant E-Commerce &amp; Digital Growth (m/w/d), \",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\"}},\"dynamic_fields\":[],\"state_code\":\"HE\",\"description\":\"<p><span style=\\\"color:#121317\\\">Du interessierst dich für E-Commerce, digitale Geschäftsmodelle und die Frage, wie Marken online besser verkaufen? Bei ABRIO lernst du als </span><strong><span style=\\\"color:#121317\\\">(Junior) Consultant E-Commerce &amp; Digital Growth (m/w/d)</span></strong><span style=\\\"color:#121317\\\">, wie moderne D2C-, B2C- und B2B-Shops wachsen: von Shop-Optimierung und Performance-Marketing über Customer Journeys bis hin zu Projektsteuerung und Kundenberatung.</span></p><p><span style=\\\"color:#121317\\\">Wir suchen kein fertiges Spezialistenprofil, sondern ein neugieriges Generalistentalent mit analytischem Denken, Kommunikationsstärke und Lust, sich tief in E-Commerce-Themen einzuarbeiten.</span></p><p><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!<br></span><strong><span style=\\\"color:#121317\\\"><br>Frankfurt am Main | Hybrid: 2–3 Tage Büro/Woche | Vollzeit | ab sofort</span></strong><span style=\\\"color:#121317\\\"><br><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p class=\\\"isSelectedEnd\\\"><strong><span style=\\\"color:#121317\\\">E-Commerce &amp; Growth Beratung:</span></strong><span style=\\\"color:#121317\\\"> Du lernst, unsere Kunden ganzheitlich in relevanten E-Commerce- und Growth-Marketing-Themen zu beraten: von digitalen Marketing-Setups wie Social, Paid, E-Mail und CRM über Shop-Optimierung bis hin zur Weiterentwicklung digitaler Sales-Prozesse.</span></p></li><li><p class=\\\"isSelectedEnd\\\"><s