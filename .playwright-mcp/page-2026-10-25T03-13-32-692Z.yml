c\",\"tags\":[\"Studierende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"praktikum-uxui-design-mwd-1\",\"category_code\":\"design\",\"translations\":{\"de\":{\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als Praktikant:in bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet und nach einem ersten gemeinsamen Team-Lunch tauchst du direkt in die faszinierende Welt des E-Commerce ein – innovative und strategische E-Commerce und Digital Marketing Projekte mit führenden Marken aus den Bereichen FMCG, OTC, Fashion und Beauty.</span></p><p><span style=\\\"color:#121317\\\">Du hast sofort gemerkt: Hier kannst du viel lernen, etwas bewegen, selbst Strategien entwickeln und Wissen aus dem Studium praktisch anwenden.</span></p><p><span style=\\\"color:#121317\\\">ABRIO ist eine der führenden Digital Commerce Beratung mit Sitz in Frankfurt am Main. Unser Ziel: Die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Marketingansätzen und maßgeschneiderten Lösungen.</span></p><p><span style=\\\"color:#121317\\\">In deinem Praktikum wirst du dich vom ersten Tag an einbringen können sowie Trends und Strategien, die unsere Kunden noch erfolgreicher machen, kennenlernen. Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!</span></p><ul><li><p><span style=\\\"color:#121317\\\">Start: ab sofort</span></p></li><li><p><span style=\\\"color:#121317\\\">Praktikumsdauer: mindestens 3 Monate, idealerweise 5 - 6 Monate</span></p></li></ul><p><span style=\\\"color:#121317\\\"><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">UI-Design</span></strong><span style=\\\"color:#121317\\\">: Du unterstützt bei der Entwicklung des UI-Designs von Online-Shops, Websites und Marketing-Kampagnen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">UX-Design:</span></strong><span style=\\\"color:#121317\\\"> Du kreierst Ideen zur Konzeption von Wireframes und Prototypen für verschiedene Anwendungsbereiche im Web.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Designsprache</span></strong><span style=\\\"color:#121317\\\">: Du entwickelst mithilfe des Teams für unsere Kunden eine Designsprache auf Basis von Corporate Design und Design-Segmenten und baust diese stetig weiter aus.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Team &amp; Ownership:</span></strong><span style=\\\"color:#121317\\\"> Als fester Bestandteil unseres Designteams erhältst du umfangreiche Einblicke in die Bereiche UI, UX, Ads sowie Testing und kannst Projekte von Anfang bis Ende mitbetreuen.</span></p></li></ul>\",\"title\":\"Praktikum UX/UI Design (m/w/d)\",\"highlight\":null,\"sharing_image\":\"https://recruitee-main.s3.eu-central-1.amazonaws.com/offers/2572477/normal_sharing_loadf9dt9k6e.png\",\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul><li><p><span style=\\\"color:#121317\\\">dich in einer Ausbildung oder einem Studium im Bereich (Kommunikations)Design, Usability, Computer Science, Medieninformatik, Interface Design oder einer vergleichbaren Fachrichtung befindest.</span></p></li><li><p><span style=\\\"color:#121317\\\">idealerweise durch Nebenjobs und Praktika erste Erfahrung im Bereich UI/UX Design sammeln konntest.</span></p></li><li><p><span style=\\\"color:#121317\\\">eine schnelle Auffassungsgabe hast und motiviert bist, dich stets auf dem neusten Stand der Innovationen zu halten.</span></p></li><li><p><span style=\\\"color:#121317\\\">schon erste Erfahrung mit UI Design Tools, wie bspw. Axure, Figma, Sketch, InVision, Adobe Creative Suite etc. hast.</span></p></li><li><p><span style=\\\"color:#121317\\\">ein echter Teamplayer bist und deine Aufgaben selbstständig, zuverlässig und verantwortungsvoll erledigst.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt: </span></strong><span style=\\\"color:#121317\\\">Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen: </span></strong><span style=\\\"color:#121317\\\">Durch flexible Arbeitszeiten und 2 - 3 Tage Präsenz pro Woche im Büro helfen wir dir, Arbeit und Privatleben in Balance zu halten.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt: </span></strong><span style=\\\"color:#121317\\\">Mit einem persönlichen Weiterbildungsbudget kannst du dein Studium um wertvolle Berufserfahrung ergänzen und fachlich weiter wachsen.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact: </span></strong><span style=\\\"color:#121317\\\">Du unterstützt innovative E-Commerce-Projekte mit bekannten D2C Brands und setzt aktuelle Trends und Technologien direkt in der Praxis ein.</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein: </span></strong><span style=\\\"color:#121317\\\">Bei uns bekommst du die Unterstützung, Verantwortung zu übernehmen, dich weiterzuentwickeln und wertvolle Praxiserfahrung zu sammeln.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag: </span></strong><span style=\\\"color:#121317\\\">Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.&nbsp;</span></p></li><li><p class=\\\"Paragraph SCXW208729386 BCX0\\\"><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts: </span></strong><span style=\\\"color:#121317\\\">Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten. </span></p><p style=\\\"min-height: 1.7em;\\\"></p></li></ul><p><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀&nbsp;</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Auch wenn die Anforderungen nicht zu 100 % zu dir passen: Wenn du Lust hast, ein Praktikum im Bereich Webdesign und UX/UI zu absolvieren, trau dich und bewirb dich. Menschen mit Passion bieten wir gerne die Chance, bei uns durchzustarten!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p>\",\"sharing_title\":\"Praktikum UX/UI Design (m/w/d)\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als Praktikant:in bei ABRIO. Du wirst herzlich von einem dynamischen und engagierten Team empfangen. Dein Onboarding ist perfekt vorbereitet und nach einem ersten\",\"locations_question\":\"Was ist dein bevorzugter Arbeitsort?\