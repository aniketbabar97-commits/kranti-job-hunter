den in klare Strategien, Roadmaps und umsetzbare Konzepte übersetzen kannst.</span></p></li><li><p><span style=\\\"color:#121317\\\">dich als Allround-Talent flexibel auf neue Aufgaben in einer schnell wachsenden Beratung einstellen kannst.</span></p></li><li><p><span style=\\\"color:#121317\\\">Lust hast, in einem aufstrebenden Unternehmen mit Start-up Atmosphäre mitzuarbeiten und unternehmerisch mitzugestalten.</span></p></li><li><p><span style=\\\"color:#121317\\\">sehr gute Deutsch- und gute Englischkenntnisse mitbringst.</span></p><p style=\\\"min-height: 1.7em;\\\"></p></li></ul><p><strong><span style=\\\"color:#121317\\\">WAS WIR DIR BIETEN</span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Urlaub &amp; Balance</span></strong><span style=\\\"color:#121317\\\">: 30 Tage Urlaub und ein kleines Extra für deine Auszeit: Ein zusätzlicher Urlaubstag, wenn Heiligabend &amp; Silvester auf Werktage fallen.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Arbeitszeiten, die zu dir passen:</span></strong><span style=\\\"color:#121317\\\"> Durch flexible Arbeitszeiten und 2 - 3 Tage Präsenz im Büro pro Woche helfen wir dir, Arbeit und Privatleben in Balance zu halten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Weiterbildung, die deine Karriere stärkt:</span></strong><span style=\\\"color:#121317\\\"> Mit einem persönlichen Weiterbildungsbudget kannst du dein Wachstum individuell voranbringen. Ob Zertifizierungen, Schulungen oder persönliches Mentoring – Wachstum ist für uns von großer Bedeutung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Spannende Projekte mit echtem Impact:</span></strong><span style=\\\"color:#121317\\\"> Du arbeitest an innovativen E-Commerce-Projekten mit führenden Marken, setzt aktuelle Technologien ein und übernimmst schrittweise mehr Verantwortung in Projekten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Modernes Büro im Herzen Frankfurts</span></strong><span style=\\\"color:#121317\\\">: Unser zentral gelegenes Büro mit moderner Ausstattung bietet dir Raum für kreative Ideen, konzentriertes Arbeiten und entspanntes Abschalten.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Teamspirit, den man erlebt</span></strong><span style=\\\"color:#121317\\\">: Offene Zusammenarbeit, gegenseitige Unterstützung und regelmäßige Teamevents sind bei uns fest verankert. Ob Team-Lunch, Afterwork-Drinks oder gemeinsame Aktivitäten – wir nehmen uns bewusst Zeit füreinander.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Unsere Werte – gelebter Alltag</span></strong><span style=\\\"color:#121317\\\">: Teamgeist, Professionalität und Leidenschaft prägen unsere Zusammenarbeit. Wir unterstützen uns gegenseitig, übernehmen Verantwortung und wachsen gemeinsam.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Faire Vergütung &amp; attraktive Benefits:</span></strong><span style=\\\"color:#121317\\\"> Attraktive Bonuszahlungen und eine Benefitcard mit monatlich 50,00€ netto steuerfreiem Sachbezug ergänzen eine faire Vergütung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Gestalte mit und wachse in Verantwortung hinein:</span></strong><span style=\\\"color:#121317\\\"> Mit Unterstützung übernimmst du Verantwortung, entwickelst dich weiter und gehst den nächsten Schritt in deiner Karriere.</span></p></li></ul><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Mit uns erhältst du nicht nur einen Job, sondern eine Erfahrung, die dich weiterbringt – beruflich und persönlich! 🚀</span></p><p style=\\\"min-height: 1.7em;\\\"></p><p><span style=\\\"color:#121317\\\">Unser Team steht für flache Hierarchien und Eigeninitiative. Wenn du motiviert bist, Verantwortung übernehmen möchtest und Lust hast, gemeinsam mit uns die Zukunft des E-Commerce zu gestalten, dann bist du bei uns genau richtig!</span></p><p><span style=\\\"color:#121317\\\">Unser Bewerbungsprozess ist schnell und zuverlässig – wir melden uns innerhalb kürzester Zeit bei dir zurück.</span></p><p><span style=\\\"color:#121317\\\">Also, bewirb dich noch heute und werde Teil unseres dynamischen Teams. Wir freuen uns auf deine Bewerbung und darauf, dich kennenzulernen.</span></p>\",\"options_photo\":\"off\",\"sharing_description\":\"Stell dir vor, es ist dein erster Tag als (Junior) Consultant Digital Marketing &amp; Sales (m/w/d) bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem er\",\"guid\":\"8p1ml\",\"tags\":[\"Berufseinsteigende\"],\"location_question_visible\":false,\"country\":\"Deutschland\",\"slug\":\"junior-consultant-digital-marketing-sales-mwd-2\",\"category_code\":\"consulting\",\"translations\":{\"de\":{\"description\":\"<p><span style=\\\"color:#121317\\\">Stell dir vor, es ist dein erster Tag als </span><strong><span style=\\\"color:#121317\\\">(Junior) Consultant Digital Marketing &amp; Sales (m/w/d)</span></strong><span style=\\\"color:#121317\\\"> bei ABRIO. Du wirst herzlich von einem motivierten und professionellen Team empfangen. Nach einem ersten gemeinsamen Team-Lunch startest du direkt in die Welt des E-Commerce – mit spannenden Projekten für führende Marken aus den Bereichen D2C, B2C und B2B.</span></p><p><span style=\\\"color:#121317\\\">Du liebst E-Commerce, steuerst Projekte souverän und entwickelst gerne kanalübergreifende Strategien, um die digitale Performance unserer Kunden messbar zu steigern? Als (Junior) Consultant Digital Marketing &amp; Sales (m/w/d) bei ABRIO kannst du dich direkt ab Tag 1 einbringen und begleitest unsere Kunden von der Strategie bis zur operativen Umsetzung.</span></p><p><span style=\\\"color:#121317\\\">ABRIO ist eine der führenden Digital Commerce Beratungen mit Sitz in Frankfurt am Main. Unser Ziel: Die E-Commerce-Welt unserer Kunden nachhaltig zu verbessern und skalierbare Erfolge zu schaffen. Dabei kombinieren wir modernste Technologien mit innovativen Ansätzen und maßgeschneiderten Lösungen.</span></p><p><span style=\\\"color:#121317\\\">Klingt spannend? Dann lies weiter – wir suchen genau dich für unser Team!<br><br></span><strong><span style=\\\"color:#121317\\\">DAS ERWARTET DICH </span></strong></p><ul><li><p><strong><span style=\\\"color:#121317\\\">Strategische Beratung:</span></strong><span style=\\\"color:#121317\\\"> Du berätst unsere Kunden ganzheitlich in allen relevanten E-Commerce Themen: von der Optimierung digitaler Marketing Setups (Social, Paid, E-Mail usw.) über Shop-Maintenance bis hin zur Shop-Weiterentwicklung.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Kundenzentrierung:</span></strong><span style=\\\"color:#121317\\\"> Du betreust deine Accounts umfassend, planst regelmäßige Jour fixes und übersetzt Bedürfnisse und Visionen unserer Kunden in klare Maßnahmen – für hohe Zufriedenheit und langfristige Partnerschaften.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Projektmanagement:</span></strong><span style=\\\"color:#121317\\\"> Du führst als Project Lead die passenden Spezialisten zusammen, bündelst die interne Kommunikation und sorgst für einen reibungslosen Projektablauf.</span></p></li><li><p><strong><span style=\\\"color:#121317\\\">Analyse &amp; Performance:</span></strong><span style=\\\"color:#121317\\\"> Du wirkst bei der Analyse von Marketing- und Vertriebsdaten zur Identifizierung von Optimierungspotenzialen unserer Kunden mit.</span></p></li></ul>\",\"title\":\"(Junior) Consultant Digital Marketing & Sales (m/w/d)\",\"highlight\":null,\"sharing_image\":null,\"requirements\":\"<p><strong><span style=\\\"color:#121317\\\">IT'S A MATCH, SOFERN DU...</span></strong></p><ul class=\\\"public-DraftStyleDefault-ul\\\"><li><p><span style=\\\"color:#121317\\\">ein interdisziplinäres Studium (z. B. Wirtschaftsinformatik, Wirtschaftsingenieurwesen, Mediendesign, BWL oder eine vergleichbare Fachrichtung) erfolgreich abgeschlossen hast.</span></p></li>