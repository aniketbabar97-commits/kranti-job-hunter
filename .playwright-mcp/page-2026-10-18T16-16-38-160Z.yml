            - paragraph [ref=f1e92]: Die empasa GmbH ist ein erfolgreiches E-Commerce-Unternehmen, das im mittelfränkischen Brodswinden ansässig ist. Das internationale Team mit rund 85 Mitarbeitern bedient den Endkunden mit einer Vielzahl an Produkten aus den Bereichen Insekten-, Sicht-, Sonnenschutz und Pergolen. Rein auf den B2C Versandhandel über das Internet spezialisiert, erfolgt der Vertrieb über mehrere Onlineshops und über bekannte Marktplätze wie Amazon und Otto. Im Produktbereich Insektenschutz und Markisen zählt die empasa GmbH zu den führenden Anbietern im deutschen Onlinehandel. Über 700.000 Kunden in ganz Europa dienen als Maß für höchste Servicequalität gepaart mit kompetenter und freundlicher Beratung. Neben der Leidenschaft für unsere Kunden alles zu geben, zeichnet uns eine hohe Produktqualität, hochspezialisierter Vertrieb und professionelles Onlinemarketing aus.
