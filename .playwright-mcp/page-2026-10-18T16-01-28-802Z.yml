                        - paragraph [ref=e459]: Dabei verbindest du strategische Beratung mit konzeptioneller Stärke und pragmatischer Umsetzungskompetenz. Du übernimmst Verantwortung für anspruchsvolle Kundenprojekte, moderierst Workshops auf Management- und C-Level und bringst deine Expertise aktiv in Presales-, Angebots- und Ausschreibungsprozesse ein.
