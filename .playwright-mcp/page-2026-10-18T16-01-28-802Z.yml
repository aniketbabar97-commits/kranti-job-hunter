            - main [ref=e230]:
              - generic [ref=e233]:
                - heading "Wer wir sind" [level=2] [ref=e234]
                - paragraph [ref=e236]: Arvato Systems unterstützt mit rund 3.500 Mitarbeitenden als international agierender IT-Spezialist namhafte Unternehmen bei der Digitalen Transformation. Ausgeprägtes Branchen-Know-how, hohes technisches Verständnis und ein klarer Fokus auf Kundenbedürfnisse zeichnen uns aus. Im Team entwickeln wir innovative IT-Lösungen, bringen unsere Kunden in die Cloud, integrieren digitale Prozesse und übernehmen den Betrieb sowie die Betreuung von IT-Systemen. Als Teil von Bertelsmann stehen wir auf dem soliden Fundament eines deutschen Weltkonzerns. Zugleich setzen wir auf unser starkes strategisches Partner-Netzwerk mit internationalen Top-Playern wie AWS, Google, Microsoft oder SAP. Wir machen die digitale Welt einfacher, effizienter und sicherer und unsere Kunden erfolgreicher.
                - heading "Diese Aufgaben erwarten dich" [level=2] [ref=e237]
                - generic [ref=e238]:
                  - paragraph [ref=e239]:
                    - text: Ohne Menschen, deren Herz voll und ganz für IT schlägt, geht es nicht.
                    - strong [ref=e240]
                    - text: Darum suchen wir dich als
                    - strong [ref=e241]: Lead Consultant SAP CX / CRM (m/w/d)
                    - text: . Werde Teil unserer modernen, hybriden Arbeitskultur an unseren deutschlandweiten Standorten – Gütersloh, Köln, Berlin, Hamburg oder München – und genieße die Flexibilität, mobil, z. B. im Homeoffice, tätig zu sein.
                  - paragraph [ref=e242]
                  - list [ref=e243]:
                    - listitem [ref=e244]: Du berätst und unterstützt unsere Kunden – mit dem Branchenschwerpunkt Handel, Fashion und Consumer Products – bei der Planung, Konzeption und Einführung von Handels- und CRM-Prozessen
                    - listitem [ref=e245]: Du bist verantwortlich für die Vorbereitung und Durchführung von Workshops mit den Fachbereichen und der IT
                    - listitem [ref=e246]: Du übernimmst die Analyse kundenspezifischer Anforderungen und die Konzeption neuer Geschäftsprozesse
                    - listitem [ref=e247]: Du gestaltest gemeinsam mit unseren Kunden deren Handels- und CRM-Prozesse mit Hilfe der SAP CX Cloud Suite (insbesondere Sales, Service & Marketing)
                    - listitem [ref=e248]: Du definierst User Stories und entwickelst die technische Architektur unserer Lösungen zur Umsetzung der Kundenanforderungen
                    - listitem [ref=e249]: Du entwickelst aktiv das Team weiter und übernimmst eine fachliche Führungsrolle
                - heading "Wen wir uns wünschen" [level=2] [ref=e250]
                - generic [ref=e251]:
                  - list [ref=e252]:
                    - listitem [ref=e253]: Du hast ein erfolgreich abgeschlossenes (technisches) Studium und Erfahrung im agilen IT-Projektmanagement
                    - listitem [ref=e254]: Du bringst fundiertes Know-how im Requirements Engineering und in der Business-Analyse mit
                    - listitem [ref=e255]: Du verfügst über tiefgreifende Kenntnisse in den SAP CX Cloud-Komponenten (Sales & Service Cloud V2, Emarsys, CDC & CDP)
                    - listitem [ref=e256]: Du bist kommunikationsstark und verstehst es, Anforderungen präzise vom Kunden in die Entwicklung zu übertragen
                    - listitem [ref=e257]: Sehr gute Deutsch- sowie gute Englischkenntnisse runden dein Profil ab
                  - paragraph [ref=e258]
                  - paragraph [ref=e259]: Auch wenn du nicht alle unsere Wünsche erfüllst, zögere nicht dich bei uns zu bewerben, denn WEITERENTWICKLUNG unserer Mitarbeitenden wird bei uns großgeschrieben und eröffnet dir in unserem Unternehmen vielfältige Möglichkeiten.
                - heading "Weitere Informationen" [level=2] [ref=e260]
                - generic [ref=e261]:
                  - paragraph [ref=e262]: Interessiert? Dann bewirb dich über unser Online-Bewerbungsformular mit deinem Lebenslauf und deiner Gehaltsvorstellung. Wir wollen ein fairer und inklusiver Arbeitgeber sein. Wir schätzen die unterschiedlichen Perspektiven, die eine vielfältige Belegschaft einbringt. Daher suchen wir aktiv nach Menschen, die unser Unternehmen durch ihre Identität, ihren Hintergrund und ihre persönlichen Erfahrungen bereichern, mit oder ohne Behinderung.
