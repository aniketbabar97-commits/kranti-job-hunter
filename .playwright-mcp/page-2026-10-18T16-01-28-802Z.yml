                        - list [ref=e345]:
                          - listitem [ref=e346]: Du konzipierst fachliche und technische PIM-Lösungen für internationale Kunden und übernimmst die Verantwortung für Produktdaten als verlässliche Grundlage für Commerce- und weitere Kanäle.
                          - listitem [ref=e347]: Du begleitest Initiativen von der Anforderungsaufnahme bis zur Umsetzung und gestaltest Datenmodelle, Attributstrukturen, Variantenlogiken, Workflows und Freigabeprozesse.
                          - listitem [ref=e348]: Du konfigurierst und implementierst PIM-Systeme und verantwortest deren Integration mit ERP-, Commerce- und DAM-Plattformen.
                          - listitem [ref=e349]: In agilen Projekten übernimmst du die Rolle des Product Owners, priorisierst das Backlog und sorgst für den optimalen Einsatz der verfügbaren Ressourcen.
                          - listitem [ref=e350]: Für größere Kunden koordinierst du weitere Business Consultants und Entwickler und fungierst als zentrale fachliche Ansprechperson für Kunden und Projektteam.
                          - listitem [ref=e351]: Du unterstützt das Vertriebsteam in Presales-Aktivitäten, beispielsweise in Workshops, Demos und Angebotsphasen.
                          - listitem [ref=e352]: Du stellst sicher, dass Kundenanforderungen erfüllt werden und behältst gleichzeitig den wirtschaftlichen Erfolg des Projekts im Blick.
                          - listitem [ref=e353]: Eigeninitiativ entwickelst du innovative Konzepte zur Verbesserung von Datenqualität, Automatisierung und Datenanreicherung und präsentierst diese beim Kunden.
