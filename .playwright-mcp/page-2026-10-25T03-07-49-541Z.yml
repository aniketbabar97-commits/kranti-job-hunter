              - generic [ref=f11e51]: Teilzeit / Mobiles Arbeiten möglich
              - generic [ref=f11e52]: ab sofort
              - generic [ref=f11e53]: Sales VAR & Regions Markets
              - generic [ref=f11e54]: Digital Sales
          - paragraph [ref=f11e55]: Der Name Ensinger steht für Hochleistungskunststoffe, die im wahrsten Sinne des Wortes die Welt erobert haben. Unsere Kunststoffe fliegen ins Weltall, sind unverzichtbar beim Bauen, sie retten Menschenleben und – ja, unsere Kunststoffe sind viel nachhaltiger als man denkt. Aus einem Familienbetrieb ist ein weltweit erfolgreiches Unternehmen geworden – und ein richtig starker Arbeitgeber, der viel zu bieten hat. Darauf sind wir stolz. Mindestens genauso stolz sind wir auf die Werte, die uns ausmachen. Weil sie uns zu dem gemacht haben, was wir heute sind. Dazu zählen zum Beispiel Verbindlichkeit, Vertrauen, Sicherheit und Verlässlichkeit. Man könnte sagen, wir sind die dynamischste Form von Beständigkeit und davon überzeugt, dass Tradition und Moderne kein Widerspruch sein müssen.
          - heading "Ihre Aufgaben umfassen:" [level=2] [ref=f11e56]
          - list [ref=f11e58]:
            - listitem [ref=f11e59]: Verantwortung für die Produktvision, die Ziele, die Roadmap und das Backlog des Webshops und der Kalkulatoren
            - listitem [ref=f11e60]: Anforderungen von Kundinnen und Kunden, aus dem Vertrieb, den Märkten und den Tochtergesellschaften bündeln, bewerten und priorisieren
            - listitem [ref=f11e61]: Das Kundenerlebnis kontinuierlich verbessern und dabei die Integration in die Vertriebsprozesse sicherstellen
            - listitem [ref=f11e62]: Umsetzung neuer Funktionen fachlich begleiten und Abnahmetests aus Nutzersicht (User Acceptance Tests, UAT) durchführen
            - listitem [ref=f11e63]: Releases und Go-Lives steuern sowie Fehler von der Priorisierung bis zur Prüfung der umgesetzten Lösungen nachverfolgen
            - listitem [ref=f11e64]: Zentrale Kennzahlen (KPIs) überwachen, daraus Verbesserungsmaßnahmen ableiten und Go-to-Market-Konzepte entwickeln
            - listitem [ref=f11e65]: Internationalisierung und Rollouts in der EMEA-Region koordinieren und dabei globale Standards sowie lokale Anforderungen berücksichtigen
          - heading "Das bringen Sie mit:" [level=2] [ref=f11e66]
          - list [ref=f11e68]:
            - listitem [ref=f11e69]: Mehrjährige Berufserfahrung im E-Commerce oder digitalen Produktmanagement, idealerweise im B2B-Umfeld
            - listitem [ref=f11e70]: Fundierte Kenntnisse in der Optimierung des Kundenerlebnisses (Customer Experience) sowie in der strukturierten Aufnahme, Bewertung und Priorisierung von Anforderungen aus Markt, Kundschaft und Vertrieb
            - listitem [ref=f11e71]: Praktische Erfahrung in der Entwicklung und Umsetzung von Markteinführungsstrategien sowie in internationalen Projekten und im Management relevanter Anspruchsgruppen, idealerweise auch in der Vorbereitung oder Begleitung internationaler Rollouts
            - listitem [ref=f11e72]: Technisches Grundverständnis für Webshops, Kalkulatoren und Schnittstellen sowie die Fähigkeit, auf Augenhöhe mit Fachbereichen, IT und Umsetzungspartnern zusammenzuarbeiten
            - listitem [ref=f11e73]: Strukturierte, lösungsorientierte und eigenverantwortliche Arbeitsweise mit hohem Umsetzungsfokus sowie sehr gute Kommunikations- und Teamfähigkeit
            - listitem [ref=f11e74]: Sehr gute Englischkenntnisse in Wort und Schrift sowie die Bereitschaft, in einem internationalen Umfeld zu arbeiten
