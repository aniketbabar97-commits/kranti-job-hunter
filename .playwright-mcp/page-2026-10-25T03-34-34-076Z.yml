        - paragraph [ref=f8e105]: Hallo und herzlich willkommen in unserem Karriere-Center. Wir freuen uns, dass Du hier bist. Mit dem Karriere-Center möchten wir nicht nur alles Wissenswerte über einen Job in unserer Agentur vermitteln, sondern vielmehr um Deine Bewerbung bewerben. Im ersten Schritt ist der Bewerbungsprozess damit einmal auf links gedreht, denn wir bewerben uns als Agentur und interessanter, verlässlicher, fairer und moderner Arbeitgeber bei Dir.
        - paragraph [ref=f8e107]: Wir wünschen Dir viel Spaß bei der Nutzung dieses Portals und hoffen die Neugier auf uns geweckt zu haben. Sollten wir Deine Frage(n) nicht proaktiv beantwortet haben, brennen wir darauf sie Dir persönlich beantworten zu dürfen. Selbstverständlich freuen wir uns mindestens genauso riesig über Deine Bewerbung.
