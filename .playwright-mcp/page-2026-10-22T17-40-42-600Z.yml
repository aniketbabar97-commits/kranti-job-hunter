  - main [ref=f4e83]:
    - generic [ref=f4e84]:
      - img "foobar Agency Team" [ref=f4e86]
      - generic [ref=f4e90]:
        - heading "Servus, Moin, Вітаю, سلام, Marhabaan and Olá!" [level=1] [ref=f4e91]
        - paragraph [ref=f4e93]: We are foobar Agency — and this is who we are.
        - link "Our job openings" [ref=f4e95] [cursor=pointer]:
          - /url: "#jobs"
    - generic [ref=f4e113]:
      - heading "The Driving Force Behind foobar!" [level=2] [ref=f4e115]
      - paragraph [ref=f4e118]: "Behind foobar is an international team based in Munich – with roots from almost every corner of the world. What brings us together: genuine curiosity, high standards, and the conviction that the best solutions emerge when people truly think along. No ticket processing. No service by the book. The foobaristas shape things – in customer projects, in architecture, in the company's further development."
    - generic [ref=f4e128]:
      - heading "Beyond the Obvious" [level=2] [ref=f4e130]
      - paragraph [ref=f4e133]: "Our projects are not standard tasks – and that's no coincidence. We work with manufacturers and retailers driving complex commerce transformations: platform migrations, new architectures, digital experience platforms. Developers build here with a modern composable stack that's truly fun. Product owners think in real business models, not checklists. The depth that these projects demand is exactly what attracts our people."
    - generic [ref=f4e143]:
      - heading "What About Growth?" [level=2] [ref=f4e145]
      - paragraph [ref=f4e148]: "For us, growth means: real responsibility, real challenges – and an environment that makes both possible. Modern hardware without compromises, AI tools as a standard part of work, WFH and workation as standard. We invest in people who want to develop further – because better people make better projects."
    - generic [ref=f4e158]:
      - heading "How We Work Together" [level=2] [ref=f4e160]
      - generic [ref=f4e162]:
        - paragraph [ref=f4e163]: "For us, real cohesion is not a matter of chance. That's why we make sure we regularly work together in the office – and we come together where it matters: with our customers. Close to the projects, close to the people we work for."
        - paragraph [ref=f4e164]: WFH and workation are standard for everyone. What counts is the result – and that's best created in real collaboration.
    - generic [ref=f4e174]:
      - heading "Being at foobar Agency" [level=2] [ref=f4e176]
      - generic [ref=f4e178]:
        - paragraph [ref=f4e179]: When you come to the office, you should feel good – and you can tell.
        - paragraph [ref=f4e180]: "Specialty coffee from a barista machine that everyone can operate. Fresh fruit, snacks, and a fridge that's never empty. Table soccer, table tennis, our own cinema, and Nintendos for moments in between. Grills on the terrace – and BBQ day every Thursday. For everyone: meat, vegetarian, vegan, halal. Thursday at foobar is legendary, and for good reason."
        - paragraph [ref=f4e181]: Clean desk policy, modern hardware without compromises, and AI tools as a standard part of work – whether in development, consulting, or project management.
    - generic [ref=f4e190]:
      - generic [ref=f4e191]: Meetup Culture
      - heading "Community Building" [level=2] [ref=f4e194]
      - paragraph [ref=f4e195]: foobaristas don’t limit ourselves to client projects. We host public innovation workshops, meetups, and the Commerce Impact Forum—because we want to be part of the industry, not just service providers within it.
      - link "To the Next.js Meetup Munich" [ref=f4e197] [cursor=pointer]:
        - /url: /en/events/next-js-meetup
    - generic [ref=f4e202]:
      - heading "Join the team!" [level=2] [ref=f4e204]
      - generic [ref=f4e206]:
        - paragraph [ref=f4e207]: Does this sound like a place where you’d like to work? Or would you simply like to know who’s behind your next project? Either way, get in touch. We’d love to hear from you.
        - paragraph [ref=f4e208]: We’re always looking for colleagues who want to try out new ideas with us and work together to achieve exciting goals.
