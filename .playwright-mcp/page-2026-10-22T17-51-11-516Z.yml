        - paragraph [ref=e86]:
          - text: "React PWA & Salesforce Commerce Cloud (SFCC) Developer Experience: 3–6 Years Location: Bengaluru –(Hybrid) Employment Type: Full-Time Immediate joiner only. Role Summary We are looking for a skilled React PWA & Salesforce Commerce Cloud (SFCC) Developer with 3–6 years of experience in developing and supporting enterprise-scale eCommerce applications. The ideal candidate should have strong hands-on expertise in"
          - link "React.js" [ref=e87] [cursor=pointer]:
            - /url: http://React.js?trk=public_post-text
          - text: ", Progressive Web Apps (PWA), Salesforce Commerce Cloud (B2C Commerce), and modern front-end development practices. Key Responsibilities Develop and maintain eCommerce storefronts using"
          - link "React.js" [ref=e88] [cursor=pointer]:
            - /url: http://React.js?trk=public_post-text
          - text: ", PWA architecture, and Salesforce Commerce Cloud (SFCC). Build responsive, mobile-first customer experiences with a focus on performance and usability. Implement PWA capabilities including Service Workers, offline functionality, caching, and push notifications. Customize and enhance SFCC storefront functionality, integrations, and customer journeys. Integrate SFCC with third-party applications, payment gateways, OMS, CRM, and enterprise systems. Work closely with Business Analysts, UX Designers, Architects, and backend teams. Participate in code reviews, debugging, performance optimization, and production support. Follow coding standards, security best practices, and accessibility guidelines. Participate in Agile ceremonies, sprint planning, estimations, and technical discussions. Mandatory Skills 3–6 years of experience in Front-End and eCommerce Development. Strong hands-on experience with"
          - link "React.js" [ref=e89] [cursor=pointer]:
            - /url: http://React.js?trk=public_post-text
          - text: and CMS. Experience building Progressive Web Applications (PWA). Strong understanding of Service Workers, Web App Manifest, caching strategies, and PWA best practices. Hands-on experience with Salesforce Commerce Cloud (SFCC/B2C Commerce). Experience with SFCC storefront architecture, controllers, pipelines, cartridges, and OCAPI/SCAPI. Experience integrating REST APIs and backend commerce services. Strong understanding of responsive design and cross-browser development. Familiarity with Git, Azure DevOps, GitHub, or similar source control tools. Understanding of Agile/Scrum methodologies. Preferred Skills SFCC PWA Kit, Managed Runtime, and Headless Commerce. Redux, Context API, or other state-management frameworks. Payment provider, OMS, inventory, and shipping integrations. CI/CD using Azure DevOps, GitHub Actions, or Jenkins. Salesforce ecosystem integrations. Web performance optimization, SEO, and accessibility. Azure Cloud or other cloud platforms. Qualifications Bachelor's degree in Computer Science, IT, Engineering, or a related field. SFCC Developer Certification is a plus. Experience with large-scale retail/eCommerce implementations is preferred. Nice to Have 📩 Interested candidates can reach out via DM or share their updated resume at
          - link "hr@runmapglobal.com" [ref=e90] [cursor=pointer]:
            - /url: https://www.linkedin.com/redir/redirect?url=mailto%3Ahr%40runmapglobal%2Ecom&urlhash=71w2&trk=public_post-text
          - text: . Immediate joiners are preferred.
