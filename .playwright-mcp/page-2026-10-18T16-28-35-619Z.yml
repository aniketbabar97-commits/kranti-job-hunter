        - generic [ref=e33]:
          - generic [ref=e36]:
            - paragraph [ref=e37]: Wir verkaufen Badspiegel und Badmöbel über mehrere eigene Onlineshops – nach Maß gefertigt, europaweit. Klingt nach Nische, ist aber ein ordentliches Geschäft mit ordentlich Technik dahinter. Und es wird mehr:Wir digitalisieren das ganze Unternehmen, von der Webseite über die Warenwirtschaft bis in die Produktion.
            - paragraph [ref=e38]: "Was dich erwartet, ist entsprechend breit:"
            - paragraph [ref=e39]:
              - strong [ref=e40]: Webseite & Shop
              - text: – ein gewachsener Shop auf Modified eCommerce (ja, das System gibt es noch, und ja, es läuft), ein laufender Frontend-Relaunch, Schnittstellen zu Versand, Payment und DATEV.
            - paragraph [ref=e41]:
              - strong [ref=e42]: Warenwirtschaft & Prozesse
              - text: "– Maßanfertigung heißt bei uns, dass jede Bestellung individuell ist. Vom Auftragseingang über die Fertigung bis zum Versand stecken überall manuelle Schritte, Copy-Paste, E-Mails und Excel. Hier gibt es viel zu bauen: Systeme vernetzen, APIs schreiben, automatisieren – auch ein ERP steht auf der Liste."
            - paragraph [ref=e43]:
              - strong [ref=e44]: Produktion & Automatisierung
              - text: "– wir fertigen selbst, und da geht die Reise hin: Produktionssysteme, Maschinenanbindung, perspektivisch auch Robotic.Wer Software nur als Webseite denkt, ist hier falsch.Wer Bock hat, dass sein Code irgendwann eine Säge oder einen Roboterarm steuert, genau richtig.Du wirst nicht in allen Bereichen gleichzeitig stecken – aber du hast überall Code-Zugang und den Auftrag, das Ganze Stück für Stück zusammenwachsen zu lassen."
            - paragraph [ref=e45]:
              - text: Wir suchen keine Abteilung. Wir suchen
              - strong [ref=e46]: eine Person
              - text: ", die richtig gut programmiert, sich in alles reinfuchsen kann und Dinge in die Hand nimmt. Direkt mit der Geschäftsführung, ohne drei Hierarchieebenen und ohne Ticketsystem-Theater."
            - paragraph [ref=e47]:
              - strong [ref=e48]: Das Thema KI
            - paragraph [ref=e49]: "Kurz und ehrlich: Wir arbeiten hier täglich mit KI. Claude, Claude Code, Automatisierungen – das ist bei uns kein Pilotprojekt, sondern Alltag.Du solltest das genauso leben. Nicht “ich hab mal ChatGPT ausprobiert”, sondern:Du baust mit KI schneller, du hältst dich auf dem Laufenden, du hast eine eigene Meinung dazu, welche Tools was taugen. Das fragen wir im Gespräch konkret ab."
            - paragraph [ref=e50]: Wer 2026 noch jede Zeile Code von Hand schreibt und KI für einen Hype hält, wird hier nicht glücklich.
            - heading "Aufgaben" [level=2] [ref=e51]
            - list [ref=e52]:
              - listitem [ref=e53]: Systeme verbinden und APIs schreiben – Shop, Warenwirtschaft, Produktion, Versand, DATEV sollen miteinander reden, nicht nebeneinander herlaufen
              - listitem [ref=e54]: Interne Prozesse anschauen, hinterfragen, automatisieren. Vom Auftragseingang bis zum Reporting – überall liegt was. Ein ERP-Aufbau gehört mittelfristig dazu
              - listitem [ref=e55]: Produktionsnahe Software mitgestalten – Maschinenanbindung, Fertigungsprozesse, perspektivisch Robotic
              - listitem [ref=e56]: Unsere Shops weiterentwickeln und am Laufen halten (Modified eCommerce, PHP/MariaDB)
              - listitem [ref=e57]: Beim Frontend-Relaunch mitziehen (Bootstrap 5, Webpack, SCSS, Smarty). Eine Playwright-Testsuite gibt’s schon – die soll mit dir wachsen und immer besser werden
              - listitem [ref=e58]: Server, Deployments, Backups, Monitoring, Security. Wenn nachts was brennt, willst du wissen warum – und es morgens gefixt haben
              - listitem [ref=e59]: "Die Geschäftsführung technisch beraten, auch bei der Frage: Was automatisieren wir als Nächstes?"
            - heading "Qualifikation" [level=2] [ref=e60]
            - list [ref=e61]:
              - listitem [ref=e62]: KI-gestütztes Coden beherrschst du richtig gut – Coding-Assistenten, LLM-APIs, Automatisierung. Das ist uns wichtiger als jede Jahresangabe im Lebenslauf
              - listitem [ref=e63]: PHP, MySQL/MariaDB, JavaScript – du musst nicht alles auswendig können, aber du musst verstehen, was du (und die KI) da baust Breites technisches Fundament:Du musst nicht alles kennen (Shopsysteme, Warenwirtschaft, Maschinenanbindung), aber du fuchst dich schnell in Neues rein
              - listitem [ref=e64]: "APIs und Schnittstellen: lesen, verstehen, selbst bauen"
              - listitem [ref=e65]: GitLab und Deployments. Welches OS du dabei fährst, ist uns egal – Hauptsache, die Resultate stimmen.
              - listitem [ref=e66]: Eigenständigkeit. Wir haben niemanden, der dir Aufgaben vorkaut – und das ist Absicht.
              - listitem [ref=e67]: Gutes Deutsch und Englisch
              - listitem [ref=e68]: Ob du 3 oder 15 Jahre dabei bist, ist uns egal. Zeig uns, was du drauf hast – das zählt.
              - listitem [ref=e69]: "Schön wäre außerdem: Modified/xt:Commerce/osCommerce-Erfahrung, Docker, GitLab CI/CD, n8n oder Make, MCPIntegrationen, DATEV-Schnittstellen.Musst du nicht alles können. Solltest du dir aber zutrauen."
            - heading "Benefits" [level=2] [ref=e70]
            - list [ref=e71]:
              - listitem [ref=e72]:
                - paragraph [ref=e73]: Einen sicheren Arbeitsplatz in einem jungen, dynamisch wachsenden Unternehmen
              - listitem [ref=e74]:
                - paragraph [ref=e75]: Unbefristete Stelle, Gehalt nach Können – nicht nach Lebenslauf-Länge
              - listitem [ref=e76]:
                - paragraph [ref=e77]: Volle technische Verantwortung. Deine Entscheidungen, deine Architektur.
              - listitem [ref=e78]:
                - paragraph [ref=e79]: Hardware und Tools nach Wahl, KI-Abos inklusive
              - listitem [ref=e80]:
                - paragraph [ref=e81]: "Kurze Wege: Du redest mit dem Chef, nicht mit einem Gremium"
              - listitem [ref=e82]:
                - paragraph [ref=e83]: Echte Produkte, echte Kunden, messbare Ergebnisse
              - listitem [ref=e84]:
                - paragraph [ref=e85]: "Zahlreiche Zusatzleistungen:"
              - listitem [ref=e86]:
                - paragraph [ref=e87]: Mitarbeiterrabatte
              - listitem [ref=e88]:
                - paragraph [ref=e89]: Umzugsprämie
              - listitem [ref=e90]:
                - paragraph [ref=e91]: Kostenlose Getränke
              - listitem [ref=e92]:
                - paragraph [ref=e93]: Zuschüsse zur betrieblichen Altersvorsorge und vermögenswirksame Leistungen
            - paragraph [ref=e94]: "Lebenslauf plus – wichtiger – Beispiele deiner Arbeit: GitHub, Projekte, Shops,irgendwas, das zeigt, wie du arbeitest. Anschreiben kannst du dir sparen."
            - paragraph [ref=e95]: Wir melden uns schnell.
