    - generic [ref=e142]:
      - generic [ref=e143]:
        - paragraph [ref=e144]: Als eigenfinanziertes Familienunternehmen sind wir weit mehr als ein Filialnetz mit rund 4.700 Standorten in über 30 Ländern, mehr als 8,9 Milliarden Euro Jahresumsatz und einem der erfolgreichsten Online-Shops für Schuhe in Europa. Deichmann ist Wegbereiter, Förderer und Arbeitgeber von ca. 50.000 engagierten Mitarbeiterinnen und Mitarbeitern weltweit. Als nachhaltig expandierendes Unternehmen sind wir seit mehreren Jahrzehnten in der Lage, unseren Mitarbeitern einen sicheren Arbeitsplatz zu bieten.
        - paragraph [ref=e145]: Unsere Kunden-App ist ein zentraler Touchpoint unserer Omnichannel-Strategie. Sie verbindet Online-Shopping, Kundenbindung und das Einkaufserlebnis in der Filiale. Als Senior Product Owner Mobile App verantwortest du die Vision, die Roadmap und den Business Value unserer App für iOS und Android, und zwar für mehrere Marken in vielen Ländern. Gemeinsam mit deinem cross-funktionalen Team machst du die App zur ersten Wahl für unsere Kundinnen und Kunden.
        - paragraph [ref=e146]:
          - strong [ref=e147]: "Deine Aufgaben:"
        - list [ref=e148]:
          - listitem [ref=e149]:
            - text: •
            - strong [ref=e150]: "Produktvision & Roadmap:"
            - text: Du entwickelst Vision, Strategie und Roadmap der Deichmann App für iOS und Android. Dabei übersetzt du Unternehmens- und Omnichannel-Ziele in klare, messbare Produktziele.
          - listitem [ref=e151]:
            - text: •
            - strong [ref=e152]: "Backlog & Priorisierung:"
            - text: Du verantwortest das App-Backlog, formulierst Epics und User Stories mit klaren Akzeptanzkriterien und priorisierst konsequent nach Kundennutzen, Business Impact und technischer Machbarkeit. Diese Prioritäten vertrittst du souverän gegenüber deinen Stakeholdern.
          - listitem [ref=e153]:
            - text: •
            - strong [ref=e154]: "Customer Journey & Omnichannel:"
            - text: Du gestaltest App-Features entlang der gesamten Customer Journey und verzahnst die App eng mit Web-Shop, CRM und Filiale, z. B. über Click & Collect, Filialverfügbarkeit oder In-Store-Funktionen.
          - listitem [ref=e155]:
            - text: •
            - strong [ref=e156]: "Kundenbindung & Engagement:"
            - text: Du treibst Features zur Steigerung von Retention, Wiederkaufrate und Customer Lifetime Value voran, z. B. Push-Strategien, Personalisierung und Loyalty-Mechaniken.
          - listitem [ref=e157]:
            - text: •
            - strong [ref=e158]: "Multi-Brand & Multi-Country:"
            - text: Du stellst sicher, dass die App skalierbar und internationalisierbar bleibt. Länder- und markenspezifische Anforderungen wie Sprache, Recht, Payment und Sortiment bildest du effizient auf einer gemeinsamen Plattform ab.
          - listitem [ref=e159]:
            - text: •
            - strong [ref=e160]: "Technische Weiterentwicklung:"
            - text: Gemeinsam mit Engineering und Enterprise Architecture gestaltest du eine zukunftsfähige App-Architektur. Dazu gehören Performance, Stabilität, Accessibility, wiederverwendbare Komponenten und ein markenübergreifendes Design System.
          - listitem [ref=e161]:
            - text: •
            - strong [ref=e162]: "Datengetriebene Steuerung:"
            - text: Du definierst App-KPIs wie Conversion, Retention, aktive Nutzer, Crash-Rate und Store-Rating. Gemeinsam mit BI etablierst du ein strukturiertes Tracking- und Experimentation-Setup (Event Tracking, Funnel-Analysen, A/B-Tests).
          - listitem [ref=e163]:
            - text: •
            - strong [ref=e164]: "Release-Management:"
            - text: Du planst Releases und verantwortest sie von der Konzeption bis zum Go-live in App Store und Google Play, inklusive fachlicher Abnahme und datenbasierter Erfolgsauswertung.
          - listitem [ref=e165]:
            - text: •
            - strong [ref=e166]: "Stakeholder-Management:"
            - text: Du arbeitest eng mit Omnichannel Commerce, Marketing, CRM, Logistik, Vertrieb/Filiale und den Landesgesellschaften zusammen. Bei Bedarf steuerst du auch externe Partner.
          - listitem [ref=e167]:
            - text: •
            - strong [ref=e168]: "KI-Potenziale:"
            - text: Du identifizierst Chancen für KI-gestützte Features in der App, z. B. in Personalisierung, Suche oder Beratung, und bringst sie mit den Teams in die Produktentwicklung ein.
        - paragraph [ref=e169]:
          - strong [ref=e170]: "Dein Profil:"
        - list [ref=e171]:
          - listitem [ref=e172]: • Abgeschlossenes Studium im Bereich Wirtschaftsinformatik, Informatik, Wirtschaftswissenschaften oder eine vergleichbare Qualifikation.
          - listitem [ref=e173]:
            - text: •
            - strong [ref=e174]: Mindestens 5 Jahre Erfahrung als Product Owner für Mobile Apps (iOS und/oder Android)
            - text: ", idealerweise im"
            - strong [ref=e175]: Retail oder E-Commerce.
          - listitem [ref=e176]: • Starke Kommunikations- und Moderationsfähigkeiten sowie Durchsetzungsstärke im Stakeholder-Umfeld.
          - listitem [ref=e177]: • Nachweisliche Erfolge in der Weiterentwicklung und Skalierung von Consumer-Apps mit messbarem Business Impact.
          - listitem [ref=e178]:
            - text: •
            - strong [ref=e179]: Tiefes technisches Verständnis
            - text: mobiler Architekturen, APIs, App-Store-Prozesse und technischer Trade-offs. Du diskutierst mit Engineering auf Augenhöhe.
          - listitem [ref=e180]:
            - text: •
            - strong [ref=e181]: "Ausgeprägtes Business-Verständnis:"
            - text: Du vermittelst souverän zwischen E-Commerce-Geschäftslogik und technischer Machbarkeit und bezifferst den Wertbeitrag deiner Produktentscheidungen.
          - listitem [ref=e182]:
            - text: •
            - strong [ref=e183]: Kundenfokus
            - text: "als Grundhaltung: Du nutzt Methoden aus Product Discovery, User Research und Design Thinking selbstverständlich."
          - listitem [ref=e184]:
            - text: •
            - strong [ref=e185]: "Zahlengetriebene Arbeitsweise:"
            - text: sicherer Umgang mit App-Analytics, Tracking-Konzepten, Experimentation und KPI-Steuerung.
          - listitem [ref=e186]: • Fundierte Erfahrung mit agilen Methoden, z. B. Scrum, Kanban oder skalierten Frameworks.
          - listitem [ref=e187]:
            - text: • Erfahrung mit
            - strong [ref=e188]: Multi-Brand- und/oder internationalen Apps
            - text: ist ein deutlicher Vorteil.
          - listitem [ref=e189]:
            - text: •
            - strong [ref=e190]: "Wünschenswert:"
            - text: erste Erfahrungen mit KI im Produktumfeld, z. B. KI-gestützte App-Features oder KI in der Produktentwicklung.
          - listitem [ref=e191]: • Sehr gute Deutsch- und gute Englischkenntnisse.
