        - paragraph [ref=e208]:
          - text: Als
          - strong [ref=e209]: Senior Product Owner Mobile App (m/w/d)
          - text: verstärkst Du unser Team in Essen. Wenn Du Einsatz zeigst und etwas bewegen willst, dann bist Du bei uns genau richtig. Lerne uns als Arbeitgeber kennen, informiere Dich über Deine beruflichen Möglichkeiten und bewege mit uns großartige Projekte. Bewirb Dich jetzt online mit Angabe Deiner Gehaltsvorstellung und Deines frühestmöglichen Eintrittstermins. Wir freuen uns auf Dich!
