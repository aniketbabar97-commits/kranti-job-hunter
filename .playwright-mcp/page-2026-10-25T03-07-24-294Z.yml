    - heading "Zukunft gestalten – mit Deinem Job bei Ensinger." [level=1] [ref=f1e45]
    - generic [ref=f1e50]:
      - paragraph [ref=f1e51]: Der Name Ensinger steht für Hochleistungskunststoffe, die im wahrsten Sinne des Wortes die Welt erobert haben. Unsere Kunststoffe fliegen ins Weltall, sind unverzichtbar beim Bauen, sie retten Menschenleben und – ja, sie können mehr zu einer besseren Zukunft beitragen, als man denkt.
      - paragraph [ref=f1e52]: Aus einem Familienbetrieb ist ein weltweit erfolgreiches Unternehmen geworden – und ein richtig starker Arbeitgeber, der viel zu bieten hat.
      - paragraph [ref=f1e53]: "Bei uns arbeiten unterschiedlichste Menschen mit den verschiedensten Stärken in zahlreichen Jobfeldern. Wir bieten abwechslungsreiche und vielseitige Jobs, Ausbildungsplätze und Duale Studiengänge mit Entwicklungspotentialen, Bedeutung und Stabilität: Wie für Euch gemacht!"
