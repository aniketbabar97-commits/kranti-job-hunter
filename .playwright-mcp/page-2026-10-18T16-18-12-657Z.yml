              - paragraph [ref=f8e549]:
                - generic [ref=f8e550]: Data Protection Information for Applicants (m/f/d)*
              - paragraph [ref=f8e551]:
                - text: Version 4 from 01.07.2024 Dear Sir or Madam, At the dormakaba Group, we take the protection of your personal data very seriously and always process your personal data in accordance with the legal data protection regulations. In accordance with Articles 13, 14, and 21 of the EU General Data Protection Regulation (EU-GDPR), we would like to give you, regardless of whether you are an applicant or already an employee, an overview of the processing of your personal data by us and your related rights. The term employee in this context also includes trainees, company pensioners, interns, graduates, working students, holiday helpers, and temporary workers or agency workers.
                - generic [ref=f8e552]: A. Controller and Data Protection Officer
              - paragraph [ref=f8e553]:
                - generic [ref=f8e554]: a. The controller responsible for processing your personal data is
                - text: "dormakaba International Holding GmbH DORMA Platz 1 58256 Ennepetal Germany Phone: +49 2333 793 0 E-Mail: info.de@dormakaba.com"
              - paragraph [ref=f8e555]:
                - generic [ref=f8e556]: b. You can reach our Data Protection Officer at
                - text: "dormakaba International Holding GmbH Attn. Data Protection Officer DORMA Platz 1 58256 Ennepetal Germany E-Mail: data.protection@dormakaba.com"
              - paragraph [ref=f8e557]:
                - text: Depending on any employment relationship established with another dormakaba company other than the one mentioned above, the responsibility for processing your personal data may change. Detailed information can be found in the appendix "Controllers and Data Protection Officers". Please also refer to the appendix "Controllers and Data Protection Officers" for the respective responsible Data Protection Officer.
                - generic [ref=f8e558]: B. How do we collect your personal data?
                - text: "We collect your data in the context of an application process in various ways: - Online application via our applicant management system, where we may collect the following:"
              - paragraph [ref=f8e559]: Your private contact details, e.g. name, telephone number, address, email address, proof of employment in the form of a CV and cover letter or by manually
              - paragraph [ref=f8e560]: entering your experience and skills into the system qualifications, either by entering them into the system or by uploading certificates, diplomas
              - paragraph [ref=f8e561]: etc. Further documents may be requested during the recruitment process if they are required for the
              - paragraph [ref=f8e562]: The position (e.g. driving license, etc.)
            - generic [ref=f8e564]:
              - paragraph [ref=f8e565]
              - paragraph [ref=f8e566]
              - paragraph [ref=f8e567]
              - paragraph [ref=f8e568]:
                - text: "- Recruitment agency / Headhunter: If we commission an external recruiter, your application data will be transmitted to us by them - Paper or email application: If you choose to send us your data by email or in paper form"
                - generic [ref=f8e569]: Visibility of your data within the organization
                - text: "If you apply online, you have the option to make your data available:"
              - paragraph [ref=f8e570]: 1. "to also be considered for other open positions (I consent to my personal data being processed for this purpose as described in more detail in the privacy policy)." In this case, all authorized recruiters within the dormakaba Group worldwide may come across your data during a search. In this case, you will be informed about a suitable job offer and asked to apply if interested.
              - paragraph [ref=f8e571]: 2. "I only want to be considered for positions I have applied for." In this case, your data is only visible and accessible to the HR manager responsible for the position you have applied for.
              - paragraph [ref=f8e572]:
                - generic [ref=f8e573]: C. Purpose and legal basis of processing
                - text: We process your personal data in accordance with the EU-GDPR and for the establishment, execution, and termination of your employment relationship as well as for the handling of company pension schemes in accordance with Art. 88 EU-GDPR in conjunction with Section 26 BDSG-New and, if applicable, Art. 6 (1) EU-GDPR.
                - generic [ref=f8e574]: 1. To fulfill contractual obligations (Art. 6 para. 1 lit. b EU-GDPR)
                - text: Processing is necessary for the performance of a contract to which the data subject is a party or to carry out pre-contractual measures taken at the request of the data subject.
                - generic [ref=f8e575]: 2. To fulfill legal obligations (Art. 6 para. 1 lit. c EU-GDPR)
                - text: We may also process your personal data if this is necessary to fulfill legal obligations or to defend and assert legal claims arising from the employment relationship. The legal basis is Art. 6 para. 1 lit. f EU-GDPR. The legitimate interest is, for example, an obligation to provide evidence in proceedings under the General Equal Treatment Act (AGG).
                - generic [ref=f8e576]: 3. Processing based on your consent (Art. 6 para. 1 lit. a EU-GDPR)
                - text: If you give us explicit consent to process personal data for specific purposes, the lawfulness of this processing is based on your consent in accordance with Art. 6 para.1 lit. a EU- GDPR. Consent given can be revoked at any time with effect for the future (see Chapter I of this data protection information).
                - generic [ref=f8e577]: 4. Establishment, execution, and termination of the contract (Section 26 I S1 BDSG-New)
                - text: The purpose of data processing is initially the selection of suitable applicants. Even in the pre-contractual phase, we are legally obliged in some countries to subject your data to an "anti-terror screening". Depending on your individual role, it may be necessary to carry out a reliability or security check of your background before we can assign you to certain customers or areas (e.g. aviation security).
            - generic [ref=f8e579]:
              - paragraph [ref=f8e580]
              - paragraph [ref=f8e581]
              - paragraph [ref=f8e582]:
                - text: If required for the security of the task, a medical examination may be organized and requested, as permitted by law in the country of employment.
                - generic [ref=f8e583]: 5. For the detection of criminal offenses
                - text: We reserve the right to process personal data of employees for the purpose of investigating criminal offenses in accordance with local laws. This requires that documented actual indications give rise to the suspicion that the data subject has committed a criminal offense in the employment relationship and that processing is necessary for detection and withstands a balancing of interests.
                - generic [ref=f8e584]: D. Recipients of personal data
                - text: "Within our company, those departments that need your data to fulfill their respective function in the company or to fulfill our contractual or legal obligations will have access to your data:"
              - paragraph [ref=f8e585]: The works council or the spokesperson committee for senior executives, if applicable, the representative for severely disabled persons receives the data required for the performance of their statutory duties and rights under the Works Constitution Act (BetrVG).
              - paragraph [ref=f8e586]: We may transfer your personal data to affiliated companies to the extent that this is permissible within the framework of the purposes and legal bases set out in Chapter C of this data protection information.
              - paragraph [ref=f8e587]: Under certain circumstances, personal data may also be passed on to public authorities (e.g. tax authorities, job centers, integration offices), social security agencies, judicial and law enforcement authorities (e.g. police, public prosecutors, courts), lawyers and notaries as well as auditors.
              - paragraph [ref=f8e588]: Hiring department management and interviewers within the dormakaba Group who are assigned to participate in the assessments for the requested role.
              - paragraph [ref=f8e589]: In the case of travel expense reimbursement, the data will be forwarded to the responsible internal or external accounting departments.
              - paragraph [ref=f8e590]: Internal Audit receives data for internal audit purposes. The HR administration for the preparation of contracts and other
              - paragraph [ref=f8e591]: administrative formalities.
              - paragraph [ref=f8e592]: "Specifically, the following recipients receive your personal data from us: Professional associations; Tax authorities; Social security agencies such as health insurance companies, pension insurance companies, etc.; Banks (e.g. for your salary transfer); Aviation security authority; Integration office; Insurance companies; Auditors; Social security and tax auditors; ISO auditors; Authorities (within the scope of assignments); Chambers of industry and commerce, universities of applied sciences, training workshops (for trainees); Company medical services; Leasing companies"
            - generic [ref=f8e594]:
              - paragraph [ref=f8e595]
              - paragraph [ref=f8e596]
              - paragraph [ref=f8e597]: If applicable, transfer companies
              - paragraph [ref=f8e598]:
                - generic [ref=f8e599]: E. Transfer to third countries or international organizations
                - text: Your data will be stored within the EU in accordance with the GDPR data protection standard and made available to recipients in the country of your application. If your personal data is transferred to third countries outside the European Economic Area that may not provide an adequate level of data protection, we will take all necessary measures for such data transfers in accordance with EU-GDPR. We use appropriate technical and organizational measures to protect your personal data from unauthorized access or use as well as from accidental, unintentional loss or destruction.
                - generic [ref=f8e600]: F. Duration of storage
                - text: We generally delete your personal data when the purpose of processing has been fulfilled, all mutual claims have been settled, and there are no other legal retention obligations or legal grounds for storage. The data is stored according to the principle of storage limitation. This means that the data is only stored for as long as is necessary for the respective purpose. Legal deletion and retention periods according to country requirements are also observed. See Appendix C for an overview of country-specific retention periods.
                - generic [ref=f8e601]: G. Your data protection rights
                - text: "You have the following data protection rights in accordance with the statutory provisions:"
              - paragraph [ref=f8e602]: 1. the right to information about the personal data stored by the respective dormakaba company (Article 15 EU-GDPR) as well as
              - paragraph [ref=f8e603]: 2. the right to rectification of your data (Article 16 EU-GDPR), 3. the right to erasure of your data (Article 17 EU-GDPR), 4. the right to restriction of processing of your data (Article 18 EU-GDPR), 5. the right to data portability of your data (Article 20 EU-GDPR), 6. and the right to object (Article 21 EU-GDPR)
              - paragraph [ref=f8e604]:
                - text: In addition, you have the right to contact the respective responsible national data protection authority with a request or complaint. For North Rhine-Westphalia, for example, this would be the State Commissioner for Data Protection and Freedom of Information North Rhine-Westphalia (LDI NRW) (https://www.ldi.nrw.de).
                - generic [ref=f8e605]: H. Is there an obligation to provide data?
                - text: In the context of the employment relationship, you must provide the personal data that is necessary for the establishment, execution, and termination of the employment relationship and for the fulfillment of the associated contractual obligations or that we are legally obliged to process. Without this data, we will generally not be able to conclude or execute an employment contract with you. In addition, our contract forms and our websites transparently indicate which information is voluntary and which is mandatory.
                - generic [ref=f8e606]: I. Right to object 1. Case-specific right to object
                - text: You have the right to object at any time to the processing of your personal data for reasons arising from your particular personal situation, if the processing is based on the legal basis regulated in Art. 6 para.
            - generic [ref=f8e608]:
              - paragraph [ref=f8e609]
              - paragraph [ref=f8e610]
              - paragraph [ref=f8e611]:
                - text: 1 letter e EU-GDPR (processing in the public interest) and Art. 6 para. 1 letter f EU-GDPR (data processing based on a balancing of interests). This also applies to profiling based on this provision. If you object, we will stop processing your personal data unless we can demonstrate compelling legitimate grounds for the necessity of processing that override your interests, rights, and freedoms, or if the processing serves the assertion, exercise, or defense of legal claims.
                - generic [ref=f8e612]: 2. Recipient of the objection
                - text: You can submit your objection informally with the subject "Objection" stating your name, address, and date of birth to us (see appendix).
                - generic [ref=f8e613]: J. Video conferences, online meetings, webinars, and screen sharing
                - text: "We use platforms and applications of other providers (hereinafter referred to as \"third-party providers\") for the purpose of conducting video and audio conferences, webinars, and other types of video and audio meetings. When selecting third-party providers and their services, we observe the legal requirements. See Appendix B for an overview of the third-party providers used. In this context, data of communication participants is processed and stored on the servers of the third-party providers, insofar as they are part of communication processes with us. This data may include in particular registration and contact data, visual and audio contributions, as well as entries in chats and shared screen content. If users are referred to third-party providers or their software or platforms in the context of communication, business, or other relationships with us, the third-party providers may process usage data and metadata for security purposes, service optimization, or marketing purposes. We therefore ask you to observe the privacy notices of the respective third-party providers. Notes on legal bases: If we ask users for their consent to the use of third-party providers or certain functions (e.g. consent to the recording of conversations), the legal basis for processing is consent. Furthermore, their use may be part of our (pre-)contractual services, provided the use of third-party providers has been agreed in this context. Otherwise, user data is processed on the basis of our legitimate interests in efficient and secure communication with our communication partners. In this context, we would also like to draw your attention to the information on the use of cookies in this privacy policy."
              - paragraph [ref=f8e614]: "Types of data processed: Inventory data (e.g. names, addresses), contact data (e.g. email, telephone numbers), content data (e.g. text entries, photographs, videos), usage data (e.g. visited websites, interest in content, access times), meta/communication data (e.g. device information, IP addresses)."
              - paragraph [ref=f8e615]: "Data subjects: Communication partners, users (e.g. website visitors, users of online services)."
              - paragraph [ref=f8e616]: "Purposes of processing: Contractual services and service, contact requests and communication, office and organizational procedures."
              - paragraph [ref=f8e617]: "Legal bases: Consent (Art. 6 para. 1 sentence 1 lit. a GDPR), contract fulfillment and pre-contractual requests (Art. 6 para. 1 sentence 1 lit. b. GDPR), legitimate interests (Art. 6 para. 1 sentence 1 lit. f. GDPR)."
              - paragraph [ref=f8e618]: The above declaration of consent to the privacy policy applies to all companies listed below. For some countries, there is additional country-specific information. Please follow this link for further country-specific information. For Great Britain and Ireland, there are separate
