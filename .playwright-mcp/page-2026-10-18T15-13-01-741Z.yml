        - generic [ref=f71e86]:
          - heading "About this job" [level=2] [ref=f71e87]
          - generic [ref=f71e90]:
            - generic [ref=f71e92]:
              - heading "Über IONOS SE" [level=2] [ref=f71e93]
              - generic [ref=f71e94]: Wir sind Europas führende Plattform für Cloud Services und Hosting-Dienstleistungen. Wir begleiten erfolgreich unsere Kund:innen bei ihrer Unternehmensentwicklung. Für unseren Unternehmenserfolg sind über 4000 Mitarbeitende in mehreren Ländern weltweit tätig, um die Anforderungen und Wünsche unserer 8,5 Millionen Kund:innen zu erfüllen.Wir sind eine Marke der United Internet AG, einem börsennotierten Unternehmen mit rund 10.200 Mitarbeitenden.Wir fördern die Entwicklung unserer Mitarbeitenden und deren unterschiedliche Talente, Interessen und Sprachen.
            - generic [ref=f71e95]:
              - heading "Was erwartet dich?" [level=2] [ref=f71e96]
              - list [ref=f71e98]:
                - listitem [ref=f71e99]: Du übernimmst als Product Owner die End-to-End-Verantwortung für einen Produktbereich unserer Websites und Online-Shops und/oder für eine Marke unserer Gruppe, zusammen mit funktionsübergreifenden Expert:innen
                - listitem [ref=f71e100]: Du bist verantwortlich für die Conversion-Rate und übernimmst die kontinuierliche Analyse und Interpretation der User Flows auf dem Portal und im Check-out-Funnel
                - listitem [ref=f71e101]: Du führst eine kontinuierliche Erfolgskontrolle der wichtigsten Websites und Online-Shop-KPIs durch und stellst Reports für das Management bereit
                - listitem [ref=f71e102]: Du erstellst und priorisierst dein Backlog mit Verbesserungen, basierend auf Nutzerfeedback, Geschäftszielen und Markteinblicken, und stimmst dies mit den Stakeholdern ab
                - listitem [ref=f71e103]: Du führst methodische Analysen durch, wie z.B. Markt- und Wettbewerbsbetrachtungen, um Nutzerbedürfnisse, Trends und Möglichkeiten für die Weiterentwicklung zu identifizieren
                - listitem [ref=f71e104]: Du verstehst es, komplexe Nutzer- und Business-Anforderungen von verschiedenen Stakeholdern im Unternehmen in nahtlose Workflows und Konzeptideen zu übersetzen
            - generic [ref=f71e105]:
              - heading "Was solltest du mitbringen?" [level=2] [ref=f71e106]
              - list [ref=f71e108]:
                - listitem [ref=f71e109]: Du bist Product Owner (m/w/d) aus Leidenschaft und weißt, was du willst. Die Bedürfnisse unserer Nutzer:innen treiben dich an. Den Grundstein deines Erfolgs bildet ein erfolgreiches Studium oder eine vergleichbare Ausbildung
                - listitem [ref=f71e110]: Du kennst die Vor- und Nachteile von klassischen und agilen Vorgehensweisen aus mehrjähriger praktischer Erfahrung, optimalerweise im Bereich der Softwareentwicklung
                - listitem [ref=f71e111]: Du bringst die richtige Mischung aus Kreativität und unternehmerischem Kalkül mit
                - listitem [ref=f71e112]: Du zeichnest dich durch analytisches Denkvermögen, viel Eigeninitiative, Engagement, Mut und ein strukturiertes, aber auch pragmatisches Vorgehen aus
                - listitem [ref=f71e113]: Du bist versiert im Umgang mit Stakeholdern sowie im Erstellen von Epics und User Stories und im Verantworten und Priorisieren des Product Backlogs
                - listitem [ref=f71e114]: Du entwickelst gemeinsam mit den Stakeholdern die Produktvision weiter und füllst sie mit Leben
            - generic [ref=f71e115]:
              - heading "Was bieten wir dir?" [level=2] [ref=f71e116]
              - list [ref=f71e118]:
                - listitem [ref=f71e119]: Hybrides Arbeitsmodell mit Homeoffice-Möglichkeit
                - listitem [ref=f71e120]: Flexible Arbeitszeiten durch Vertrauensarbeitszeit
                - listitem [ref=f71e121]: An einigen Standorten eine bezuschusste Kantine und verschiedene kostenfreie Getränke
                - listitem [ref=f71e122]: Moderne Büroflächen mit sehr guter Verkehrsanbindung
                - listitem [ref=f71e123]: Diverse Mitarbeiterrabatte für Aktivitäten und Produkte
                - listitem [ref=f71e124]: Mitarbeiterevents wie Sommer- und Winterfeiern, sowie Workshops
                - listitem [ref=f71e125]: Zahlreiche Weiterbildungs- und Entwicklungsmöglichkeiten
                - listitem [ref=f71e126]: Verschiedene Gesundheitsangebote, wie Sport- und Gesundheitskurse
