        - generic [ref=f16e601]:
          - heading "Über diesen Job" [level=2] [ref=f16e602]
          - paragraph [ref=f16e603]:
            - text: Als
            - strong [ref=f16e604]: Teamleiter (m/w/d) Produktmanagement Automatisierung
            - text: gestaltest Du bei der CHECK24 für Sachversicherungen GmbH die Digitalisierung unserer Produkte aktiv mit. Die Position eignet sich ideal für Dich, wenn
            - strong [ref=f16e605]: Du den digitalen Vergleich transparent, effizient und nutzerfreundlich vorantreiben möchtest
            - text: – und perspektivisch Verantwortung für ein Team übernehmen willst.
          - paragraph [ref=f16e606]:
            - strong [ref=f16e607]: "Unser Ziel: das Kundenerlebnis in unserem Vergleichsportal kontinuierlich zu verbessern."
          - paragraph [ref=f16e608]:
            - text: Dafür übernimmst Du
            - strong [ref=f16e609]: eine zentrale Rolle in der Weiterentwicklung des Produkts
            - text: . Du verantwortest KI-basierte Automatisierungsinitiativen, identifizierst neue Einsatzmöglichkeiten für generative KI und Large Language Models (LLMs) und überführst diese gemeinsam mit Deinem Team in konkrete Produktlösungen. Dabei
            - strong [ref=f16e610]: steuerst Du den gesamten Produktentwicklungsprozess – von der Analyse und Konzeption über die technische Umsetzung bis zur Erfolgsmessung.
          - paragraph [ref=f16e611]:
            - text: In einem
            - strong [ref=f16e612]: modernen Entwicklungsumfeld arbeitest Du eng mit der Geschäftsführung, der IT, der Kundenberatung und unseren Versicherungspartnern zusammen
            - text: . Mit Deinem Team gestaltest Du die
            - strong [ref=f16e613]: strategische Weiterentwicklung des Rechtsschutzprodukts und treibst insbesondere die Automatisierung von Prozessen und Kundenkommunikation voran
            - text: .
          - paragraph [ref=f16e614]:
            - text: CHECK24 ist für alle, die gestalten wollen. Nicht irgendwann.
            - strong [ref=f16e615]: Sondern jetzt!
        - generic [ref=f16e616]:
          - heading "Was Du mitbringst" [level=2] [ref=f16e617]
          - list [ref=f16e618]:
            - listitem [ref=f16e619]:
              - strong [ref=f16e620]: Mehrjähriger Erfahrung
              - text: im digitalen Produktmanagement, E-Commerce oder in einem vergleichbaren datengetriebenen Umfeld (z.B. Beratung, Projektmanagement)
            - listitem [ref=f16e621]:
              - strong [ref=f16e622]: Nachweisbare Erfahrung in der fachlichen und idealerweise disziplinarischen Führung
              - text: eines (kleinen) Produkt- oder Projektteams.
            - listitem [ref=f16e623]:
              - strong [ref=f16e624]: Erfahrung in der eigenständigen Steuerung digitaler Produkte
              - text: anhand von Kunden-, Wachstums- und Wirtschaftlichkeitskennzahlen.
            - listitem [ref=f16e625]:
              - strong [ref=f16e626]: Sehr gute analytische Fähigkeiten
              - text: und ein
              - strong [ref=f16e627]: ausgeprägtes Verständnis
              - text: für digitale Customer Journeys, Conversion-Optimierung und A/B-Testing.
            - listitem [ref=f16e628]: Erfahrung in der Zusammenarbeit mit Softwareentwicklung, UX, Analytics und weiteren internen sowie externen Stakeholdern.
            - listitem [ref=f16e629]:
              - strong [ref=f16e630]: Expertise mit Automatisierungs- oder KI-Projekten
              - text: sowie Interesse an generativer KI und LLMs.
            - listitem [ref=f16e631]:
              - strong [ref=f16e632]: Unternehmerisches Denken, Entscheidungsstärke und eine ausgeprägte Hands-on-Mentalität
              - text: .
            - listitem [ref=f16e633]:
              - strong [ref=f16e634]: Kenntnisse des Versicherungs-, InsurTech- oder Finanzdienstleistungsmarkts
              - text: sind von Vorteil, aber kein Muss!
        - generic [ref=f16e635]:
          - heading "Zu Deinen Aufgaben zählen" [level=2] [ref=f16e636]
          - list [ref=f16e637]:
            - listitem [ref=f16e638]:
              - strong [ref=f16e639]: Verantwortung
              - text: – gemeinsam mit Deinem Team – für den gesamten Produktentwicklungsprozess unseres Vergleichs sowie Koordination der Implementierung neuer Features.
            - listitem [ref=f16e640]:
              - strong [ref=f16e641]: Fachliche und disziplinarische Führung
              - text: des Produktteams mit dem Ziel, Stärken gezielt zu fördern, Verantwortung zu übertragen und die Zusammenarbeit kontinuierlich weiterzuentwickeln.
            - listitem [ref=f16e642]:
              - strong [ref=f16e643]: Enge Zusammenarbeit mit der Geschäftsführung, der IT, der Kundenberatung und unseren Versicherungspartnern
              - text: sowie gemeinsame Entwicklung pragmatischer und kundenorientierter Lösungen.
            - listitem [ref=f16e644]:
              - strong [ref=f16e645]: Weiterentwicklung der User Experience (UX)
              - text: und
              - strong [ref=f16e646]: Optimierung der gesamten Customer Journey
              - text: im engen Austausch mit Deinem Team und unseren Softwareentwicklern.
            - listitem [ref=f16e647]:
              - strong [ref=f16e648]: Gemeinsame Analyse relevanter Produkt- und Kundendaten
              - text: ", Ableitung konkreter Optimierungspotenziale und Steuerung zentraler Kennzahlen wie Conversion, Vertragswachstum und Kundenzufriedenheit."
            - listitem [ref=f16e649]:
              - strong [ref=f16e650]: Identifikation von Automatisierungspotenzialen
              - text: sowie Bewertung und Umsetzung KI-basierter Lösungsansätze für Frontend, Backend und Kundenkommunikation zusammen mit den beteiligten Fachbereichen.
            - listitem [ref=f16e651]:
              - strong [ref=f16e652]: Aktuelle Best Practices im Blick behalten
              - text: ", Markt-, Wettbewerbs- und Technologietrends beobachten und gemeinsam mit Deinem Team auf ihre Anwendbarkeit für unseren Vergleich prüfen."
        - generic [ref=f16e653]:
          - heading "Was CHECK24 Dir bietet" [level=2] [ref=f16e654]
          - list [ref=f16e655]:
            - listitem [ref=f16e656]:
              - strong [ref=f16e657]: "Balance, die zum Arbeitsalltag passt:"
              - text: Von Montag bis Donnerstag arbeiten wir im Office zusammen, freitags kannst Du mobil arbeiten. Wir arbeiten bewusst vor Ort in unserem Office – weil direkte Zusammenarbeit, schnelle Abstimmung und echtes Teamgefühl für uns im Alltag den Unterschied machen.
            - listitem [ref=f16e658]:
              - strong [ref=f16e659]: "Das Beste aus beiden Welten:"
              - text: Bei uns bekommst Du die Sicherheit und Stabilität eines etablierten Unternehmens – kombiniert mit dem Drive, der Geschwindigkeit und dem Gestaltungsspielraum eines Startups. Wir denken langfristig und geben Dir gleichzeitig die Chance, Prozesse und Themen aktiv mitzuprägen.
            - listitem [ref=f16e660]:
              - strong [ref=f16e661]: "Modernes Arbeiten mit echtem Zukunftsfokus - AI-first statt oldschool:"
              - text: Du arbeitest bei uns mit modernen Technologien und nutzt Tools wie ChatGPT Enterprise, Claude Code, Cursor.ai und weitere AI-Anwendungen ganz selbstverständlich im Alltag.
            - listitem [ref=f16e662]:
              - strong [ref=f16e663]: "Top Equipment ab Tag 1:"
              - text: Einen top ausgestatteten, ergonomischen Arbeitsplatz mit leistungsstarkem MacBook, zusätzlichen Bildschirmen und höhenverstellbarem Schreibtisch. Weiteres individuelles Equipment wie Noise-Cancelling-Kopfhörer oder ergonomische Maus? Bekommst Du natürlich auch.
            - listitem [ref=f16e664]:
              - strong [ref=f16e665]: "Herausfordernde und abwechslungsreiche Aufgaben:"
              - text: Freu Dich auf Gestaltungsspielraum, Prozesse aktiv mitzugestalten sowie direkte Kommunikationswege zur Geschäftsführung.
            - listitem [ref=f16e666]:
              - strong [ref=f16e667]: "Wachstum, das wirklich möglich ist:"
              - text: Durch unser starkes Wachstum entstehen echte Chancen, schnell Verantwortung zu übernehmen und Dich fachlich wie persönlich weiterzuentwickeln. Dafür stehen Dir individuelle Weiterbildungs- und Entwicklungsmöglichkeiten sowie ein breiter Trainingskatalog zur Verfügung.
            - listitem [ref=f16e668]:
              - strong [ref=f16e669]: "Starkes Gesamtpaket:"
              - text: Neben einem attraktiven Gehalt profitierst Du von Gutscheinen für viele CHECK24-Produkte, einer starken Unterstützung bei der betrieblichen Altersvorsorge und einer sehr guten Bezuschussung des EGYM Wellpass.
            - listitem [ref=f16e670]:
              - strong [ref=f16e671]: "Food & Drinks gehen aufs Haus:"
              - text: "Frühstück (Auswahl an verschiedenen Müslisorten), Lunch, frisches Obst sowie Heiß- und Kaltgetränke stehen Dir die ganze Woche kostenlos zur Verfügung. Kurz gesagt: Du musst Dich um einiges kümmern – aber nicht um Dein Essen im Office."
            - listitem [ref=f16e672]:
              - strong [ref=f16e673]: "Easy & nachhaltig unterwegs:"
              - text: Durch unseren zentralen Standort erreichst Du uns bequem mit öffentlichen Verkehrsmitteln oder dem Fahrrad. Dabei profitierst Du von einem komplett kostenfreien Deutschlandticket oder einer Förderung für Dein Firmenfahrradleasing.
            - listitem [ref=f16e674]:
              - strong [ref=f16e675]: "CHECKito-Spirit / Teamspirit, der nicht aufgesetzt ist:"
              - text: "Wir arbeiten eng zusammen, unterstützen uns gegenseitig und feiern Erfolge auch gemeinsam. Ob beim Lunch, Kickern, After-Work oder bei Team- und Firmenevents: Bei uns erwartet Dich ein lockeres Umfeld mit Duz-Kultur und ohne Dresscode."
