            - img "Arbeitsort" [ref=f5e21]
            - text: Köln
        - paragraph [ref=f5e25]: Diese Position ist zwischen 70.000 € und 80.000 € brutto jährlich dotiert.
        - generic [ref=f5e26]:
          - heading "PS Direkt - Job perfekt" [level=2] [ref=f5e27]
          - paragraph [ref=f5e28]: Sie möchten digitale Lösungen aktiv mitgestalten und komplexe Anforderungen in zukunftsfähige Konzepte übersetzen? In dieser Position übernehmen Sie eine zentrale Rolle an der Schnittstelle zwischen Fachbereichen, IT und Entwicklung.Sie analysieren bestehende Prozesse und Anforderungen, begleiten die Weiterentwicklung digitaler Plattformen und sorgen gemeinsam mit verschiedenen Teams für effiziente und nachhaltige Lösungen. Dabei verbinden Sie technisches Verständnis mit analytischem Denken und einem guten Gespür für wirtschaftliche Zusammenhänge.Wir suchen im Rahmen der Arbeitnehmerüberlassung mit anschließender Übernahmeoption.
        - generic [ref=f5e29]:
          - heading "Ihre Aufgaben" [level=2] [ref=f5e30]
          - list [ref=f5e31]:
            - listitem [ref=f5e32]: Sie analysieren fachliche und technische Anforderungen und entwickeln gemeinsam mit den beteiligten Teams geeignete Lösungsansätze
            - listitem [ref=f5e33]: Digitale Plattformen und E-Commerce-Lösungen begleiten Sie bei der kontinuierlichen Weiterentwicklung
            - listitem [ref=f5e34]: Komplexe Anforderungen strukturieren Sie und übersetzen diese in verständliche und umsetzbare Konzepte
            - listitem [ref=f5e35]: Anforderungen aus unterschiedlichen Fachbereichen nehmen Sie auf, bewerten diese und stimmen Prioritäten mit den relevanten Stakeholdern ab
            - listitem [ref=f5e36]: Sie arbeiten eng mit Entwicklung, IT und weiteren Fachbereichen zusammen und koordinieren wichtige Schnittstellen
            - listitem [ref=f5e37]: Technische und fachliche Dokumentationen erstellen und pflegen Sie zielgruppengerecht
            - listitem [ref=f5e38]: Die Umsetzung neuer Funktionen und Änderungen begleiten Sie von der Anforderungsaufnahme bis zur erfolgreichen Implementierung
            - listitem [ref=f5e39]: Bestehende digitale Prozesse und Systemlösungen analysieren Sie hinsichtlich Qualität, Effizienz und Weiterentwicklungsmöglichkeiten
            - listitem [ref=f5e40]: Bei technischen oder prozessualen Herausforderungen unterstützen Sie bei der Ursachenanalyse und Lösungsfindung
            - listitem [ref=f5e41]: Aus Ihren Analysen leiten Sie geeignete Optimierungsmaßnahmen ab und begleiten deren Umsetzung
            - listitem [ref=f5e42]: Projektfortschritte, offene Themen und mögliche Risiken bereiten Sie transparent für unterschiedliche Stakeholder auf
            - listitem [ref=f5e43]: Sie unterstützen dabei, Anforderungen an IT-Sicherheit, Qualität und stabile Prozesse frühzeitig in die Lösungsentwicklung einzubeziehen
            - listitem [ref=f5e44]: Durch Ihre strukturierte Arbeitsweise tragen Sie zur kontinuierlichen Verbesserung digitaler Produkte und Prozesse bei
        - generic [ref=f5e45]:
          - heading "Ihre Fähigkeiten" [level=2] [ref=f5e46]
          - list [ref=f5e47]:
            - listitem [ref=f5e48]: Sie verfügen über ein abgeschlossenes Studium der Informatik, Wirtschaftsinformatik oder eine vergleichbare Qualifikation
            - listitem [ref=f5e49]: Erfahrung in der Analyse, Konzeption oder Weiterentwicklung komplexer Software-, Plattform- oder E-Commerce-Lösungen bringen Sie mit
            - listitem [ref=f5e50]: Sie besitzen ein gutes Verständnis moderner Softwareentwicklungsprozesse und agiler Arbeitsweisen
            - listitem [ref=f5e51]: Kenntnisse in den Bereichen Softwarearchitektur, IT-Sicherheit, Systembetrieb oder Qualitätsmanagement sind von Vorteil
            - listitem [ref=f5e52]: Erfahrung im Anforderungsmanagement sowie in der Zusammenarbeit mit Fachbereichen und Entwicklungsteams ist wünschenswert
            - listitem [ref=f5e53]: Technische Dokumentationen, Konzepte und Anforderungsbeschreibungen erstellen Sie sicher und strukturiert
            - listitem [ref=f5e54]: Analytisches Denkvermögen und die Fähigkeit, komplexe Zusammenhänge schnell zu erfassen, zeichnen Sie aus
            - listitem [ref=f5e55]: Sie kommunizieren sicher mit unterschiedlichen fachlichen und technischen Ansprechpartnern
            - listitem [ref=f5e56]: Auch komplexe technische Inhalte können Sie verständlich und zielgruppengerecht vermitteln
            - listitem [ref=f5e57]: Eine proaktive, lösungsorientierte und eigenverantwortliche Arbeitsweise rundet Ihr Profil ab
