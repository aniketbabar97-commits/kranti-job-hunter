# German version of master.yaml for German job postings. SAME structure, SAME order of skills items and bullets
# (tailoring picks items/bullets by position, so index i here = index i in master.yaml). Keep both files in sync.
location: Karlsruhe, Deutschland
work_authorization: Gültige Aufenthalts- und Arbeitserlaubnis für Deutschland
earliest_start: 16.12.2026
work_mode: Remote, hybrid oder vor Ort in ganz Deutschland

skills:
  Backend: [Java (Core & J2EE), Spring Framework, Spring Boot, Microservices, RESTful APIs, SOAP, Design Patterns, Datenmodellierung, JUnit, Groovy]
  E-Commerce: [SAP Commerce Cloud (Hybris 2105 / 2211), B2B- / B2C-Commerce, Headless Commerce, Order Management (OMS), Promotions Engine, Produktkatalog & PIM, Backoffice, Impex, Cronjobs]
  APIs & Integration: [REST-Webservices, OCC-APIs, "PIM- / ERP- / MDM-Integration (Profisee, SAP ERP)", DataHub, Hotfolders, dateibasierte Datenpipelines, Integration von Drittsystemen]
  Datenbanken & Suche: [SQL, Abfrageoptimierung und Performance-Tuning, FlexibleSearch, Apache Solr]
  DevOps & Cloud: [CI/CD-Pipelines, Jenkins, Git, Docker, Kubernetes, SAP Commerce Cloud Portal (CCv2), Hybris Admin Console (HAC), Produktionssupport und Fehleranalyse]
  Frontend & Web: [JavaScript, Integration von Progressive Web Apps (PWA), Responsive Design, Storefront-Anpassung]
  Business-Analyse: [Techno-funktionale Beratung, Requirements Engineering, Analyse von Geschäftsanforderungen, User Stories & Akzeptanzkriterien, Stakeholder-Management, Prozessmodellierung, Gap-Analyse, Fachkonzepte, User Acceptance Testing (UAT), Lösungsdesign]
  KI: [KI-gestützte Entwicklung, Generative KI / LLM-Tools, Prompt Engineering, KI-gestützte Analyse und Dokumentation]
  Arbeitsweise: [Agile / Scrum, PI Planning, Jira, Confluence, Code-Reviews, Technisches Mentoring, Internationale Teams]

jobs:
  - key: rockwell
    title: SAP Hybris Developer (Senior Level)
    place: Pune, Indien
    dates: 10/2024 – 15.12.2026
    bullets:
      - Konzeption und Umsetzung von Backend- und Frontend-Funktionen auf SAP Commerce Cloud (Hybris 2211) mit Java und Spring für Produkt-, Katalog-, Preis- und Kundendaten nach Plattform-Best-Practices und Design Patterns.
      - Entwicklung und Bereitstellung von OCC-REST-Webservices (Headless-APIs) für Storefront und Drittsysteme sowie Anpassung von Interceptors, Populators und Converters für eigene Datenflüsse.
      - Konzeption, Aufbau und Optimierung von PIM-zu-Hybris-Datenpipelines mit Profisee, Hotfolders und DataHub zur Synchronisierung der Produktkataloge über globale E-Commerce-Kanäle.
      - Analyse und Behebung von Integrationsengpässen zwischen SAP ERP, MDM und Profisee in direkter Zusammenarbeit mit internationalen technischen Teams.
      - Umsetzung von API-Migrationen für Kundenkontostrukturen zur Verbesserung von Systemstabilität und Datenkonsistenz.
      - Code-Reviews, Unterstützung bei Produktionsvorfällen und technische Anleitung von Junior-Entwicklern.
      - "Techno-funktionale Rolle im Austausch mit Fachbereichen: Anforderungen analysiert, User Stories und Fachkonzepte erstellt und in SAP-Commerce-Lösungen umgesetzt."
      - Intensiver Einsatz von KI-Tools (generative KI / LLMs) zur Beschleunigung von Analyse, Entwicklung, Test und Dokumentation.
  - key: shell
    title: Software Engineer
    place: Bangalore, Indien
    dates: 05/2022 – 10/2024
    bullets:
      - "Entwicklung und Wartung zentraler SAP-Hybris-Module: Promotions Engine, Hotfolders, FlexibleSearch-Abfragen, Cronjobs, Impex-Skripte und Order Management (OMS)."
      - Entwicklung von RESTful APIs und OCC-Webservices für Headless-Commerce-Integrationen und Progressive-Web-App-Frontends (PWA).
      - Nutzung und Bereitstellung von REST- und SOAP-Webservices sowie Integration externer Services über das SAP Commerce Cloud Portal (CCv2).
      - Anpassung von Backoffice-Komponenten, Erstellung von Groovy-Administrationsskripten und Plattformverwaltung über die Hybris Admin Console (HAC).
      - Durchführung von CI/CD-Deployment-Zyklen und Release-Builds auf SAP Commerce Cloud (CCv2) in agilen DevOps-Workflows.
      - Leitung der Refaktorierung von Datenbankabfragen mit kürzeren Antwortzeiten und schnelleren Transaktionen; Unterstützung bei Fehleranalyse und Wartung im Produktivbetrieb.
      - Erhebung und Analyse von Geschäftsanforderungen mit Product Ownern und Fachbereichen, Prozessmodellierung und Unterstützung bei User Acceptance Tests (UAT).
  - key: cognizant
    title: Programmer Analyst
    place: Pune, Indien
    dates: 11/2020 – 05/2022
    bullets:
      - Aufbau automatisierter Unit- und Integrationstests mit JUnit zur Sicherung von Codequalität und Testabdeckung.
      - Entwicklung von Java-Native-Interface-Komponenten (JNI) und Backend-Middleware-Services.
      - Konfiguration der Apache-Solr-Suchindizierung, automatisierter E-Mail-Benachrichtigungen und Hotfolder-Dateiverarbeitung.
      - Mitarbeit in agiler Lieferung; Beförderung vom Programmer Analyst Trainee aufgrund starker Leistungen in Java Enterprise, SQL und SAP Hybris.

certifications:
  - SAP Certified Professional – SAP Commerce Cloud Developer
  - SAP Certified Associate – SAP Commerce Cloud Business User

education: Bachelor of Engineering (B.E.) in Computer Engineering / IT — Savitribai Phule Pune University, Pune, Indien (06/2016 – 06/2020)
languages: Englisch (verhandlungssicher, C2) | Deutsch (gute Kenntnisse, B1) | Hindi und Marathi (Muttersprache)
